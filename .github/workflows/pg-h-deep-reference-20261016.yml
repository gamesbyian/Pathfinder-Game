# One-shot, production-inert deeper-prefix exact reference check; retired after evidence.
name: PG-H deeper-prefix CP-SAT exact resolution
on:
  push:
    branches:
      - chatgpt/pg-h-deep-prefix-observability-2026-10-16
    paths:
      - .github/workflows/pg-h-deep-reference-20261016.yml
permissions:
  contents: read
concurrency:
  group: pg-h-deep-reference-20261016
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Recapture same frozen eight parents and enforce deeper-prefix case identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/pg-h-deep
          node scripts/run-bundled.mjs scripts/stress/semantic-forcedness-capture.mjs -- \
            --corpus=data/stress/stress-levels-random.json \
            --levels=R00242,R02941,R03030,R02405,R01229,R02307,R02561,R02240 \
            --profile=objectiveFirst --width=500 \
            --work-budget=500000 --budget-ms=600000 \
            --min-children=2 --max-children=4 \
            --max-states-per-gate=2 --selection=deepest \
            --out=tmp/pg-h-deep/capture.json \
            --cases-out=tmp/pg-h-deep/cases.json
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {extractExplicitPrefixCases} from './scripts/stress/cpsat-explicit-prefix-reference-lib.mjs';
          const c=JSON.parse(readFileSync('tmp/pg-h-deep/capture.json','utf8'));
          const raw=JSON.parse(readFileSync('tmp/pg-h-deep/cases.json','utf8'));
          const list=extractExplicitPrefixCases(raw,{format:'cases'});
          const depths=c.parents.flatMap(p=>p.gates.flatMap(g=>g.selected.map(s=>s.depth)));
          if(c.protocol.selectionMode!=='deepest'||c.summary.parents!==8||c.summary.selectedStates!==16||list.length!==35||c.summary.childCases!==35||depths.length!==16||Math.min(...depths)!==53||Math.max(...depths)!==105)throw Error('Freeze mismatch: do not query a shifted sample');
          if(new Set(list.map(x=>x.id)).size!==35)throw Error('Duplicate child case');
          const freeze={parentCount:8,states:16,cases:35,minDepth:53,maxDepth:105,
            caseIds:list.map(x=>x.id),
            casesSha256:createHash('sha256').update(JSON.stringify(raw.cases)).digest('hex'),
            sourceCommit:process.env.GITHUB_SHA,
            originalCaptureRun:38980229147,
            classificationBudgetSeconds:20};
          writeFileSync('tmp/pg-h-deep/freeze.json',JSON.stringify(freeze,null,2)+'\n');
          console.log('PG-H DEEP FROZEN '+JSON.stringify({count:list.length,minDepth:53,maxDepth:105}));
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pg-h-deep-exact-input
          path: tmp/pg-h-deep/
          if-no-files-found: warn
          retention-days: 90

  exact:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [1,2,3,4,5,6,7,8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: |
          npm ci
          pip install ortools
      - uses: actions/download-artifact@v8
        with:
          name: pg-h-deep-exact-input
          path: tmp/pg-h-deep/
      - name: CP-SAT 20s per frozen prefix with native witness referee
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/pg-h-deep/exact
          nn=$(printf '%03d' "${{ matrix.shard }}")
          node scripts/run-bundled.mjs scripts/stress/cpsat-explicit-prefix-reference.mjs -- \
            --cases=tmp/pg-h-deep/cases.json --format=cases \
            --time-limit=20 --max-cases=35 \
            --shard-index=${{ matrix.shard }} --shard-count=8 \
            --out="tmp/pg-h-deep/exact/cpsat-explicit-prefix-reference-shard-$nn.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pg-h-deep-exact-shard-${{ matrix.shard }}
          path: tmp/pg-h-deep/exact/
          if-no-files-found: warn
          retention-days: 90

  reconcile:
    needs: [capture, exact]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: pg-h-deep-exact-input
          path: tmp/pg-h-deep/
      - uses: actions/download-artifact@v8
        with:
          pattern: pg-h-deep-exact-shard-*
          path: tmp/pg-h-deep/exact/
          merge-multiple: true
      - name: Coverage-check and reconcile all 35 child decisions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/combine-cpsat-explicit-prefix-reference-shards.mjs \
            --in-dir=tmp/pg-h-deep/exact --shards=8 \
            --out=tmp/pg-h-deep/reference.json
          node scripts/stress/semantic-forcedness-reconcile.mjs \
            --capture=tmp/pg-h-deep/capture.json \
            --reference=tmp/pg-h-deep/reference.json \
            --out=tmp/pg-h-deep/result.json
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const ref=JSON.parse(readFileSync('tmp/pg-h-deep/reference.json','utf8'));
          const r=JSON.parse(readFileSync('tmp/pg-h-deep/result.json','utf8'));
          if(ref.summary.cases!==35||r.summary.referenceRows!==35||r.summary.missingCases||r.summary.correctnessAlarms||ref.summary.inputAlarms)throw Error('Incomplete or invalid exact references');
          const verdict={
            sourceRun:process.env.GITHUB_RUN_ID,sourceCommit:process.env.GITHUB_SHA,
            cases:35,live:ref.summary.live,dead:ref.summary.dead,unknown:ref.summary.abstain,
            fullyResolvedStates:r.summary.resolvedStates,
            forcedStates:r.summary.semanticallyForcedStates,
            branchingStates:r.summary.genuinelyBranchingStates,
            semanticallyDeadStates:r.summary.semanticallyDeadStates,
            unresolvedStates:r.summary.unresolvedStates,
            parentsWithForcedness:r.summary.forcedParents,
            role:'development-only',productionEffect:'none'
          };
          writeFileSync('tmp/pg-h-deep/verdict.json',JSON.stringify(verdict,null,2)+'\n');
          console.log('PG-H DEEP EXACT VERDICT '+JSON.stringify(verdict));
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pg-h-deep-exact-complete
          path: tmp/pg-h-deep/
          if-no-files-found: warn
          retention-days: 90
