name: Hint evidence consolidation post-merge census (temporary)
on:
  push:
    branches:
      - chatgpt/hint-determinism-provenance-audit-2026-09-22
jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Run current consolidation census
        env:
          AUDITED_GIT_SHA: ${{ github.sha }}
        run: node scripts/hint-evidence-consolidation-audit.mjs --out=reports/post-merge-hint-evidence-consolidation-census.json
      - name: Upload census
        uses: actions/upload-artifact@v7
        with:
          name: post-merge-hint-evidence-consolidation-census
          path: reports/post-merge-hint-evidence-consolidation-census.json
          if-no-files-found: error
