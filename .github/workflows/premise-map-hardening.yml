name: Premise map hardening

on:
  pull_request:
    paths:
      - 'docs/solver-*.md'
      - 'docs/variant-level-research.md'
      - 'docs/human-parent-contrast-research.md'
      - 'docs/technique-census-analysis.md'
      - 'docs/solver-premise-space-register.csv'
      - 'docs/solver-premise-space-extension-*.csv'
      - 'docs/solver-premise-space-post-v1-candidates-*.csv'
      - 'docs/solver-premise-space-graph.json'
      - 'docs/solver-premise-space-relations*.json'
      - 'docs/solver-premise-map-hardening*.json'
      - 'docs/solver-premise-map-hardening*.md'
      - 'docs/solver-premise-map-snapshot*.json'
      - 'docs/solver-premise-map-source-coverage*'
      - 'data/stress/README.*'
      - 'modules/solver/README.md'
      - 'scripts/audit-solver-premise-map*.mjs'
      - 'scripts/audit-solver-premise-source-coverage.mjs'
      - '.github/workflows/premise-map-hardening.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /docs/
            /data/stress/README.md
            /modules/solver/README.md
            /modules/solver/stage-plan.ts
            /modules/solver/search-state.ts
            /modules/solver/diversification.ts
            /.github/workflows/README.md
            /reports/2026-09-13-stress-corpus-population-validity-audit.md
            /reports/2026-09-10-solver-system-audit.md
            /reports/solver-premise-map-phase3/
            /scripts/audit-solver-premise-map.mjs
            /scripts/audit-solver-premise-map-v2.mjs
            /scripts/audit-solver-premise-source-coverage.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Audit frozen v1 premise-map structure
        id: v1
        run: node scripts/audit-solver-premise-map.mjs
      - name: Audit reconciled v2 premise-map structure
        id: v2
        run: node scripts/audit-solver-premise-map-v2.mjs
      - name: Audit reciprocal premise-source coverage
        id: source_coverage
        run: node scripts/audit-solver-premise-source-coverage.mjs

      - name: Summarize premise-map hardening
        if: always()
        shell: bash
        env:
          V1: ${{ steps.v1.outcome }}
          V2: ${{ steps.v2.outcome }}
          SOURCE_COVERAGE: ${{ steps.source_coverage.outcome }}
        run: |
          {
            echo '## Premise map hardening'
            echo
            echo "| Audit | Outcome |"
            echo "| --- | --- |"
            printf '| Frozen v1 structure | `%s` |\n' "$V1"
            printf '| Reconciled v2 structure | `%s` |\n' "$V2"
            printf '| Reciprocal premise-source coverage | `%s` |\n' "$SOURCE_COVERAGE"
            echo
            if [[ "$V1" == success && "$V2" == success && "$SOURCE_COVERAGE" == success ]]; then
              echo 'All maintained premise-map invariants passed.'
            else
              echo 'A premise-map invariant failed or was skipped after an earlier failure. Inspect the named audit step from the table above.'
              [[ "$V1" == failure ]] && echo '::error::Frozen v1 premise-map structure audit failed.'
              [[ "$V2" == failure ]] && echo '::error::Reconciled v2 premise-map structure audit failed.'
              [[ "$SOURCE_COVERAGE" == failure ]] && echo '::error::Reciprocal premise-source coverage audit failed.'
            fi
          :
          } >> "$GITHUB_STEP_SUMMARY"
