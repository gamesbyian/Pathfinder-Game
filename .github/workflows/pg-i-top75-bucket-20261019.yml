# One-shot source-frozen PG-I top75 protected score / bucket-tail A/B.
name: PG-I protected top75 bucket retention cold 250k
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pg-i-top75-bucket-20261019.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pg-i-protected-top75-20261019
  cancel-in-progress: false
jobs:
  experiment:
    name: First12 source-only strict-250k original versus score-protected bucket
    runs-on: ubuntu-latest
    timeout-minutes: 29
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Exact source selection/dose fixture
        run: node scripts/run-bundled.mjs scripts/stress/pg-i-top75-score-protected-bucket-250k.mjs -- --self-test
      - name: Actual 12-parent source-frozen original and protected-75 250k A/B
        id: experiment
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/pg-i-top75
          timeout -k 20s --preserve-status 23m \
            node scripts/run-bundled.mjs scripts/stress/pg-i-top75-score-protected-bucket-250k.mjs -- \
            --out=logs/pg-i-top75/verdict.json
      - name: Retain complete positive, negative or partial evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-i-protected-top75-original-250k-20261019
          path: logs/pg-i-top75/verdict.json
          retention-days: 90
          if-no-files-found: warn
      - name: Strict source and referee, but never require a gain
        if: always()
        env:
          RESEARCH_RESULT: ${{ steps.experiment.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RESEARCH_RESULT" = success
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const j=JSON.parse(readFileSync('logs/pg-i-top75/verdict.json','utf8'));
          if(j.sourceExecutionSha!==process.env.GITHUB_SHA
            ||j.summary.sourceOnlyDevelopmentParents!==12
            ||j.summary.validSourceArms!==24
            ||j.summary.errors!==0||j.summary.maxSourceWork>250000)
            throw Error('PG-I source/cap/referee error');
          console.log('PG-I TOP75 SOURCE VERDICT '+JSON.stringify(j.summary));
          NODE
