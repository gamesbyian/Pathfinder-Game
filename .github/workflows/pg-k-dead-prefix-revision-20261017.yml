# One-shot PG-K exact-DEAD revision viability. Remove before permanent integration.
name: PG-K DEAD-prefix segment revision pilot
on:
  push:
    branches:
      - chatgpt/pg-k-dead-prefix-segment-revision-20261017
    paths:
      - .github/workflows/pg-k-dead-prefix-revision-20261017.yml
permissions:
  contents: read
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Pure splice geometry correctness tests
        run: node scripts/run-bundled.mjs scripts/stress/pg-k-dead-prefix-commuting-revision.mjs -- --self-test
      - name: Complete all frozen 75 DEAD-case research-only prefix revisions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-bundled.mjs scripts/stress/pg-k-dead-prefix-commuting-revision.mjs -- --out=tmp/pg-k/dead-revision-verdict.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('tmp/pg-k/dead-revision-verdict.json','utf8'));
          if(d.summary.parents!==25||d.summary.cases!==75)throw Error('incomplete 25-parent/75-case coverage');
          if(d.summary.casesWithRevisionProposals===0)throw Error('zero mechanism exposure: no usable revision candidates');
          console.log('PG-K FULL COVERAGE '+JSON.stringify(d.summary));
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pg-k-dead-prefix-segment-revision-20261017
          path: tmp/pg-k/dead-revision-verdict.json
          if-no-files-found: warn
          retention-days: 90
