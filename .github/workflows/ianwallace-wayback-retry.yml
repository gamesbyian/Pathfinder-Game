name: IanWallace Wayback Retry Failures

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Previous Wayback workflow run ID whose artifact should be extended"
        required: true
        type: string
        default: "32568273632"
      workers:
        description: "Concurrent Wayback recovery requests"
        required: true
        type: choice
        options:
          - "2"
          - "3"
          - "4"
        default: "3"
      timeout:
        description: "Seconds allowed for each replay strategy"
        required: true
        type: choice
        options:
          - "4"
          - "6"
          - "8"
        default: "6"

permissions:
  contents: read
  actions: read

jobs:
  retry:
    name: Retry failed ianwallace.com captures
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download prior Wayback artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          mkdir -p tools/ianwallace-wayback/output
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "ianwallace-wayback-$SOURCE_RUN_ID" \
            --dir tools/ianwallace-wayback/output
          test -f tools/ianwallace-wayback/output/failures.csv
          test -f tools/ianwallace-wayback/output/download-status.csv

      - name: Retry failed captures only
        env:
          WORKERS: ${{ inputs.workers }}
          RETRY_TIMEOUT: ${{ inputs.timeout }}
        run: |
          python3 tools/ianwallace-wayback/retry_failures.py \
            --output tools/ianwallace-wayback/output \
            --workers "$WORKERS" \
            --timeout "$RETRY_TIMEOUT"

      - name: Show recovery summary
        if: always()
        run: cat tools/ianwallace-wayback/output/summary.json || true

      - name: Upload cumulative Wayback archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ianwallace-wayback-${{ github.run_id }}
          path: tools/ianwallace-wayback/output/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30
