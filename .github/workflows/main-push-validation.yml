name: Main push validation

on:
  push:
    branches: [main]

permissions:
  contents: read

# PR CI remains the pre-merge gate. This is a secondary safety net for the repository's currently
# unprotected main branch. Validate every push, including merge commits: parent count cannot prove
# that a merge actually came through a successfully checked PR, and an unprotected branch permits a
# manually pushed merge commit just as readily as a single-parent commit. The duplicated fast gate is
# intentionally small compared with the cost of allowing one main-update shape to bypass validation.
concurrency:
  group: main-push-validation
  cancel-in-progress: false

jobs:
  # Shadow the same impact model used by PR CI without changing this workflow's broad safety-net
  # behavior. Use the push event's full before->after range rather than HEAD^ so multi-commit pushes
  # are classified as one repository update.
  impact-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /scripts/ci-execution-plan.json
            /scripts/ci-execution-plan.mjs
            /scripts/ci-impact-classifier.mjs
            /scripts/ci-impact-rules.json
            /scripts/ci-impact-shadow-plan.mjs
            /scripts/ci-validation-plan.json
            /scripts/ci-validation-plan.mjs
            /scripts/validation-groups.json
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Compute main-push shadow validation plan
        id: impact
        continue-on-error: true
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            node scripts/ci-impact-shadow-plan.mjs --full --out=tmp/ci-impact-shadow.json
          else
            node scripts/ci-impact-shadow-plan.mjs --git-diff "$BEFORE" "$AFTER" --out=tmp/ci-impact-shadow.json
          fi

      - name: Upload shadow validation plan
        if: steps.impact.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ci-impact-shadow
          path: tmp/ci-impact-shadow.json
          retention-days: 14

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run fast repository and contract validation
        id: fast
        run: npm run ci:fast
      - name: Build production bundle
        id: build
        run: npm run build
      - name: Solver capability canary
        id: solver_canary
        run: |
          node scripts/run-bundled.mjs scripts/solver-bench.mjs -- --check \
            --baseline=logs/solver-canary-baseline.json \
            --levels=pos:1,pos:20,pos:40,pos:60,pos:80,pos:100,pos:120,pos:140,pos:160 \
            --budget-ms=15000 --work-budget=5000000

      - name: Summarize main-push validation
        if: always()
        shell: bash
        env:
          FAST: ${{ steps.fast.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SOLVER_CANARY: ${{ steps.solver_canary.outcome }}
        run: |
          {
            echo '## Main push validation'
            echo
            echo "| Check | Outcome |"
            echo "| --- | --- |"
            printf '| Fast repository + contract validation | `%s` |\n' "$FAST"
            printf '| Production build | `%s` |\n' "$BUILD"
            printf '| Solver capability canary | `%s` |\n' "$SOLVER_CANARY"
            echo
            if [[ "$FAST" == success && "$BUILD" == success && "$SOLVER_CANARY" == success ]]; then
              echo 'All post-merge safety-net checks passed.'
            else
              echo 'One or more post-merge safety-net checks did not pass. The table above identifies the first useful step(s) to inspect.'
              [[ "$FAST" == failure ]] && echo '::error::Main-push fast repository/contract validation failed.'
              [[ "$BUILD" == failure ]] && echo '::error::Main-push production build failed.'
              [[ "$SOLVER_CANARY" == failure ]] && echo '::error::Main-push solver capability canary failed.'
            fi
          :
          } >> "$GITHUB_STEP_SUMMARY"