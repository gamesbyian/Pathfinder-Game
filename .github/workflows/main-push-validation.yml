name: Main push validation

on:
  push:
    branches: [main]

permissions:
  contents: read

# PR CI remains the pre-merge gate. This is a secondary safety net for the repository's currently
# unprotected main branch. Validate every push, including merge commits: parent count cannot prove
# that a merge actually came through a successfully checked PR, and an unprotected branch permits a
# manually pushed merge commit just as readily as a single-parent commit. The duplicated fast gate is
# intentionally small compared with the cost of allowing one main-update shape to bypass validation.
concurrency:
  group: main-push-validation
  cancel-in-progress: false

jobs:
  # Shadow the same impact model used by PR CI without changing this workflow's broad safety-net
  # behavior. Use the push event's full before->after range rather than HEAD^ so multi-commit pushes
  # are classified as one repository update.
  impact-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /scripts/ci-execution-plan.json
            /scripts/ci-execution-plan.mjs
            /scripts/ci-impact-classifier.mjs
            /scripts/ci-impact-rules.json
            /scripts/ci-impact-shadow-plan.mjs
            /scripts/ci-validation-plan.json
            /scripts/ci-validation-plan.mjs
            /scripts/validation-groups.json
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Compute main-push shadow validation plan
        id: impact
        continue-on-error: true
        shell: bash
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$BEFORE" =~ ^0+$ ]]; then
            node scripts/ci-impact-shadow-plan.mjs --full --out=tmp/ci-impact-shadow.json
          else
            node scripts/ci-impact-shadow-plan.mjs --git-diff "$BEFORE" "$AFTER" --out=tmp/ci-impact-shadow.json
          fi

      - name: Upload shadow validation plan
        if: steps.impact.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ci-impact-shadow
          path: tmp/ci-impact-shadow.json
          retention-days: 14

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Restore TypeScript incremental state
        id: typescript-buildinfo
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules/.cache/tsconfig.tsbuildinfo
            node_modules/.cache/tsconfig.test.tsbuildinfo
          key: typescript-buildinfo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.test.json') }}-${{ github.sha }}
          restore-keys: |
            typescript-buildinfo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.test.json') }}-

      # Keep independent validation phases running after one phase fails. This is intentionally
      # different from the local ci:fast convenience chain: main-push is a repository-health
      # diagnostic surface, so one push should expose the whole current debt set instead of
      # revealing the next layer only after each fix lands.
      - name: Check package-script reachability
        id: dead_scripts
        continue-on-error: true
        run: npm run check:dead-scripts
      - name: Check textual source invariants
        id: text_source
        continue-on-error: true
        run: npm run check:text-source-files
      - name: Run repository/domain validators
        id: validators
        continue-on-error: true
        env:
          PATHFINDER_PARALLEL_SUCCESS_OUTPUT: summary
          PATHFINDER_DIRECT_PACKAGE_SCRIPTS: '1'
        run: npm run check:validators
      - name: Save TypeScript incremental state
        if: steps.validators.outcome == 'success' && steps.typescript-buildinfo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules/.cache/tsconfig.tsbuildinfo
            node_modules/.cache/tsconfig.test.tsbuildinfo
          key: typescript-buildinfo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.test.json') }}-${{ github.sha }}
      - name: Run lint
        id: lint
        continue-on-error: true
        run: npm run check:lint
      - name: Run fast unit tests
        id: unit_fast
        continue-on-error: true
        run: npm run test:unit:fast
      - name: Run Node and CLI contract tests
        id: node_tests
        continue-on-error: true
        env:
          PATHFINDER_PARALLEL_JOBS: '4'
          PATHFINDER_PARALLEL_SUCCESS_OUTPUT: summary
          PATHFINDER_DIRECT_PACKAGE_SCRIPTS: '1'
        run: npm run test:node
      - name: Build production bundle
        id: build
        continue-on-error: true
        run: npm run build
      - name: Solver capability canary
        id: solver_canary
        continue-on-error: true
        run: |
          node scripts/run-bundled.mjs scripts/solver-bench.mjs -- --check \
            --baseline=logs/solver-canary-baseline.json \
            --levels=pos:1,pos:20,pos:40,pos:60,pos:80,pos:100,pos:120,pos:140,pos:160 \
            --budget-ms=15000 --work-budget=5000000

      - name: Summarize and enforce main-push validation
        if: always()
        shell: bash
        env:
          DEAD_SCRIPTS: ${{ steps.dead_scripts.outcome }}
          TEXT_SOURCE: ${{ steps.text_source.outcome }}
          VALIDATORS: ${{ steps.validators.outcome }}
          LINT: ${{ steps.lint.outcome }}
          UNIT_FAST: ${{ steps.unit_fast.outcome }}
          NODE_TESTS: ${{ steps.node_tests.outcome }}
          BUILD: ${{ steps.build.outcome }}
          SOLVER_CANARY: ${{ steps.solver_canary.outcome }}
        run: |
          failed=0
          {
            echo '## Main push validation'
            echo
            echo '| Validation phase | Outcome |'
            echo '| --- | --- |'
            printf '| Package/script reachability | `%s` |\n' "$DEAD_SCRIPTS"
            printf '| Textual source invariants | `%s` |\n' "$TEXT_SOURCE"
            printf '| Repository/domain validators | `%s` |\n' "$VALIDATORS"
            printf '| Lint | `%s` |\n' "$LINT"
            printf '| Fast unit tests | `%s` |\n' "$UNIT_FAST"
            printf '| Node + CLI contracts | `%s` |\n' "$NODE_TESTS"
            printf '| Production build | `%s` |\n' "$BUILD"
            printf '| Solver capability canary | `%s` |\n' "$SOLVER_CANARY"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for name in DEAD_SCRIPTS TEXT_SOURCE VALIDATORS LINT UNIT_FAST NODE_TESTS BUILD SOLVER_CANARY; do
            status="${!name}"
            printf '%-14s %s\n' "$name" "$status"
            if [[ "$status" != "success" ]]; then
              failed=1
              echo "::error::Main-push validation phase $name finished with $status."
            fi
          done
          if [[ "$failed" == 0 ]]; then
            echo 'All post-merge safety-net phases passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'One or more post-merge phases failed. All independent phases were still executed; fix the complete failure set rather than rerunning to discover the next layer.' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$failed"
