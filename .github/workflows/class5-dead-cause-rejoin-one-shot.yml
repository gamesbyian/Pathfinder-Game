name: class5-dead-cause-rejoin-one-shot

on:
  push:
    branches:
      - chatgpt/class5-dead-cause-rejoin-run-2026-09-13

concurrency:
  group: class5-dead-cause-rejoin-one-shot
  cancel-in-progress: true

jobs:
  rejoin:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Regenerate atlas and freeze sample
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp
          node scripts/run-bundled.mjs scripts/stress/analyze-post-1029-residual-atlas.mjs -- \
            --baseline=reports/stress/capability-runs/34683011115/per-level-corpus2.json \
            --lifecycle=reports/stress/capability-runs/34683011115/lifecycle-failure-map-corpus2.json \
            --census=reports/stress/technique-census/33717910218/combined-cells.json \
            --hints-dir=data/stress/hints-random --out=tmp/class5-atlas.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const atlas = JSON.parse(fs.readFileSync('tmp/class5-atlas.json','utf8'));
          const doc = JSON.parse(fs.readFileSync('data/stress/stress-levels-random.json','utf8'));
          const corpus = Array.isArray(doc) ? doc : doc.levels;
          const posById = new Map(corpus.map((r,i)=>[r.id,i+1]));
          const exclusions = ['R03229','R00046','R02733'];
          const excluded = new Set(exclusions);
          const rows = atlas.rows.filter(r=>r.primaryClass===5 && !excluded.has(r.id)).sort((a,b)=>a.id.localeCompare(b.id));
          const selected=[];
          for(let i=0;i<12;i++){
            const start=Math.floor(i*rows.length/12), end=Math.floor((i+1)*rows.length/12);
            const index=start+Math.floor((end-start-1)/2), row=rows[index], pos=posById.get(row.id);
            if(!pos) throw new Error(`Missing corpus position for ${row.id}`);
            selected.push({stratum:i+1,index,id:row.id,pos,routingRegime:row.routingRegime,features:row.features});
          }
          const out={sourceCommit:process.env.GITHUB_SHA,generatedAt:new Date().toISOString(),class5CountBeforeExclusions:atlas.rows.filter(r=>r.primaryClass===5).length,eligibleCount:rows.length,exclusions,selectionRule:'sort eligible Class-5 rows by id; split into 12 floor-index strata; choose lower midpoint of each stratum',selected};
          fs.writeFileSync('tmp/class5-selection.json',JSON.stringify(out,null,2));
          fs.appendFileSync(process.env.GITHUB_ENV,`CLASS5_LEVEL_SPEC=${selected.map(r=>`pos:${r.pos}`).join(',')}\n`);
          console.log('CLASS5_SELECTION '+JSON.stringify(out));
          NODE

      - name: Run existing boundary-sketch observer at frozen dose
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-bundled.mjs scripts/connectivity-rejection-audit.mjs -- \
            --corpus=data/stress/stress-levels-random.json \
            --levels="$CLASS5_LEVEL_SPEC" \
            --work-budget=500000 \
            --time-budget-ms=30000 \
            --boundary-sketch \
            --out=tmp/class5-dead-cause-audit.json \
            --summary-out=tmp/class5-dead-cause-audit.md

      - name: Evaluate preregistered recurrence gate
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const selection=JSON.parse(fs.readFileSync('tmp/class5-selection.json','utf8'));
          const audit=JSON.parse(fs.readFileSync('tmp/class5-dead-cause-audit.json','utf8'));
          const dominant=audit.records.filter(r=>r.subtype==='goal'&&r.mpVisitedMask===0&&r.mustCrossMask===0&&!r.reservedWallActive&&r.boundarySketch);
          const boundaryKey=r=>r.boundarySketch.boundaryBlockers.map(b=>`${b.cell}:${b.reason}`).sort().join(',');
          const reachedKey=r=>r.boundarySketch.reachedFingerprint;
          const exactKey=r=>r.stateFingerprint;
          function stats(records,keyFn){
            const groups=new Map();
            for(const r of records){const key=`${r.levelId}|${keyFn(r)}`;let g=groups.get(key);if(!g)groups.set(key,g={records:[],states:new Set()});g.records.push(r);g.states.add(r.stateFingerprint);}
            let shared=0,cross=0;const spans=[];
            for(const g of groups.values()){if(g.records.length>1)shared+=g.records.length;if(g.states.size>1){cross+=g.records.length;const w=g.records.map(r=>r.work??0).sort((a,b)=>a-b);spans.push((w.at(-1)??0)-(w[0]??0));}}
            spans.sort((a,b)=>a-b);const pct=n=>records.length?+(100*n/records.length).toFixed(2):0;const p=q=>spans.length?spans[Math.min(spans.length-1,Math.floor(q*spans.length))]:null;
            return {records:records.length,distinctGroups:groups.size,sharedRecords:shared,sharingRate:pct(shared),crossStateRecords:cross,crossStateRecordRate:pct(cross),crossStateGroups:spans.length,crossStateSpanMin:spans[0]??null,crossStateSpanP50:p(.5),crossStateSpanP90:p(.9),crossStateSpanMax:spans.at(-1)??null,crossStateGroupsSpanGt100:spans.filter(v=>v>100).length,crossStateGroupsSpanGt1000:spans.filter(v=>v>1000).length};
          }
          const ids=selection.selected.map(r=>r.id);
          const perLevel=ids.map(id=>{const records=dominant.filter(r=>r.levelId===id);return{id,records:records.length,informative:records.length>=25,exact:stats(records,exactKey),reached:stats(records,reachedKey),boundary:stats(records,boundaryKey)};});
          const informative=perLevel.filter(r=>r.informative), exact=stats(dominant,exactKey), reached=stats(dominant,reachedKey), boundary=stats(dominant,boundaryKey);
          function gate(label,pooled){const majorityPositive=informative.filter(r=>r[label].sharingRate>r.exact.sharingRate).length;return{label,sharingLiftPp:+(pooled.sharingRate-exact.sharingRate).toFixed(2),majorityPositive,informativeLevels:informative.length,crossStateRecordRate:pooled.crossStateRecordRate,conditions1to4:informative.length>=6&&pooled.sharingRate-exact.sharingRate>=10&&majorityPositive>informative.length/2&&pooled.crossStateRecordRate>=25,spacing:{groups:pooled.crossStateGroups,min:pooled.crossStateSpanMin,p50:pooled.crossStateSpanP50,p90:pooled.crossStateSpanP90,max:pooled.crossStateSpanMax,gt100:pooled.crossStateGroupsSpanGt100,gt1000:pooled.crossStateGroupsSpanGt1000}};}
          const reachedGate=gate('reached',reached),boundaryGate=gate('boundary',boundary);
          const result={sourceCommit:process.env.GITHUB_SHA,generatedAt:new Date().toISOString(),selected:selection.selected,workBudget:500000,strictTotalWorkBudget:true,timeBudgetMs:30000,primaryCluster:'goal + mpVisitedMask=0 + mustCrossMask=0 + reservedWallActive=false',dominantRecords:dominant.length,informativeLevels:informative.length,exact,reached,boundary,reachedGate,boundaryGate,perLevel,gateConditions1to4Pass:reachedGate.conditions1to4||boundaryGate.conditions1to4,condition5Note:'Inspect cross-state work-span distribution to rule out almost-entirely adjacent duplicate emission.'};
          fs.writeFileSync('tmp/class5-dead-cause-gate-summary.json',JSON.stringify(result,null,2));
          console.log('CLASS5_GATE_SUMMARY '+JSON.stringify(result));
          console.log(`CLASS5_HUMAN selected=${ids.join(',')} dominant=${dominant.length} informative=${informative.length}/12 exact=${exact.sharingRate}% reached=${reached.sharingRate}% reachedLift=${reachedGate.sharingLiftPp}pp reachedCross=${reached.crossStateRecordRate}% reachedMajority=${reachedGate.majorityPositive}/${informative.length} boundary=${boundary.sharingRate}% boundaryLift=${boundaryGate.sharingLiftPp}pp boundaryCross=${boundary.crossStateRecordRate}% boundaryMajority=${boundaryGate.majorityPositive}/${informative.length} conditions1to4=${result.gateConditions1to4Pass} reachedSpanP50=${reached.crossStateSpanP50} reachedSpanP90=${reached.crossStateSpanP90} boundarySpanP50=${boundary.crossStateSpanP50} boundarySpanP90=${boundary.crossStateSpanP90}`);
          NODE

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: class5-dead-cause-rejoin-evidence
          path: |
            tmp/class5-selection.json
            tmp/class5-dead-cause-audit.json
            tmp/class5-dead-cause-audit.md
            tmp/class5-dead-cause-gate-summary.json
          retention-days: 30
