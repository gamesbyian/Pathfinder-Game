name: Re-derive technique census reports

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/rederive-technique-census-trigger
      - .github/workflows/rederive-technique-census.yml

permissions:
  contents: write

jobs:
  rederive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Re-derive corrected census reports
        run: |
          printf '%s\n' '{"baselineFile":"reports/stress/capability-runs/31918095910/summary.json"}' > /tmp/technique-census-plan.json
          node scripts/combine-technique-census-shards.mjs \
            --combined-file=reports/stress/technique-census/32240161854/combined-cells.json \
            --derived-only \
            --out-dir=reports/stress/technique-census/32240161854 \
            --plan=/tmp/technique-census-plan.json
          git diff -- reports/stress/technique-census/32240161854
      - name: Commit corrected derived reports
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/stress/technique-census/32240161854/README.md \
                  reports/stress/technique-census/32240161854/technique-capability-summary.md \
                  reports/stress/technique-census/32240161854/level-technique-coverage.json \
                  reports/stress/technique-census/32240161854/pair-synergy.md \
                  reports/stress/technique-census/32240161854/flag-sensitivity.md
          if git diff --cached --quiet; then
            echo 'No derived report changes.'
          else
            git commit -m 'Re-derive corrected technique census reports'
            git push
          fi
