name: Temporary solver audit closeout

on:
  push:
    branches:
      - chatgpt/solver-audit-campaign-2026-09-10

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/solver-audit-campaign-2026-09-10
          fetch-depth: 1
      - name: Close audit ledger
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('reports/2026-09-10-solver-system-audit.md')
          text = path.read_text()
          old = (
              '> **Status:** active\n'
              '> **Last evidence:** 2026-09-11 — Audit 19 follow-up and CI recovery are committed: parallel partial-reuse provenance is guarded, fast-gate is green, and three stale deep-verification assertions were aligned with the Audit 12 retry-distinctness contract.\n'
              '> **Decision:** No additional source-audit area remains open; completed CI or review failures reopen the relevant row and are repaired without waiting on in-flight jobs.\n'
              '> **Remaining gate:** Green required CI/review on the current branch tip; repair any concrete regression it exposes.\n'
          )
          new = (
              '> **Status:** complete\n'
              '> **Last evidence:** 2026-09-11 — CI run 4165 is green on the recovered branch tip: fast-gate, ordinary deep verification, and heavyweight implementation proofs all passed after the retry-contract assertion repairs.\n'
              '> **Decision:** All 23 source-audit areas and the recovery/CI follow-up are closed. Later evidence may still reopen the relevant row under the follow-up rule below.\n'
              '> **Remaining gate:** None for this audit campaign.\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one audit header target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/tmp-solver-audit-closeout.yml').unlink()
          PY
      - name: Commit closeout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add reports/2026-09-10-solver-system-audit.md .github/workflows/tmp-solver-audit-closeout.yml
          git diff --cached --check
          git commit -m "docs(audit): close solver system audit campaign"
          git push origin HEAD:chatgpt/solver-audit-campaign-2026-09-10
