# Temporary read-only four-prefix PG-J exact-fate falsifier, not a cold solver producer.
name: PG-J one-pair route compression
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pg-j-one-pair-route-20261018.yml'
  workflow_dispatch:

concurrency:
  group: pg-j-one-pair-route-20261018
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  falsify:
    name: Four frozen exact prefixes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Contract self-test
        run: node scripts/run-bundled.mjs scripts/stress/pg-j-coupled-obligation-route.mjs -- --self-test
      - name: Evaluate all four original P00137 source prefixes
        id: experiment
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/pg-j-coupled-route
          timeout -k 20s --preserve-status 16m \
            node scripts/run-bundled.mjs scripts/stress/pg-j-coupled-obligation-route.mjs -- \
            --out=logs/pg-j-coupled-route/verdict.json
      - name: Preserve result even if experiment failed
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-j-one-pair-route
          path: logs/pg-j-coupled-route/verdict.json
          retention-days: 30
          if-no-files-found: warn
      - name: Validate result completeness
        if: always()
        shell: bash
        env:
          REPLAY_RESULT: ${{ steps.experiment.outcome }}
        run: |
          set -euo pipefail
          test "$REPLAY_RESULT" = success
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('logs/pg-j-coupled-route/verdict.json','utf8'));
          if(r.sourceHead!==process.env.GITHUB_SHA||r.summary.cases!==4
            ||r.summary.liveFalseNegatives!==0||r.rows.some(x=>x.capHit)
            ||r.rows.filter(x=>x.referenceLabel==='live').some(x=>
                !x.witnessAudit?.refereeValid||!x.witnessAudit?.abstractTransitionComplete)
            ||r.summary.noFlipperLiveFalseNegatives!==0
            ||r.rows.some(x=>x.noFlippers.capHit
                ||x.noFlippers.minimumRequiredLength>x.minimumRequiredLength)
            ||r.summary.selectedPairLiveFalseNegatives!==0
            ||r.rows.some(x=>x.selectedPair.capHit
                ||x.selectedPair.minimumRequiredLength>x.noFlippers.minimumRequiredLength))
            throw Error('source/semantic/cap/LIVE-witness qualification failed');
          console.log(JSON.stringify(r.summary));
          NODE
