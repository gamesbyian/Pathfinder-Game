# Generated by scripts/generate-corpus2-batch-workflows.mjs -- do not hand-edit.
# See .github/workflows/README-solver-corpus2-batches.md for what this is and how to use it.
# One-off, rare/on-demand infrastructure -- manual trigger only, not run on every push.
name: Solver corpus-2 batch 20/20 (levels 1616-1700)

on:
  workflow_dispatch:
    inputs:
      budget_ms:
        description: 'Per-level solve budget in milliseconds'
        required: false
        default: '120000'
      node_budget:
        description: 'Per-level node-count ceiling (deterministic backstop alongside budget_ms)'
        required: false
        default: '8000000'
      workers:
        description: 'Cross-level worker processes (GH-hosted ubuntu-latest runners have 2-4 cores)'
        required: false
        default: '2'

permissions:
  contents: write

concurrency:
  group: solver-corpus2-batch-20
  cancel-in-progress: false

jobs:
  solve-batch-20:
    name: Corpus-2 levels 1616-1700
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check out the batch branch (continuing prior progress) or create it from main
        shell: bash
        run: |
          git fetch origin main
          if git ls-remote --exit-code --heads origin stress-corpus2-batch-20 >/dev/null 2>&1; then
            echo "Branch stress-corpus2-batch-20 already exists -- continuing from its current state."
            git fetch origin stress-corpus2-batch-20
            git checkout -B stress-corpus2-batch-20 origin/stress-corpus2-batch-20
          else
            echo "Branch stress-corpus2-batch-20 does not exist yet -- creating from main."
            git checkout -B stress-corpus2-batch-20 origin/main
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare log files (always creates a valid result file before anything else runs)
        shell: bash
        run: |
          mkdir -p logs/solver-corpus2-batches
          if [ ! -f logs/solver-corpus2-batches/batch-20.json ]; then
            cat > logs/solver-corpus2-batches/batch-20.json <<'JSON'
          {
           "batch": 20,
           "levels": "1616-1700",
           "corpus": "data/stress/stress-levels-random.json",
           "status": "not-started",
           "note": "placeholder written before the solve step ran; overwritten with real results if the sweep completes any levels"
          }
          JSON
          fi
          touch logs/solver-corpus2-batches/batch-20.console.log
          echo "Prepared batch 20 (levels 1616-1700) at $(date -u +%FT%TZ)." | tee -a logs/solver-corpus2-batches/batch-20.console.log

      - name: Determine still-unsolved levels in this batch's range
        id: unsolved
        shell: bash
        run: |
          set +e
          levels=$(npm run --silent stress:unsolved-in-range -- --corpus=data/stress/stress-levels-random.json --range=1616-1700 2>>logs/solver-corpus2-batches/batch-20.console.log)
          status=$?
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "Determining unsolved levels failed with exit code ${status}; sweep will not start." | tee -a logs/solver-corpus2-batches/batch-20.console.log
            echo "levels=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "levels=${levels}" >> "$GITHUB_OUTPUT"
          if [ -z "${levels}" ]; then
            echo "All levels 1616-1700 already have a solver-found hint; nothing to do." | tee -a logs/solver-corpus2-batches/batch-20.console.log
          else
            echo "Levels still unsolved: ${levels}" | tee -a logs/solver-corpus2-batches/batch-20.console.log
          fi
          exit 0

      - name: Run portfolio-solve-sweep on remaining levels (legacy scheduler only, matches production)
        id: sweep
        if: steps.unsolved.outputs.status == '0' && steps.unsolved.outputs.levels != ''
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout -k 30s --preserve-status 340m node scripts/run-bundled.mjs scripts/portfolio-solve-sweep.mjs \
            --corpus=data/stress/stress-levels-random.json \
            --levels="${{ steps.unsolved.outputs.levels }}" \
            --scheduler-mode=legacy \
            --budget-ms="${{ inputs.budget_ms }}" \
            --node-budget="${{ inputs.node_budget }}" \
            --workers="${{ inputs.workers }}" \
            --resume --checkpoint=logs/solver-corpus2-batches/batch-20.checkpoint.jsonl \
            --save-hints \
            --out=logs/solver-corpus2-batches/batch-20.json --summary-out=logs/solver-corpus2-batches/batch-20-summary.md \
            2>&1 | tee -a logs/solver-corpus2-batches/batch-20.console.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record skipped sweep
        if: steps.unsolved.outputs.status == '0' && steps.unsolved.outputs.levels == ''
        shell: bash
        run: |
          echo "Skipped -- every level in this batch already has a solver-found hint." | tee -a logs/solver-corpus2-batches/batch-20.console.log

      - name: Commit and push whatever hints/results this run produced
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/stress/hints-random/ data/stress/stress-levels-random.json logs/solver-corpus2-batches/
          if git diff --cached --quiet; then
            echo "Nothing changed -- not creating an empty commit."
          else
            git commit -m "Batch 20: corpus-2 levels 1616-1700 solve progress"
            for attempt in 1 2 3 4; do
              if git push origin HEAD:stress-corpus2-batch-20; then break; fi
              echo "Push attempt ${attempt} failed; retrying after a short wait..."
              sleep $((attempt * 5))
              git fetch origin stress-corpus2-batch-20
              if git rebase origin/stress-corpus2-batch-20; then continue; fi
              fallback_ref="refs/heads/stress-corpus2-batch-20-retry-$(date +%s)"
              echo "Rebase failed -- pushing what we have to a fallback ref instead of losing it: ${fallback_ref}"
              git push origin "HEAD:${fallback_ref}"
              break
            done
          fi

      - name: Upload batch logs as an artifact (belt and suspenders alongside the branch push)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solver-corpus2-batch-20
          path: |
            logs/solver-corpus2-batches/batch-20.json
            logs/solver-corpus2-batches/batch-20-summary.md
            logs/solver-corpus2-batches/batch-20.checkpoint.jsonl
            logs/solver-corpus2-batches/batch-20.console.log
          if-no-files-found: warn
          retention-days: 30

      - name: Fail the job if the sweep itself failed (visibility only -- push/upload already happened above)
        if: always() && (steps.unsolved.outputs.status != '0' || (steps.unsolved.outputs.levels != '' && steps.sweep.outputs.exit_code != '0' && steps.sweep.outputs.exit_code != '124' && steps.sweep.outputs.exit_code != '143'))
        run: |
          echo "unsolved_status=${{ steps.unsolved.outputs.status }}"
          echo "sweep_exit_code=${{ steps.sweep.outputs.exit_code }}"
          echo "Note: exit codes 124/143 (timeout/SIGTERM from the 340m wrapper) are treated as expected for a" \
               "budget-exhausting batch, not a failure -- whatever was found before the timeout was already" \
               "committed and pushed in the prior step."
          exit 1
