# One-shot PG-L canary; remove before evidence-only integration.
name: PG-L actual production dispatch canary
on:
  push:
    branches:
      - chatgpt/pg-l-actual-dispatch-census-20261017
    paths:
      - .github/workflows/pg-l-actual-dispatch-20261017.yml
      - scripts/stress/pg-l-actual-dispatch-canary.mjs
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Check attempt telemetry identity contract
        run: node scripts/run-bundled.mjs scripts/stress/pg-l-actual-dispatch-canary.mjs -- --self-test
      - name: Observe actual bounded attempts on eight parents
        run: node scripts/run-bundled.mjs scripts/stress/pg-l-actual-dispatch-canary.mjs -- --out=tmp/pg-l/dispatch.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pg-l-actual-dispatch-250k-20261017
          path: tmp/pg-l/dispatch.json
          if-no-files-found: warn
          retention-days: 90
