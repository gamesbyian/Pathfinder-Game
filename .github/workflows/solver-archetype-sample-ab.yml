# Stratified-sample level-blind capability A/B for an archetype-gated ATTEMPT_POLICY routing
# change (modules/solver/attempts.ts) -- the general form of solver-repair-probe-adaptive-sample-
# ab.yml's eligibility-sample pattern, generalized from one hardcoded mechanic predicate to any set
# of detectArchetype() archetypes via scripts/stress/select-archetype-sample.mjs.
#
# Deliberately NOT a full-corpus refresh, and NOT solver-stress-refresh.yml's canonical full-1700
# capability workflow: an ATTEMPT_POLICY rule change can only ever affect a level's outcome if the
# level's detected archetype matches one of the rules the change touches (attempts.ts routes purely
# on detectArchetype(level)/LevelFeatures). A uniform random sample of the full corpus wastes most
# of its compute re-confirming zero-effect on every other archetype. This draws a deterministic
# seeded subsample from the named archetype(s) specifically, plus a small control sample from every
# other archetype, to empirically catch anything outside the intended scope. Same seed -> same
# sample, always.
#
# CORPUS INVARIANT: every arm also runs all of Corpus 1 and all published levels; the targeted
# sample applies only to expensive Corpus 2. scripts/plan-ab-corpus-shards.mjs owns this shared policy.
#
# CAPABILITY INVARIANT (same as solver-stress-refresh.yml): uses scripts/level-blind-capability-
# sweep.mjs, never the history-aware research sweep. Never persists hints, never touches
# logs/stress-corpus2-baseline.json / data/level-heatmaps.json. Artifact-only: never commits to main.
#
# Usage: dispatch twice with identical inputs (including archetypes and seed) except enable_flags/
# disable_flags/ref for whatever code change you're A/B testing -- e.g. dispatch control at the
# pre-change commit and treatment at the post-change commit, both with identical archetypes/seed/
# node_budget -- then compare each run's combined solved count/gains/losses (per-id, from each run's
# reports/stress/archetype-sample-ab.json artifact).
name: Solver archetype-gated routing sample A/B

on:
  workflow_dispatch:
    inputs:
      archetypes:
        description: 'Comma-separated detectArchetype() values the code change under test can affect, e.g. high-intersection-burden,must-cross-heavy (see modules/solver/archetype.ts for the full vocabulary: near-closure, portal-heavy, must-cross-heavy, high-intersection-burden, default).'
        required: true
      eligible_sample:
        description: 'How many of the eligible (archetype in the list above) population to sample.'
        required: false
        default: '250'
      control_sample:
        description: 'How many ineligible (every other archetype) levels to sample as a control.'
        required: false
        default: '50'
      seed:
        description: 'Deterministic sample seed. MUST be identical across both arms of a matched A/B -- pick something stable per question (e.g. a short slug for what you are testing) so re-dispatches of the same question stay comparable.'
        required: false
        default: 'archetype-sample'
      node_budget:
        description: 'Corpus-2 cumulative node ceiling per level. Matches solver-stress-refresh.yml''s canonical corpus2_node_budget default.'
        required: false
        default: '50000000'
      budget_ms:
        description: 'Per-level wall budget. Default 24h is intentionally non-binding; node budget is the real ceiling.'
        required: false
        default: '86400000'
      workers:
        description: 'Cross-level worker processes per shard. Default 4 matches current standard public ubuntu-latest runner vCPU count.'
        required: false
        default: '4'
      shard_count:
        description: 'Number of even shards to split the sample into. Default 60 queues finer work behind 20 lanes so fast lanes keep pulling work instead of idling behind a coarse-shard straggler.'
        required: false
        default: '60'
      max_parallel:
        description: 'Shards running concurrently. Keep below shard_count for queue-based tail balancing; lower further if a matched A/B pair must share the account job budget.'
        required: false
        default: '20'
      enable_flags:
        description: 'Comma-separated ablation flags to turn ON for this arm.'
        required: false
        default: ''
      disable_flags:
        description: 'Comma-separated ablation flags to turn OFF for this arm.'
        required: false
        default: ''
      repair_late_probe_node_budget:
        description: 'Optional STRATEGY_REPAIR_LATE_PROBE node cap override (production default 2000000, stage-budget.ts REPAIR_LATE_PROBE_NODE_BUDGET); blank for control.'
        required: false
        default: ''
      deterministic:
        description: 'true forces a 24h non-binding deadline so this run is reproducible (bit-identical nodes/work). Matched A/B arms should both use true.'
        required: false
        default: 'true'

concurrency:
  group: solver-archetype-sample-ab-${{ inputs.archetypes }}-${{ inputs.seed }}
  cancel-in-progress: false

jobs:
  plan:
    name: Select stratified sample and plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      total_levels: ${{ steps.plan.outputs.total_levels }}
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select the deterministic stratified sample
        shell: bash
        run: |
          mkdir -p logs/solver-archetype-sample
          node scripts/run-bundled.mjs scripts/stress/select-archetype-sample.mjs -- \
            --corpus=data/stress/stress-levels-random.json \
            --archetypes="${{ inputs.archetypes }}" \
            --eligible-sample="${{ inputs.eligible_sample }}" \
            --control-sample="${{ inputs.control_sample }}" \
            --seed="${{ inputs.seed }}" \
            --out=logs/solver-archetype-sample/sample.txt

      - name: Split into even shards
        id: plan
        shell: bash
        run: |
          node scripts/plan-ab-corpus-shards.mjs \
            --corpus2-sample="logs/solver-archetype-sample/sample.txt" \
            --corpus2-shards="${{ inputs.shard_count }}"

      - name: Upload the sample + shard plan for traceability
        uses: actions/upload-artifact@v7
        with:
          name: archetype-sample-plan
          path: logs/solver-archetype-sample/
          retention-days: 90

  solve-shards:
    name: Sample shard ${{ matrix.shard.idx }}/${{ needs.plan.outputs.shard_count }}
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel) }}
      matrix: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run level-blind capability sweep on this shard
        id: sweep
        continue-on-error: true
        shell: bash
        env:
          DEADLINE: ${{ inputs.deterministic == 'true' && '86400000' || inputs.budget_ms }}
        run: |
          set +e
          mkdir -p logs/solver-archetype-sample
          extra=()
          [ -n "${{ inputs.enable_flags }}" ] && extra+=("--enable-flags=${{ inputs.enable_flags }}")
          [ -n "${{ inputs.disable_flags }}" ] && extra+=("--disable-flags=${{ inputs.disable_flags }}")
          [ -n "${{ inputs.repair_late_probe_node_budget }}" ] && extra+=("--repair-late-probe-node-budget=${{ inputs.repair_late_probe_node_budget }}")
          work=$(( ${{ inputs.node_budget }} * 134 / 100 ))
          timeout -k 30s --preserve-status 170m node scripts/run-bundled.mjs scripts/level-blind-capability-sweep.mjs -- \
            --corpus="${{ matrix.shard.corpus }}" \
            --levels="${{ matrix.shard.levels }}" \
            --budget-ms="${DEADLINE}" \
            --node-budget="${{ inputs.node_budget }}" \
            --work-budget="${work}" \
            --workers="${{ inputs.workers }}" \
            "${extra[@]}" \
            --out="logs/solver-archetype-sample/batch-${{ matrix.shard.idx }}.json" \
            --summary-out="logs/solver-archetype-sample/batch-${{ matrix.shard.idx }}-summary.md"
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archetype-sample-shard-${{ matrix.shard.idx }}
          path: |
            logs/solver-archetype-sample/batch-${{ matrix.shard.idx }}.json
            logs/solver-archetype-sample/batch-${{ matrix.shard.idx }}-summary.md
          if-no-files-found: error
          retention-days: 90

      - name: Fail on unexpected sweep error
        if: >-
          always() &&
          (steps.sweep.outputs.exit_code != '0' && steps.sweep.outputs.exit_code != '124' && steps.sweep.outputs.exit_code != '143')
        run: exit 1

  combine:
    name: Combine sample results
    needs: [plan, solve-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Download shard artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'archetype-sample-shard-*'
          path: artifact-staging/downloaded
          merge-multiple: true

      - name: Combine into one report (subset-shaped -- NEVER the full-corpus baseline)
        shell: bash
        run: |
          mkdir -p logs/solver-archetype-sample reports/stress
          cp -a artifact-staging/downloaded/. logs/solver-archetype-sample/
          FILES=$(ls logs/solver-archetype-sample/batch-*.json 2>/dev/null | paste -sd, -)
          [ -n "$FILES" ] && node scripts/portfolio-sweep-reports-to-benchmark.mjs --allow-mixed-corpora --in="${FILES}" --out=reports/stress/archetype-sample-ab.json

      - name: Verify complete coverage
        id: coverage
        shell: bash
        run: |
          node -e "
          const fs = require('node:fs');
          const expectedTotal = ${{ needs.plan.outputs.total_levels }};
          const report = JSON.parse(fs.readFileSync('reports/stress/archetype-sample-ab.json', 'utf8'));
          const rows = report.levels ?? [];
          if (rows.length !== expectedTotal) { console.error(\`incomplete: \${rows.length}/\${expectedTotal}\`); process.exit(1); }
          console.log(\`complete: \${rows.length}/\${expectedTotal}\`);
          "

      - name: Print solved-count summary
        shell: bash
        run: |
          node -e "
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('reports/stress/archetype-sample-ab.json', 'utf8'));
          const rows = r.levels ?? [];
          const solved = rows.filter(x => x.ok).length;
          const nodes = rows.reduce((n,x) => n + (x.nodesExpanded || 0), 0);
          const work = rows.reduce((n,x) => n + (x.workSpent || 0), 0);
          console.log('archetypes=${{ inputs.archetypes }} enable_flags=${{ inputs.enable_flags }} disable_flags=${{ inputs.disable_flags }} ref=${{ github.sha }}');
          console.log(\`SOLVED sample: \${solved}/\${rows.length} nodes=\${nodes} work=\${work}\`);
          console.log('Solved ids: ' + rows.filter(x => x.ok).map(x => x.id ?? String(x.level)).sort().join(','));
          console.log('Unsolved ids: ' + rows.filter(x => !x.ok).map(x => x.id ?? String(x.level)).sort().join(','));
          "

      - name: Upload combined results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: archetype-sample-ab-combined
          path: |
            reports/stress/archetype-sample-ab.json
            logs/solver-archetype-sample/
          if-no-files-found: error
          retention-days: 90
