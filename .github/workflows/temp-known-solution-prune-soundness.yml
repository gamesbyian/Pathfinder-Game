name: TEMP known-solution prune soundness

on:
  push:
    branches:
      - chatgpt/known-solution-prune-soundness-2026-09-11

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Replay every stored corpus-2 solution through shared hard prunes
        run: |
          mkdir -p reports/stress/tmp-known-solution-prune
          node scripts/run-bundled.mjs scripts/stress/known-solution-hard-prune-soundness-check.mjs -- \
            --corpus=data/stress/stress-levels-random.json \
            --out=reports/stress/tmp-known-solution-prune/corpus2.json
      - name: Replay every stored corpus-1 solution through shared hard prunes
        run: |
          node scripts/run-bundled.mjs scripts/stress/known-solution-hard-prune-soundness-check.mjs -- \
            --corpus=data/stress/stress-levels.json \
            --out=reports/stress/tmp-known-solution-prune/corpus1.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: known-solution-prune-soundness
          path: reports/stress/tmp-known-solution-prune/*.json
          if-no-files-found: error
