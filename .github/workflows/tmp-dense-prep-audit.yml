name: Temporary dense-prep refactor workbench

on:
  push:
    branches:
      - chatgpt/dense-prep-indexes-2026-08-25

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Enumerate packed-key prep readers
        run: node scripts/tmp-dense-prep-audit.mjs

      - name: Baseline published speed probe
        run: npm run solver:speed-probe -- --corpus=published --count=40 --budget-ms=600000 --node-budget=250000 --out=tmp/dense-prep/published-before.json
      - name: Baseline Corpus-2 speed probe
        run: npm run solver:speed-probe -- --corpus=corpus2 --count=24 --start=1 --stride=67 --budget-ms=600000 --node-budget=250000 --out=tmp/dense-prep/corpus2-before.json

      - name: Apply count-checked dense-prep codemod
        run: node scripts/tmp-apply-dense-prep-codemod.mjs

      - name: Typecheck changed representation
        run: npm run check:types && npm run check:types:tests
      - name: Solver regression baseline
        run: npm run solver:bench -- --check

      - name: Treatment published speed probe
        run: npm run solver:speed-probe -- --corpus=published --count=40 --budget-ms=600000 --node-budget=250000 --out=tmp/dense-prep/published-after.json
      - name: Treatment Corpus-2 speed probe
        run: npm run solver:speed-probe -- --corpus=corpus2 --count=24 --start=1 --stride=67 --budget-ms=600000 --node-budget=250000 --out=tmp/dense-prep/corpus2-after.json

      - name: Require identical search work and report wall change
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const pairs = [
            ['published', 'tmp/dense-prep/published-before.json', 'tmp/dense-prep/published-after.json'],
            ['corpus2', 'tmp/dense-prep/corpus2-before.json', 'tmp/dense-prep/corpus2-after.json'],
          ];
          let bad = false;
          for (const [name, bp, ap] of pairs) {
            const b = JSON.parse(readFileSync(bp, 'utf8'));
            const a = JSON.parse(readFileSync(ap, 'utf8'));
            if (b.rows.length !== a.rows.length) throw new Error(`${name}: row-count mismatch`);
            for (let i = 0; i < b.rows.length; i++) {
              const br = b.rows[i], ar = a.rows[i];
              if (br.id !== ar.id || br.ok !== ar.ok || br.nodes !== ar.nodes) {
                console.error(`${name}: search divergence at ${br.id}: before ok=${br.ok} nodes=${br.nodes}; after ok=${ar.ok} nodes=${ar.nodes}`);
                bad = true;
              }
            }
            const pct = ((a.totalMs / b.totalMs) - 1) * 100;
            console.log(`${name}: ${b.totalMs.toFixed(1)}ms -> ${a.totalMs.toFixed(1)}ms (${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%), nodes ${b.totalNodes} -> ${a.totalNodes}`);
          }
          if (bad) process.exit(1);
          NODE

      - name: Fast repository CI
        run: npm run ci:fast

      - name: Commit verified solver changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add modules/solver
          if git diff --cached --quiet; then
            echo "No solver changes to commit"
            exit 0
          fi
          git commit -m "Dense-index remaining prepLevel cell arrays"
          git push origin HEAD:chatgpt/dense-prep-indexes-2026-08-25
