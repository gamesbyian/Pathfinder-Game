# Temporary read-only transfer of the terminal metric to original saved beam prefixes.
name: PG-J frozen terminal metric transfer
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pg-j-frozen-terminal-metric-transfer-20261018.yml'
  workflow_dispatch:

concurrency:
  group: pg-j-frozen-terminal-metric-transfer-20261018
  cancel-in-progress: false
permissions:
  contents: read
  actions: read

jobs:
  transfer:
    name: Original twelve-parent retained-prefix metric
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact execution commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install
        run: npm ci
      - name: Check pure state/heap contracts
        run: node scripts/stress/pg-j-metric-frozen-corpus2-transfer.mjs --self-test
      - name: Retrieve unchanged original native beam artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/pg-j-terminal-transfer/source
          gh run download 39197248687 \
            --repo gamesbyian/Pathfinder-Game \
            --name pg-j-corpus2-subset-opportunity \
            --dir logs/pg-j-terminal-transfer/source
          test -f logs/pg-j-terminal-transfer/source/opportunity.json
      - name: Source-native canonical prefix replay and bounded metric
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 15s --preserve-status 16m \
            node scripts/run-bundled.mjs scripts/stress/pg-j-metric-frozen-corpus2-transfer.mjs -- \
            --source=logs/pg-j-terminal-transfer/source/opportunity.json \
            --out=logs/pg-j-terminal-transfer/verdict.json
      - name: Preserve 12-parent outcome regardless of scientific sign
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-j-frozen-terminal-metric-transfer
          path: logs/pg-j-terminal-transfer/verdict.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce evidence integrity not a positive result
        if: always()
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PROBE_OUTCOME" = success
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const j=JSON.parse(readFileSync('logs/pg-j-terminal-transfer/verdict.json','utf8'));
          if(j.sourceHead!==process.env.GITHUB_SHA
            ||j.sourceArtifactRun!==39197248687
            ||j.summary.independentParents!==12
            ||j.rows.length!==12
            ||j.summary.selectedPrefixCells<12
            ||j.summary.sourceNativeReplayAlarms!==0)
             throw Error('PG-J frozen transfer identity or mandatory replay incomplete');
          console.log(JSON.stringify(j.summary));
          NODE
