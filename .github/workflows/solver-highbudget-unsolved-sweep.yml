# High-budget exploratory sweep over ONLY the levels neither corpus's solver has ever cold-solved,
# using the real production solving path (portfolio-solve-sweep.mjs --scheduler-mode=production).
# Built 2026-07-24; reworked 2026-07-26
# to fix a tail-latency problem discovered running it twice: the original fixed 20-shard even-COUNT
# split let a shard's wall time vary hugely by chance (round 2: ideal perfectly-balanced wall time
# was ~152min, actual observed was ~220min -- a ~45% loss purely from some of the 20 fixed lanes
# finishing in ~90min while the slowest ran 210+min, with nothing to refill the idle lanes).
#
# Now a `plan` job runs scripts/plan-highbudget-shards.mjs first: it predicts each still-unsolved
# id's runtime from logs/solver-stress-refresh/corpus2-runtime-telemetry.json (an EMA of "ms per
# billion nodes" observed the last time that id hit the node-budget ceiling) scaled to THIS round's
# --node-budget, then bin-packs ids into runtime-balanced shards (~160-ish at the defaults, sized to
# a target wall-clock per shard) instead of a fixed count. `solve-shards` consumes that plan as a
# DYNAMIC matrix (`fromJson(needs.plan.outputs.shards)`) with `max-parallel: 20`: as a small shard
# finishes, the next queued shard starts immediately, instead of idling behind 20 fixed lanes.
# `combine` folds this round's real observed timings back into the telemetry file afterward, so the
# NEXT round's plan is better-calibrated -- see plan-highbudget-shards.mjs's own header for the
# exceptionally-slow-levels-get-their-own-shard and randomized-tie-breaking mechanics.
#
# Deliberately NOT a full-corpus refresh: unlike solver-stress-refresh.yml, this workflow only
# targets the two frozen id lists below (each level already confirmed unsolved as of the last
# baseline refresh) and does NOT recompile logs/stress-corpus{1,2}-baseline.json or
# data/level-heatmaps.json -- those represent FULL-corpus truth, and overwriting them from a
# subset-only run would silently corrupt them. Any level this sweep solves gets a real hint saved
# (--save-hints, same mechanism as every other batch tool) and shows up in the combined report;
# merging newly-solved ids into the official baseline is a separate, explicit step (see
# scripts/patch-benchmark-with-sweep.mjs) run after reviewing a round's results.
name: Solver high-budget sweep (unsolved-only, both corpora)
run-name: "High-budget unsolved · node=${{ inputs.node_budget }} · workers=${{ inputs.workers }}"

on:
  workflow_dispatch:
    inputs:
      budget_ms:
        description: 'Per-level time budget in milliseconds (per attempt-ladder tier; node_budget is the real backstop)'
        required: false
        default: '75000'
      node_budget:
        description: 'Per-level node-count ceiling (the real backstop -- every remaining-unsolved level has hit this in every round run so far)'
        required: false
        default: '120000000'
      workers:
        description: 'Cross-level worker processes per shard (GH-hosted ubuntu-latest runners have 4 vCPUs)'
        required: false
        default: '4'
      target_wall_minutes:
        description: 'Target wall-clock minutes per shard (shard count is derived from this, not fixed -- tune UP when node_budget grows a lot round over round, since the typical predicted-per-level time grows with it)'
        required: false
        default: '20'
      solo_threshold_multiplier:
        description: 'An id predicted to take >= target_wall_minutes * this multiplier gets its own dedicated shard instead of being packed with others'
        required: false
        default: '2.5'
      seed:
        description: "Shard-packing tie-break shuffle seed (blank = derived from this run's id, so each dispatch reshuffles which similarly-weighted ids share a shard)"
        required: false
        default: ''

concurrency:
  group: solver-highbudget-unsolved-sweep
  cancel-in-progress: false

jobs:
  # Predicts each still-unsolved id's runtime from telemetry and bin-packs them into runtime-
  # balanced shards -- see plan-highbudget-shards.mjs's own header comment for the full mechanism.
  plan:
    name: Plan weighted shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the shard planner
        id: plan
        shell: bash
        run: |
          mkdir -p logs/solver-highbudget-sweep
          node scripts/plan-highbudget-shards.mjs \
            --ids-file=logs/solver-stress-refresh/corpus2-unsolved-highbudget-2026-07-24.txt \
            --corpus1-ids-file=logs/solver-stress-refresh/corpus1-unsolved-highbudget-2026-07-24.txt \
            --corpus2=data/stress/stress-levels-random.json \
            --corpus1=data/stress/stress-levels.json \
            --telemetry=logs/solver-stress-refresh/corpus2-runtime-telemetry.json \
            --node-budget="${{ inputs.node_budget }}" \
            --workers="${{ inputs.workers }}" \
            --target-wall-minutes="${{ inputs.target_wall_minutes }}" \
            --solo-threshold-multiplier="${{ inputs.solo_threshold_multiplier }}" \
            --seed="${{ inputs.seed || github.run_id }}" \
            --max-shards=250 \
            --out=logs/solver-highbudget-sweep/shard-plan.json
          shards_json=$(jq -c . logs/solver-highbudget-sweep/shard-plan.json)
          echo "shards=${shards_json}" >> "$GITHUB_OUTPUT"
          echo "shard_count=$(jq '.shard | length' logs/solver-highbudget-sweep/shard-plan.json)" >> "$GITHUB_OUTPUT"

      - name: Upload the shard plan for traceability
        uses: actions/upload-artifact@v7
        with:
          name: highbudget-shard-plan
          path: logs/solver-highbudget-sweep/shard-plan.json
          retention-days: 90

  # One job instance per planned shard, up to 20 running concurrently -- as a small shard finishes,
  # the matrix immediately starts the next queued one (no more idle lanes waiting on 20 fixed-size
  # shards). Every shard's own --levels/--timeout are pre-resolved by the plan job; nothing here
  # does its own position/timing math anymore.
  solve-shards:
    name: High-budget shard ${{ matrix.shard.idx }}/${{ needs.plan.outputs.shard_count }}
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.shard.jobTimeoutMinutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare log files (always creates valid result files before anything else runs)
        shell: bash
        run: |
          mkdir -p logs/solver-highbudget-sweep
          # portfolio-solve-sweep.mjs's --resume/--checkpoint exists to survive THIS shard's own
          # timeout wrapper killing it mid-run, not to persist across separate workflow_dispatch
          # runs -- but since --out/--checkpoint reuse the same corpusN-batch-NNN filenames every
          # dispatch, and the previous run's checkpoint is still sitting in the repo (committed by
          # the combine job), a plain checkout leaves it in place. --resume then treats every id
          # the last run touched as "already done" and skips it outright, even at a brand new
          # budget -- confirmed 2026-07-24: shards silently no-op'd in <30s. Deleting any checkpoint
          # left over from a previous run before this run's sweep steps closes that gap while
          # keeping --resume's real job (mid-run crash safety) intact.
          rm -f "logs/solver-highbudget-sweep/corpus1-batch-${{ matrix.shard.idx }}.json.checkpoint.jsonl" \
                "logs/solver-highbudget-sweep/corpus2-batch-${{ matrix.shard.idx }}.json.checkpoint.jsonl"
          cat > "logs/solver-highbudget-sweep/corpus2-batch-${{ matrix.shard.idx }}.json" <<'JSON'
          {
           "summary": { "corpus": "data/stress/stress-levels-random.json", "budgetMs": null, "status": "not-started" },
           "levels": [],
           "note": "placeholder written before the sweep ran; overwritten with real results as soon as the first level completes"
          }
          JSON
          touch "logs/solver-highbudget-sweep/corpus2-batch-${{ matrix.shard.idx }}.console.log"
          if [ -n "${{ matrix.shard.c1Id }}" ]; then
            cat > "logs/solver-highbudget-sweep/corpus1-batch-${{ matrix.shard.idx }}.json" <<'JSON'
          {
           "summary": { "corpus": "data/stress/stress-levels.json", "budgetMs": null, "status": "not-started" },
           "levels": [],
           "note": "placeholder written before the sweep ran; overwritten with real results as soon as the first level completes"
          }
          JSON
            touch "logs/solver-highbudget-sweep/corpus1-batch-${{ matrix.shard.idx }}.console.log"
          fi

      - name: Run portfolio-solve-sweep on this shard's corpus-1 straggler (if any)
        id: sweep-corpus1
        if: matrix.shard.c1Id != null
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout -k 30s --preserve-status "${{ matrix.shard.c1TimeoutMinutes }}m" node scripts/run-bundled.mjs scripts/portfolio-solve-sweep.mjs \
            --corpus=data/stress/stress-levels.json \
            --levels="${{ matrix.shard.c1Levels }}" \
            --scheduler-mode=production \
            --budget-ms="${{ inputs.budget_ms }}" \
            --node-budget="${{ inputs.node_budget }}" \
            --workers=1 \
            --resume \
            --save-hints \
            --out="logs/solver-highbudget-sweep/corpus1-batch-${{ matrix.shard.idx }}.json" \
            --summary-out="logs/solver-highbudget-sweep/corpus1-batch-${{ matrix.shard.idx }}-summary.md" \
            2>&1 | tee -a "logs/solver-highbudget-sweep/corpus1-batch-${{ matrix.shard.idx }}.console.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run portfolio-solve-sweep on this shard's corpus-2 slice
        id: sweep-corpus2
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout -k 30s --preserve-status "${{ matrix.shard.timeoutMinutes }}m" node scripts/run-bundled.mjs scripts/portfolio-solve-sweep.mjs \
            --corpus=data/stress/stress-levels-random.json \
            --levels="${{ matrix.shard.levels }}" \
            --scheduler-mode=production \
            --budget-ms="${{ inputs.budget_ms }}" \
            --node-budget="${{ inputs.node_budget }}" \
            --workers="${{ inputs.workers }}" \
            --resume \
            --save-hints \
            --out="logs/solver-highbudget-sweep/corpus2-batch-${{ matrix.shard.idx }}.json" \
            --summary-out="logs/solver-highbudget-sweep/corpus2-batch-${{ matrix.shard.idx }}-summary.md" \
            2>&1 | tee -a "logs/solver-highbudget-sweep/corpus2-batch-${{ matrix.shard.idx }}.console.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Stage this shard's changed files for upload (reports + any new/changed hint files)
        if: always()
        shell: bash
        run: |
          stage="artifact-staging/highbudget-shard-${{ matrix.shard.idx }}"
          mkdir -p "${stage}/logs/solver-highbudget-sweep" "${stage}/data/stress/hints" "${stage}/data/stress/hints-random"
          for f in logs/solver-highbudget-sweep/*-${{ matrix.shard.idx }}*.json \
                   logs/solver-highbudget-sweep/*-${{ matrix.shard.idx }}*.md \
                   logs/solver-highbudget-sweep/*-${{ matrix.shard.idx }}*.log \
                   logs/solver-highbudget-sweep/*-${{ matrix.shard.idx }}*.jsonl; do
            [ -e "$f" ] && cp "$f" "${stage}/logs/solver-highbudget-sweep/" 2>/dev/null || true
          done
          # Only this shard's own hint files change (disjoint id slices across shards, for each
          # corpus independently), so a plain git-status diff against the fresh checkout is a safe,
          # precise changed-file list.
          git status --porcelain -- data/stress/hints/ data/stress/hints-random/ | awk '{print $2}' | while read -r f; do
            mkdir -p "${stage}/$(dirname "$f")"
            cp "$f" "${stage}/${f}"
          done

      - name: Upload this shard's staged results as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: highbudget-shard-${{ matrix.shard.idx }}
          path: artifact-staging/highbudget-shard-${{ matrix.shard.idx }}
          if-no-files-found: warn
          retention-days: 90

      - name: Fail the job if either sweep failed (visibility only -- artifacts already uploaded above)
        if: >-
          always() &&
          ((steps.sweep-corpus1.outcome == 'failure') ||
          (steps.sweep-corpus2.outputs.exit_code != '0' && steps.sweep-corpus2.outputs.exit_code != '124' && steps.sweep-corpus2.outputs.exit_code != '143'))
        run: |
          echo "sweep-corpus1 outcome=${{ steps.sweep-corpus1.outcome }} exit_code=${{ steps.sweep-corpus1.outputs.exit_code }}"
          echo "sweep-corpus2 exit_code=${{ steps.sweep-corpus2.outputs.exit_code }}"
          echo "Note: exit codes 124/143 (timeout/SIGTERM from the timeout wrapper) are treated as expected for a" \
               "budget-exhausting shard, not a failure -- whatever was found before the timeout was already" \
               "uploaded as this shard's artifact."
          exit 1

  # Combines every shard's reports into two corpus-shaped JSON files, folds this round's real
  # observed timings back into the runtime telemetry file (so the NEXT round's plan is better-
  # calibrated), and commits any newly-solved levels' hint files directly to main. Deliberately does
  # NOT touch logs/stress-corpus{1,2}-baseline.json or data/level-heatmaps.json -- see the top-of-
  # file note for why a subset sweep must not overwrite full-corpus truth.
  combine:
    name: Combine results, update telemetry, and commit new hints to main
    needs: [plan, solve-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Clear any stale per-shard files committed by a previous round
        shell: bash
        run: |
          # logs/solver-highbudget-sweep/ is committed by this same job (see the last step below)
          # so a shard's --resume/--checkpoint can survive ITS OWN timeout wrapper (see
          # solve-shards' "Prepare log files" comment) -- but that also means old corpusN-batch-
          # *.json report files from a PREVIOUS round linger here across dispatches. If a later
          # round changes shard count, index-padding width, or --budget-ms, the stale files don't
          # get overwritten (different filenames) and the merge step below's glob picks up both
          # generations at once -- combine-solver-sweep-reports.mjs's main() then hard-
          # fails on the resulting budgetMs mismatch, aborting the whole combine before anything
          # commits (hit 2026-07-25: round 2's corpus1-batch-001..005.json, 200000ms, collided
          # with round 1's already-solved corpus1-batch-01..05.json, 125000ms, still sitting in
          # the repo). Only THIS round's freshly-downloaded artifacts (laid down next) should
          # feed the merge.
          rm -rf logs/solver-highbudget-sweep
          mkdir -p logs/solver-highbudget-sweep

      - name: Download every shard's artifact
        uses: actions/download-artifact@v8
        with:
          pattern: 'highbudget-shard-*'
          path: artifact-staging/downloaded
          merge-multiple: true

      - name: Lay the downloaded shard results onto the working tree
        shell: bash
        run: |
          cp -a artifact-staging/downloaded/. ./

      - name: Combine each corpus's shard reports into one report (subset-shaped, not a baseline)
        shell: bash
        run: |
          if ls logs/solver-highbudget-sweep/corpus1-batch-*.json >/dev/null 2>&1; then
            CORPUS1_FILES=$(ls logs/solver-highbudget-sweep/corpus1-batch-*.json | paste -sd, -)
            npm run solver:combine-sweep-reports -- --in="${CORPUS1_FILES}" --out=reports/stress/highbudget-unsolved-sweep-corpus1-2026-07-24.json
          fi
          if ls logs/solver-highbudget-sweep/corpus2-batch-*.json >/dev/null 2>&1; then
            CORPUS2_FILES=$(ls logs/solver-highbudget-sweep/corpus2-batch-*.json | paste -sd, -)
            npm run solver:combine-sweep-reports -- --in="${CORPUS2_FILES}" --out=reports/stress/highbudget-unsolved-sweep-corpus2-2026-07-24.json
          fi

      - name: Fold this round's observed timings into the runtime telemetry file
        shell: bash
        run: |
          if [ -f reports/stress/highbudget-unsolved-sweep-corpus2-2026-07-24.json ]; then
            node scripts/update-highbudget-telemetry.mjs \
              --sweep=reports/stress/highbudget-unsolved-sweep-corpus2-2026-07-24.json \
              --node-budget="${{ inputs.node_budget }}" \
              --telemetry=logs/solver-stress-refresh/corpus2-runtime-telemetry.json \
              --out=logs/solver-stress-refresh/corpus2-runtime-telemetry.json
          fi

      - name: Print a solved-count summary to the job log
        shell: bash
        run: |
          node -e "
          for (const f of ['reports/stress/highbudget-unsolved-sweep-corpus1-2026-07-24.json', 'reports/stress/highbudget-unsolved-sweep-corpus2-2026-07-24.json']) {
            try {
              const d = JSON.parse(require('fs').readFileSync(f, 'utf8'));
              const solved = d.levels.filter(l => l.ok).length;
              console.log(f + ': ' + solved + '/' + d.levels.length + ' newly solved');
            } catch (e) { console.log(f + ': not present (' + e.message + ')'); }
          }
          "

      - name: Publish standard solver sweep result
        if: always()
        shell: bash
        run: |
          node scripts/publish-solver-sweep-result.mjs \
            --primary="reports/stress/highbudget-unsolved-sweep-corpus1-2026-07-24.json" \
            --include="reports/stress/highbudget-unsolved-sweep-corpus2-2026-07-24.json" \
            --shards-expected="${{ needs.plan.outputs.shard_count }}" \
            --shards-observed="$(find logs/solver-highbudget-sweep -maxdepth 1 -name 'corpus2-batch-*.json' | wc -l | tr -d ' ')" \
            --provenance-out="reports/stress/highbudget-unsolved-sweep-source-run-${{ github.run_id }}.json" \
            --source-artifact="committed high-budget combined reports"

      - name: Upload standard solver sweep result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-sweep-result
          path: logs/solver-sweep-result/
          if-no-files-found: error
          retention-days: 90

      - name: Commit newly-solved hints + combined reports + updated telemetry directly to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stress/hints/ data/stress/hints-random/ reports/stress/highbudget-unsolved-sweep-corpus1-2026-07-24.json reports/stress/highbudget-unsolved-sweep-corpus2-2026-07-24.json "reports/stress/highbudget-unsolved-sweep-source-run-${{ github.run_id }}.json" logs/solver-highbudget-sweep/ logs/solver-stress-refresh/corpus2-runtime-telemetry.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing changed -- not creating an empty commit."
            exit 0
          fi
          git commit -m "Solver high-budget unsolved-only sweep: combined results $(date -u +%FT%TZ)"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push attempt ${attempt} failed; retrying after a short wait..."
            sleep $((attempt * 5))
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed -- leaving commit local for manual recovery."; exit 1; }
          done
          echo "All push attempts failed."
          exit 1
