# One-shot source-frozen independent 24-parent matched-total-work PG-L confirmation.
name: PG-L independent complete-flood replay 250k confirmation
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pg-l-independent-flood-replay-20261019.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pg-l-independent-complete-flood-replay-20261019
  cancel-in-progress: false
jobs:
  experiment:
    name: Source-frozen 24 independent production baseline neutral and saving replay
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - name: Checkout frozen execution source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Node 22.23.2
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install source-locked dependencies
        run: npm ci
      - name: Source-only population and reporting fixture
        run: node scripts/stress/pg-l-flood-replay-independent-24.mjs --self-test
      - name: Run all frozen 24 matched-total-250k native controls
        id: experiment
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/pg-l-independent-replay
          timeout -k 20s --preserve-status 36m \
            node scripts/run-bundled.mjs scripts/stress/pg-l-flood-replay-independent-24.mjs -- \
            --out=logs/pg-l-independent-replay/verdict.json
      - name: Preserve exact complete or partial source evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-l-independent-complete-flood-replay-20261019
          path: logs/pg-l-independent-replay/verdict.json
          retention-days: 90
          if-no-files-found: warn
      - name: Enforce source identity and safety, not solve positivity
        if: always()
        env:
          RESULT_OUTCOME: ${{ steps.experiment.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RESULT_OUTCOME" = success
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('logs/pg-l-independent-replay/verdict.json','utf8'));
          if(d.executionSha!==process.env.GITHUB_SHA
            ||d.summary.parents!==24
            ||d.summary.neutralParityPasses!==24
            ||d.summary.anyStorageCensoring
            ||!d.summary.allSavingResultsRefereeValid
            ||d.source.selectedIds.length!==24
            ||new Set(d.source.selectedIds).size!==24)
            throw Error('PG-L independent source or native replay invariant failed');
          console.log('PG-L INDEPENDENT REPLAY VERDICT '+JSON.stringify(d.summary));
          NODE
