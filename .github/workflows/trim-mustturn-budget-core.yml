name: Trim must-turn budget core

on:
  push:
    branches:
      - chatgpt/must-turn-family-contrast-pilot-2026-09-13
    paths:
      - scripts/trigger-mustturn-budget-core-trim.txt

permissions:
  contents: write

jobs:
  trim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: python3 scripts/remove-mustturn-cap-from-budget-core.py
      - run: npm run check:file-size-ratchet
      - run: npx vitest run scripts/late-mustturn-tier-unit-tests.mjs modules/solver/stage-plan.test.ts
      - run: npm run check:types
      - name: Commit trim
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/solver/stage-budget-core.ts
          git commit -m 'Fix: keep experiment cap outside budget core'
          git push origin HEAD:chatgpt/must-turn-family-contrast-pilot-2026-09-13
