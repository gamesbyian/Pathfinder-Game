name: TEMP seven-day capability reconciliation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Rebuild corrected residual atlas
        run: |
          node scripts/run-bundled.mjs scripts/stress/analyze-post-1029-residual-atlas.mjs -- \
            --baseline=reports/stress/capability-runs/34683011115/per-level-corpus2.json \
            --lifecycle=reports/stress/capability-runs/34683011115/lifecycle-failure-map-corpus2.json \
            --census=reports/stress/technique-census/33717910218/combined-cells.json \
            --hints-dir=data/stress/hints-random \
            --out=tmp/seven-day-atlas.json
      - name: Rebuild six-source nomination union from committed evidence
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {
            buildCapabilityMemory,
            reportRows,
            solvedIds,
            diffIdSets,
          } from './scripts/solver-capability-memory-lib.mjs';

          const readJson = p => JSON.parse(fs.readFileSync(p, 'utf8'));
          const readIds = p => fs.readFileSync(p, 'utf8').split(/\s+/).map(s => s.trim()).filter(Boolean);
          const uniq = xs => [...new Set(xs)].sort();

          const baseline = readJson('reports/stress/capability-runs/34683011115/per-level-corpus2.json');
          const previous = readJson('reports/stress/capability-runs/34531412380/per-level-corpus2.json');
          const niche = readJson('reports/stress/technique-niches/2026-09-03/level-capability.json');

          const nicheRows = [];
          const seenObjects = new Set();
          function walk(value) {
            if (!value || typeof value !== 'object' || seenObjects.has(value)) return;
            seenObjects.add(value);
            if (Array.isArray(value)) {
              for (const item of value) walk(item);
              return;
            }
            const id = value.levelId ?? value.id ?? value.level;
            if (id != null && Array.isArray(value.solvingActions)) {
              nicheRows.push({ id: String(id), solvingActions: value.solvingActions.map(String) });
              return;
            }
            for (const child of Object.values(value)) walk(child);
          }
          walk(niche);
          if (!nicheRows.length) throw new Error('No solvingActions rows found in technique-niche artifact');

          const actionLabels = uniq(nicheRows.flatMap(row => row.solvingActions));
          const interestingLabels = actionLabels.filter(label => /turn|mechanic|intersection|objective/i.test(label));
          console.log('CAPABILITY_ACTION_LABELS');
          console.log(JSON.stringify(interestingLabels, null, 2));

          const idsForPredicate = predicate => uniq(nicheRows.filter(row => row.solvingActions.some(predicate)).map(row => row.id));
          const currentSolved = solvedIds(reportRows(baseline));
          const previousSolved = solvedIds(reportRows(previous));
          const displaced = diffIdSets(currentSolved, previousSolved).lostIds;

          const sourceDefinitions = [
            {
              id: 'portal-coarse-state-merge',
              gainIds: readIds('data/stress/portal-coarse-state-merge-gain-referee-check-001-ids.txt'),
              matchedLabels: ['historical +158 referee-valid gain set'],
            },
            {
              id: 'repair-turn-biased',
              predicate: label => /repair/i.test(label) && /turn-biased/i.test(label) && !/must-turn/i.test(label),
            },
            {
              id: 'beam-intersectionHarvest-mechanic-buckets',
              predicate: label => /beam/i.test(label) && /intersectionHarvest/i.test(label) && /mechanic/i.test(label),
            },
            {
              id: 'beam-objectiveFirst-mechanic-buckets',
              predicate: label => /beam/i.test(label) && /objectiveFirst/i.test(label) && /mechanic/i.test(label),
            },
            {
              id: 'goal-attraction-disabled-retry',
              gainIds: ['R01124', 'R02020', 'R02060'],
              matchedLabels: ['promoted retry +3 set'],
            },
            {
              id: 'accepted-change-displaced-losses',
              gainIds: displaced,
              matchedLabels: ['solved-set losses: 34531412380 -> 34683011115'],
            },
          ].map(source => {
            if (!source.predicate) return source;
            const matchedLabels = actionLabels.filter(source.predicate);
            return {
              ...source,
              matchedLabels,
              gainIds: idsForPredicate(source.predicate),
            };
          });

          console.log('CAPABILITY_SOURCE_IDENTITIES');
          console.log(JSON.stringify(sourceDefinitions.map(source => ({
            id: source.id,
            matchedLabels: source.matchedLabels,
            demonstratedIds: source.gainIds.length,
          })), null, 2));

          const result = buildCapabilityMemory({
            baselineId: '34683011115-corpus2',
            baselineRows: baseline,
            candidates: sourceDefinitions.map(source => ({
              id: source.id,
              disposition: 'diagnostic',
              signature: { gainIds: source.gainIds, lossIds: [] },
            })),
          });

          const atlas = readJson('tmp/seven-day-atlas.json');
          const atlasRows = [];
          const atlasSeen = new Set();
          function walkAtlas(value) {
            if (!value || typeof value !== 'object' || atlasSeen.has(value)) return;
            atlasSeen.add(value);
            if (Array.isArray(value)) {
              for (const item of value) walkAtlas(item);
              return;
            }
            const id = value.levelId ?? value.id ?? value.level;
            const cls = value.primaryClass ?? value.class ?? value.classId ?? value.residualClass;
            if (id != null && cls != null && /^[1-5]$/.test(String(cls))) {
              atlasRows.push({ id: String(id), cls: Number(cls) });
            }
            for (const child of Object.values(value)) walkAtlas(child);
          }
          walkAtlas(atlas);
          const classById = new Map(atlasRows.map(row => [row.id, row.cls]));

          const perSource = result.candidates.map(candidate => {
            const classCounts = Object.fromEntries([1,2,3,4,5].map(cls => [cls, 0]));
            for (const id of candidate.currentResidualNominationIds) {
              const cls = classById.get(id);
              if (cls) classCounts[cls]++;
            }
            return {
              id: candidate.id,
              demonstratedGains: candidate.demonstratedGains,
              nominations: candidate.currentResidualNominationIds.length,
              uniqueNominations: candidate.uniqueCurrentResidualNominations,
              classCounts,
            };
          });

          const unionIds = uniq(result.candidates.flatMap(c => c.currentResidualNominationIds));
          const unionClassCounts = Object.fromEntries([1,2,3,4,5].map(cls => [cls, 0]));
          for (const id of unionIds) {
            const cls = classById.get(id);
            if (cls) unionClassCounts[cls]++;
          }

          console.log('CAPABILITY_RECONCILIATION_RESULT');
          console.log(JSON.stringify({
            baseline: result.baseline,
            nicheRows: nicheRows.length,
            atlasClassRows: classById.size,
            perSource,
            union: {
              count: unionIds.length,
              libraryCount: result.union.nominated,
              classCounts: unionClassCounts,
              ids: unionIds,
            },
          }, null, 2));
          NODE
