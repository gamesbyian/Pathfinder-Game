name: Temporary corpus population audit

on:
  push:
    branches:
      - chatgpt/stress-corpus-population-validity-audit-2026-09-13

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run population audit
        run: node scripts/stress/corpus-population-audit.mjs > corpus-population-audit.json
      - name: Upload audit output
        uses: actions/upload-artifact@v4
        with:
          name: corpus-population-audit
          path: corpus-population-audit.json
          retention-days: 1
