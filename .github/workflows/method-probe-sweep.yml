# Sharded runner for scripts/method-probe.mjs — isolated single-method testing across a full
# corpus. Diagnostic-only: this workflow never commits anything back to the repo; results are
# artifacts + a combined job summary.
#
# Throughput shape (2026-08-25): queue many small outer shards behind a smaller max-parallel cap,
# then use several disjoint method-probe processes INSIDE each runner. Standard public-repository
# ubuntu-latest runners currently expose 4 vCPUs, so the default uses 4 worker processes. Each job
# bundles method-probe.mjs exactly once before launching those children: invoking run-bundled.mjs
# independently in every child would make them race to rewrite the same .solver-tools bundle.
# The outer shard queue smooths cross-level runtime variance; the inner processes keep each runner's
# CPUs occupied. Worker subranges are floor-split with no gaps/overlaps and write separate result
# files, all of which combine-method-probe-shards.mjs consumes afterward.
name: method-probe sweep (isolated single-method corpus test)
run-name: "Method probe · ${{ inputs.only || 'all methods' }} · shards=${{ inputs.shard_count }}"

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'method-probe.mjs --only value (one or more canonical attempt identities, comma-separated), e.g. admissible-order|tieBreak=mustCrossFirst|lds=off or dfs|score=objectiveFirst|bias=none'
        required: true
      corpus:
        description: 'Corpus file to test against'
        required: false
        default: 'data/stress/stress-levels-random.json'
      levels:
        description: 'Optional method-probe.mjs --levels selector. Supports full ids / id: / pos: syntax; default all. The wrapper shards only the selected rows.'
        required: false
        default: 'all'
      budget_ms:
        description: 'Per-attempt wall safety deadline. In work-budget mode keep this generously non-binding; blank work_budget preserves the legacy real-time search cap.'
        required: false
        default: '8000'
      work_budget:
        description: 'Optional per-level canonical WORK ceiling. Recommended for decision-bearing/equal-cost research; rows fail closed if budget_ms binds first. Blank preserves legacy wall+node mode.'
        required: false
        default: ''
      node_budget:
        description: 'Per-level node-count ceiling'
        required: false
        default: '20000000'
      shard_count:
        description: 'Fine-grained outer shard count. Default 60 queues three waves behind max_parallel=20, so fast lanes immediately pull another small slice instead of waiting for one unlucky coarse shard.'
        required: false
        default: '60'
      max_parallel:
        description: 'Outer GitHub Actions jobs running concurrently. This bounds account/job footprint independently of shard_count.'
        required: false
        default: '15'
      workers:
        description: 'Disjoint method-probe processes inside each runner. Default 4 matches current standard public ubuntu-latest vCPU count.'
        required: false
        default: '4'

concurrency:
  # No git writes or shared corpus mutation. Only serialize accidental duplicate sweeps for the
  # same technique key; different methods may run concurrently when account capacity allows it.
  group: method-probe-sweep-${{ inputs.only }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan selected-level shards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Compute selected population and shard list
        id: plan
        shell: bash
        run: |
          selected=$(node scripts/method-probe-shard-plan.mjs --corpus="${{ inputs.corpus }}" --levels="${{ inputs.levels }}" --count=true)
          requested="${{ inputs.shard_count }}"
          n=$requested
          if [ "$n" -gt "$selected" ]; then n=$selected; fi
          if [ "$n" -lt 1 ]; then
            echo "Selected population is empty" >&2
            exit 2
          fi
          shards=$(node -e "console.log(JSON.stringify(Array.from({length:Number(process.argv[1])},(_,i)=>i+1)))" "$n")
          echo "selected=${selected}"
          echo "shard_count=${n}" >> "$GITHUB_OUTPUT"
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"

  probe-shards:
    name: method-probe shard ${{ matrix.shard }}/${{ needs.plan.outputs.shard_count }}
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel) }}
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute this shard's selected level ids (floor-based even split, no gaps/overlaps)
        id: range
        shell: bash
        run: |
          nn=$(printf '%03d' "${{ matrix.shard }}")
          spec=$(node scripts/method-probe-shard-plan.mjs \
            --corpus="${{ inputs.corpus }}" --levels="${{ inputs.levels }}" \
            --shard="${{ matrix.shard }}" --shards="${{ needs.plan.outputs.shard_count }}")
          count=$(node -e "const s=process.argv[1]; console.log(s ? s.split(',').filter(Boolean).length : 0)" "$spec")
          if [ "$count" -lt 1 ]; then
            echo "Empty shard selection" >&2
            exit 2
          fi
          echo "nn=${nn}" >> "$GITHUB_OUTPUT"
          echo "spec=${spec}" >> "$GITHUB_OUTPUT"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      - name: Run method-probe across this runner's CPUs
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p logs/method-probe-shards

          # Bundle once. Parallel run-bundled.mjs children would all target the same output bundle.
          bundle=$(node --input-type=module -e \
            "import { buildBundle } from './scripts/run-bundled.mjs'; console.log(buildBundle('scripts/method-probe.mjs'));" )
          if [ -z "$bundle" ] || [ ! -f "$bundle" ]; then
            echo "Failed to build method-probe bundle" >&2
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          outer_spec="${{ steps.range.outputs.spec }}"
          count="${{ steps.range.outputs.count }}"
          requested_workers=${{ inputs.workers }}
          if [ "$requested_workers" -lt 1 ]; then requested_workers=1; fi
          workers=$requested_workers
          if [ "$workers" -gt "$count" ]; then workers=$count; fi

          work_arg=""
          if [ -n "${{ inputs.work_budget }}" ]; then
            work_arg="--work-budget=${{ inputs.work_budget }}"
          fi

          pids=()
          labels=()
          for ((w=0; w<workers; w++)); do
            sub_spec=$(node scripts/method-probe-shard-plan.mjs \
              --corpus="${{ inputs.corpus }}" --levels="$outer_spec" \
              --shard="$((w + 1))" --shards="$workers")
            label="${{ steps.range.outputs.nn }}-w$((w + 1))"
            labels+=("$label")
            echo "worker $((w + 1))/$workers: ${sub_spec}"
            timeout -k 30s --preserve-status 110m node "$bundle" \
              --corpus="${{ inputs.corpus }}" \
              --levels="${sub_spec}" \
              --only="${{ inputs.only }}" \
              --budget-ms="${{ inputs.budget_ms }}" \
              ${work_arg} \
              --node-budget="${{ inputs.node_budget }}" \
              --out="logs/method-probe-shards/shard-${label}.json" \
              --summary-out="logs/method-probe-shards/shard-${label}-summary.md" \
              > "logs/method-probe-shards/shard-${label}.console.log" 2>&1 &
            pids+=("$!")
          done

          aggregate=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}"
            status=$?
            echo "worker ${labels[$i]} exit=${status}"
            printf '%s\n' "$status" > "logs/method-probe-shards/shard-${labels[$i]}.exit-status"
            cat "logs/method-probe-shards/shard-${labels[$i]}.console.log"
            if [ "$status" -ne 0 ] && [ "$aggregate" -eq 0 ]; then aggregate=$status; fi
          done
          echo "exit_code=${aggregate}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload this shard's results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: method-probe-shard-${{ steps.range.outputs.nn }}
          path: logs/method-probe-shards/
          retention-days: 14
          if-no-files-found: warn

      - name: Fail on unexpected worker error
        if: >-
          always() &&
          steps.probe.outputs.exit_code != '0' &&
          steps.probe.outputs.exit_code != '124' &&
          steps.probe.outputs.exit_code != '143'
        run: exit 1

  combine:
    name: Combine shard results
    needs: [plan, probe-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download all shard artifacts
        id: download
        uses: actions/download-artifact@v8
        with:
          pattern: method-probe-shard-*
          path: artifact-staging
          merge-multiple: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Combine every worker result + write job summary
        id: combine
        run: node scripts/combine-method-probe-shards.mjs --staging-dir=artifact-staging --out-dir=logs/method-probe-shards --outcome-out=logs/method-probe-shards/outcome.json --deterministic-work-mode=${{ inputs.work_budget != '' }} --expected-shards=${{ needs.plan.outputs.shard_count }}

      - name: Upload combined result
        uses: actions/upload-artifact@v7
        with:
          name: method-probe-combined
          path: |
            logs/method-probe-shards/combined.json
            logs/method-probe-shards/solved-ids.txt
          retention-days: 30

      - name: Publish standard solver sweep result
        if: always()
        shell: bash
        env:
          CORPUS: ${{ inputs.corpus }}
          ONLY: ${{ inputs.only }}
          BUDGET_MS: ${{ inputs.budget_ms }}
          WORK_BUDGET: ${{ inputs.work_budget }}
          NODE_BUDGET: ${{ inputs.node_budget }}
          LEVELS: ${{ inputs.levels }}
        run: |
          if [ "${{ needs.probe-shards.result }}" != success ]; then
            if [ "${{ needs.probe-shards.result }}" = cancelled ]; then
              outcome=infrastructure-error
              reason='The probe shard matrix was cancelled before normal completion.'
            else
              outcome=harness-error
              reason='At least one probe shard reported an unexpected execution failure.'
            fi
            node scripts/research-workflow-outcome.mjs --out=logs/method-probe-shards/outcome.json --outcome="$outcome" --reason="$reason"
          elif [ ! -s logs/method-probe-shards/outcome.json ]; then
            if [ "${{ steps.download.outcome }}" != success ]; then
              outcome=infrastructure-error
              reason='Required method-probe shard artifacts could not be downloaded.'
            else
              outcome=harness-error
              reason='The method-probe combiner failed before it could classify the result.'
            fi
            node scripts/research-workflow-outcome.mjs --out=logs/method-probe-shards/outcome.json --outcome="$outcome" --reason="$reason"
          fi
          node scripts/method-probe-shard-plan.mjs \
            --corpus="$CORPUS" --levels="$LEVELS" --shard=1 --shards=1 \
            | tr ',' '\n' > logs/method-probe-shards/expected-ids.txt
          if [ -f logs/method-probe-shards/combined.json ]; then
            node scripts/validate-solver-sweep-integrity.mjs --allow-incomplete \
              --expected-ids=logs/method-probe-shards/expected-ids.txt \
              --result=logs/method-probe-shards/combined.json \
              --integrity-out=logs/method-probe-shards/population-integrity.json
          fi
          node_budget_json="${NODE_BUDGET:-null}"
          work_budget_json="${WORK_BUDGET:-null}"
          budget_ms_json="${BUDGET_MS:-null}"
          levels_selector="${LEVELS:-all}"
          population_kind=explicit-selected-subset
          [ "$levels_selector" = all ] && population_kind=whole-supplied-corpus
          reproducibility_expected=false
          [ -n "$WORK_BUDGET" ] && reproducibility_expected=true
          wall_deadline_binding=true
          [ -n "$WORK_BUDGET" ] && wall_deadline_binding=false
          cat > logs/method-probe-shards/experiment-contract-spec.json <<SPEC
          {"configuration": {"only": "$ONLY", "corpus": "$CORPUS", "levels": "$levels_selector", "budgetMs": $budget_ms_json, "workBudget": $work_budget_json, "nodeBudget": $node_budget_json},
          "workflowFamily": "isolated-method-probe", "producer": "method-probe-sweep.yml", "entrypoint": "scripts/method-probe.mjs",
          "population": {"kind": "$population_kind", "identityBasis": "stable-level-id", "selector": "$levels_selector"},
          "execution": {"levelBlind": true, "historyAware": false, "historicalInputs": [], "reproducibilityExpected": $reproducibility_expected, "producerFamily": "method-probe", "schedulerMode": "isolated-technique"},
          "limits": {"cumulativeNodeCeiling": $node_budget_json, "initialWorkAllocation": $work_budget_json, "totalWorkCeiling": $work_budget_json, "wallSafetyDeadlineMs": $budget_ms_json, "wallDeadlineBinding": $wall_deadline_binding},
          "sideEffects": {"hints": "none", "canonicalBaseline": "none", "telemetry": "compact", "reports": "artifact-only"}}
          SPEC
          node scripts/write-solver-experiment-contract.mjs \
            --spec=logs/method-probe-shards/experiment-contract-spec.json \
            --out=logs/method-probe-shards/experiment-contract.json
          node scripts/summarize-solver-failure-response.mjs \
            --in="logs/method-probe-shards/combined.json" \
            --rows-key=levels \
            --contract-file="logs/method-probe-shards/experiment-contract.json" \
            --out="logs/method-probe-shards/failure-response-summary.json"
          node scripts/publish-solver-sweep-result.mjs \
            --primary="logs/method-probe-shards/combined.json" \
            --include="logs/method-probe-shards/solved-ids.txt" \
            --outcome-file="logs/method-probe-shards/outcome.json" \
            --integrity-file="logs/method-probe-shards/population-integrity.json" \
            --contract-file="logs/method-probe-shards/experiment-contract.json" \
            --failure-response-file="logs/method-probe-shards/failure-response-summary.json" \
            --shards-expected="${{ needs.plan.outputs.shard_count }}" \
            --shards-observed="$(node scripts/count-method-probe-shard-dirs.mjs --staging-dir=artifact-staging)" \
            --source-artifact="method-probe-combined"

      - name: Upload standard solver sweep result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-sweep-result
          path: logs/solver-sweep-result/
          if-no-files-found: error
          retention-days: 90
