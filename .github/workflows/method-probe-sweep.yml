# Sharded runner for scripts/method-probe.mjs — isolated single-method testing across a full
# corpus. Diagnostic-only: this workflow never commits anything back to the repo; results are
# artifacts + a combined job summary.
#
# Throughput shape (2026-08-25): queue many small outer shards behind a smaller max-parallel cap,
# then use several disjoint method-probe processes INSIDE each runner. Standard public-repository
# ubuntu-latest runners currently expose 4 vCPUs, so the default uses 4 worker processes. Each job
# bundles method-probe.mjs exactly once before launching those children: invoking run-bundled.mjs
# independently in every child would make them race to rewrite the same .solver-tools bundle.
# The outer shard queue smooths cross-level runtime variance; the inner processes keep each runner's
# CPUs occupied. Worker subranges are floor-split with no gaps/overlaps and write separate result
# files, all of which combine-method-probe-shards.mjs consumes afterward.
name: method-probe sweep (isolated single-method corpus test)

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'method-probe.mjs --only value (one or more attemptConfigKeys, comma-separated), e.g. ida:mustCrossFirst or dfs:objectiveFirst'
        required: true
      corpus:
        description: 'Corpus file to test against'
        required: false
        default: 'data/stress/stress-levels-random.json'
      budget_ms:
        description: 'Per-attempt wall safety deadline. In work-budget mode keep this generously non-binding; blank work_budget preserves the legacy real-time search cap.'
        required: false
        default: '8000'
      work_budget:
        description: 'Optional per-level canonical WORK ceiling. Recommended for decision-bearing/equal-cost research; rows fail closed if budget_ms binds first. Blank preserves legacy wall+node mode.'
        required: false
        default: ''
      node_budget:
        description: 'Per-level node-count ceiling'
        required: false
        default: '20000000'
      total_levels:
        description: 'Total level count in the chosen corpus (1700 for stress-levels-random.json, 102 for stress-levels.json)'
        required: false
        default: '1700'
      shard_count:
        description: 'Fine-grained outer shard count. Default 60 queues three waves behind max_parallel=20, so fast lanes immediately pull another small slice instead of waiting for one unlucky coarse shard.'
        required: false
        default: '60'
      max_parallel:
        description: 'Outer GitHub Actions jobs running concurrently. This bounds account/job footprint independently of shard_count.'
        required: false
        default: '20'
      workers:
        description: 'Disjoint method-probe processes inside each runner. Default 4 matches current standard public ubuntu-latest vCPU count.'
        required: false
        default: '4'

concurrency:
  # No git writes or shared corpus mutation. Only serialize accidental duplicate sweeps for the
  # same technique key; different methods may run concurrently when account capacity allows it.
  group: method-probe-sweep-${{ inputs.only }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan shard count
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Compute the shard list
        id: plan
        shell: bash
        run: |
          n="${{ inputs.shard_count }}"
          shards=$(node -e "console.log(JSON.stringify(Array.from({length:Number(process.argv[1])},(_,i)=>i+1)))" "$n")
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"

  probe-shards:
    name: method-probe shard ${{ matrix.shard }}/${{ inputs.shard_count }}
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel) }}
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute this shard's level range (floor-based even split, no gaps/overlaps)
        id: range
        shell: bash
        run: |
          nn=$(printf '%03d' "${{ matrix.shard }}")
          total="${{ inputs.total_levels }}"
          n="${{ inputs.shard_count }}"
          start=$(( ( (${{ matrix.shard }} - 1) * total ) / n + 1 ))
          end=$(( ( ${{ matrix.shard }} * total ) / n ))
          echo "nn=${nn}" >> "$GITHUB_OUTPUT"
          echo "start=${start}" >> "$GITHUB_OUTPUT"
          echo "end=${end}" >> "$GITHUB_OUTPUT"

      - name: Run method-probe across this runner's CPUs
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p logs/method-probe-shards

          # Bundle once. Parallel run-bundled.mjs children would all target the same output bundle.
          bundle=$(node --input-type=module -e \
            "import { buildBundle } from './scripts/run-bundled.mjs'; console.log(buildBundle('scripts/method-probe.mjs'));" )
          if [ -z "$bundle" ] || [ ! -f "$bundle" ]; then
            echo "Failed to build method-probe bundle" >&2
            echo "exit_code=2" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          outer_start=${{ steps.range.outputs.start }}
          outer_end=${{ steps.range.outputs.end }}
          count=$(( outer_end - outer_start + 1 ))
          requested_workers=${{ inputs.workers }}
          if [ "$requested_workers" -lt 1 ]; then requested_workers=1; fi
          workers=$requested_workers
          if [ "$workers" -gt "$count" ]; then workers=$count; fi

          work_arg=""
          if [ -n "${{ inputs.work_budget }}" ]; then
            work_arg="--work-budget=${{ inputs.work_budget }}"
          fi

          pids=()
          labels=()
          for ((w=0; w<workers; w++)); do
            sub_start=$(( outer_start + (w * count) / workers ))
            sub_end=$(( outer_start + ((w + 1) * count) / workers - 1 ))
            label="${{ steps.range.outputs.nn }}-w$((w + 1))"
            labels+=("$label")
            echo "worker $((w + 1))/$workers: pos:${sub_start}-${sub_end}"
            timeout -k 30s --preserve-status 110m node "$bundle" \
              --corpus="${{ inputs.corpus }}" \
              --levels="pos:${sub_start}-${sub_end}" \
              --only="${{ inputs.only }}" \
              --budget-ms="${{ inputs.budget_ms }}" \
              ${work_arg} \
              --node-budget="${{ inputs.node_budget }}" \
              --out="logs/method-probe-shards/shard-${label}.json" \
              --summary-out="logs/method-probe-shards/shard-${label}-summary.md" \
              > "logs/method-probe-shards/shard-${label}.console.log" 2>&1 &
            pids+=("$!")
          done

          aggregate=0
          for i in "${!pids[@]}"; do
            wait "${pids[$i]}"
            status=$?
            echo "worker ${labels[$i]} exit=${status}"
            cat "logs/method-probe-shards/shard-${labels[$i]}.console.log"
            if [ "$status" -ne 0 ] && [ "$aggregate" -eq 0 ]; then aggregate=$status; fi
          done
          echo "exit_code=${aggregate}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload this shard's results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: method-probe-shard-${{ steps.range.outputs.nn }}
          path: logs/method-probe-shards/
          retention-days: 14
          if-no-files-found: warn

      - name: Fail on unexpected worker error
        if: >-
          always() &&
          steps.probe.outputs.exit_code != '0' &&
          steps.probe.outputs.exit_code != '124' &&
          steps.probe.outputs.exit_code != '143'
        run: exit 1

  combine:
    name: Combine shard results
    needs: probe-shards
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download all shard artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: method-probe-shard-*
          path: artifact-staging
          merge-multiple: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Combine every worker result + write job summary
        run: node scripts/combine-method-probe-shards.mjs --staging-dir=artifact-staging --out-dir=logs/method-probe-shards

      - name: Upload combined result
        uses: actions/upload-artifact@v7
        with:
          name: method-probe-combined
          path: |
            logs/method-probe-shards/combined.json
            logs/method-probe-shards/solved-ids.txt
          retention-days: 30
