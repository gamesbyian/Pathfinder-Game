# One-time archival bridge from immutable PG-K machine artifact to permanent branch JSON.
# Remove this workflow immediately after successful artifact import.
name: PG-K archive frozen legal-revision cohort
on:
  push:
    branches:
      - chatgpt/pg-k-dead-prefix-segment-revision-20261017
    paths:
      - .github/workflows/pg-k-preserve-revision-cases-20261017.yml
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Download exact completed pilot result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tmp/pg-k-retained
          gh run download 39070668942 --repo "$GITHUB_REPOSITORY" \
            --name pg-k-dead-prefix-segment-revision-20261017 --dir tmp/pg-k-retained
          test -s tmp/pg-k-retained/dead-revision-verdict.json
      - name: Preserve full 92-prefix evidence and locked twelve-parent exact tranche
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          const d=JSON.parse(readFileSync('tmp/pg-k-retained/dead-revision-verdict.json','utf8'));
          const s=d.summary,m=d.referenceCandidateManifest;
          if(s.parents!==25||s.cases!==75||s.distinctRevisionProposals!==796||
             s.moveLegalRevisedPrefixes!==92||s.moveIllegalRevisedPrefixes!==704||
             s.fullPathChecks!==911||s.acceptedNovelRevisions!==0)
            throw Error('PG-K source artifact exact-count provenance invalid');
          if(m.selectedParents!==12||m.cases.length!==12||new Set(m.cases.map(x=>x.levelId)).size!==12)
            throw Error('PG-K exact tranche provenance invalid');
          if(d.rows.reduce((n,r)=>n+r.legalRevisions.length,0)!==92)throw Error('not all move-legal candidates preserved');
          d.provenance={pilotRunId:39070668942,pilotSourceCommit:'5b6b0af688a64a076c10f747ede1186b9a702493',
            pilotArtifactId:12114499887,pilotArtifactZipSha256:'ab256e589f401c7402d7fd085e5e9ccea0ce19f418264c537be86ef7f9c4784b'};
          const cases={schemaVersion:1,kind:'pathfinder-pg-k-explicit-prefix-cases',
            corpus:'data/stress/stress-levels-random.json',
            selection:m.selection,eligibleIndependentParents:m.eligibleParents,
            selectedIndependentParents:m.selectedParents,sourcePilotRunId:39070668942,
            cases:m.cases};
          mkdirSync('reports/stress',{recursive:true});
          writeFileSync('reports/stress/pg-k-dead-prefix-revisions-20261017-001.json',JSON.stringify(d,null,2)+'\n');
          writeFileSync('reports/stress/pg-k-dead-prefix-exact-tranche-20261017-001.json',JSON.stringify(cases,null,2)+'\n');
          console.log('PG-K PRESERVED '+JSON.stringify({sourceCases:s.cases,moveLegal:s.moveLegalRevisedPrefixes,exactParents:cases.selectedIndependentParents}));
          NODE
      - name: Commit complete unedited computed result and frozen exact request
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/stress/pg-k-dead-prefix-revisions-20261017-001.json \
            reports/stress/pg-k-dead-prefix-exact-tranche-20261017-001.json
          git commit -m 'PG-K: freeze all legal revisions and preselected independent exact-reference tranche'
          git push origin HEAD:refs/heads/chatgpt/pg-k-dead-prefix-segment-revision-20261017
