name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules
        run: |
          set -e
          TOKEN=$(gcloud auth print-access-token)
          PROJECT="pathfinder-game-23e29"
          API="https://firebaserules.googleapis.com/v1/projects/$PROJECT"

          PAYLOAD=$(jq -n --rawfile content firestore.rules \
            '{"source":{"files":[{"name":"firestore.rules","content":$content}]}}')

          RULESET=$(curl -sf -X POST "$API/rulesets" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          RULESET_NAME=$(echo "$RULESET" | jq -r '.name')
          echo "Created ruleset: $RULESET_NAME"

          echo "=== Current release ==="
          curl -s "$API/releases/cloud.firestore" -H "Authorization: Bearer $TOKEN"
          echo ""

          PATCH_BODY=$(jq -n \
            --arg n "projects/$PROJECT/releases/cloud.firestore" \
            --arg r "$RULESET_NAME" \
            '{"release":{"name":$n,"rulesetName":$r},"updateMask":"rulesetName"}')

          echo "=== PATCH body ==="
          echo "$PATCH_BODY"

          PATCH_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X PATCH "$API/releases/cloud.firestore" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PATCH_BODY")

          HTTP_CODE=$(echo "$PATCH_RESPONSE" | tail -1)
          RESP_BODY=$(echo "$PATCH_RESPONSE" | head -n -1)

          echo "=== PATCH response (HTTP $HTTP_CODE) ==="
          echo "$RESP_BODY"

          if [ "$HTTP_CODE" -ge 400 ]; then
            exit 1
          fi

          echo "Firestore rules deployed successfully."
