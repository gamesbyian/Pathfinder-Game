name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules
        run: |
          set -e
          TOKEN=$(gcloud auth print-access-token)
          PROJECT="pathfinder-game-23e29"
          API="https://firebaserules.googleapis.com/v1/projects/$PROJECT"

          PAYLOAD=$(jq -n --rawfile content firestore.rules \
            '{"source":{"files":[{"name":"firestore.rules","content":$content}]}}')

          RULESET=$(curl -sf -X POST "$API/rulesets" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          RULESET_NAME=$(echo "$RULESET" | jq -r '.name')
          echo "Created ruleset: $RULESET_NAME"

          RELEASE_BODY=$(jq -n \
            --arg n "projects/$PROJECT/releases/cloud.firestore" \
            --arg r "$RULESET_NAME" \
            '{"name":$n,"rulesetName":$r}')

          # Try to update an existing release; create it if this is the first deploy
          PATCH_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X PATCH "$API/releases/cloud.firestore" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg r "$RULESET_NAME" \
                   '{"release":{"rulesetName":$r},"updateMask":"rulesetName"}')")

          HTTP_CODE=$(echo "$PATCH_RESPONSE" | tail -1)
          RESP_BODY=$(echo "$PATCH_RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" -eq 404 ]; then
            echo "No existing release found — creating for the first time."
            CREATE_RESPONSE=$(curl -s -w "\n%{http_code}" \
              -X POST "$API/releases" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$RELEASE_BODY")
            HTTP_CODE=$(echo "$CREATE_RESPONSE" | tail -1)
            RESP_BODY=$(echo "$CREATE_RESPONSE" | head -n -1)
          fi

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "Release deploy failed (HTTP $HTTP_CODE):"
            echo "$RESP_BODY"
            exit 1
          fi

          echo "Firestore rules deployed successfully."
