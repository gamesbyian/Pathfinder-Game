name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules
        run: |
          set -e
          TOKEN=$(gcloud auth print-access-token)
          PROJECT="pathfinder-game-23e29"
          API="https://firebaserules.googleapis.com/v1/projects/$PROJECT"

          PAYLOAD=$(jq -n --rawfile content firestore.rules \
            '{"source":{"files":[{"name":"firestore.rules","content":$content}]}}')

          RULESET=$(curl -sf -X POST "$API/rulesets" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          RULESET_NAME=$(echo "$RULESET" | jq -r '.name')
          echo "Created ruleset: $RULESET_NAME"

          RELEASE_BODY=$(jq -n \
            --arg n "projects/$PROJECT/releases/cloud.firestore" \
            --arg r "$RULESET_NAME" \
            '{"name":$n,"rulesetName":$r}')

          PATCH_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X PATCH "$API/releases/cloud.firestore" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg r "$RULESET_NAME" \
                   '{"release":{"rulesetName":$r},"updateMask":"rulesetName"}')")
          PATCH_CODE=$(echo "$PATCH_RESPONSE" | tail -1)

          if [ "$PATCH_CODE" -lt 400 ]; then
            echo "Firestore rules deployed successfully."
            exit 0
          fi

          POST_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "$API/releases" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$RELEASE_BODY")
          POST_CODE=$(echo "$POST_RESPONSE" | tail -1)
          POST_RESP=$(echo "$POST_RESPONSE" | head -n -1)

          if [ "$POST_CODE" -ge 400 ]; then
            echo "Release deploy failed (HTTP $POST_CODE): $POST_RESP"
            exit 1
          fi

          echo "Firestore rules deployed successfully."
