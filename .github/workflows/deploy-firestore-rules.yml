name: Deploy Firestore Rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
  workflow_dispatch:

# A ruleset release mutates one shared remote resource. Queue a newer deployment behind the
# current one rather than racing releases or cancelling midway through a write.
concurrency:
  group: deploy-firestore-rules
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Characterize Firestore rules before deploy
        id: characterize
        run: npm run test:firestore-rules

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Deploy Firestore rules
        id: deploy_rules
        run: |
          set -e
          TOKEN=$(gcloud auth print-access-token)
          PROJECT="pathfinder-game-23e29"
          API="https://firebaserules.googleapis.com/v1/projects/$PROJECT"

          PAYLOAD=$(jq -n --rawfile content firestore.rules \
            '{"source":{"files":[{"name":"firestore.rules","content":$content}]}}')

          RULESET=$(curl -sf -X POST "$API/rulesets" \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          RULESET_NAME=$(echo "$RULESET" | jq -r '.name')
          echo "Created ruleset: $RULESET_NAME"
          echo "ruleset_name=$RULESET_NAME" >> "$GITHUB_OUTPUT"

          RELEASE_BODY=$(jq -n \
            --arg n "projects/$PROJECT/releases/cloud.firestore" \
            --arg r "$RULESET_NAME" \
            '{"name":$n,"rulesetName":$r}')

          deploy_release() {
            curl -s -w "\n%{http_code}" \
              -X POST "$API/releases" \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              -d "$RELEASE_BODY"
          }

          RESPONSE=$(deploy_release)
          CODE=$(echo "$RESPONSE" | tail -1)

          if [ "$CODE" -eq 409 ]; then
            echo "Release exists — deleting and recreating."
            curl -sf -X DELETE "$API/releases/cloud.firestore" \
              -H "Authorization: Bearer $TOKEN"
            RESPONSE=$(deploy_release)
            CODE=$(echo "$RESPONSE" | tail -1)
          fi

          if [ "$CODE" -ge 400 ]; then
            echo "Deploy failed (HTTP $CODE): $(echo "$RESPONSE" | head -n -1)"
            exit 1
          fi

          echo "Firestore rules deployed successfully."

      - name: Summarize Firestore rules deployment
        if: always()
        shell: bash
        env:
          CHARACTERIZE: ${{ steps.characterize.outcome }}
          DEPLOY: ${{ steps.deploy_rules.outcome }}
          RULESET: ${{ steps.deploy_rules.outputs.ruleset_name }}
        run: |
          {
            echo '## Firestore rules deployment'
            echo
            echo "| Stage | Outcome |"
            echo "| --- | --- |"
            printf '| Rules characterization | `%s` |\n' "$CHARACTERIZE"
            printf '| Remote deployment | `%s` |\n' "$DEPLOY"
            echo
            if [[ "$DEPLOY" == success ]]; then
              printf 'Deployed ruleset: `%s`\n' "${RULESET:-unknown}"
              echo
              printf 'Source commit: `%s`\n' "$GITHUB_SHA"
            elif [[ "$CHARACTERIZE" == failure ]]; then
              echo 'Deployment did not proceed because the local Firestore rules characterization failed.'
              echo '::error::Firestore rules characterization failed; no successful deployment was established.'
            else
              echo 'The remote Firestore rules deployment did not complete successfully. Inspect the deployment step for the HTTP/API response.'
              echo '::error::Firestore rules deployment failed.'
            fi
          :
          } >> "$GITHUB_STEP_SUMMARY"
