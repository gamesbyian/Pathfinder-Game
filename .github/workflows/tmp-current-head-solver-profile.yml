name: Temporary plain-scorer speed A/B

on:
  push:
    branches:
      - chatgpt/profile-current-head-2026-08-26

permissions:
  contents: read

jobs:
  ab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Prepare pinned base and treatment worktrees
        shell: bash
        env:
          BASE_SHA: 0815d6f5b4e58b45a3487c2c63a9c90ee79c38bf
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add --detach /tmp/pathfinder-base "$BASE_SHA"
          git worktree add --detach /tmp/pathfinder-treat "$BASE_SHA"
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/pathfinder-base/node_modules
          ln -s "$GITHUB_WORKSPACE/node_modules" /tmp/pathfinder-treat/node_modules
          node "$GITHUB_WORKSPACE/scripts/tmp-specialize-plain-score.mjs" /tmp/pathfinder-treat/modules/solver/scoring.ts
      - name: Build base and treatment bundles
        shell: bash
        run: |
          set -euo pipefail
          BASE_BUNDLE=$(cd /tmp/pathfinder-base && node --input-type=module -e "import { buildBundle } from './scripts/run-bundled.mjs'; console.log(buildBundle('scripts/solver-speed-probe.mjs'));" | tail -n1)
          TREAT_BUNDLE=$(cd /tmp/pathfinder-treat && node --input-type=module -e "import { buildBundle } from './scripts/run-bundled.mjs'; console.log(buildBundle('scripts/solver-speed-probe.mjs'));" | tail -n1)
          echo "BASE_BUNDLE=$BASE_BUNDLE" >> "$GITHUB_ENV"
          echo "TREAT_BUNDLE=$TREAT_BUNDLE" >> "$GITHUB_ENV"
      - name: Run interleaved fixed-work A/B
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/tmp/plain-score-ab"
          run_one() {
            local arm="$1" rep="$2" corpus="$3" count="$4" start="$5" stride="$6" cwd bundle
            if [[ "$arm" == base ]]; then cwd=/tmp/pathfinder-base; bundle="$BASE_BUNDLE"; else cwd=/tmp/pathfinder-treat; bundle="$TREAT_BUNDLE"; fi
            (cd "$cwd" && node "$bundle" \
              --corpus="$corpus" --count="$count" --start="$start" --stride="$stride" \
              --budget-ms=600000 --node-budget=250000 \
              --out="$GITHUB_WORKSPACE/tmp/plain-score-ab/${corpus}-${arm}-${rep}.json" >/dev/null)
          }

          # Alternate arm order by repetition to reduce monotonic runner drift.
          for rep in 1 2 3; do
            if (( rep % 2 == 1 )); then first=base; second=treat; else first=treat; second=base; fi
            run_one "$first"  "$rep" published 160 1 1
            run_one "$second" "$rep" published 160 1 1
          done
          for rep in 1 2 3; do
            if (( rep % 2 == 1 )); then first=base; second=treat; else first=treat; second=base; fi
            run_one "$first"  "$rep" corpus2 24 1 67
            run_one "$second" "$rep" corpus2 24 1 67
          done
      - name: Verify deterministic parity and summarize timing
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const dir = 'tmp/plain-score-ab';
          const corpora = ['published', 'corpus2'];
          const report = {};
          const median = xs => [...xs].sort((a,b)=>a-b)[Math.floor(xs.length/2)];
          for (const corpus of corpora) {
            const baseTimes = [], treatTimes = [], ratios = [];
            let signature = null;
            for (let rep=1; rep<=3; rep++) {
              const base = JSON.parse(readFileSync(`${dir}/${corpus}-base-${rep}.json`, 'utf8'));
              const treat = JSON.parse(readFileSync(`${dir}/${corpus}-treat-${rep}.json`, 'utf8'));
              const sig = rows => rows.map(r => `${r.id}:${r.ok?1:0}:${r.nodes}`).join('|');
              const bs = sig(base.rows), ts = sig(treat.rows);
              if (bs !== ts) throw new Error(`${corpus} rep ${rep}: treatment changed solve/node trace`);
              if (signature !== null && bs !== signature) throw new Error(`${corpus} rep ${rep}: base trace changed across repetitions`);
              signature = bs;
              baseTimes.push(base.totalMs); treatTimes.push(treat.totalMs); ratios.push(treat.totalMs/base.totalMs);
              console.log(`${corpus} rep${rep}: base=${base.totalMs.toFixed(1)}ms treat=${treat.totalMs.toFixed(1)}ms delta=${((treat.totalMs/base.totalMs-1)*100).toFixed(2)}% nodes=${base.totalNodes}`);
            }
            const gmRatio = Math.exp(ratios.reduce((s,r)=>s+Math.log(r),0)/ratios.length);
            report[corpus] = {
              baseTimes, treatTimes, pairedRatios: ratios,
              medianBaseMs: median(baseTimes), medianTreatMs: median(treatTimes),
              geometricMeanDeltaPct: (gmRatio-1)*100,
              deterministicParity: true,
            };
            console.log(`${corpus} geometric-mean paired delta: ${((gmRatio-1)*100).toFixed(2)}%`);
          }
          writeFileSync(`${dir}/summary.json`, JSON.stringify(report, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: plain-scorer-speed-ab
          path: tmp/plain-score-ab/
          retention-days: 30
