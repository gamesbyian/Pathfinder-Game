name: Solver diagnostics and hint capture

on:
  push:
    branches:
      - main
    paths:
      - 'data/levels.json'
      - 'modules/solver.ts'
      - 'modules/solver/**'

permissions:
  contents: write

jobs:
  new-hint-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # The diagnostics report is self-describing enough for the central Harvest solver hint
      # evidence workflow to reconstruct every accepted discovery. This source workflow is
      # intentionally report-only; it must not mutate canonical Hint files itself.
      - name: Run full SolverV2 diagnostics analysis
        run: npm run solver:analyze-diagnostics

      - name: Guard audit output
        run: npm run check:audit-output -- logs/solver-workflow/latest.json

      # Search-cost drift is computed by the central harvester after it has semantically merged
      # this run's observations into canonical Hint evidence. Computing it here would require a
      # second direct Hint writer and defeat the single-ingestion-path invariant.

      - name: Upload full or partial diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-diagnostics-${{ github.sha }}
          path: |
            logs/solver-workflow/latest.json
            logs/solver-workflow/*.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publish standard solver sweep result
        if: always()
        run: |
          node scripts/sweep-publish.mjs \
            --primary="logs/solver-workflow/latest.json" \
            --failure-source="logs/solver-workflow/latest.json" \
            --failure-response-out="tmp/solver-diagnostics-compact-failure-response.json" \
            --source-artifact="solver-diagnostics-${{ github.sha }}"

      - name: Upload standard solver sweep result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-sweep-result
          path: logs/solver-sweep-result/
          if-no-files-found: error
          retention-days: 90

      - name: Commit audit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only the canonical current pointer and timestamped history belong in
          # logs/solver-workflow. sweep-publish scratch evidence lives under tmp/ and is copied into
          # the uploaded standard sweep artifact, never committed as raw workflow history.
          git add logs/solver-workflow/latest.json
          git add logs/solver-workflow/????-??-??T??-??-??Z-*.json
          if git diff --cached --quiet; then
            echo "No audit changes to commit."
            exit 0
          fi
          git commit -m "chore(audit): update audit outputs for ${GITHUB_SHA::12} [skip ci]"
          # Retry against concurrent pushes. Two qualifying merges landing close together both run
          # this job, and the loser used to fail the whole workflow on a non-fast-forward -- losing
          # that run's captured hints entirely. --rebase is safe here because every path this job
          # stages is append-only generated output that no human edits in the same window.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/main and retrying."
            git pull --rebase --autostash origin main || {
              echo "Rebase failed; leaving main untouched."
              exit 1
            }
            sleep $((attempt * 3))
          done
          echo "Could not push after 5 attempts."
          exit 1

      - name: Derive final pushed runtime-data cache key
        id: runtime-data-key
        shell: bash
        run: |
          # The commit step above may rebase before pushing. Derive identity from the final local
          # HEAD, which is the tree actually pushed to main, not from the triggering GITHUB_SHA.
          {
            git rev-parse HEAD:data/levels.json
            git rev-parse HEAD:data/level-heatmaps.json
            git rev-parse HEAD:data/themes.json
            git rev-parse HEAD:data/hints
            git rev-parse HEAD:data/stress/stress-levels.json
            git rev-parse HEAD:data/stress/stress-levels-random.json
            git rev-parse HEAD:data/stress/stress-levels-envelope.json
            git rev-parse HEAD:data/stress/hints
            git rev-parse HEAD:data/stress/hints-random
            git rev-parse HEAD:data/stress/hints-envelope
          } | sha256sum | awk '{print "key="$1}' >> "$GITHUB_OUTPUT"

      - name: Restore final runtime-data cache if already published
        id: runtime-data-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            data/levels.json
            data/level-heatmaps.json
            data/themes.json
            data/hints
            data/stress/stress-levels.json
            data/stress/stress-levels-random.json
            data/stress/stress-levels-envelope.json
            data/stress/hints
            data/stress/hints-random
            data/stress/hints-envelope
          key: runtime-data-${{ steps.runtime-data-key.outputs.key }}

      - name: Publish final runtime-data cache for later PRs
        if: steps.runtime-data-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            data/levels.json
            data/level-heatmaps.json
            data/themes.json
            data/hints
            data/stress/stress-levels.json
            data/stress/stress-levels-random.json
            data/stress/stress-levels-envelope.json
            data/stress/hints
            data/stress/hints-random
            data/stress/hints-envelope
          key: runtime-data-${{ steps.runtime-data-key.outputs.key }}

      - name: Derive final pushed runtime-hint projection key
        id: runtime-hint-projection-key
        shell: bash
        run: |
          {
            git rev-parse HEAD:data/hints
            git rev-parse HEAD:data/stress/hints
            git rev-parse HEAD:data/stress/hints-random
            git hash-object scripts/runtime-hint-projection-lib.mjs
            git hash-object modules/domain/hint-runtime.mjs
            git hash-object modules/canonical-json.mjs
            git hash-object vite.config.ts
          } | sha256sum | awk '{print "key="$1}' >> "$GITHUB_OUTPUT"
      - name: Restore final runtime-hint projection if already published
        id: runtime-hint-projection-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/runtime-hint-projection
          key: runtime-hint-projection-${{ runner.os }}-${{ steps.runtime-hint-projection-key.outputs.key }}
      - name: Generate final runtime-hint projection on cache miss
        id: runtime-hint-projection-build
        if: steps.runtime-hint-projection-cache.outputs.cache-hit != 'true'
        env:
          PATHFINDER_RUNTIME_HINT_PROJECTION_CACHE_ROOT: .cache/runtime-hint-projection
        run: npm run build
      - name: Publish final runtime-hint projection for later PRs
        if: steps.runtime-hint-projection-cache.outputs.cache-hit != 'true' && steps.runtime-hint-projection-build.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: .cache/runtime-hint-projection
          key: runtime-hint-projection-${{ runner.os }}-${{ steps.runtime-hint-projection-key.outputs.key }}
