name: Solver research runtime rehearsal

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/solver-research-runtime-rehearsal.yml'
      - 'scripts/solver-runtime-rehearsal.mjs'
      - 'scripts/level-blind-capability-sweep.mjs'
      - 'scripts/portfolio-solve-sweep.mjs'

permissions:
  contents: read

jobs:
  runtime:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20.20.2', '22.23.2']
    steps:
      - name: Check out exact rehearsal ref
        uses: actions/checkout@v7

      - name: Setup exact Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run deterministic solver-runtime rehearsal
        run: node scripts/solver-runtime-rehearsal.mjs --out=tmp/solver-runtime-rehearsal.json

      - name: Upload runtime fingerprint
        uses: actions/upload-artifact@v7
        with:
          name: solver-runtime-rehearsal-node-${{ matrix.node }}
          path: tmp/solver-runtime-rehearsal.json
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Compare semantic fingerprints
    needs: runtime
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download Node 20 fingerprint
        uses: actions/download-artifact@v8
        with:
          name: solver-runtime-rehearsal-node-20.20.2
          path: tmp/node20

      - name: Download Node 22 fingerprint
        uses: actions/download-artifact@v8
        with:
          name: solver-runtime-rehearsal-node-22.23.2
          path: tmp/node22

      - name: Compare semantic fingerprints
        id: compare
        shell: bash
        run: |
          set -euo pipefail
          jq -S 'del(.runtime)' tmp/node20/solver-runtime-rehearsal.json > tmp/node20-semantic.json
          jq -S 'del(.runtime)' tmp/node22/solver-runtime-rehearsal.json > tmp/node22-semantic.json
          diff -u tmp/node20-semantic.json tmp/node22-semantic.json
          echo "semantic_match=true" >> "$GITHUB_OUTPUT"

      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo '## Solver research runtime rehearsal'
            echo
            echo '- Compared exact Node 20.20.2 against CI-proven Node 22.23.2.'
            echo '- Both arms run real bundled level-blind and history-aware portfolio producers on the same deterministic one-level fixture.'
            echo "- Semantic parity: \`${{ steps.compare.outputs.semantic_match || 'false' }}\`"
            echo
            echo 'Runtime identity itself is intentionally excluded from the semantic diff and remains recorded in each artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
