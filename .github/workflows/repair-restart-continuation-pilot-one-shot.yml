# One-shot sharded dispatcher for scripts/stress/restart-continuation-population-pilot.mjs (the
# repair restart-vs-continuation research harness — see reports/2026-08-27-repair-restart-
# continuation-production-candidate-design.md's "Required pre-wiring pilot"). Individual levels in
# this population have been observed to take anywhere from ~2 minutes to nearly an hour per level at
# a large --work-budget (each level runs THREE repairSearchFromGate calls: one continuation arm, two
# restart-arm seeds), so a serial local/single-runner sweep of more than a handful of levels is
# impractical. This workflow shards the population by --offset/--limit ranges (fixed, deterministic
# census order — same as every other disjoint-slice convention this research line already uses) and
# runs each shard as its own parallel job, so total wall time is bounded by the slowest SHARD
# (a few levels), not the slowest full population.
#
# Not a general solver capability sweep: this is specific to the restart-continuation research
# question and does not touch logs/stress-corpus2-baseline.json, data/level-heatmaps.json, or any
# other full-corpus-truth artifact. Artifact-only; never commits to main.
name: Repair restart-vs-continuation population pilot (one-shot)

on:
  workflow_dispatch:
    inputs:
      min_badness:
        description: 'Lower bound (inclusive) on the primary repair-probe attempt''s recorded bestBadness.'
        required: false
        default: '7'
      max_badness:
        description: 'Upper bound (inclusive) on bestBadness. Together with min_badness this selects a near-miss stratum band — see restart-continuation-population-pilot.mjs''s own population comment for why depth matters.'
        required: false
        default: '9'
      work_budget:
        description: 'Canonical workSpent cap W for the continuation arm and the restart arm''s combined two seeds.'
        required: false
        default: '150000000'
      restart_split:
        description: 'Fraction of W the restart arm''s seed 0 gets before a fresh seed 1 takes the remainder (0.5 = the primary prespecified comparison; a different value is a distinct treatment, not a rescue of it).'
        required: false
        default: '0.5'
      budget_ms:
        description: 'Non-binding per-arm-per-seed wall-clock deadline. Must stay large enough that work_budget, not this wall clock, is what actually stops a slow arm — size it generously above any single-level timing you have observed.'
        required: false
        default: '3600000'
      shard_size:
        description: 'Levels per shard. Smaller shards bound each job''s worst-case wall time more tightly (a shard''s time is dominated by its slowest level) at the cost of more parallel jobs.'
        required: false
        default: '2'
      max_parallel:
        description: 'Shards running concurrently.'
        required: false
        default: '20'
      census:
        description: 'Census file the population/badness labels are drawn from.'
        required: false
        default: 'reports/stress/benchmark-latest-random.json'
      corpus:
        description: 'Corpus file the census indexes into.'
        required: false
        default: 'data/stress/stress-levels-random.json'

concurrency:
  group: repair-restart-continuation-pilot-one-shot
  cancel-in-progress: false

jobs:
  plan:
    name: Plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      total_levels: ${{ steps.plan.outputs.total_levels }}
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Count the population and split into fixed-size offset/limit shards
        id: plan
        shell: bash
        run: |
          total=$(node scripts/run-bundled.mjs scripts/stress/restart-continuation-population-pilot.mjs -- \
            --census="${{ inputs.census }}" --corpus="${{ inputs.corpus }}" \
            --min-badness="${{ inputs.min_badness }}" --max-badness="${{ inputs.max_badness }}" \
            --count-only | tail -1)
          echo "Population: ${total} levels"
          node -e "
          const total = ${total};
          const shardSize = ${{ inputs.shard_size }};
          const shards = [];
          for (let offset = 0; offset < total; offset += shardSize) {
            shards.push({ idx: shards.length, offset, limit: Math.min(shardSize, total - offset) });
          }
          const fs = require('node:fs');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, \`shards=\${JSON.stringify({ include: shards })}\n\`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, \`total_levels=\${total}\n\`);
          console.log(\`\${shards.length} shards of up to \${shardSize} levels each\`);
          "

  run-shards:
    name: Shard ${{ matrix.idx }}
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel) }}
      matrix: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run this shard's levels
        shell: bash
        run: |
          mkdir -p logs/repair-restart-continuation-pilot
          node scripts/run-bundled.mjs scripts/stress/restart-continuation-population-pilot.mjs -- \
            --census="${{ inputs.census }}" --corpus="${{ inputs.corpus }}" \
            --min-badness="${{ inputs.min_badness }}" --max-badness="${{ inputs.max_badness }}" \
            --offset="${{ matrix.offset }}" --limit="${{ matrix.limit }}" \
            --work-budget="${{ inputs.work_budget }}" --restart-split="${{ inputs.restart_split }}" \
            --budget-ms="${{ inputs.budget_ms }}" \
            --out="logs/repair-restart-continuation-pilot/shard-${{ matrix.idx }}.json"

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-restart-continuation-pilot-shard-${{ matrix.idx }}
          path: logs/repair-restart-continuation-pilot/shard-${{ matrix.idx }}.json
          if-no-files-found: error
          retention-days: 90

  combine:
    name: Combine results
    needs: [plan, run-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'repair-restart-continuation-pilot-shard-*'
          path: artifact-staging/downloaded
          merge-multiple: true

      - name: Combine shard result files into one report; verify complete coverage
        shell: bash
        run: |
          node -e "
          const fs = require('node:fs');
          const path = require('node:path');
          const dir = 'artifact-staging/downloaded';
          const files = fs.readdirSync(dir).filter(f => f.endsWith('.json')).sort();
          let combined = null;
          let results = [];
          for (const f of files) {
            const d = JSON.parse(fs.readFileSync(path.join(dir, f), 'utf8'));
            if (!combined) combined = { censusPath: d.censusPath, censusCommit: d.censusCommit, corpusPath: d.corpusPath, workBudget: d.workBudget, restartSplitFraction: d.restartSplitFraction };
            results = results.concat(d.results);
          }
          const expectedTotal = ${{ needs.plan.outputs.total_levels }};
          if (results.length !== expectedTotal) { console.error(\`incomplete: \${results.length}/\${expectedTotal} (a shard likely failed/timed out — check its job log)\`); }
          const continuationSolved = results.filter(r => r.continuation.solved).length;
          const restartSolved = results.filter(r => r.restart.solved).length;
          const gains = results.filter(r => r.restart.solved && !r.continuation.solved).map(r => r.id);
          const losses = results.filter(r => !r.restart.solved && r.continuation.solved).map(r => r.id);
          console.log(\`Combined: \${results.length}/\${expectedTotal} levels\`);
          console.log(\`continuation solved \${continuationSolved}/\${results.length}, restart solved \${restartSolved}/\${results.length}\`);
          console.log(\`restart-only gains (\${gains.length}): \${gains.join(',')}\`);
          console.log(\`restart-only losses (\${losses.length}): \${losses.join(',')}\`);
          fs.mkdirSync('reports/stress', { recursive: true });
          fs.writeFileSync('reports/stress/repair-restart-continuation-pilot-combined.json', JSON.stringify({ ...combined, populationSize: expectedTotal, sampledSize: results.length, results }, null, 2));
          "

      - name: Upload combined results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-restart-continuation-pilot-combined
          path: reports/stress/repair-restart-continuation-pilot-combined.json
          if-no-files-found: error
          retention-days: 90
