name: Forced-work prevalence one-shot
# Corrected post-hard-prune chain-anatomy rerun.

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/forced-work-prevalence-one-shot.yml

permissions:
  contents: read

concurrency:
  group: forced-work-prevalence-pr-1952
  cancel-in-progress: true

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Focused reducer test
        run: npm run test:forced-work-prevalence
      - name: Run frozen current-residual census
        run: |
          npm run research:forced-work-prevalence -- \
            --corpus=data/stress/stress-levels-random.json \
            --levels-file=data/stress/forced-work-prevalence-sample-2026-09-21.json \
            --profile=objectiveFirst \
            --width=5000 \
            --work-budget=5000000 \
            --budget-ms=600000 \
            --out=reports/stress/forced-work-prevalence-census-2026-09-21.json
      - name: Emit compact summary
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = 'reports/stress/forced-work-prevalence-census-2026-09-21.json';
          const x = JSON.parse(fs.readFileSync(p, 'utf8'));
          console.log(JSON.stringify(x.summary, null, 2));
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: forced-work-prevalence-census
          path: reports/stress/forced-work-prevalence-census-2026-09-21.json
          retention-days: 30
          if-no-files-found: warn
