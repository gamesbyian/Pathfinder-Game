# Disposable no-search population freeze; remove after ledger integration.
name: PG-L independent dispatch holdout population freeze
on:
  push:
    branches:
      - chatgpt/pg-l-independent-dispatch-holdout-20261018
    paths:
      - .github/workflows/pg-l-independent-holdout-population-20261018.yml
permissions:
  contents: read
jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - name: Freeze independent corpus IDs without looking at solve outcomes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stress/pg-l-independent-dispatch-manifest.mjs --out=tmp/pg-l-independent/population.json
          node -e "const x=require('./tmp/pg-l-independent/population.json'); if(x.selected.length!==24 || new Set(x.selected.map(y=>y.id)).size!==24)throw Error('frozen population incomplete')"
      - uses: actions/upload-artifact@v7
        with:
          name: pg-l-independent-dispatch-population-20261018
          path: tmp/pg-l-independent/population.json
          retention-days: 90
