name: Audit Export

on:
  push:
    branches:
      - main
    paths:
      - 'data/levels.json'
      - 'modules/Solver.ts'
      - 'modules/solver/**'

permissions:
  contents: write

jobs:
  new-hint-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run full SolverV2 audit export
        run: npm run audit:newhint:full

      - name: Guard audit output
        run: npm run check:audit-output -- logs/solver-workflow/latest.json

      - name: Upload full audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: fullaudit-${{ github.sha }}
          path: |
            logs/solver-workflow/latest.json
            logs/solver-workflow/*.json
          retention-days: 30

      - name: Commit audit history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs/solver-workflow
          if git diff --cached --quiet; then
            echo "No audit changes to commit."
            exit 0
          fi
          git commit -m "chore(audit): update audit outputs for ${GITHUB_SHA::12} [skip ci]"
          git push
