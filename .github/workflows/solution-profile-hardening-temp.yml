name: Temporary solution-profile semantic hardening

on:
  push:
    branches:
      - chatgpt/solution-profile-resource-audit-2026-09-13

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply semantic hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lib_path = Path('scripts/stress/solution-profile-lib.mjs')
          s = lib_path.read_text()
          if "SOLUTION_PROFILE_ALGORITHM_VERSION = 'sample-support-v1'" not in s:
              s = s.replace('docs/solution-profile.md', 'docs/solver-solution-profile.md')
              old = """export const SOLUTION_PROFILE_SCHEMA_VERSION = 2;
          export const SOLUTION_PROFILE_TAXONOMY = 'origin-facet-applicability-v2';

          export function hasCurrentSolutionProfileTaxonomy(library) {
              return library?.schemaVersion === SOLUTION_PROFILE_SCHEMA_VERSION &&
                  library?.provenanceTaxonomy === SOLUTION_PROFILE_TAXONOMY;
          }"""
              new = """export const SOLUTION_PROFILE_SCHEMA_VERSION = 3;
          export const SOLUTION_PROFILE_TAXONOMY = 'origin-facet-applicability-v2';
          export const SOLUTION_PROFILE_ALGORITHM_VERSION = 'sample-support-v1';

          export function hasCurrentSolutionProfileTaxonomy(library) {
              return library?.schemaVersion === SOLUTION_PROFILE_SCHEMA_VERSION &&
                  library?.provenanceTaxonomy === SOLUTION_PROFILE_TAXONOMY &&
                  library?.profileAlgorithmVersion === SOLUTION_PROFILE_ALGORITHM_VERSION;
          }"""
              assert old in s
              s = s.replace(old, new)

              old = """        // \"Rigid\" = every accepted solution used the same entry/completion order — a genuinely
                  // level-forced constraint rather than an artifact of how solutions happened to be found.
                  rigid: firstOrderCounts.size === 1 && fullOrderCounts.size === 1,"""
              new = """        // Descriptive sample property only. A single observed order is not proof that the level
                  // forces that order unless an independent whole-space completeness contract establishes it.
                  pathsObserved: paths.length,
                  observedSingleOrder: firstOrderCounts.size === 1 && fullOrderCounts.size === 1,
                  // Compatibility alias for schema-v2 consumers. Do not interpret this as level-forced rigidity.
                  rigid: firstOrderCounts.size === 1 && fullOrderCounts.size === 1,"""
              assert old in s
              s = s.replace(old, new)

              s = s.replace("cwFraction: (totalCw + totalCcw) ? Number((totalCw / (totalCw + totalCcw)).toFixed(4)) : 0,",
                            "cwFraction: (totalCw + totalCcw) ? Number((totalCw / (totalCw + totalCcw)).toFixed(4)) : null,")

              old = """export function discoverySaturationCurve(hints, mcKeys, grid) {
              const ordered = [...hints].sort((a, b) => earliestFoundAt(a) - earliestFoundAt(b));"""
              new = """export function discoverySaturationCurve(hints, mcKeys, grid) {
              const chronologyDatedHints = hints.filter(h => Number.isFinite(earliestFoundAt(h))).length;
              const chronologyComplete = chronologyDatedHints === hints.length;
              const ordered = [...hints].sort((a, b) => earliestFoundAt(a) - earliestFoundAt(b));"""
              assert old in s
              s = s.replace(old, new)

              old = """    return {
                  totalHints: curve.length,
                  curve: downsampleCurve(curve),
                  plateauStartIndex,
                  plateauFraction: plateauStartIndex === null ? null : Number((plateauStartIndex / curve.length).toFixed(4)),
              };"""
              new = """    return {
                  totalHints: curve.length,
                  chronologyDatedHints,
                  chronologyComplete,
                  curve: downsampleCurve(curve),
                  plateauStartIndex: chronologyComplete ? plateauStartIndex : null,
                  plateauFraction: chronologyComplete && plateauStartIndex !== null
                      ? Number((plateauStartIndex / curve.length).toFixed(4)) : null,
              };"""
              assert old in s
              s = s.replace(old, new)

              s = s.replace("provablyExhaustive: hints.some(h => (h.provenance || []).some(p => p.search?.termination === 'exhaustive')),",
                            "hasExhaustiveSearchEvent: hints.some(h => (h.provenance || []).some(p => p.search?.termination === 'exhaustive')),")

              old = """function mustCrossOrderDist(a, b) {
              if (!a || !b) return null;
              return a.rigid === b.rigid ? 0 : 1;
          }"""
              new = """function mustCrossOrderDist(a, b) {
              if (!a || !b || (a.pathsObserved ?? 0) < 2 || (b.pathsObserved ?? 0) < 2) return null;
              return a.observedSingleOrder === b.observedSingleOrder ? 0 : 1;
          }"""
              assert old in s
              s = s.replace(old, new)

              old = """        turnChirality: Math.abs((a.turnDistribution?.cwFraction ?? 0.5) - (b.turnDistribution?.cwFraction ?? 0.5)),
                  mustCrossRigidity: mustCrossOrderDist(a.mustCrossOrder, b.mustCrossOrder),
                  portalUsageRate: portalPatternDist(a.portalUsage, b.portalUsage),
                  objectiveDepth: objectiveDepthDist(a.objectiveSatisfaction, b.objectiveSatisfaction),
                  cellEntropy: Math.abs((a.cellVisitFrequency?.entropy ?? 0) - (b.cellVisitFrequency?.entropy ?? 0)) / 6,
                  prefixDiversity: Math.abs((a.prefixDiversity?.meanSharedPrefixFrac ?? 0) - (b.prefixDiversity?.meanSharedPrefixFrac ?? 0)),
                  pairwiseDistinctiveness: Math.abs((a.pairwiseDistinctiveness?.meanDistance ?? 0) - (b.pairwiseDistinctiveness?.meanDistance ?? 0)),
                  discoverySaturation: Math.abs((a.discoverySaturation?.plateauFraction ?? 1) - (b.discoverySaturation?.plateauFraction ?? 1)),"""
              new = """        turnChirality: a.turnDistribution?.cwFraction == null || b.turnDistribution?.cwFraction == null
                      ? null : Math.abs(a.turnDistribution.cwFraction - b.turnDistribution.cwFraction),
                  mustCrossRigidity: mustCrossOrderDist(a.mustCrossOrder, b.mustCrossOrder),
                  portalUsageRate: portalPatternDist(a.portalUsage, b.portalUsage),
                  objectiveDepth: objectiveDepthDist(a.objectiveSatisfaction, b.objectiveSatisfaction),
                  cellEntropy: Math.abs((a.cellVisitFrequency?.entropy ?? 0) - (b.cellVisitFrequency?.entropy ?? 0)) / 6,
                  prefixDiversity: (a.prefixDiversity?.pathsSampled ?? 0) < 2 || (b.prefixDiversity?.pathsSampled ?? 0) < 2
                      ? null : Math.abs(a.prefixDiversity.meanSharedPrefixFrac - b.prefixDiversity.meanSharedPrefixFrac),
                  pairwiseDistinctiveness: (a.pairwiseDistinctiveness?.pairsCompared ?? 0) < 1 || (b.pairwiseDistinctiveness?.pairsCompared ?? 0) < 1
                      ? null : Math.abs(a.pairwiseDistinctiveness.meanDistance - b.pairwiseDistinctiveness.meanDistance),
                  discoverySaturation: a.discoverySaturation?.plateauFraction == null || b.discoverySaturation?.plateauFraction == null
                      ? null : Math.abs(a.discoverySaturation.plateauFraction - b.discoverySaturation.plateauFraction),"""
              assert old in s
              s = s.replace(old, new)

              old = """export function profileDistance(a, b) {
              const terms = profileDistanceTerms(a, b);
              let d = 0, wsum = 0;
              for (const [name, value] of Object.entries(terms)) {
                  if (value === null || value === undefined || Number.isNaN(value)) continue;
                  d += PROFILE_DISTANCE_WEIGHTS[name] * Math.min(1, value);
                  wsum += PROFILE_DISTANCE_WEIGHTS[name];
              }
              return wsum ? d / wsum : 1;
          }"""
              new = """export function profileDistanceWithCoverage(a, b) {
              const terms = profileDistanceTerms(a, b);
              let d = 0, comparableWeight = 0, comparableAxes = 0;
              const totalWeight = Object.values(PROFILE_DISTANCE_WEIGHTS).reduce((sum, value) => sum + value, 0);
              for (const [name, value] of Object.entries(terms)) {
                  if (value === null || value === undefined || Number.isNaN(value)) continue;
                  d += PROFILE_DISTANCE_WEIGHTS[name] * Math.min(1, value);
                  comparableWeight += PROFILE_DISTANCE_WEIGHTS[name];
                  comparableAxes++;
              }
              return {
                  distance: comparableWeight ? d / comparableWeight : 1,
                  comparableAxes,
                  comparableWeight,
                  comparableWeightFraction: totalWeight ? comparableWeight / totalWeight : 0,
                  totalWeight,
              };
          }

          export function profileDistance(a, b) {
              return profileDistanceWithCoverage(a, b).distance;
          }"""
              assert old in s
              s = s.replace(old, new)

              old = """        .map(entry => ({
                      id: entry.id,
                      distance: Number(profileDistance(candidate, entry.solutionProfile).toFixed(4)),
                      terms: Object.fromEntries("""
              new = """        .map(entry => {
                      const support = profileDistanceWithCoverage(candidate, entry.solutionProfile);
                      return {
                      id: entry.id,
                      distance: Number(support.distance.toFixed(4)),
                      support: {
                          comparableAxes: support.comparableAxes,
                          comparableWeight: Number(support.comparableWeight.toFixed(4)),
                          comparableWeightFraction: Number(support.comparableWeightFraction.toFixed(4)),
                      },
                      terms: Object.fromEntries("""
              assert old in s
              s = s.replace(old, new)
              old = """                    .map(([name, value]) => [name, value === null || value === undefined ? null : Number(value.toFixed(4))]),
                      ),
                  }))"""
              new = """                    .map(([name, value]) => [name, value === null || value === undefined ? null : Number(value.toFixed(4))]),
                      ),
                  };
                  })"""
              assert old in s
              s = s.replace(old, new)

              s = s.replace("levelsProvablyExhaustive: combined.filter(c => c.provablyExhaustive).length,",
                            "levelsWithExhaustiveSearchEvent: combined.filter(c => c.hasExhaustiveSearchEvent).length,")
              s = s.replace("meanCwFraction: Number(mean(combined.map(c => c.turnDistribution.cwFraction)).toFixed(4)),",
                            "meanCwFraction: Number(mean(combined.map(c => c.turnDistribution.cwFraction).filter(Number.isFinite)).toFixed(4)),")
              s = s.replace("levelsWithRigidMustCrossOrder: withMustCrossOrder.filter(c => c.mustCrossOrder.rigid).length,",
                            "levelsWithObservedSingleMustCrossOrder: withMustCrossOrder.filter(c => c.mustCrossOrder.observedSingleOrder).length,")

              old = """/** Deterministic signature of a corpus's saved-hint content — hint count + total provenance-entry
           *  count per level, hashed. Cheap enough to compute on every compare run (it reuses the same
           *  readLevelsWithHints() call the comparison needs anyway), and sensitive to any hint
           *  addition/removal or provenance append (e.g. a rediscovery) without hashing full path contents. */
          export function computeHintSignature(levels, levelNumbers = null) {
              const wanted = levelNumbers || levels.map((_, i) => i + 1);
              let totalHints = 0, totalProvenance = 0;
              const perLevel = wanted.map((n) => {
                  const level = levels[n - 1];
                  const hintCount = level?.hints?.length || 0;
                  const provenanceCount = (level?.hintRecords || []).reduce((sum, h) => sum + (h.provenance?.length || 0), 0);
                  totalHints += hintCount;
                  totalProvenance += provenanceCount;
                  return `${hintCount}:${provenanceCount}`;
              });
              const hash = createHash('sha1').update(perLevel.join('|')).digest('hex').slice(0, 16);
              return { totalHints, totalProvenance, hash };
          }"""
              new = """/** Deterministic content signature of every profile-bearing hint input. Count-only freshness was
           *  insufficient: in-place path/provenance corrections and discovery-date edits can change a profile
           *  without changing record counts. */
          export function computeHintSignature(levels, levelNumbers = null) {
              const wanted = levelNumbers || levels.map((_, i) => i + 1);
              let totalHints = 0, totalProvenance = 0;
              const perLevel = wanted.map((n) => {
                  const level = levels[n - 1];
                  const records = level?.hintRecords || [];
                  const hintCount = records.length;
                  const provenanceCount = records.reduce((sum, h) => sum + (h.provenance?.length || 0), 0);
                  totalHints += hintCount;
                  totalProvenance += provenanceCount;
                  return records.map(h => ({ path: h.path, provenance: h.provenance || [] }));
              });
              const hash = createHash('sha1').update(JSON.stringify(perLevel)).digest('hex').slice(0, 16);
              return { totalHints, totalProvenance, hash };
          }"""
              assert old in s
              s = s.replace(old, new)

              s = s.replace("`${summary.levelsProvablyExhaustive}** levels have at least one hint whose own search `", "`${summary.levelsWithExhaustiveSearchEvent}** levels have at least one hint whose own search `")
              s = s.replace("'terminated `exhaustive` (a real completeness signal, not the plateau heuristic below).'", "'terminated `exhaustive` (an event-local context marker, not proof the stored library is complete).'" )
              s = s.replace("`${summary.levelsWithRigidMustCrossOrder}** / `", "`${summary.levelsWithObservedSingleMustCrossOrder}** / `")
              s = s.replace("`${summary.levelsWithMustCrossOrder} multi-must-cross levels show a single rigid entry+completion order.`", "`${summary.levelsWithMustCrossOrder} multi-must-cross levels show one observed entry+completion order in the stored sample.`")
              s = s.replace("'## Provenance-source coverage'", "'## Provenance-origin coverage'")
              s = s.replace("'| Source | Levels with ≥ min-hints-per-source |'", "'| Origin | Levels with ≥ min-hints-per-source |'")

              old = """        schemaVersion: SOLUTION_PROFILE_SCHEMA_VERSION,
                  provenanceTaxonomy: SOLUTION_PROFILE_TAXONOMY,"""
              new = """        schemaVersion: SOLUTION_PROFILE_SCHEMA_VERSION,
                  provenanceTaxonomy: SOLUTION_PROFILE_TAXONOMY,
                  profileAlgorithmVersion: SOLUTION_PROFILE_ALGORITHM_VERSION,"""
              assert old in s
              s = s.replace(old, new)
              s = s.replace("known-solvable corpus — see docs/solver-solution-profile.md.'",
                            "known-solvable corpus — a known-solution sample profile, not a completeness claim; see docs/solver-solution-profile.md.'")
              lib_path.write_text(s)

          compare_path = Path('scripts/stress/solution-profile-compare.mjs')
          c = compare_path.read_text().replace('docs/solution-profile.md', 'docs/solver-solution-profile.md')
          c = c.replace("const reason = taxonomyCurrent\n        ? `${parsed.hintSignature?.totalHints ?? '?'} -> ${currentSignature.totalHints} hints`\n        : `taxonomy ${parsed.provenanceTaxonomy ?? 'legacy/unknown'} -> ${SOLUTION_PROFILE_TAXONOMY}`;",
                        "const reason = taxonomyCurrent\n        ? `${parsed.hintSignature?.totalHints ?? '?'} -> ${currentSignature.totalHints} hints/content changed`\n        : `profile schema/taxonomy/algorithm is legacy or unknown (taxonomy ${parsed.provenanceTaxonomy ?? 'legacy/unknown'}; expected ${SOLUTION_PROFILE_TAXONOMY})`;" )
          c = c.replace("console.log(`  ${r.id.padEnd(24)} distance=${r.distance}` + (worstAxis ? `  (most different on: ${worstAxis[0]}=${worstAxis[1]})` : ''));",
                        "console.log(`  ${r.id.padEnd(24)} distance=${r.distance} support=${Math.round(r.support.comparableWeightFraction * 100)}%` + (worstAxis ? `  (most different on: ${worstAxis[0]}=${worstAxis[1]})` : ''));" )
          compare_path.write_text(c)

          test_path = Path('scripts/stress/solution-profile-lib-unit-tests.mjs')
          t = test_path.read_text().replace('docs/solution-profile.md', 'docs/solver-solution-profile.md')
          t = t.replace('profileDistanceTerms, nearestProfiles, summarizeCorpusProfiles, PROVENANCE_SOURCES,',
                        'profileDistanceTerms, profileDistanceWithCoverage, nearestProfiles, summarizeCorpusProfiles, PROVENANCE_SOURCES,')
          t = t.replace('hasCurrentSolutionProfileTaxonomy, SOLUTION_PROFILE_SCHEMA_VERSION, SOLUTION_PROFILE_TAXONOMY,',
                        'hasCurrentSolutionProfileTaxonomy, SOLUTION_PROFILE_SCHEMA_VERSION, SOLUTION_PROFILE_TAXONOMY, SOLUTION_PROFILE_ALGORITHM_VERSION,')
          marker = """test('profileDistanceTerms: axes absent on both sides (e.g. no must-cross) are null, not maximal distance', () => {
              const level = { grid: { w: 3, h: 1 }, mustPass: [], mustCross: [], landmarks: [] };
              const profile = buildSinglePathProfile([p(0, 0), p(1, 0), p(2, 0)], level);
              const terms = profileDistanceTerms(profile, profile);
              assert.equal(terms.mustCrossRigidity, null);
              assert.equal(terms.objectiveDepth, null);
          });"""
          addition = marker + """

          test('profileDistanceTerms: one-path distribution axes are unknown rather than synthetic zero evidence', () => {
              const level = { grid: { w: 3, h: 1 }, mustPass: [], mustCross: [], landmarks: [] };
              const profile = buildSinglePathProfile([p(0, 0), p(1, 0), p(2, 0)], level);
              const terms = profileDistanceTerms(profile, profile);
              assert.equal(terms.prefixDiversity, null);
              assert.equal(terms.pairwiseDistinctiveness, null);
              assert.equal(terms.discoverySaturation, null);
              assert.equal(terms.turnChirality, null);
          });

          test('profileDistanceWithCoverage exposes how much nominal distance weight was comparable', () => {
              const level = { grid: { w: 3, h: 1 }, mustPass: [], mustCross: [], landmarks: [] };
              const profile = buildSinglePathProfile([p(0, 0), p(1, 0), p(2, 0)], level);
              const result = profileDistanceWithCoverage(profile, profile);
              assert.ok(result.comparableWeightFraction > 0 && result.comparableWeightFraction < 1);
          });"""
          assert marker in t
          t = t.replace(marker, addition)
          t = t.replace("""    assert.equal(hasCurrentSolutionProfileTaxonomy({
                  schemaVersion: SOLUTION_PROFILE_SCHEMA_VERSION,
                  provenanceTaxonomy: SOLUTION_PROFILE_TAXONOMY,
              }), true);""",
              """    assert.equal(hasCurrentSolutionProfileTaxonomy({
                  schemaVersion: SOLUTION_PROFILE_SCHEMA_VERSION,
                  provenanceTaxonomy: SOLUTION_PROFILE_TAXONOMY,
                  profileAlgorithmVersion: SOLUTION_PROFILE_ALGORITHM_VERSION,
              }), true);""")
          freshness_marker = """test('computeHintSignature: a rediscovery (new provenance entry, same hint) also changes the hash', () => {
              const before = [{ hints: [[1, 2]], hintRecords: [{ path: [1, 2], provenance: [entry()] }] }];
              const after = [{ hints: [[1, 2]], hintRecords: [{ path: [1, 2], provenance: [entry(), entry()] }] }];
              assert.notEqual(computeHintSignature(before).hash, computeHintSignature(after).hash);
              assert.equal(computeHintSignature(before).totalHints, computeHintSignature(after).totalHints);
          });"""
          freshness_add = freshness_marker + """

          test('computeHintSignature: in-place path/provenance edits change the hash even when counts do not', () => {
              const before = [{ hints: [[1, 2]], hintRecords: [{ path: [1, 2], provenance: [entry()] }] }];
              const after = [{ hints: [[1, 3]], hintRecords: [{ path: [1, 3], provenance: [entry({ foundAt: '2026-02-01T00:00:00Z' })] }] }];
              assert.notEqual(computeHintSignature(before).hash, computeHintSignature(after).hash);
              assert.equal(computeHintSignature(before).totalHints, computeHintSignature(after).totalHints);
          });"""
          assert freshness_marker in t
          t = t.replace(freshness_marker, freshness_add)
          chronology_marker = """test('discoverySaturationCurve: walks in foundAt order and reports cumulative growth', () => {
              const grid = { w: 3, h: 1 };
              const later = { path: [p(1, 0), p(2, 0)], provenance: [entry({ foundAt: '2026-02-01T00:00:00Z' })] };
              const earlier = { path: [p(0, 0), p(1, 0)], provenance: [entry({ foundAt: '2026-01-01T00:00:00Z' })] };
              const result = discoverySaturationCurve([later, earlier], [], grid);
              assert.equal(result.curve[0].n, 1);
              // Ordered by foundAt, so the EARLIER hint (found in January) must be processed first.
              assert.deepEqual(result.curve[0], { n: 1, newEdges: 1, newCells: 2, newPortalSignatures: 0, newMustCrossOrders: 0, cumulativeEdges: 1, cumulativeCells: 2 });
          });"""
          chronology_add = chronology_marker + """

          test('discoverySaturationCurve: incomplete discovery chronology cannot claim a plateau', () => {
              const grid = { w: 3, h: 1 };
              const dated = { path: [p(0, 0), p(1, 0)], provenance: [entry()] };
              const undatedEntry = entry(); undatedEntry.foundAt = null;
              const undated = { path: [p(1, 0), p(2, 0)], provenance: [undatedEntry] };
              const result = discoverySaturationCurve([dated, undated], [], grid);
              assert.equal(result.chronologyComplete, false);
              assert.equal(result.chronologyDatedHints, 1);
              assert.equal(result.plateauFraction, null);
          });"""
          assert chronology_marker in t
          t = t.replace(chronology_marker, chronology_add)
          test_path.write_text(t)
          PY
      - name: Targeted unit tests
        run: npx vitest run scripts/stress/solution-profile-lib-unit-tests.mjs scripts/stress/provenance-source-taxonomy-unit-tests.mjs
      - name: Lint touched JavaScript
        run: npx eslint scripts/stress/solution-profile-lib.mjs scripts/stress/solution-profile-compare.mjs scripts/stress/solution-profile-resource-audit.mjs scripts/stress/solution-profile-lib-unit-tests.mjs
      - name: Commit hardening if changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No hardening changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/stress/solution-profile-lib.mjs scripts/stress/solution-profile-compare.mjs scripts/stress/solution-profile-lib-unit-tests.mjs
          git commit -m 'research: harden solution-profile sample semantics'
          git push origin HEAD:chatgpt/solution-profile-resource-audit-2026-09-13
