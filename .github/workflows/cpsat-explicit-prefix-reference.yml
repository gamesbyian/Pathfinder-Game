# Executes a bounded, explicit list of prefix-feasibility questions through the EXISTING
# cpsat-reference-probe.py model. Cases are independent, so the selected population is round-robin
# sharded across Actions runners instead of being processed serially in one 6-hour-prone job.
# Each individual case still runs through exactly one cpsat-reference-probe.py process and preserves
# the same live/dead/timeout/referee semantics.
name: cpsat-explicit-prefix-reference
run-name: "CP-SAT prefix reference · ${{ inputs.cases_file }} · shards=${{ inputs.shard_count }}"

on:
  workflow_dispatch:
    inputs:
      cases_file:
        description: 'Committed JSON input. reference-abstain format can directly read known-solution-prefix branch artifacts; cases format expects {corpus,cases:[{id?,levelId,prefix,child?}]}'
        required: false
        default: 'reports/stress/winning-prefix-atlas-pilot-2026-08-11.json'
      case_format:
        description: 'reference-abstain or cases'
        required: false
        default: 'reference-abstain'
      corpus:
        description: 'Optional corpus override. Blank uses the input document levelsFile/corpus field.'
        required: false
        default: ''
      time_limit:
        description: 'Per-case CP-SAT time limit in seconds. UNKNOWN remains timeout/abstain.'
        required: false
        default: '60'
      max_cases:
        description: 'Bound the TOTAL selected population before sharding. Use a high value to process the whole committed list.'
        required: false
        default: '1000'
      shard_count:
        description: 'Number of round-robin case shards. Default 20 matches the usual Actions concurrency footprint; empty shards are harmless on small pilots.'
        required: false
        default: '20'
      max_parallel:
        description: 'Shard jobs allowed to run concurrently. Lower this to share Actions capacity without changing the selected case population.'
        required: false
        default: '20'

concurrency:
  group: cpsat-explicit-prefix-reference
  cancel-in-progress: false

jobs:
  plan:
    name: Validate tooling and plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Check out dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify explicit-prefix parsing/classification helpers
        run: npm run test:research-analysis-lib

      - name: Build shard matrix
        id: plan
        shell: bash
        run: |
          n="${{ inputs.shard_count }}"
          shards=$(node -e "console.log(JSON.stringify(Array.from({length:Number(process.argv[1])},(_,i)=>i+1)))" "$n")
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"

  reference-shards:
    name: Prefix reference shard ${{ matrix.shard }}/${{ inputs.shard_count }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel) }}
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - name: Check out dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          pip install ortools

      - name: Run this explicit-prefix shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/stress
          corpus_arg=()
          if [ -n "${{ inputs.corpus }}" ]; then
            corpus_arg+=("--corpus=${{ inputs.corpus }}")
          fi
          nn=$(printf '%03d' "${{ matrix.shard }}")
          node scripts/run-bundled.mjs scripts/stress/cpsat-explicit-prefix-reference.mjs -- \
            "--cases=${{ inputs.cases_file }}" \
            "--format=${{ inputs.case_format }}" \
            "--time-limit=${{ inputs.time_limit }}" \
            "--max-cases=${{ inputs.max_cases }}" \
            "--shard-index=${{ matrix.shard }}" \
            "--shard-count=${{ inputs.shard_count }}" \
            "--out=reports/stress/cpsat-explicit-prefix-reference-shard-${nn}.json" \
            "${corpus_arg[@]}"

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpsat-explicit-prefix-reference-shard-${{ matrix.shard }}
          path: reports/stress/cpsat-explicit-prefix-reference-shard-*.json
          retention-days: 30
          if-no-files-found: error

  combine:
    name: Combine explicit-prefix reference results
    needs: [plan, reference-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Download every shard result
        uses: actions/download-artifact@v8
        with:
          pattern: cpsat-explicit-prefix-reference-shard-*
          path: artifact-staging
          merge-multiple: true

      - name: Combine and verify complete shard coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/stress
          node scripts/combine-cpsat-explicit-prefix-reference-shards.mjs \
            --in-dir=artifact-staging \
            --shards="${{ inputs.shard_count }}" \
            --out="reports/stress/cpsat-explicit-prefix-reference-${{ github.run_id }}.json"

      - name: Upload combined reference result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cpsat-explicit-prefix-reference-${{ github.run_id }}
          path: reports/stress/cpsat-explicit-prefix-reference-${{ github.run_id }}.json
          retention-days: 30
          if-no-files-found: error

      - name: Publish standard solver sweep result
        if: always()
        shell: bash
        run: |
          node scripts/publish-solver-sweep-result.mjs \
            --primary="reports/stress/cpsat-explicit-prefix-reference-${{ github.run_id }}.json" \
            --shards-expected="${{ inputs.shard_count }}" \
            --shards-observed="$(find artifact-staging -maxdepth 1 -name 'cpsat-explicit-prefix-reference-shard-*.json' | wc -l | tr -d ' ')" \
            --source-artifact="cpsat-explicit-prefix-reference-${{ github.run_id }}"

      - name: Upload standard solver sweep result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-sweep-result
          path: logs/solver-sweep-result/
          if-no-files-found: error
          retention-days: 90
