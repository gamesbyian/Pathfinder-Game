# One-shot evidence archiver; remove before integrating the PG-K report.
name: PG-K archive exact twelve-parent verdict
on:
  push:
    branches:
      - chatgpt/pg-k-dead-prefix-segment-revision-20261017
    paths:
      - .github/workflows/pg-k-preserve-exact-result-20261017.yml
permissions:
  contents: write
  actions: read
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Recover exact oracle result without recomputation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tmp/pg-k-exact
          gh run download 39070952304 --repo "$GITHUB_REPOSITORY" \
            --name pg-k-12-parent-exact-revised-prefix-20261017 --dir tmp/pg-k-exact
          test -s tmp/pg-k-exact/pg-k-exact-reference-20261017.json
      - name: Persist all 12 complete exact-source rows and provenance
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          const d=JSON.parse(readFileSync('tmp/pg-k-exact/pg-k-exact-reference-20261017.json','utf8'));
          const m=JSON.parse(readFileSync('reports/stress/pg-k-dead-prefix-exact-tranche-20261017-001.json','utf8'));
          if(d.summary.cases!==12||d.rows.length!==12||d.summary.live!==0||
             d.summary.dead!==12||d.summary.abstain!==0||d.summary.correctnessAlarms!==0||d.summary.inputAlarms!==0)
            throw Error('exact PG-K result incomplete or unexpectedly different');
          const ids=new Set(m.cases.map(c=>c.id));
          if(m.cases.length!==12||new Set(m.cases.map(c=>c.levelId)).size!==12)throw Error('selection identity changed');
          if(d.rows.some(r=>!ids.has(r.caseId)||r.referenceLabel!=='dead'||r.cpSatStatus!=='INFEASIBLE'))
            throw Error('exact labels do not match frozen selected cases');
          d.provenance={sourceRunId:39070952304,sourceHead:'96dead3f8bb804435d3bb092da383aa66bdb49d9',
            artifactId:12115520877,artifactZipSha256:'6015d4ee42588d0884b39255970847a9f3f9b7561ce286cdf486aae7913680df',
            frozenInput:'reports/stress/pg-k-dead-prefix-exact-tranche-20261017-001.json'};
          mkdirSync('reports/stress',{recursive:true});
          writeFileSync('reports/stress/pg-k-exact-12-parent-dead-revisions-20261017-001.json',JSON.stringify(d,null,2)+'\n');
          console.log('PG-K EXACT ROWS PRESERVED '+JSON.stringify(d.summary));
          NODE
      - name: Commit result as exact repo artifact
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/stress/pg-k-exact-12-parent-dead-revisions-20261017-001.json
          git commit -m 'PG-K: preserve exact CP-SAT DEAD verdict on twelve independent revised prefixes'
          git push origin HEAD:refs/heads/chatgpt/pg-k-dead-prefix-segment-revision-20261017
