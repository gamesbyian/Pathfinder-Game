name: Temporary solution-profile closeout

on:
  push:
    branches:
      - chatgpt/solution-profile-resource-audit-2026-09-13

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Apply closeout patch
        run: python scripts/stress/solution-profile-closeout-temp.py
      - name: Targeted profile tests
        run: npx vitest run scripts/stress/solution-profile-lib-unit-tests.mjs scripts/stress/provenance-source-taxonomy-unit-tests.mjs
      - name: Lint profile code
        run: npx eslint scripts/stress/solution-profile-lib.mjs scripts/stress/solution-profile-lib-unit-tests.mjs scripts/stress/solution-profile-compare.mjs scripts/stress/solution-profile-resource-audit.mjs
      - name: Commit closeout patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/stress/solution-profile-lib.mjs scripts/stress/solution-profile-lib-unit-tests.mjs scripts/stress/solution-profile-compare.mjs
          git commit -m 'research: close profile evidence semantics gaps'
          git push origin HEAD:chatgpt/solution-profile-resource-audit-2026-09-13
