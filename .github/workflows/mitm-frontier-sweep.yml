# Sharded runner for scripts/stress/mitm-frontier-probe.mjs -- settling docs/future-work.md's
# "genuinely open, not settled" bidirectional/meet-in-the-middle frontier-size question.
#
# The original probe (see mitm-frontier-probe.mjs's own header for the full history) died at
# depth ~20 from O(depth) per-successor work, AND used a dedup key that omitted per-cell edge-axis
# usage -- a real correctness gap (search-state.ts's general "can't re-enter a cell along an axis
# already used to enter it" rule applies to every cell, not just must-cross ones), which
# systematically UNDERCOUNTED distinct states and biased the whole measurement toward false
# optimism. Both are fixed in the rewritten probe (incremental DFS-with-per-depth-dedup using the
# real applyMove/undoMove/getNeighbors, validated against an independent naive BFS reference at
# small depth; corrected key covers every SolverSearchState field, generalizing the must-cross-only
# axis tracking future-work.md's own analysis called out as missing).
#
# Runs a small, fixed level sample (not a shard of the whole corpus) -- one shard per level, matrix
# entries named directly rather than shard-index/shard-count round-robin, since the point here is
# depth reached per level, not corpus coverage. The sample mixes: must-cross-heavy levels already
# referenced in future-work.md/reports/2026-07-31-mustcross-forced-structure.md's widening (for
# continuity with the documented-but-undercounted numbers), clean flipping-filter-only levels
# spanning the real flipper-count range (5-8 -- CLAUDE.md's documented "max 4" is published-corpus-
# only; the stress corpora go higher), and matched flipper-free baselines at similar reqLen, so the
# flipper-specific effect on frontier growth is isolated rather than assumed.
#
# `--cap` was 5,000,000 on the first dispatch and OOM'd every shard: the probe's first rewrite
# (correctness fix) held every depth's data resident for the whole run, so real memory was the SUM
# across ~40+ depths, not the one depth the cap bounded. Fixed in the probe (now an explicit BFS,
# only 2 depth-layers resident at once) and re-measured locally via per-depth RSS logging: about
# 1.5-1.6 KB per resident state (R00044: 620MB at ~620K resident growing to 6,739MB at ~4.3M
# resident, roughly linear). Standard GitHub-hosted runners have ~7GB; 1,500,000 keeps total
# resident (current depth + previous, ~1.65x the per-depth cap empirically) to roughly 4GB, leaving
# real headroom for Node/OS overhead rather than tuning to the edge of another OOM. Commit
# mechanics mirror collect-prune-gap-labels.yml (commit directly from the runner's own network, not via artifact
# download into a sandboxed dispatching session -- see that workflow's own header for why).
name: mitm-frontier-sweep (settle the MITM frontier-size question)
run-name: "MITM frontier · cap=${{ inputs.cap }} · levels=${{ inputs.levels }}"

on:
  workflow_dispatch:
    inputs:
      cap:
        description: 'Per-depth distinct-state cap before a shard stops (memory safety)'
        required: false
        default: '1500000'
      levels:
        description: 'Comma-separated level ids to run (one shard each). Leave default for the full curated sample.'
        required: false
        default: 'R00044,R03196,R03360,R02704,R02211,R02190,R03171,R02575'

concurrency:
  group: mitm-frontier-sweep
  cancel-in-progress: false

jobs:
  prepare-matrix:
    name: Build the level matrix
    runs-on: ubuntu-latest
    outputs:
      levels: ${{ steps.split.outputs.levels }}
    steps:
      - id: split
        shell: bash
        run: |
          json=$(printf '%s' "${{ inputs.levels }}" | awk -F',' '{printf "["; for(i=1;i<=NF;i++){printf "%s\"%s\"", (i>1?",":""), $i}; printf "]"}')
          echo "levels=${json}" >> "$GITHUB_OUTPUT"

  sweep:
    name: mitm-frontier ${{ matrix.level }}
    needs: prepare-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        level: ${{ fromJSON(needs.prepare-matrix.outputs.levels) }}
    steps:
      - name: Check out the dispatched ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run mitm-frontier-probe for this level
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p reports/stress logs/mitm-frontier-sweep
          # NODE_OPTIONS (not `node --max-old-space-size=...`) because run-bundled.mjs SPAWNS a
          # child process to run the actual bundle -- a flag on the outer `node` invocation only
          # raises the trivial esbuild-driver process's own heap, never reaches the child that does
          # the real work. NODE_OPTIONS is inherited by the spawned child's environment instead.
          export NODE_OPTIONS="--max-old-space-size=6144"
          timeout -k 30s --preserve-status 170m node scripts/run-bundled.mjs scripts/stress/mitm-frontier-probe.mjs -- \
            --level="${{ matrix.level }}" \
            --cap="${{ inputs.cap }}" \
            --out="reports/stress/mitm-frontier-${{ matrix.level }}.json" \
            2>&1 | tee "logs/mitm-frontier-sweep/${{ matrix.level }}.console.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload this level's result
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mitm-frontier-${{ matrix.level }}
          path: |
            reports/stress/mitm-frontier-${{ matrix.level }}.json
            logs/mitm-frontier-sweep/${{ matrix.level }}.console.log
          retention-days: 30
          if-no-files-found: warn

  combine:
    name: Combine results and commit
    needs: sweep
    if: ${{ always() && needs.sweep.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the dispatched ref
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Download all shard artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: mitm-frontier-*
          path: artifact-staging
          merge-multiple: true

      - name: Upload combined artifact (also kept regardless of the commit below)
        uses: actions/upload-artifact@v7
        with:
          name: mitm-frontier-sweep-combined
          path: artifact-staging/
          retention-days: 30
          if-no-files-found: warn

      - name: Publish standard solver sweep result
        if: always()
        shell: bash
        run: |
          node scripts/publish-solver-sweep-result.mjs \
            --primary="artifact-staging" \
            --shards-expected="$(printf '%s' "${{ inputs.levels }}" | awk -F',' '{print NF}')" \
            --shards-observed="$(find artifact-staging -name 'mitm-frontier-*.json' | wc -l | tr -d ' ')" \
            --provenance-out="reports/stress/mitm-frontier-source-run-${{ github.run_id }}.json" \
            --source-artifact="mitm-frontier-sweep-combined"

      - name: Upload standard solver sweep result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-sweep-result
          path: logs/solver-sweep-result/
          if-no-files-found: error
          retention-days: 90

      - name: Merge new/updated results into the working tree and commit
        shell: bash
        run: |
          mkdir -p reports/stress
          # Each shard uploads reports/stress/mitm-frontier-<id>.json alongside a console log;
          # upload-artifact preserves that relative path (least-common-ancestor rule), so after
          # merge-multiple download the files land at artifact-staging/reports/stress/*.json, not
          # directly under artifact-staging/ -- search recursively, not maxdepth 1 (the bug that
          # made run 31057521030's combine job silently commit nothing despite every shard
          # succeeding).
          find artifact-staging -name 'mitm-frontier-*.json' -exec cp {} reports/stress/ \;
          if git status --porcelain -- reports/stress/ | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add reports/stress/mitm-frontier-*.json
            git commit -m "mitm-frontier-sweep: grow the meet-in-the-middle frontier measurement (run ${{ github.run_id }})"
            git push origin HEAD:"${{ github.ref_name }}"
          else
            echo "No new/changed results -- nothing to commit."
          fi
