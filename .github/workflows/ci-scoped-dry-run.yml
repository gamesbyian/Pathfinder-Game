name: CI Scoped Dry Run

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref/SHA for impact classification
        required: true
        type: string
      head_ref:
        description: Head ref/SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  impact-shadow:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      surfaces: ${{ steps.plan.outputs.surfaces }}
      validator_groups: ${{ steps.plan.outputs.validator_groups }}
      node_test_groups: ${{ steps.plan.outputs.node_test_groups }}
      needs_build: ${{ steps.plan.outputs.needs_build }}
      needs_coverage: ${{ steps.plan.outputs.needs_coverage }}
      needs_deep_proofs: ${{ steps.plan.outputs.needs_deep_proofs }}
      needs_firestore: ${{ steps.plan.outputs.needs_firestore }}
      fast_job_required: ${{ steps.plan.outputs.fast_job_required }}
      deep_job_required: ${{ steps.plan.outputs.deep_job_required }}
      deep_services_job_required: ${{ steps.plan.outputs.deep_services_job_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_ref }}
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /scripts/ci-execution-plan.json
            /scripts/ci-execution-plan.mjs
            /scripts/ci-impact-classifier.mjs
            /scripts/ci-impact-rules.json
            /scripts/ci-impact-shadow-plan.mjs
            /scripts/ci-validation-plan.json
            /scripts/ci-validation-plan.mjs
            /scripts/validation-groups.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Compute scoped validation plan
        id: plan
        run: >-
          node scripts/ci-impact-shadow-plan.mjs
          --git-diff "${{ inputs.base_ref }}" "${{ inputs.head_ref }}" --out=tmp/ci-impact-shadow.json

      - name: Upload scoped impact plan
        uses: actions/upload-artifact@v7
        with:
          name: ci-impact-shadow
          path: tmp/ci-impact-shadow.json
          retention-days: 14

  fast-gate:
    needs: impact-shadow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Derive exact dependency-tree cache key
        id: dependency-tree-key
        shell: bash
        run: |
          echo "key=node-modules-${RUNNER_OS}-$(node -p 'process.arch')-node$(node --version)-npm$(npm --version)-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Restore exact dependency tree
        id: dependency-tree-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ steps.dependency-tree-key.outputs.key }}
      - name: Install dependencies from the npm cache
        id: install-dependencies
        if: steps.dependency-tree-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Save exact dependency tree after successful install
        if: steps.dependency-tree-cache.outputs.cache-hit != 'true' && steps.install-dependencies.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: node_modules
          key: ${{ steps.dependency-tree-key.outputs.key }}
      - name: Check package-script reachability
        run: npm run check:dead-scripts
      - name: Check textual source invariants
        run: npm run check:text-source-files
        env:
          PATHFINDER_PR_INCREMENTAL: '0'
      - name: Run selected non-lint validators
        if: needs.impact-shadow.outputs.validator_groups != ''
        shell: bash
        env:
          VALIDATOR_GROUPS: ${{ needs.impact-shadow.outputs.validator_groups }}
          PATHFINDER_PR_INCREMENTAL: '0'
          PATHFINDER_PARALLEL_SUCCESS_OUTPUT: summary
          PATHFINDER_DIRECT_PACKAGE_SCRIPTS: '1'
        run: |
          groups="${VALIDATOR_GROUPS//,/ }"
          node scripts/validation-groups.mjs validators $groups
      - name: Run lint
        id: lint
        run: npm run check:lint

  node-contracts:
    needs: impact-shadow
    name: node-contracts-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            owner_groups: research,solver,game,persistence
          - shard: b
            owner_groups: shared,data,repo
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Derive exact dependency-tree cache key
        id: dependency-tree-key
        shell: bash
        run: |
          echo "key=node-modules-${RUNNER_OS}-x64-nodev22.23.2-npm10.9.8-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Restore exact dependency tree
        id: dependency-tree-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ steps.dependency-tree-key.outputs.key }}
      - name: Install dependencies from the npm cache
        if: steps.dependency-tree-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run selected Node and CLI contract shard
        shell: bash
        env:
          NODE_TEST_GROUPS: ${{ needs.impact-shadow.outputs.node_test_groups }}
          OWNER_GROUPS: ${{ matrix.owner_groups }}
          PATHFINDER_PARALLEL_JOBS: '4'
          PATHFINDER_PARALLEL_SUCCESS_OUTPUT: summary
          PATHFINDER_DIRECT_PACKAGE_SCRIPTS: '1'
        run: |
          if [[ -z "$NODE_TEST_GROUPS" ]]; then
            echo "No Node/CLI contract groups selected."
            exit 0
          fi
          groups="${NODE_TEST_GROUPS//,/ }"
          node scripts/validation-groups.mjs nodeTests $groups --owner-groups="$OWNER_GROUPS"

  deep-verification:
    needs: impact-shadow
    if: needs.impact-shadow.outputs.deep_job_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_ref }}
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/
          sparse-checkout-cone-mode: false
      - name: Derive exact dependency-tree cache key
        id: dependency-tree-key
        shell: bash
        run: |
          echo "key=node-modules-${RUNNER_OS}-x64-nodev22.23.2-npm10.9.8-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Restore exact dependency tree
        id: dependency-tree-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ steps.dependency-tree-key.outputs.key }}
      - name: Set up Node on warm dependency-tree path
        if: steps.dependency-tree-cache.outputs.cache-hit == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Set up Node with npm cache on dependency-tree miss
        if: steps.dependency-tree-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install dependencies from the npm cache
        if: steps.dependency-tree-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run covered ordinary test population
        id: coverage
        run: npm run test:coverage
        env:
          SOLVER_DEADLOCK_PROOF_SKIP: '1'
          SOLVER_R02560_PROOF_SKIP: '1'

  deep-services:
    needs: impact-shadow
    if: needs.impact-shadow.outputs.deep_services_job_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_ref }}
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/
          sparse-checkout-cone-mode: false
      - name: Derive exact dependency-tree cache key
        id: dependency-tree-key
        shell: bash
        run: |
          echo "key=node-modules-${RUNNER_OS}-x64-nodev22.23.2-npm10.9.8-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Restore exact dependency tree
        id: dependency-tree-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ steps.dependency-tree-key.outputs.key }}
      - name: Set up Node on warm dependency-tree path
        if: steps.dependency-tree-cache.outputs.cache-hit == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Set up Node with npm cache on dependency-tree miss
        if: steps.dependency-tree-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install dependencies from the npm cache
        if: steps.dependency-tree-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Materialize build runtime JSON
        if: needs.impact-shadow.outputs.needs_build == 'true'
        shell: bash
        run: |
          mkdir -p data/stress
          for file in \
            data/levels.json \
            data/level-heatmaps.json \
            data/themes.json \
            data/stress/stress-levels.json \
            data/stress/stress-levels-random.json
          do
            git show "HEAD:$file" > "$file"
          done
      - name: Derive runtime-hint projection cache identity
        if: needs.impact-shadow.outputs.needs_build == 'true'
        id: runtime-hint-projection-key
        shell: bash
        run: node scripts/ci-runtime-hint-projection-cache.mjs key
      - name: Restore exact or recent runtime-hint projection
        if: needs.impact-shadow.outputs.needs_build == 'true'
        id: runtime-hint-projection-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/runtime-hint-projection
          key: runtime-hint-projection-v2-${{ runner.os }}-${{ steps.runtime-hint-projection-key.outputs.authority_key }}-${{ steps.runtime-hint-projection-key.outputs.source_key }}
          restore-keys: |
            runtime-hint-projection-v2-${{ runner.os }}-${{ steps.runtime-hint-projection-key.outputs.authority_key }}-
      - name: Restore runtime Hint sources for projection miss
        if: needs.impact-shadow.outputs.needs_build == 'true' && steps.runtime-hint-projection-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/runtime-data
      - name: Plan runtime-hint projection overlay
        if: needs.impact-shadow.outputs.needs_build == 'true' && steps.runtime-hint-projection-cache.outputs.cache-hit != 'true'
        shell: bash
        run: node scripts/ci-runtime-hint-projection-cache.mjs plan
      - name: Restore Firebase CLI cache
        if: needs.impact-shadow.outputs.needs_firestore == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ~/.npm/_npx
          key: firebase-cli-${{ runner.os }}-node22.23.2-firebase-tools-15.28.2-v1
      - name: Restore Firestore emulator binary
        if: needs.impact-shadow.outputs.needs_firestore == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firestore-emulator-${{ runner.os }}-firebase-tools-15.28.2-v1.22.0-v1
      - uses: actions/setup-java@v5
        if: needs.impact-shadow.outputs.needs_firestore == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Run selected build and deep services concurrently
        id: deep_services
        shell: bash
        env:
          RUN_BUILD: ${{ needs.impact-shadow.outputs.needs_build }}
          RUN_PROOFS: ${{ needs.impact-shadow.outputs.needs_deep_proofs }}
          RUN_FIRESTORE: ${{ needs.impact-shadow.outputs.needs_firestore }}
          PATHFINDER_RUNTIME_HINT_PROJECTION_CACHE_ROOT: .cache/runtime-hint-projection
          PATHFINDER_RUNTIME_HINT_PROJECTION_RECONCILE: ${{ steps.runtime-hint-projection-cache.outputs.cache-hit != 'true' && '1' || '0' }}
        run: |
          set +e
          build_status=0
          proofs_status=0
          firestore_status=0
          build_pid=''
          proofs_pid=''
          firestore_pid=''

          if [[ "$RUN_BUILD" == "true" ]]; then
            npm run build > /tmp/pathfinder-build.log 2>&1 &
            build_pid=$!
          else
            echo "build=skipped" >> "$GITHUB_OUTPUT"
          fi

          if [[ "$RUN_PROOFS" == "true" ]]; then
            npm run test:deep-proofs > /tmp/pathfinder-deep-proofs.log 2>&1 &
            proofs_pid=$!
          fi
          if [[ "$RUN_FIRESTORE" == "true" ]]; then
            npx --yes firebase-tools@15.28.2               emulators:exec --only firestore               --project demo-pathfinder-fingerprint-boundary               "npm run test:firestore-level-fingerprint-boundary"               > /tmp/pathfinder-firestore.log 2>&1 &
            firestore_pid=$!
          fi
          if [[ -n "$build_pid" ]]; then
            wait "$build_pid"; build_status=$?
            [[ "$build_status" -eq 0 ]] && echo "build=success" >> "$GITHUB_OUTPUT" || echo "build=failure" >> "$GITHUB_OUTPUT"
            echo '=== production build ==='
            cat /tmp/pathfinder-build.log
          fi
          if [[ -n "$proofs_pid" ]]; then wait "$proofs_pid"; proofs_status=$?; fi
          if [[ -n "$firestore_pid" ]]; then wait "$firestore_pid"; firestore_status=$?; fi
          if [[ "$RUN_PROOFS" == "true" ]]; then cat /tmp/pathfinder-deep-proofs.log; fi
          if [[ "$RUN_FIRESTORE" == "true" ]]; then cat /tmp/pathfinder-firestore.log; fi
          if [[ "$build_status" -ne 0 || "$proofs_status" -ne 0 || "$firestore_status" -ne 0 ]]; then exit 1; fi

      - name: Save exact runtime-hint projection after successful build
        if: needs.impact-shadow.outputs.needs_build == 'true' && steps.deep_services.outputs.build == 'success' && steps.runtime-hint-projection-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/runtime-hint-projection
          key: runtime-hint-projection-v2-${{ runner.os }}-${{ steps.runtime-hint-projection-key.outputs.authority_key }}-${{ steps.runtime-hint-projection-key.outputs.source_key }}


  ci-success:
    needs:
      - impact-shadow
      - fast-gate
      - node-contracts
      - deep-verification
      - deep-services
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce scoped CI result contract
        shell: bash
        env:
          ROUTE_RESULT: ${{ needs.impact-shadow.result }}
          FAST_RESULT: ${{ needs.fast-gate.result }}
          NODE_RESULT: ${{ needs.node-contracts.result }}
          DEEP_RESULT: ${{ needs.deep-verification.result }}
          SERVICES_RESULT: ${{ needs.deep-services.result }}
        run: |
          printf '%-18s %s\n' route "$ROUTE_RESULT"
          printf '%-18s %s\n' fast-gate "$FAST_RESULT"
          printf '%-18s %s\n' node-contracts "$NODE_RESULT"
          printf '%-18s %s\n' deep-verification "$DEEP_RESULT"
          printf '%-18s %s\n' deep-services "$SERVICES_RESULT"
          [[ "$ROUTE_RESULT" == "success" ]]
          [[ "$FAST_RESULT" == "success" ]]
          [[ "$NODE_RESULT" == "success" ]]
          [[ "$DEEP_RESULT" == "success" || "$DEEP_RESULT" == "skipped" ]]
          [[ "$SERVICES_RESULT" == "success" || "$SERVICES_RESULT" == "skipped" ]]
