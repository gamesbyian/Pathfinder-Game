name: CI Scoped Dry Run

on:
  workflow_dispatch:
    inputs:
      base_ref:
        description: Base ref/SHA for impact classification
        required: true
        type: string
      head_ref:
        description: Head ref/SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  impact-shadow:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.plan.outputs.full }}
      surfaces: ${{ steps.plan.outputs.surfaces }}
      validator_groups: ${{ steps.plan.outputs.validator_groups }}
      node_test_groups: ${{ steps.plan.outputs.node_test_groups }}
      needs_build: ${{ steps.plan.outputs.needs_build }}
      needs_coverage: ${{ steps.plan.outputs.needs_coverage }}
      needs_deep_proofs: ${{ steps.plan.outputs.needs_deep_proofs }}
      needs_solver_canary: ${{ steps.plan.outputs.needs_solver_canary }}
      needs_firestore: ${{ steps.plan.outputs.needs_firestore }}
      fast_job_required: ${{ steps.plan.outputs.fast_job_required }}
      deep_job_required: ${{ steps.plan.outputs.deep_job_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_ref }}
          fetch-depth: 0
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /scripts/ci-execution-plan.json
            /scripts/ci-execution-plan.mjs
            /scripts/ci-impact-classifier.mjs
            /scripts/ci-impact-rules.json
            /scripts/ci-impact-shadow-plan.mjs
            /scripts/ci-validation-plan.json
            /scripts/ci-validation-plan.mjs
            /scripts/validation-groups.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Compute scoped validation plan
        id: plan
        run: >-
          node scripts/ci-impact-shadow-plan.mjs
          --git-diff "${{ inputs.base_ref }}" "${{ inputs.head_ref }}" --out=tmp/ci-impact-shadow.json

      - name: Upload scoped impact plan
        uses: actions/upload-artifact@v7
        with:
          name: ci-impact-shadow
          path: tmp/ci-impact-shadow.json
          retention-days: 14

  fast-gate:
    needs: impact-shadow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_ref }}
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/
          sparse-checkout-cone-mode: false
      - name: Derive deep runtime-data cache key
        id: deep-runtime-data-key
        shell: bash
        run: |
          {
            git rev-parse HEAD:data/levels.json
            git rev-parse HEAD:data/level-heatmaps.json
            git rev-parse HEAD:data/themes.json
            git rev-parse HEAD:data/hints
            git rev-parse HEAD:data/stress/stress-levels.json
            git rev-parse HEAD:data/stress/stress-levels-random.json
            git rev-parse HEAD:data/stress/stress-levels-envelope.json
            git rev-parse HEAD:data/stress/hints
            git rev-parse HEAD:data/stress/hints-random
            git rev-parse HEAD:data/stress/hints-envelope
          } | sha256sum | awk '{print "key="$1}' >> "$GITHUB_OUTPUT"
      - name: Restore exact runtime-data tree for deep verification
        id: deep-runtime-data-cache
        uses: actions/cache/restore@v5
        with:
          path: |
            data/levels.json
            data/level-heatmaps.json
            data/themes.json
            data/hints
            data/stress/stress-levels.json
            data/stress/stress-levels-random.json
            data/stress/stress-levels-envelope.json
            data/stress/hints
            data/stress/hints-random
            data/stress/hints-envelope
          key: runtime-data-${{ steps.deep-runtime-data-key.outputs.key }}
      - name: Materialize deep runtime data on cache miss
        if: steps.deep-runtime-data-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_ref }}
          # A second batched checkout is intentionally used on a miss. Hosted evidence showed
          # post-clone sparse expansion taking 51s, while the equivalent initial sparse checkout is
          # ~15s. The hit path avoids both costs; the miss path must remain no worse than baseline.
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/*
            /data/stress/stress-levels.json
            /data/stress/stress-levels-random.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install dependencies from the npm cache
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Check package-script reachability
        run: npm run check:dead-scripts
      - name: Check textual source invariants
        run: npm run check:text-source-files
        env:
          PATHFINDER_PR_INCREMENTAL: '0'
      - name: Check CI impact inventory
        run: npm run check:ci-impact-inventory
      - name: Run selected non-lint validators
        if: needs.impact-shadow.outputs.validator_groups != ''
        shell: bash
        env:
          VALIDATOR_GROUPS: ${{ needs.impact-shadow.outputs.validator_groups }}
          PATHFINDER_PR_INCREMENTAL: '0'
          PATHFINDER_PARALLEL_SUCCESS_OUTPUT: summary
          PATHFINDER_DIRECT_PACKAGE_SCRIPTS: '1'
        run: |
          groups="${VALIDATOR_GROUPS//,/ }"
          node scripts/validation-groups.mjs validators $groups
      - name: Run lint
        id: lint
        run: npm run check:lint
      - name: Run selected Node and CLI contract tests
        if: needs.impact-shadow.outputs.node_test_groups != ''
        shell: bash
        env:
          NODE_TEST_GROUPS: ${{ needs.impact-shadow.outputs.node_test_groups }}
          PATHFINDER_PARALLEL_JOBS: '4'
          PATHFINDER_PARALLEL_SUCCESS_OUTPUT: summary
          PATHFINDER_DIRECT_PACKAGE_SCRIPTS: '1'
        run: |
          groups="${NODE_TEST_GROUPS//,/ }"
          node scripts/validation-groups.mjs nodeTests $groups
      - name: Solver capability canary
        id: solver_canary
        if: needs.impact-shadow.outputs.needs_solver_canary == 'true'
        run: |
          node scripts/run-bundled.mjs scripts/solver-bench.mjs -- --check \
            --baseline=logs/solver-canary-baseline.json \
            --levels=pos:1,pos:20,pos:40,pos:60,pos:80,pos:100,pos:120,pos:140,pos:160 \
            --budget-ms=15000 --work-budget=250000
      - name: Build production bundle
        id: build
        if: needs.impact-shadow.outputs.needs_build == 'true'
        run: npm run build

  deep-verification:
    needs: impact-shadow
    if: needs.impact-shadow.outputs.deep_job_required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install dependencies from the npm cache
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run covered ordinary test population
        id: coverage
        if: needs.impact-shadow.outputs.needs_coverage == 'true'
        run: npm run test:coverage
        env:
          SOLVER_DEADLOCK_PROOF_SKIP: '1'
          SOLVER_R02560_PROOF_SKIP: '1'
      - name: Run heavyweight implementation proofs
        id: deep_proofs
        if: needs.impact-shadow.outputs.needs_deep_proofs == 'true'
        run: npm run test:deep-proofs
      # Restore the default-branch-seeded Firebase CLI materialization. Startup acceleration only.
      - name: Restore Firebase CLI cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.npm/_npx
          key: firebase-cli-${{ runner.os }}-node22.23.2-firebase-tools-15.28.2-v1
      - uses: actions/setup-java@v5
        if: needs.impact-shadow.outputs.needs_firestore == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Exercise level-fingerprint repository identity through Firestore emulator
        id: firestore
        if: needs.impact-shadow.outputs.needs_firestore == 'true'
        run: >-
          npx --yes firebase-tools@15.28.2
          emulators:exec --only firestore
          --project demo-pathfinder-fingerprint-boundary
          "npm run test:firestore-level-fingerprint-boundary"

  ci-success:
    needs:
      - impact-shadow
      - fast-gate
      - deep-verification
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Enforce scoped CI result contract
        shell: bash
        env:
          ROUTE_RESULT: ${{ needs.impact-shadow.result }}
          FAST_RESULT: ${{ needs.fast-gate.result }}
          DEEP_RESULT: ${{ needs.deep-verification.result }}
        run: |
          printf '%-18s %s\n' route "$ROUTE_RESULT"
          printf '%-18s %s\n' fast-gate "$FAST_RESULT"
          printf '%-18s %s\n' deep-verification "$DEEP_RESULT"
          [[ "$ROUTE_RESULT" == "success" ]]
          [[ "$FAST_RESULT" == "success" ]]
          [[ "$DEEP_RESULT" == "success" || "$DEEP_RESULT" == "skipped" ]]
