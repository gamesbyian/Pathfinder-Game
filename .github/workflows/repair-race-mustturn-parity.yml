name: Repair race must-turn parity

on:
  push:
    branches:
      - chatgpt/must-turn-family-contrast-pilot-2026-09-13
    paths:
      - scripts/trigger-race-mustturn-parity-repair.txt

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: python3 scripts/patch-race-mustturn-parity.py
      - run: npm run test:race-stage-parity
      - name: Remove one-shot repair machinery
        run: rm .github/workflows/repair-race-mustturn-parity.yml scripts/patch-race-mustturn-parity.py scripts/trigger-race-mustturn-parity-repair.txt
      - run: npm run check:documentation-links
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix: account for late must-turn tier in race parity'
          git push origin HEAD:chatgpt/must-turn-family-contrast-pilot-2026-09-13
