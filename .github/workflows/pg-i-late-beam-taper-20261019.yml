# Disposable source-authentic PG-I taper-to-512 development falsifier.
name: PG-I phase-delayed beam taper 250k
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pg-i-late-beam-taper-20261019.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pg-i-late-beam-taper-20261019
  cancel-in-progress: false
jobs:
  canary:
    name: Three 10M-positive development methods, width5000 versus phase8/16 late512
    runs-on: ubuntu-latest
    timeout-minutes: 26
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Bundled source and witness-only fixture
        run: node scripts/run-bundled.mjs scripts/stress/pg-i-late-beam-taper-250k.mjs -- --self-test
      - name: Strict-source 3 methods x 3 plans, no historical hint in solver
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/pg-i-late-taper
          timeout -k 20s --preserve-status 19m \
            node scripts/run-bundled.mjs scripts/stress/pg-i-late-beam-taper-250k.mjs -- \
            --out=logs/pg-i-late-taper/result.json
      - name: Always preserve source result, including no-solve or failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-i-late-beam-taper-20261019
          path: logs/pg-i-late-taper/result.json
          retention-days: 90
          if-no-files-found: warn
      - name: Enforce source identity, budget and referee, never require a new solve
        if: always()
        env:
          RESEARCH_OUTCOME: OUTCOME
        shell: bash
        run: |
          set -euo pipefail
          test "$RESEARCH_OUTCOME" = success
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const v=JSON.parse(readFileSync('logs/pg-i-late-taper/result.json','utf8'));
          if(v.executionSha!==process.env.GITHUB_SHA ||v.summary.methodCells!==3
            ||v.summary.validCells!==9 ||v.summary.errors!==0
            ||v.summary.worstWork>250000)throw Error('PG-I late taper protocol violation');
          console.log('PG-I SOURCE VERDICT '+JSON.stringify(v.summary));
          NODE
