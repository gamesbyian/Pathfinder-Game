name: Codex high-int standard-IH broader A/B

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx vitest run modules/solver/attempts.test.ts scripts/technique-census-cell-node-test.mjs
      - run: npm run check:types
      - run: npm run check:workflow-actions
      - run: npm run check:solver-sweep-results
      - name: Smoke equal-work plan shape
        run: |
          node scripts/run-bundled.mjs scripts/build-technique-census-plan.mjs -- \
            --t1-sample-size=1 --t3t4-sample-size=0 \
            --equal-work-sample-size=2 --equal-work-budget=1000000 --equal-work-seed=20260828 \
            --out=tmp/ew-plan.json
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('tmp/ew-plan.json','utf8'));
          const ew = p.cells.filter(c => c.tier === 'EW1');
          if (!ew.length) throw new Error('EW1 smoke produced zero cells');
          if (!ew.every(c => c.workBudget === 1000000)) throw new Error('EW1 workBudget mismatch');
          if (p.equalWorkPilot?.seed !== 20260828) throw new Error('EW1 seed metadata mismatch');
          console.log('EW1 smoke cells=' + ew.length + ' levels=' + new Set(ew.map(c => c.corpus + '/' + c.levelPos)).size);
          NODE

  plan:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sample_sha: ${{ steps.make.outputs.sample_sha }}
      sample_count: ${{ steps.make.outputs.sample_count }}
      eligible_count: ${{ steps.make.outputs.eligible_count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Materialize feature-defined sample
        id: make
        shell: bash
        run: |
          mkdir -p tmp
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { installBrowserStubs } from './scripts/test-lib/browser-stubs.mjs';
          installBrowserStubs();
          const { createSolver, SOLVER_TESTING_API } = await import('./modules/solver.js');
          const { getAttemptConfigs, attemptConfigKey, defaultConfig } = SOLVER_TESTING_API;
          const Solver = createSolver();
          const rawDoc = JSON.parse(fs.readFileSync('data/stress/stress-levels-random.json','utf8'));
          const rows = Array.isArray(rawDoc) ? rawDoc : rawDoc.levels;
          const selectedReplayIds = new Set(['R01124','R02500','R02718','R02440']);
          const flag = 'STRATEGY_HIGHINT_STANDARD_INTERSECTION_HARVEST_BEAM_EXPOSURE';
          const eligible = [];
          for (let i = 0; i < rows.length; i++) {
            const raw = rows[i];
            if (selectedReplayIds.has(raw.id)) continue;
            const { id: _id, stressMeta: _sm, ...mechanics } = raw;
            const level = Solver.prepareLevelForSolver(mechanics, { source: 'raw' });
            const off = new Set(getAttemptConfigs(level, null).map(attemptConfigKey));
            const on = new Set(getAttemptConfigs(level, { ...defaultConfig(), [flag]: true }).map(attemptConfigKey));
            if (!off.has('beam:intersectionHarvest@beam2000') && on.has('beam:intersectionHarvest@beam2000'))
              eligible.push({ pos: i + 1, id: raw.id });
          }
          function mulberry32(a) {
            return function() {
              let t = a += 0x6D2B79F5;
              t = Math.imul(t ^ t >>> 15, t | 1);
              t ^= t + Math.imul(t ^ t >>> 7, t | 61);
              return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
          }
          const rng = mulberry32(20260828);
          const shuffled = [...eligible];
          for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(rng() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
          }
          const sample = shuffled.slice(0, Math.min(120, shuffled.length)).sort((a,b) => a.pos-b.pos);
          const sha = crypto.createHash('sha256').update(sample.map(x => x.pos).join('\n')).digest('hex');
          fs.writeFileSync('tmp/highint-standard-ih-sample.json', JSON.stringify({
            evidenceRole: 'development',
            selection: 'deterministic random sample of Corpus2 levels where enabling the candidate adds beam:intersectionHarvest@beam2000; four selected-replay IDs excluded',
            seed: 20260828,
            eligibleCount: eligible.length,
            sampleCount: sample.length,
            sampleSha256: sha,
            sample,
          }, null, 2));
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'sample_sha=' + sha + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'sample_count=' + sample.length + '\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'eligible_count=' + eligible.length + '\n');
          console.log('eligible=' + eligible.length + ' sample=' + sample.length + ' sha=' + sha);
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: highint-standard-ih-sample
          path: tmp/highint-standard-ih-sample.json
          if-no-files-found: error
          retention-days: 30

  ab:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        arm: [control, treatment]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: highint-standard-ih-sample
          path: tmp
      - name: Resolve shard positions
        id: shard
        shell: bash
        run: |
          positions=$(node - <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync('tmp/highint-standard-ih-sample.json','utf8'));
          const shard = Number(process.env.SHARD), shards = 8;
          const a = Math.floor(shard * d.sample.length / shards);
          const b = Math.floor((shard + 1) * d.sample.length / shards);
          process.stdout.write(d.sample.slice(a,b).map(x => x.pos).join(','));
          NODE
          )
          echo "positions=$positions" >> "$GITHUB_OUTPUT"
          echo "positions=$positions"
        env:
          SHARD: ${{ matrix.shard }}
      - name: Run paired arm shard under strict work
        shell: bash
        run: |
          extra=()
          if [ "${{ matrix.arm }}" = "treatment" ]; then
            extra+=("--enable-flags=STRATEGY_HIGHINT_STANDARD_INTERSECTION_HARVEST_BEAM_EXPOSURE")
          fi
          timeout -k 30s --preserve-status 110m node scripts/run-bundled.mjs scripts/level-blind-capability-sweep.mjs -- \
            --corpus=data/stress/stress-levels-random.json \
            --levels="pos:${{ steps.shard.outputs.positions }}" \
            --budget-ms=86400000 \
            --node-budget=50000000 \
            --work-budget=67000000 \
            --strict-total-work-budget \
            --attempt-budget-telemetry \
            --workers=4 \
            "${extra[@]}" \
            --out="tmp/highint-standard-ih-${{ matrix.arm }}-${{ matrix.shard }}.json" \
            --summary-out="tmp/highint-standard-ih-${{ matrix.arm }}-${{ matrix.shard }}-summary.md"
      - uses: actions/upload-artifact@v7
        with:
          name: highint-standard-ih-${{ matrix.arm }}-${{ matrix.shard }}
          path: tmp/highint-standard-ih-${{ matrix.arm }}-${{ matrix.shard }}*
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: [plan, ab]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: highint-standard-ih-*
          path: tmp/download
          merge-multiple: true
      - name: Compare paired sample
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const files = fs.readdirSync('tmp/download').filter(f => /^highint-standard-ih-(control|treatment)-\d+\.json$/.test(f));
          const rows = { control: [], treatment: [] };
          for (const f of files) {
            const arm = f.includes('-control-') ? 'control' : 'treatment';
            const d = JSON.parse(fs.readFileSync(path.join('tmp/download', f),'utf8'));
            rows[arm].push(...d.levels);
          }
          for (const arm of ['control','treatment']) rows[arm].sort((a,b) => a.id.localeCompare(b.id));
          if (rows.control.length !== rows.treatment.length) throw new Error('arm row count mismatch');
          const c = new Map(rows.control.map(r => [r.id,r]));
          const t = new Map(rows.treatment.map(r => [r.id,r]));
          const ids = [...c.keys()].sort();
          if (ids.some(id => !t.has(id))) throw new Error('arm ID mismatch');
          const gained = ids.filter(id => !c.get(id).ok && t.get(id).ok);
          const lost = ids.filter(id => c.get(id).ok && !t.get(id).ok);
          const sum = (arr,k) => arr.reduce((s,r) => s + Number(r[k] ?? 0),0);
          const result = {
            evidenceRole: 'development matched-work A/B',
            sampleCount: ids.length,
            controlSolved: ids.filter(id => c.get(id).ok).length,
            treatmentSolved: ids.filter(id => t.get(id).ok).length,
            gained,
            lost,
            controlWork: sum(rows.control,'workSpent'),
            treatmentWork: sum(rows.treatment,'workSpent'),
            workDelta: sum(rows.treatment,'workSpent') - sum(rows.control,'workSpent'),
            changed: [...new Set([...gained,...lost])].sort().map(id => ({
              id,
              control: { ok:c.get(id).ok,status:c.get(id).status,workSpent:c.get(id).workSpent,nodesExpanded:c.get(id).nodesExpanded,winningConfig:c.get(id).winningConfig,winningActionKey:c.get(id).winningActionKey },
              treatment: { ok:t.get(id).ok,status:t.get(id).status,workSpent:t.get(id).workSpent,nodesExpanded:t.get(id).nodesExpanded,winningConfig:t.get(id).winningConfig,winningActionKey:t.get(id).winningActionKey },
            })),
          };
          fs.writeFileSync('tmp/highint-standard-ih-development-result.json', JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: highint-standard-ih-development-result
          path: tmp/highint-standard-ih-development-result.json
          if-no-files-found: error
          retention-days: 30
