name: Temporary solver audit quote repair

on:
  push:
    branches:
      - chatgpt/solver-audit-campaign-2026-09-10

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/solver-audit-campaign-2026-09-10
          fetch-depth: 1
      - name: Fix assertion quoting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('modules/solver/orchestration.test.ts')
          text = path.read_text()
          old = """'retry must not rerun when its forced treatment is already the caller's effective setting'"""
          new = '"retry must not rerun when its forced treatment is already the caller\'s effective setting"'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected two retry assertion quote targets, found {count}')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/tmp-solver-audit-quote-repair.yml').unlink()
          PY
      - name: Commit quote repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/solver/orchestration.test.ts .github/workflows/tmp-solver-audit-quote-repair.yml
          git diff --cached --check
          git commit -m "test(solver): fix retry assertion quoting"
          git push origin HEAD:chatgpt/solver-audit-campaign-2026-09-10
