name: Solver random baseline part 3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solve-randoms-part-3:
    name: Random stress levels 684-1012
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare solver log files
        shell: bash
        run: |
          mkdir -p logs/solver-randoms-baseline
          cat > logs/solver-randoms-baseline/batch-004.json <<'JSON'
          {
           "timestamp": null,
           "corpus": "data/stress/stress-levels-random.json",
           "levelFilter": "684-1012",
           "partial": true,
           "status": "not-started",
           "solved": 0,
           "failed": 0,
           "errors": 0,
           "completed": 0,
           "total": 329,
           "levels": []
          }
          JSON
          cat > logs/solver-randoms-baseline/batch-004.console.log <<'LOG'
          Prepared solver random baseline batch 004 for levels 684-1012; benchmark has not started yet.
          LOG

      - name: Determine missing random stress levels 684-1012
        id: missing
        shell: bash
        run: |
          set +e
          node scripts/stress/missing-levels.mjs \
            --corpus=data/stress/stress-levels-random.json \
            --levels=684-1012 \
            --log-dir=logs/solver-randoms-baseline \
            2>&1 | tee -a logs/solver-randoms-baseline/batch-004.console.log
          status=${PIPESTATUS[0]}
          echo "missing_status=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" -ne 0 ]; then
            echo "count=0" >> "$GITHUB_OUTPUT"
            echo "Missing-level detection failed with exit code ${status}; benchmark will not start." | tee -a logs/solver-randoms-baseline/batch-004.console.log
          fi
          exit 0

      - name: Run solver on missing random stress levels 684-1012
        id: benchmark
        if: steps.missing.outputs.missing_status == '0' && steps.missing.outputs.count != '0'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          timeout -k 30s --preserve-status 330m npm run stress:benchmark -- \
            --corpus=data/stress/stress-levels-random.json \
            --levels=${{ steps.missing.outputs.levels }} \
            --out=logs/solver-randoms-baseline/batch-004.json \
            --parallel=6 \
            --skip-existing-dir=logs/solver-randoms-baseline \
            2>&1 | tee -a logs/solver-randoms-baseline/batch-004.console.log
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Record skipped benchmark
        if: steps.missing.outputs.missing_status == '0' && steps.missing.outputs.count == '0'
        run: echo "All target levels already have results; no solver run needed." | tee -a logs/solver-randoms-baseline/batch-004.console.log

      - name: Upload solver logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solver-randoms-baseline-batch-004
          path: |
            logs/solver-randoms-baseline/batch-004.json
            logs/solver-randoms-baseline/batch-004.console.log
          if-no-files-found: error
          retention-days: 30

      - name: Fail if benchmark failed
        if: always() && (steps.missing.outputs.missing_status != '0' || (steps.missing.outputs.count != '0' && steps.benchmark.outputs.exit_code != '0'))
        run: |
          echo "missing_status=${{ steps.missing.outputs.missing_status }}"
          echo "missing_count=${{ steps.missing.outputs.count }}"
          echo "benchmark_exit_code=${{ steps.benchmark.outputs.exit_code }}"
          exit 1
