# One-shot documented trigger for the maintained canonical centralized hint harvester.
# Do not write Hint files from this workflow. The existing harvester serializes persistence.
name: BC1-VX 64 canonical evidence backfill trigger
on:
  push:
    branches:
      - chatgpt/backfill-bc1vx-hints-20261017
    paths:
      - .github/workflows/bc1vx-canonical-hint-backfill-trigger-20261017.yml

permissions:
  contents: read
  actions: write

jobs:
  request-central-harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch maintained serialized source-run harvester
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run harvest-solver-evidence.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f source_run_id=38976765549 \
            -f source_workflow="BC1-VX fresh cold-solve screen" \
            -f source_sha=49504b1773cf59498259031143a795adf7f2486e
          echo "Dispatched canonical hint harvester for BC1-VX cold solve source run 38976765549"
