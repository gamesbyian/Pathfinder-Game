name: Temporary corpus evidence audit

on:
  push:
    branches:
      - chatgpt/stress-corpus-resource-audit-2026-09-13

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx tsx scripts/stress/corpus-evidence-audit.mjs
