# Disposable research execution, remove before production evidence integration.
# Validate at a head that also records this workflow in .github/workflows/README.md.
name: BC1-VX 2Y DFS admissible opportunity canary
on:
  push:
    branches:
      - chatgpt/bc1vx-shared-dfs-admissible-opportunity-20261017
    paths:
      - .github/workflows/bc1vx-shared-stage-transfer-canary-20261017.yml
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Verify ordinary code and type gates
        run: npm run ci:fast && npm run build
      - name: Paired zero-policy-change 2Y method canary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/bc1vx-2y
          for method in dfs admissible; do
            if [ "$method" = dfs ]; then
              key='dfs|score=objectiveFirst|bias=none'
            else
              key='admissible-order|tieBreak=default|lds=off'
            fi
            for arm in control shadow; do
              observe_flag=()
              if [ "$arm" = shadow ]; then observe_flag+=(--bc1-shared-transfer-observe); fi
              node scripts/run-bundled.mjs scripts/method-probe.mjs -- \
                --corpus=data/stress/stress-levels-random.json \
                --levels=R00242,R02941,R03030,R02405,R01229,R02307,R02561,R02240 \
                --only="$key" --work-budget=250000 --budget-ms=600000 \
                "${observe_flag[@]}" --out="tmp/bc1vx-2y/${method}-${arm}.json"
            done
          done
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const corpusHash=createHash('sha256').update(readFileSync('data/stress/stress-levels-random.json')).digest('hex');
          if(corpusHash!=='d15ed3b626b98c3bb8898f4a49079cc8a920f9e237412966b7eeedd0a27c7ffb')throw Error('Changed corpus');
          const expected=['R00242','R02941','R03030','R02405','R01229','R02307','R02561','R02240'];
          const byMethod={};
          for(const method of ['dfs','admissible']){
            const load=arm=>JSON.parse(readFileSync('tmp/bc1vx-2y/'+method+'-'+arm+'.json','utf8')).levels;
            const control=load('control').sort((a,b)=>expected.indexOf(a.id)-expected.indexOf(b.id));
            const shadow=load('shadow').sort((a,b)=>expected.indexOf(a.id)-expected.indexOf(b.id));
            if(control.length!==8||shadow.length!==8)throw Error('Wrong selected cohort size');
            let stats={method,parents:8,comparedRows:0,pairedParity:true,reachedAfterConnectivity:0,supported:0,strandedPositive:0,volumeRejects:0,bc1Conflicts:0,maxStrandedFresh:0,portalSkipped:0,rows:[]};
            for(let i=0;i<8;i++){
              const c=control[i],s=shadow[i];
              if(c.id!==expected[i]||s.id!==expected[i])throw Error('Level selection drift');
              if(c.error||s.error||c.deadlineTruncated||s.deadlineTruncated)throw Error('Error/deadline truncation '+c.id);
              for(const key of ['ok','status','winningConfigKey','winningGate','workSpent','nodesExpanded','solution']){
                if(JSON.stringify(c[key])!==JSON.stringify(s[key]))throw Error('Passive observer perturbed '+method+' '+c.id+' '+key);
              }
              if(!s.bc1SharedTransfer)throw Error('Missing shadow '+method+' '+c.id);
              for(const key of ['reachedAfterConnectivity','supported','strandedPositive','volumeRejects','bc1Conflicts','portalSkipped'])stats[key]+=s.bc1SharedTransfer[key];
              stats.maxStrandedFresh=Math.max(stats.maxStrandedFresh,s.bc1SharedTransfer.maxStrandedFresh);
              stats.rows.push({id:c.id,status:c.status,workSpent:c.workSpent,nodesExpanded:c.nodesExpanded,...s.bc1SharedTransfer});
              stats.comparedRows++;
            }
            byMethod[method]=stats;
          }
          const verdict={schema:'pathfinder.bc1vx-2y-availability/v1',sourceCommit:process.env.GITHUB_SHA,corpusHash,role:'selected-development-canary-not-population-confirmation',workBudgetPerLevel:250000,methods:byMethod};
          writeFileSync('tmp/bc1vx-2y/verdict.json',JSON.stringify(verdict,null,2)+'\n');
          console.log('2Y WORK/RESULT PARITY VERIFIED '+JSON.stringify(Object.fromEntries(Object.entries(byMethod).map(([k,v])=>[k,{comparedRows:v.comparedRows,reached:v.reachedAfterConnectivity,strandedPositive:v.strandedPositive,volumeRejects:v.volumeRejects,bc1Conflicts:v.bc1Conflicts}]))));
          NODE
          cat tmp/bc1vx-2y/verdict.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bc1vx-shared-stage-opportunity-canary-001
          path: tmp/bc1vx-2y/
          if-no-files-found: warn
          retention-days: 90
