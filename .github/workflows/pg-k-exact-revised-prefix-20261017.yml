# One-shot independent-parent reference of only the frozen, move-legal PG-K revisions.
# Never promote this exact oracle to production. Delete after evidence integration.
name: PG-K 12-parent exact revised-prefix reference
on:
  push:
    branches:
      - chatgpt/pg-k-dead-prefix-segment-revision-20261017
    paths:
      - reports/stress/pg-k-dead-prefix-exact-tranche-20261017-001.json
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: npm ci
      - run: pip install ortools
      - name: Execute only the twelve frozen revision-prefix questions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-bundled.mjs scripts/stress/cpsat-explicit-prefix-reference.mjs -- \
            --cases=reports/stress/pg-k-dead-prefix-exact-tranche-20261017-001.json \
            --format=cases --corpus=data/stress/stress-levels-random.json \
            --time-limit=20 --max-cases=12 \
            --out=tmp/pg-k-exact-reference-20261017.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('tmp/pg-k-exact-reference-20261017.json','utf8'));
          if(r.summary.cases!==12 || r.rows.length!==12)throw Error('exact tranche incomplete');
          if(new Set(r.rows.map(x=>x.levelId)).size!==12)throw Error('parents not independent');
          if(r.summary.correctnessAlarms!==0 || r.summary.inputAlarms!==0)throw Error('reference correctness/input alarm');
          console.log('PG-K EXACT-REFERENCE VERDICT '+JSON.stringify(r.summary));
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pg-k-12-parent-exact-revised-prefix-20261017
          path: tmp/pg-k-exact-reference-20261017.json
          if-no-files-found: warn
          retention-days: 90
