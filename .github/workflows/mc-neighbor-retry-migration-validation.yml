name: MC neighbor retry migration validation

on:
  pull_request:
    paths:
      - 'modules/solver/orchestration.ts'
      - 'modules/solver/orchestration.test.ts'
      - 'scripts/check-solver-budget-boundaries.mjs'
      - '.github/workflows/mc-neighbor-retry-migration-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Focused ownership tests
        run: SOLVER_DEEP_TESTS=0 npx vitest run modules/solver/orchestration.test.ts -t "must-cross-neighbor-prune-disabled-retry"
      - name: Budget boundary ratchet
        run: npm run check:solver-budget-boundaries
      - name: Published-corpus regression
        run: npm run solver:regression -- --check
