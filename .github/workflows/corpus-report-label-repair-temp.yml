name: Temporary corrected-report label repair

on:
  push:
    branches:
      - chatgpt/stress-corpus-fresh-reconstruction-audit-2026-09-13

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message != 'Repair corrected report status labels'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chatgpt/stress-corpus-fresh-reconstruction-audit-2026-09-13
          fetch-depth: 2
      - name: Restore canonical investigation labels
        shell: python
        run: |
          from pathlib import Path
          p = Path('reports/2026-09-03-portfolio-18-tranche-v2-cross-generator-001-preflight.md')
          s = p.read_text()
          s = s.replace('> **Decision (2026-09-13 corrected interpretation):**', '> **Decision:**', 1)
          s = s.replace('> **Evidence role (corrected 2026-09-13):**', '> **Evidence role:**', 1)
          p.write_text(s)
      - name: Commit repair
        run: |
          git config user.name gamesbyian
          git config user.email ianmakesjokes@gmail.com
          git add reports/2026-09-03-portfolio-18-tranche-v2-cross-generator-001-preflight.md
          git diff --cached --check
          git commit -m "Repair corrected report status labels"
          git push origin HEAD:chatgpt/stress-corpus-fresh-reconstruction-audit-2026-09-13
