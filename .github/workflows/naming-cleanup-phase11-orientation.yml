name: Phase 11 orientation browser gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orientation-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Phase 11 orientation characterization
        run: npm run test:e2e:phase11a
