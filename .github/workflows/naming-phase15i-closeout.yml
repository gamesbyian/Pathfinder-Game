name: Phase 15I Closeout

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: phase15i-closeout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  hostile-closeout:
    if: github.head_ref == 'chatgpt/phase15i-hostile-closeout-2026-08-31'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1000
          sparse-checkout: |
            /*
            !/logs/*
            /logs/solver-baseline.json
            !/reports/*
            /reports/stress/winning-prefix-atlas-pilot-2026-08-11.json
            !/data/*
            /data/levels.json
            /data/stress/stress-levels-random.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Execute post-naming solver research resumption gate
        run: npm run test:solver-research-resumption
      - name: Execute independent Phase 15I hostile closeout
        run: npm run check:naming-cleanup-phase15i-closeout
      - name: Re-run production solved-set regression on post-Phase-15 lineage
        run: npm run solver:regression -- --check
