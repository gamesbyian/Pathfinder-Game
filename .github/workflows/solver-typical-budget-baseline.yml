# Produces a FRESH typical-budget baseline over BOTH stress corpora and diffs it against the
# baseline currently on main, so a batch of solver changes can be judged corpus-wide in one run.
#
# How this differs from the two workflows next to it:
#   solver-stress-refresh.yml          20 shards, ms-budgeted, refreshes the official baselines.
#                                      Still the routine refresh; this file does not replace it.
#   solver-highbudget-unsolved-sweep   unsolved-only, huge budgets, deliberately does NOT touch the
#                                      baselines. Answers "can we crack these at any price".
#   THIS FILE                          full corpus, TYPICAL budget, 240 shards, and — the point —
#                                      pinned in WORK units so the result is reproducible on any
#                                      host under any load, plus an explicit before/after diff.
#
# WHY WORK UNITS. The solver allocates in work (modules/solver/work-meter.ts); `timeBudgetMs` only
# derives a work budget when none is passed (timeBudgetMs * 3350). Before that migration, 84.2% of
# repeat runs failed to reproduce their own nodesExpanded, so two corpus runs' costs were not
# comparable and a "regression" could be pure host noise. Both bounds this workflow passes -- the
# work budget and the node ceiling below -- are counts rather than clock readings, so the run is a
# function of (level, budgets) alone on any host under any load. What was removed for determinism is
# the WALL CLOCK deciding anything, not the ceiling itself. See docs/solver-budget-determinism.md.
#
# The work-budget defaults are the work equivalents of solver-stress-refresh.yml's ms budgets
# (8000ms -> 26.8M, 20000ms -> 67M at 3350 work/ms). Note that equivalence sizes an ATTEMPT, not a
# level -- see the node-budget note below for why that is not the same thing, and why sizing this
# run from the work budget alone put it on track for 100+ hours of runner time.
#
# --node-budget IS THE CEILING, AND IT IS NOT OPTIONAL. Measured the hard way on this workflow's
# first dispatch: `workBudget` bounds each PASS, not the level. The extra-budget passes (repair
# fallback, attraction-diversity, admissible-order) each get their own allocation on top, so
# corpus-2's R00001 spent 752,011,453 work against a 26,800,000 budget — 28x — and ran for 593
# SECONDS. `nodeBudget`, by contrast, is cumulative across every attempt (orchestration.ts checks it
# against the running total), which is what actually caps a level. The first dispatch passed only a
# work budget and was cancelled: 240 shards were tracking toward 100+ hours of runner time for a
# corpus the previous refresh solves in a fraction of that. Keep both — the work budget shapes
# allocation between attempts, the node budget stops the level — and note the node budget is just as
# host-independent as the work budget, so determinism is not what was traded away here.
#
# THE ms DEADLINE DOES NOT BOUND PER-LEVEL WALL TIME. Also measured: R00001 ran 593s against a
# 90,000ms `--budget-ms` and still came back deadlineTruncated: false, because timeBudgetMs sizes
# attempt tiers rather than capping the level. Do not size a shard's runtime from it. The `timeout`
# wrapper on each sweep step is the only real wall-clock bound in this workflow. The truncation check
# in the combine job stays because a truncated level IS indeterminate rather than unsolved when it
# does happen — it is just not the cost control it was originally written as.
name: Solver typical-budget baseline (corpus-1 + corpus-2, 240 shards)

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'Number of parallel shards (GitHub caps a matrix at 256 jobs; 240 leaves headroom)'
        required: false
        default: '240'
      max_parallel:
        description: 'Shards running concurrently. Lower than `shards` on purpose: a short shard frees its lane immediately instead of idling, which is the whole reason for slicing this finely.'
        required: false
        default: '20'
      corpus2_work_budget:
        description: 'Corpus-2: per-level WORK budget (26800000 = the work equivalent of the 8000ms refresh budget)'
        required: false
        default: '26800000'
      corpus2_node_budget:
        description: 'Corpus-2: CUMULATIVE node ceiling across every attempt — this is what actually caps a level (see the header). 20000000 matches solver-stress-refresh.yml, so cost stays comparable to the runs this is diffed against.'
        required: false
        default: '20000000'
      corpus2_deadline_ms:
        description: 'Corpus-2: sizes attempt TIERS; does NOT cap per-level wall time (measured — see the header). 8000 matches the previous typical-budget run: tier sizing changes which solutions are found, so this is not a free knob.'
        required: false
        default: '8000'
      corpus1_work_budget:
        description: 'Corpus-1: per-level WORK budget (67000000 = the work equivalent of the 20000ms refresh budget)'
        required: false
        default: '67000000'
      corpus1_node_budget:
        description: 'Corpus-1: CUMULATIVE node ceiling. solver-stress-refresh.yml passes none here (corpus-1 was bounded by wall clock alone, which is exactly the non-reproducibility this workflow exists to remove), so 50000000 is the analog of its 20000ms budget at corpus-2''s 8000ms/20M ratio.'
        required: false
        default: '50000000'
      corpus1_deadline_ms:
        description: 'Corpus-1: sizes attempt TIERS; does NOT cap per-level wall time. 20000 matches the previous typical-budget run.'
        required: false
        default: '20000'
      workers:
        description: 'Cross-level worker processes per shard (GH-hosted ubuntu-latest runners have 4 vCPUs). Deliberately NOT composed with --race-pool-size: the race path drops workBudget, which would silently un-pin the budget this whole workflow depends on.'
        required: false
        default: '2'
      enable_flags:
        description: 'Comma-separated ablation flags to turn ON, applied to BOTH corpora (blank = baseline). Run twice, blank vs flag, to A/B corpus-wide.'
        required: false
        default: ''
      combine_from_run_id:
        description: 'RECOVERY MODE. Set to a previous run id to skip solving entirely and re-combine THAT run''s shard artifacts. A combine-step bug should never cost a full re-solve — run #2 lost its combine to a broken-pipe bug after all 240 shards had already succeeded, and their artifacts were still sitting there intact. Blank = solve normally.'
        required: false
        default: ''
      allow_partial:
        description: 'Set to any non-empty value to let the combine proceed when some shards contributed no results. Off by default: a partial baseline is indistinguishable from a corpus-wide regression once it reaches the diff.'
        required: false
        default: ''
      commit_results:
        description: 'true = commit the new baseline + diff to main. false = build and upload everything as artifacts only, changing nothing in git (use for a dry run).'
        required: false
        default: 'true'

concurrency:
  group: solver-typical-budget-baseline
  cancel-in-progress: false

jobs:
  # Splits both corpora across the shard count and validates the partition before anything runs.
  # Corpus-1 (102 levels) is smaller than the shard count, so most shards get zero corpus-1 levels —
  # handled explicitly rather than left to produce an inverted `pos:2-1` range. See the script.
  plan:
    name: Plan ${{ inputs.shards }} shards
    if: ${{ inputs.combine_from_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build and validate the shard plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/plan-typical-budget-shards.mjs --shards="${{ inputs.shards }}" --pretty
          # The script throws on any gap/overlap/short-count in either corpus's split, so reaching
          # this line means the partition is provably complete.
          echo "matrix=$(node scripts/plan-typical-budget-shards.mjs --shards='${{ inputs.shards }}')" >> "$GITHUB_OUTPUT"

  solve-shards:
    name: Shard ${{ matrix.shard }}
    needs: plan
    if: ${{ inputs.combine_from_run_id == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel) }}
      matrix:
        # `|| '[]'` matters: in recovery mode `plan` is skipped, so this output is an empty
        # string and a bare fromJson('') is an expression error rather than an empty matrix.
        include: ${{ fromJson(needs.plan.outputs.matrix || '[]') }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Written before either sweep so a shard that dies mid-run still uploads a well-formed file.
      # Only for the corpora this shard actually carries: a placeholder for a corpus with no levels
      # would be indistinguishable from a real shard that crashed instantly.
      - name: Prepare placeholder result files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/typical-budget-baseline
          write_placeholder () {
            cat > "$1" <<JSON
          {
           "summary": { "corpus": "$2", "budgetMs": null, "status": "not-started" },
           "levels": [],
           "note": "placeholder written before the sweep ran; overwritten once the first level completes"
          }
          JSON
          }
          if [ -n "${{ matrix.c2 }}" ]; then
            write_placeholder "logs/typical-budget-baseline/batch-${{ matrix.shard }}.json" "data/stress/stress-levels-random.json"
            touch "logs/typical-budget-baseline/batch-${{ matrix.shard }}.console.log"
          fi
          if [ -n "${{ matrix.c1 }}" ]; then
            write_placeholder "logs/typical-budget-baseline/corpus1-batch-${{ matrix.shard }}.json" "data/stress/stress-levels.json"
            touch "logs/typical-budget-baseline/corpus1-batch-${{ matrix.shard }}.console.log"
          fi

      # --node-budget is the cumulative ceiling that actually stops a level; --work-budget shapes
      # allocation between attempts; --budget-ms sizes attempt tiers and bounds nothing overall.
      # --prime-winner is kept to match solver-stress-refresh.yml so the diff is apples-to-apples;
      # note it reads the recorded baseline, so this is a warm re-solve, not a cold-solve measurement.
      # --baseline-budget is deliberately NOT passed (it caused a 503->473 corpus-2 regression when
      # tried in the refresh workflow — see that file's comment).
      - name: Solve this shard's corpus-1 slice
        id: sweep-corpus1
        if: ${{ matrix.c1 != '' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ENABLE_FLAGS_ARG=""
          if [ -n "${{ inputs.enable_flags }}" ]; then ENABLE_FLAGS_ARG="--enable-flags=${{ inputs.enable_flags }}"; fi
          timeout -k 30s --preserve-status 40m node scripts/run-bundled.mjs scripts/portfolio-solve-sweep.mjs \
            --corpus=data/stress/stress-levels.json \
            --levels="pos:${{ matrix.c1start }}-${{ matrix.c1end }}" \
            --scheduler-mode=legacy \
            --work-budget="${{ inputs.corpus1_work_budget }}" \
            --node-budget="${{ inputs.corpus1_node_budget }}" \
            --budget-ms="${{ inputs.corpus1_deadline_ms }}" \
            --workers="${{ inputs.workers }}" \
            --baseline=logs/stress-corpus1-baseline.json \
            --prime-winner \
            $ENABLE_FLAGS_ARG \
            --save-hints \
            --out="logs/typical-budget-baseline/corpus1-batch-${{ matrix.shard }}.json" \
            --summary-out="logs/typical-budget-baseline/corpus1-batch-${{ matrix.shard }}-summary.md" \
            2>&1 | tee -a "logs/typical-budget-baseline/corpus1-batch-${{ matrix.shard }}.console.log"
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Solve this shard's corpus-2 slice
        id: sweep-corpus2
        if: ${{ matrix.c2 != '' }}
        continue-on-error: true
        shell: bash
        run: |
          set +e
          ENABLE_FLAGS_ARG=""
          if [ -n "${{ inputs.enable_flags }}" ]; then ENABLE_FLAGS_ARG="--enable-flags=${{ inputs.enable_flags }}"; fi
          timeout -k 30s --preserve-status 100m node scripts/run-bundled.mjs scripts/portfolio-solve-sweep.mjs \
            --corpus=data/stress/stress-levels-random.json \
            --levels="pos:${{ matrix.c2start }}-${{ matrix.c2end }}" \
            --scheduler-mode=legacy \
            --work-budget="${{ inputs.corpus2_work_budget }}" \
            --node-budget="${{ inputs.corpus2_node_budget }}" \
            --budget-ms="${{ inputs.corpus2_deadline_ms }}" \
            --workers="${{ inputs.workers }}" \
            --baseline=logs/stress-corpus2-baseline.json \
            --prime-winner \
            $ENABLE_FLAGS_ARG \
            --save-hints \
            --out="logs/typical-budget-baseline/batch-${{ matrix.shard }}.json" \
            --summary-out="logs/typical-budget-baseline/batch-${{ matrix.shard }}-summary.md" \
            2>&1 | tee -a "logs/typical-budget-baseline/batch-${{ matrix.shard }}.console.log"
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Stage this shard's results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          stage="artifact-staging/typical-shard-${{ matrix.shard }}"
          mkdir -p "${stage}/logs/typical-budget-baseline" "${stage}/data/stress/hints" "${stage}/data/stress/hints-random"
          cp logs/typical-budget-baseline/*batch-${{ matrix.shard }}*.json \
             logs/typical-budget-baseline/*batch-${{ matrix.shard }}*.md \
             logs/typical-budget-baseline/*batch-${{ matrix.shard }}*.log \
             "${stage}/logs/typical-budget-baseline/" 2>/dev/null || true
          # Shard level-ranges are disjoint per corpus, so a git-status diff against the fresh
          # checkout is a precise list of the hint files THIS shard changed.
          git status --porcelain -- data/stress/hints/ data/stress/hints-random/ | awk '{print $2}' | while read -r f; do
            mkdir -p "${stage}/$(dirname "$f")"
            cp "$f" "${stage}/${f}"
          done

      # The artifact name and the staging directory both come from matrix.shard — ONE source. The
      # neighbouring refresh workflow derived its padding twice and the two silently diverged,
      # uploading zero bytes for 9 of 20 shards while still reporting success.
      - name: Upload this shard's results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typical-shard-${{ matrix.shard }}
          path: artifact-staging/typical-shard-${{ matrix.shard }}
          if-no-files-found: warn
          retention-days: 90

      - name: Surface a sweep failure (artifacts are already uploaded)
        if: >-
          always() &&
          ((steps.sweep-corpus1.outputs.exit_code != '' && steps.sweep-corpus1.outputs.exit_code != '0' && steps.sweep-corpus1.outputs.exit_code != '124' && steps.sweep-corpus1.outputs.exit_code != '143') ||
           (steps.sweep-corpus2.outputs.exit_code != '' && steps.sweep-corpus2.outputs.exit_code != '0' && steps.sweep-corpus2.outputs.exit_code != '124' && steps.sweep-corpus2.outputs.exit_code != '143'))
        run: |
          echo "corpus1 exit=${{ steps.sweep-corpus1.outputs.exit_code }} corpus2 exit=${{ steps.sweep-corpus2.outputs.exit_code }}"
          echo "124/143 (timeout wrapper) are expected for a budget-exhausting shard, not failures."
          exit 1

  combine:
    name: Combine, diff against the current baseline, commit
    needs: [plan, solve-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read   # required to download artifacts from ANOTHER run (recovery mode)
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download every shard's artifact
        uses: actions/download-artifact@v4
        with:
          pattern: 'typical-shard-*'
          path: artifact-staging/downloaded
          merge-multiple: true
          # In recovery mode these come from the earlier run instead of this one.
          run-id: ${{ inputs.combine_from_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # download-artifact SILENTLY UNDER-DELIVERS at this artifact count. Measured: it logged
      # "Total of 240 artifact(s) downloaded" and exited 0, but only 284 of the expected 341 json
      # files landed -- 41 shards' results missing, which then read as 290 unsolved corpus-2 levels
      # in the diff. A second pass fills the gaps (files already present are simply rewritten), and
      # the assertion below makes a partial download fail loudly instead of becoming a partial
      # baseline that looks like a solver regression.
      - name: Download again to fill any gaps the first pass silently left
        uses: actions/download-artifact@v4
        with:
          pattern: 'typical-shard-*'
          path: artifact-staging/downloaded
          merge-multiple: true
          run-id: ${{ inputs.combine_from_run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Lay the shard results onto the working tree
        shell: bash
        run: |
          set -euo pipefail
          # PURGE FIRST. This job checks out main, and main may still carry a PREVIOUS run's
          # committed shard files. Laying new artifacts on top only overwrites the names the
          # current run produced, so any gap silently inherits a stale file -- run #3 died exactly
          # this way: "Mismatched budgetMs: corpus1-batch-003.json used 225000ms,
          # corpus1-batch-043.json used 20000ms", where 225000 was run #1's deadline default.
          # Starting clean means the combine can only ever see THIS run's results.
          rm -rf logs/typical-budget-baseline
          mkdir -p logs/typical-budget-baseline
          cp -a artifact-staging/downloaded/. ./
          # NEVER pipe into `head` here. This step runs under `set -o pipefail`, so when `head`
          # closes the pipe early `ls` dies with SIGPIPE (exit 2) and takes the whole combine job
          # with it. That is exactly how run #2 failed after all 240 shards had already succeeded:
          # "ls: write error: Broken pipe". Run #1 survived the identical line only because a
          # partial run had few enough files to fit the pipe buffer before `head` exited, which
          # makes this a bug that appears only at full scale. Count, do not paginate.
          echo "batch files present: $(ls logs/typical-budget-baseline/batch-*.json 2>/dev/null | wc -l) corpus-2, $(ls logs/typical-budget-baseline/corpus1-batch-*.json 2>/dev/null | wc -l) corpus-1"

      # THE combine-gets-stuck guard. The combiner hard-throws on a budgetMs mismatch, and a
      # placeholder carries budgetMs: null — so a single shard that died before its first level
      # would abort the whole combine and the run would produce nothing. Placeholders are dropped
      # here (loudly, by name) instead, so a partial run still yields a usable combined report.
      # Writes a COMMITTED audit of every drop decision, not just a log line. A baseline that
      # silently covers 83% of the corpus is worse than one that fails: run #4 dropped 41 shards
      # (the whole first wave) and the only symptom was an onlyInBaseline count in the diff, which
      # reads like a solver finding rather than missing data. The audit records, per shard, whether
      # each corpus's file arrived at all and exactly why it was rejected.
      - name: Select usable shard reports, and audit every drop
        id: select
        shell: bash
        env:
          SHARD_COUNT: ${{ inputs.shards }}
          ALLOW_PARTIAL: ${{ inputs.allow_partial }}
        run: |
          set -euo pipefail
          node --input-type=commonjs -e "$(cat <<'NODE'
          const { readFileSync, readdirSync, existsSync, writeFileSync, mkdirSync, appendFileSync } = require('node:fs');
          const dir = 'logs/typical-budget-baseline';
          const all = existsSync(dir) ? readdirSync(dir) : [];
          // Localise any loss to download vs copy: count what actually arrived in the download
          // staging area alongside what survived into the working tree. Shard 001's own job log
          // proves its artifact contains batch-001.json, yet 41 shards' files are absent after the
          // copy -- so one of these two numbers is where they vanish.
          const dl = 'artifact-staging/downloaded/logs/typical-budget-baseline';
          const downloaded = existsSync(dl) ? readdirSync(dl).filter(f => f.endsWith('.json')) : [];
          const audit = { generatedAt: new Date().toISOString(), dirEntryCount: all.length,
                          downloadedJsonCount: downloaded.length,
                          downloadedSample: downloaded.slice(0, 10), corpora: {} };
          console.error(`downloaded json in staging: ${downloaded.length}; working-tree entries: ${all.length}`);
          const out = [];
          for (const [key, prefix] of [['corpus1', 'corpus1-batch-'], ['corpus2', 'batch-']]) {
            const match = key === 'corpus1'
              ? f => f.startsWith('corpus1-batch-') && f.endsWith('.json')
              : f => f.startsWith('batch-') && f.endsWith('.json');
            const good = [], dropped = [];
            for (const f of all.filter(match).sort()) {
              const p = `${dir}/${f}`;
              let parsed = null, raw = '';
              try { raw = readFileSync(p, 'utf8'); parsed = JSON.parse(raw); }
              catch (e) { dropped.push({ file: f, reason: 'unparseable', bytes: raw.length, error: String(e).slice(0, 200) }); continue; }
              const status = parsed?.summary?.status ?? null;
              const budgetMs = parsed?.summary?.budgetMs ?? null;
              const levels = Array.isArray(parsed?.levels) ? parsed.levels.length : null;
              if (status === 'not-started') { dropped.push({ file: f, reason: 'placeholder-never-overwritten', status, budgetMs, levels }); continue; }
              if (budgetMs == null) { dropped.push({ file: f, reason: 'no-budgetMs', status, budgetMs, levels }); continue; }
              if (!levels) { dropped.push({ file: f, reason: 'zero-levels', status, budgetMs, levels }); continue; }
              good.push(p);
            }
            audit.corpora[key] = { usable: good.length, dropped: dropped.length, droppedDetail: dropped, prefix };
            console.error(`${key}: ${good.length} usable, ${dropped.length} dropped`);
            for (const d of dropped.slice(0, 60)) console.error(`   drop ${d.file}: ${d.reason} (status=${d.status} budgetMs=${d.budgetMs} levels=${d.levels})`);
            out.push(`${key}_files=${good.join(',')}`, `${key}_count=${good.length}`);
          }
          // The discriminator that matters: a shard whose file was REJECTED (placeholder, unparseable)
          // means the sweep ran and produced nothing usable; a shard with NO file at all means the
          // artifact never carried one. Those have completely different causes, and the drop list
          // alone cannot tell them apart.
          const shardCount = Number(process.env.SHARD_COUNT || 0);
          const width = String(shardCount).length;
          const seen = new Set(all.filter(f => f.endsWith('.json')).map(f => f.replace(/^corpus1-/, '').replace(/^batch-/, '').replace(/\.json$/, '')));
          const noFileAtAll = [];
          for (let i = 1; i <= shardCount; i++) {
            const id = String(i).padStart(width, '0');
            if (!seen.has(id)) noFileAtAll.push(id);
          }
          audit.shardsWithNoFileAtAll = noFileAtAll;
          audit.shardCount = shardCount;
          console.error(`shards with no batch file of any kind: ${noFileAtAll.length}` + (noFileAtAll.length ? ` -> ${noFileAtAll.slice(0, 60).join(',')}` : ''));
          mkdirSync('reports/stress', { recursive: true });
          writeFileSync(`reports/stress/typical-budget-shard-audit.json`, JSON.stringify(audit, null, 2));
          // Never produce a partial baseline silently. A missing shard is indistinguishable from a
          // corpus-wide solver regression once it reaches the diff, so it has to stop the job.
          if (noFileAtAll.length && !process.env.ALLOW_PARTIAL) {
            console.error(`FATAL: ${noFileAtAll.length} shard(s) contributed no results. This would produce a baseline covering only part of the corpus. Re-dispatch, or set allow_partial to accept it.`);
            process.exit(1);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, out.join('\n') + '\n');
          NODE
          )"

      - name: Archive the previous baseline before overwriting it
        shell: bash
        run: |
          set -euo pipefail
          # Full timestamp, not date-only: two runs in one UTC day would otherwise collide, and the
          # refresh workflow lost a whole combine to exactly that (`git mv` into an existing folder,
          # set -e, every downstream step skipped). Plain mv, not git mv, so an untracked file is
          # not a fatal error either — everything is `git add`ed at commit time regardless.
          stamp="$(date -u +%Y-%m-%dT%H%M%SZ)"
          dest="logs/typical-budget-baseline/archive/${stamp}"
          mkdir -p "${dest}"
          for f in logs/stress-corpus1-baseline.json logs/stress-corpus2-baseline.json \
                   reports/stress/benchmark-parallel.json reports/stress/benchmark-latest-random.json; do
            [ -f "$f" ] && cp "$f" "${dest}/$(basename "$f")"
          done
          echo "stamp=${stamp}" >> "$GITHUB_ENV"
          echo "Archived the pre-run baseline under ${dest}."

      - name: Combine each corpus's shard reports
        shell: bash
        run: |
          set -euo pipefail
          # Two explicit --in lists, never --in-dir: this directory holds BOTH corpora's files and
          # the combiner rejects a mixed-corpus input set.
          if [ "${{ steps.select.outputs.corpus1_count }}" -gt 0 ]; then
            npm run solver:combine-corpus2-batches -- --in="${{ steps.select.outputs.corpus1_files }}" --out=reports/stress/typical-budget-corpus1.json
          else
            echo "::warning::No usable corpus-1 shard reports — skipping its combine."
          fi
          if [ "${{ steps.select.outputs.corpus2_count }}" -gt 0 ]; then
            npm run solver:combine-corpus2-batches -- --in="${{ steps.select.outputs.corpus2_files }}" --out=reports/stress/typical-budget-corpus2.json
          else
            echo "::warning::No usable corpus-2 shard reports — skipping its combine."
          fi

      # A truncated level is indeterminate, not unsolved. If the deadline bound anywhere, this run
      # is not reproducible and its numbers must not be read as a solvability change.
      - name: Check that the wall deadline never bound
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { readFileSync, existsSync } = require('node:fs');
          let truncated = 0, total = 0;
          for (const f of ['reports/stress/typical-budget-corpus1.json', 'reports/stress/typical-budget-corpus2.json']) {
            if (!existsSync(f)) continue;
            for (const lv of JSON.parse(readFileSync(f, 'utf8')).levels ?? []) {
              total++;
              if (lv.deadlineTruncated || lv.status === 'deadline-truncated') {
                truncated++;
                if (truncated <= 20) console.log(`  truncated: ${lv.id ?? lv.level} (${f})`);
              }
            }
          }
          console.log(`${truncated}/${total} level(s) hit the wall deadline before spending their work budget.`);
          if (truncated > 0) {
            console.log('::warning::Deadline-truncated levels are INDETERMINATE, not unsolved -- this run is not fully reproducible. Re-run with a larger *_deadline_ms.');
          }
          NODE

      - name: Diff the new baseline against the one currently on main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/stress
          out="reports/stress/typical-budget-baseline-${stamp}.md"
          {
            echo "# Typical-budget baseline — ${stamp}"
            echo
            echo "Work budgets: corpus-1 ${{ inputs.corpus1_work_budget }}, corpus-2 ${{ inputs.corpus2_work_budget }} (deadlines ${{ inputs.corpus1_deadline_ms }}ms / ${{ inputs.corpus2_deadline_ms }}ms, non-binding by design)."
            echo "Shards: ${{ inputs.shards }} at max-parallel ${{ inputs.max_parallel }}. Ablation flags: \`${{ inputs.enable_flags }}\`."
            echo
          } > "$out"
          # diff-baseline exit-codes on hard regressions; that must not abort the commit, so the
          # result is captured into the report instead of gating the job.
          # Diffed against the previous TYPICAL-BUDGET reports, never logs/stress-corpus*-baseline.json.
          # Those baselines are MERGED artifacts: corpus-2's carries 605 solved against this report's
          # 434, because 155 of them were patched in from the high-budget unsolved sweep at up to 300M
          # nodes. A typical-budget run cannot reproduce those by construction, so diffing against the
          # merged baseline would report ~155 false regressions and bury any real one.
          for pair in "corpus1:reports/stress/benchmark-parallel.json:reports/stress/typical-budget-corpus1.json" \
                      "corpus2:reports/stress/benchmark-latest-random.json:reports/stress/typical-budget-corpus2.json"; do
            name="${pair%%:*}"; rest="${pair#*:}"; base="${rest%%:*}"; cand="${rest#*:}"
            if [ ! -f "$cand" ]; then echo "## ${name}: no combined report produced" >> "$out"; continue; fi
            echo "## ${name}" >> "$out"; echo '```' >> "$out"
            node scripts/stress/diff-baseline.mjs --baseline="$base" --candidate="$cand" \
              --out="reports/stress/typical-budget-diff-${name}-${stamp}.json" >> "$out" 2>&1 || true
            echo '```' >> "$out"
          done
          cat "$out"

      # DELIBERATELY DOES NOT RECOMPILE logs/stress-corpus{1,2}-baseline.json. Those are MERGED
      # artifacts: corpus-2's currently holds 605 solved against the last typical-budget run's 434,
      # because 155 were patched in from the high-budget unsolved sweep at up to 300M nodes.
      # compile-baseline stitches sources with "official wins ties", so recompiling it from a
      # typical-budget report would DISCARD every one of those high-budget solves. Merging results
      # into the official baseline stays a separate, explicit step
      # (scripts/patch-benchmark-with-sweep.mjs), exactly as solver-highbudget-unsolved-sweep.yml
      # documents for the same reason. This workflow only ever writes its OWN reports.
      - name: Report completeness of this run
        shell: bash
        run: |
          set -euo pipefail
          c1_expected=$(node -e "const f=require('./data/stress/stress-levels.json');console.log((Array.isArray(f)?f:f.levels).length)")
          c2_expected=$(node -e "const f=require('./data/stress/stress-levels-random.json');console.log((Array.isArray(f)?f:f.levels).length)")
          c1_got=$(node -e "const f=require('./reports/stress/typical-budget-corpus1.json');console.log((f.levels||[]).length)" 2>/dev/null || echo 0)
          c2_got=$(node -e "const f=require('./reports/stress/typical-budget-corpus2.json');console.log((f.levels||[]).length)" 2>/dev/null || echo 0)
          echo "corpus-1 ${c1_got}/${c1_expected}, corpus-2 ${c2_got}/${c2_expected}"
          [ "$c1_got" = "$c1_expected" ] || echo "::warning::corpus-1 incomplete (${c1_got}/${c1_expected}) — the diff covers only the levels present."
          [ "$c2_got" = "$c2_expected" ] || echo "::warning::corpus-2 incomplete (${c2_got}/${c2_expected}) — the diff covers only the levels present."

      - name: Upload everything as an artifact (always, even when not committing)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typical-budget-baseline-combined
          path: |
            reports/stress/typical-budget-*
            logs/typical-budget-baseline/
          if-no-files-found: warn
          retention-days: 90

      - name: Commit the new baseline and diff to main
        if: ${{ inputs.commit_results == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # NOT logs/stress-corpus*-baseline.json (see the completeness step above), and NOT the
          # raw per-shard logs: they are already uploaded as artifacts, and committing them is what
          # let a previous run's files contaminate a later combine. Only reports go to git.
          git add data/stress/hints/ data/stress/hints-random/ reports/stress/
          if git diff --cached --quiet; then
            echo "Nothing changed — not creating an empty commit."
            exit 0
          fi
          git commit -m "Typical-budget baseline: corpus-1 + corpus-2 (${stamp})"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed — leaving the commit local."; exit 1; }
          done
          echo "All push attempts failed."
          exit 1
