# phase1 solve-relative evidence v2
name: Solver batch digestion audit evidence

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/solver-batch-digestion-audit-evidence.yml'
      - 'scripts/solver-batch-cost-probe.mjs'
      - 'scripts/initial-presolve-opportunity-census.mjs'
      - 'scripts/solver-equivalence-opportunity-census.mjs'
      - 'scripts/family-constructive-reuse-census.mjs'
      - 'scripts/family-compile-reuse-census.mjs'
      - 'modules/solver/**'
      - 'modules/domain/**'
      - 'package.json'

permissions:
  contents: read

jobs:
  fixed-cost:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --fund=false

      - name: Measure published fixed cost
        run: |
          mkdir -p tmp/solver-batch-digestion
          npm run solver:audit-batch-cost -- \
            --corpus=published --count=160 --repeats=10 \
            --out=tmp/solver-batch-digestion/published.json

      - name: Measure Corpus 1 fixed cost
        run: |
          npm run solver:audit-batch-cost -- \
            --corpus=corpus1 --count=200 --stride=5 --repeats=10 \
            --out=tmp/solver-batch-digestion/corpus1.json

      - name: Measure Corpus 2 fixed cost
        run: |
          npm run solver:audit-batch-cost -- \
            --corpus=corpus2 --count=200 --stride=5 --repeats=10 \
            --out=tmp/solver-batch-digestion/corpus2.json

      - name: Measure published solve-relative cost
        run: |
          npm run solver:audit-batch-cost -- \
            --corpus=published --count=160 --repeats=1 --solve \
            --node-budget=250000 --budget-ms=600000 \
            --out=tmp/solver-batch-digestion/published-solve.json

      - name: Measure hard Corpus 2 solve-relative cost
        run: |
          npm run solver:audit-batch-cost -- \
            --corpus=corpus2 --count=24 --stride=70 --repeats=1 --solve \
            --node-budget=250000 --budget-ms=600000 \
            --out=tmp/solver-batch-digestion/corpus2-solve.json

      - name: Measure initial presolve opportunity
        run: |
          npm run solver:audit-initial-presolve -- \
            --corpus=data/levels.json \
            --out=tmp/solver-batch-digestion/presolve-published.json
          npm run solver:audit-initial-presolve -- \
            --corpus=data/stress/stress-levels.json \
            --out=tmp/solver-batch-digestion/presolve-corpus1.json
          npm run solver:audit-initial-presolve -- \
            --corpus=data/stress/stress-levels-random.json \
            --out=tmp/solver-batch-digestion/presolve-corpus2.json

      - name: Measure exact/symmetry equivalence opportunity
        run: |
          npm run solver:audit-equivalence -- \
            --out=tmp/solver-batch-digestion/equivalence.json

      - name: Measure family constructive reuse opportunity
        run: |
          npm run solver:audit-family-constructive-reuse -- \
            --out=tmp/solver-batch-digestion/family-constructive-reuse.json

      - name: Measure family compile reuse opportunity
        run: |
          npm run solver:audit-family-compile-reuse -- \
            --out=tmp/solver-batch-digestion/family-compile-reuse.json

      - name: Summarize evidence
        run: |
          node <<'NODE'
          const fs = require('fs');
          for (const name of ['published', 'corpus1', 'corpus2', 'published-solve', 'corpus2-solve', 'presolve-published', 'presolve-corpus1', 'presolve-corpus2', 'equivalence', 'family-constructive-reuse', 'family-compile-reuse']) {
            const doc = JSON.parse(fs.readFileSync(`tmp/solver-batch-digestion/${name}.json`, 'utf8'));
            console.log(JSON.stringify({ name, summary: doc.summary }, null, 2));
          }
          NODE

      - uses: actions/upload-artifact@v4
        with:
          name: solver-batch-digestion-fixed-cost
          path: tmp/solver-batch-digestion/*.json
          if-no-files-found: error
