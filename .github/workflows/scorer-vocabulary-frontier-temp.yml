name: TEMP class1 missed-rescuer menu audit

on:
  pull_request:
    paths:
      - '.github/workflows/scorer-vocabulary-frontier-temp.yml'

permissions:
  contents: read

jobs:
  class1-menu-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the PR merge commit
        uses: actions/checkout@v7

      - name: Audit actually missed class-1 rescuers without solver dispatch
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const atlas = JSON.parse(readFileSync('reports/stress/residual-atlas/2026-09-11-post-1029-671/atlas.json', 'utf8'));
          const rows = (atlas.rows || []).filter(row => Number(row.primaryClass) === 1);
          if (rows.length !== 26) throw new Error(`expected 26 class-1 rows, found ${rows.length}`);

          const missedByIdentity = new Map();
          const familyLevels = new Map();
          const statusCounts = { missed: 0, dispatched: 0, other: 0 };
          const levelsWithoutMissed = [];
          const routingRegimes = {};

          const median = values => {
            if (!values.length) return null;
            const s = [...values].sort((a, b) => a - b);
            const m = Math.floor(s.length / 2);
            return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
          };

          for (const row of rows) {
            routingRegimes[row.routingRegime || 'unknown'] = (routingRegimes[row.routingRegime || 'unknown'] || 0) + 1;
            const missed = (row.t1Wins || []).filter(win => win.dispatched === false);
            if (!missed.length) levelsWithoutMissed.push(row.id);
            for (const win of row.t1Wins || []) {
              if (win.dispatched === false) statusCounts.missed++;
              else if (win.dispatched === true) statusCounts.dispatched++;
              else statusCounts.other++;
            }
            for (const win of missed) {
              const identity = String(win.identity || 'unknown');
              let stat = missedByIdentity.get(identity);
              if (!stat) stat = { identity, family: win.family || identity.split('|')[0], levels: new Set(), nodes: [] };
              stat.levels.add(row.id);
              if (Number.isFinite(win.nodes)) stat.nodes.push(win.nodes);
              missedByIdentity.set(identity, stat);

              const family = stat.family || 'unknown';
              if (!familyLevels.has(family)) familyLevels.set(family, new Set());
              familyLevels.get(family).add(row.id);
            }
          }

          const identities = [...missedByIdentity.values()].map(stat => ({
            identity: stat.identity,
            family: stat.family,
            levelCount: stat.levels.size,
            levelIds: [...stat.levels].sort(),
            medianWinnerNodes: median(stat.nodes),
            minWinnerNodes: stat.nodes.length ? Math.min(...stat.nodes) : null,
            maxWinnerNodes: stat.nodes.length ? Math.max(...stat.nodes) : null,
          })).sort((a, b) => b.levelCount - a.levelCount || (a.medianWinnerNodes ?? Infinity) - (b.medianWinnerNodes ?? Infinity) || a.identity.localeCompare(b.identity));

          const remaining = new Set(rows.map(row => row.id));
          const unused = new Map([...missedByIdentity.entries()]);
          const greedyCoverage = [];
          while (remaining.size && unused.size) {
            let best = null;
            for (const stat of unused.values()) {
              const newIds = [...stat.levels].filter(id => remaining.has(id));
              if (!newIds.length) continue;
              const candidate = { identity: stat.identity, family: stat.family, newIds, n: newIds.length, median: median(stat.nodes) };
              if (!best || candidate.n > best.n || (candidate.n === best.n && (candidate.median ?? Infinity) < (best.median ?? Infinity))) best = candidate;
            }
            if (!best) break;
            for (const id of best.newIds) remaining.delete(id);
            unused.delete(best.identity);
            greedyCoverage.push({
              rank: greedyCoverage.length + 1,
              identity: best.identity,
              family: best.family,
              newlyCovered: best.newIds.sort(),
              newlyCoveredCount: best.n,
              cumulativeCovered: rows.length - remaining.size,
              cumulativeCoverageRate: (rows.length - remaining.size) / rows.length,
              medianWinnerNodes: best.median,
            });
          }

          const familyCoverage = [...familyLevels.entries()].map(([family, ids]) => ({
            family,
            levelCount: ids.size,
            levelIds: [...ids].sort(),
            coverageRate: ids.size / rows.length,
          })).sort((a, b) => b.levelCount - a.levelCount || a.family.localeCompare(b.family));

          const beamMissedIds = familyLevels.get('beam') || new Set();
          const cheapBeamIdentities = identities.filter(row => row.family === 'beam');

          const perLevel = rows.map(row => ({
            id: row.id,
            routingRegime: row.routingRegime,
            productionAttemptCount: row.productionAttemptCount,
            missedRescuers: (row.t1Wins || []).filter(win => win.dispatched === false).map(win => ({
              identity: win.identity,
              family: win.family,
              nodes: win.nodes,
              offered: win.offered,
            })),
            alreadyDispatchedWinners: (row.t1Wins || []).filter(win => win.dispatched === true).map(win => win.identity),
          })).sort((a, b) => a.id.localeCompare(b.id));

          console.log('__CLASS1_MISSED_MENU_AUDIT_BEGIN__');
          console.log(JSON.stringify({
            population: { class1Levels: rows.length, routingRegimes, levelsWithoutMissed, statusCounts },
            familyCoverage,
            beamOnlyCoverage: { levelCount: beamMissedIds.size, coverageRate: beamMissedIds.size / rows.length, levelIds: [...beamMissedIds].sort() },
            identities,
            greedyCoverage,
            uncoveredAfterAllMissedIdentities: [...remaining].sort(),
            cheapBeamIdentities,
            perLevel,
          }, null, 2));
          console.log('__CLASS1_MISSED_MENU_AUDIT_END__');
          NODE
