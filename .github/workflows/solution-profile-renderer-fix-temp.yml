name: Temporary solution-profile renderer repair

on:
  push:
    branches:
      - chatgpt/solution-profile-resource-audit-2026-09-13

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Repair renderer and add regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lib = Path('scripts/stress/solution-profile-lib.mjs')
          s = lib.read_text()
          s = s.replace("'exhaustive' (provablyExhaustive), which is a per-level fact, not an inference.",
                        "'exhaustive' (an event-local marker), without promoting that event into a whole-library completeness claim.")
          s = s.replace('`**${summary.levelsProvablyExhaustive}** levels have at least one hint whose own search ` +',
                        '`**${summary.levelsWithExhaustiveSearchEvent}** levels have at least one hint whose own search ` +')
          s = s.replace('`- Must-cross order: **${summary.levelsWithRigidMustCrossOrder}** / ` +',
                        '`- Must-cross order: **${summary.levelsWithObservedSingleMustCrossOrder}** / ` +')
          s = s.replace('function renderSummaryMd(summary, corpusTag, levelsJsonLabel) {',
                        'export function renderSummaryMd(summary, corpusTag, levelsJsonLabel) {')
          lib.write_text(s)

          tests = Path('scripts/stress/solution-profile-lib-unit-tests.mjs')
          t = tests.read_text()
          t = t.replace('profileDistanceTerms, profileDistanceWithCoverage, nearestProfiles, summarizeCorpusProfiles, PROVENANCE_SOURCES,',
                        'profileDistanceTerms, profileDistanceWithCoverage, nearestProfiles, summarizeCorpusProfiles, renderSummaryMd, PROVENANCE_SOURCES,')
          marker = "test('summarizeCorpusProfiles: no profiles produces finite zero means', () => {"
          idx = t.find(marker)
          assert idx >= 0, 'summary-test insertion marker missing'
          insert = """test('renderSummaryMd uses current event/order summary fields', () => {
    const md = renderSummaryMd({
        levelsTotal: 2,
        levelsWithHints: 2,
        levelsInsufficientData: 0,
        levelsWithExhaustiveSearchEvent: 1,
        meanHintCount: 3,
        meanPathwiseDistinctiveness: 0.25,
        meanTurnRate: 0.4,
        meanCwFraction: 0.5,
        levelsWithObservedSingleMustCrossOrder: 1,
        levelsWithMustCrossOrder: 2,
        meanDiscoverySaturationPlateauFraction: null,
        sourceCoverage: Object.fromEntries(PROVENANCE_SOURCES.map(source => [source, 0])),
    }, 'test', 'data/test.json');
    assert.match(md, /\\*\\*1\\*\\* levels have at least one hint/);
    assert.match(md, /Must-cross order: \\*\\*1\\*\\* \\/ \\*\\*2\\*\\*/);
    assert.doesNotMatch(md, /undefined/);
});

"""
          t = t[:idx] + insert + t[idx:]
          tests.write_text(t)
          PY
      - name: Targeted tests and lint
        run: |
          npx vitest run scripts/stress/solution-profile-lib-unit-tests.mjs scripts/stress/provenance-source-taxonomy-unit-tests.mjs
          npx eslint scripts/stress/solution-profile-lib.mjs scripts/stress/solution-profile-compare.mjs scripts/stress/solution-profile-resource-audit.mjs scripts/stress/solution-profile-lib-unit-tests.mjs
      - name: Remove temporary workflows and commit
        shell: bash
        run: |
          rm -f .github/workflows/solution-profile-hardening-temp.yml
          rm -f .github/workflows/solution-profile-renderer-fix-temp.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A scripts/stress/solution-profile-lib.mjs scripts/stress/solution-profile-lib-unit-tests.mjs .github/workflows/solution-profile-hardening-temp.yml .github/workflows/solution-profile-renderer-fix-temp.yml
          git commit -m 'research: repair profile summary renderer coverage'
          git push origin HEAD:chatgpt/solution-profile-resource-audit-2026-09-13
