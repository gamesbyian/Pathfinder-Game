# Disposable outcome-blind counted-residual PG-H opportunity capture; no CP-SAT.
name: PG-H counted-midpoint opportunity capture
on:
  push:
    branches:
      - chatgpt/pg-h-mid-counted-prefix-opportunity-20261017
    paths:
      - .github/workflows/pg-h-mid-counted-capture-20261017.yml
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Self-test portal-correct counted-middle selection before sample capture
        run: node scripts/stress/semantic-forcedness-lib-node-test.mjs
      - name: Capture at 25–75 percent true counted-length residual
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/pg-h-mid
          node scripts/run-bundled.mjs scripts/stress/semantic-forcedness-capture.mjs -- \
            --corpus=data/stress/stress-levels-random.json \
            --levels=R00242,R02941,R03030,R02405,R01229,R02307,R02561,R02240 \
            --profile=objectiveFirst --width=500 \
            --work-budget=500000 --budget-ms=600000 \
            --min-children=2 --max-children=4 --max-states-per-gate=2 \
            --selection=middle-counted \
            --out=tmp/pg-h-mid/capture.json \
            --cases-out=tmp/pg-h-mid/cases.json
      - name: Freeze and describe opportunity without querying oracle
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const corpusHash=createHash('sha256').update(readFileSync('data/stress/stress-levels-random.json')).digest('hex');
          if(corpusHash!=='d15ed3b626b98c3bb8898f4a49079cc8a920f9e237412966b7eeedd0a27c7ffb')throw Error('Historical parent corpus revision mismatch');
          const c=JSON.parse(readFileSync('tmp/pg-h-mid/capture.json','utf8'));
          const q=JSON.parse(readFileSync('tmp/pg-h-mid/cases.json','utf8'));
          const selected=c.parents.flatMap(p=>p.gates.flatMap(g=>g.selected.map(x=>({
            id:x.stateId,levelId:p.levelId,depth:x.depth,countedDepth:x.countedDepth,
            portalJumps:x.portalJumps,remaining:x.remainingCountedSteps,
            fraction:x.remainingCountedFraction,children:x.children.length,
            parentExpansionWork:x.parentExpansionWork,eligiblePerGate:g.eligibleStateCount,
            gateWorkSpent:g.workSpent
          }))));
          if(c.protocol.selectionMode!=='middle-counted'||c.summary.parents!==8)throw Error('Selection or parent mismatch');
          if(selected.length>16||q.cases.length>64||q.cases.length!==c.summary.childCases)throw Error('Selected count inconsistent');
          if(selected.some(s=>s.fraction<0.25||s.fraction>0.75||s.countedDepth+s.portalJumps!==s.depth))throw Error('Counted length or portal count wrong');
          const result={schema:'pathfinder.pg-h-middle-counted-opportunity/v1',
            sourceCommit:process.env.GITHUB_SHA,corpusSha256:corpusHash,
            independentParents:8,states:selected.length,children:q.cases.length,
            parentsWithStates:new Set(selected.map(x=>x.levelId)).size,
            selected,CPsatQueried:false,productionChanged:false};
          writeFileSync('tmp/pg-h-mid/verdict.json',JSON.stringify(result,null,2)+'\n');
          console.log('PG-H MIDDLE COUNTED VERDICT '+JSON.stringify(result));
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pg-h-middle-counted-capture-001
          path: tmp/pg-h-mid/
          if-no-files-found: warn
          retention-days: 90
