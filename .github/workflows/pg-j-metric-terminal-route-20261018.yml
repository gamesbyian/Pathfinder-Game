# Single-run read-only historical P00137 metric-route falsifier.
name: PG-J terminal metric exact prefixes
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pg-j-metric-terminal-route-20261018.yml'
  workflow_dispatch:

concurrency:
  group: pg-j-metric-terminal-route-20261018
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  four-prefix:
    name: Four exact source LIVE and DEAD forks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact execution source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test metric and heap contracts
        run: node scripts/stress/pg-j-metric-terminal-route.mjs --self-test
      - name: Four source P00137 metric bound calls
        id: experiment
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/pg-j-metric
          timeout -k 10s --preserve-status 9m \
            node scripts/run-bundled.mjs scripts/stress/pg-j-metric-terminal-route.mjs -- \
            --out=logs/pg-j-metric/verdict.json
      - name: Save exact source artifact, even if falsified
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-j-metric-terminal-route
          path: logs/pg-j-metric/verdict.json
          if-no-files-found: warn
          retention-days: 30
      - name: Require completed legal source corpus and soundness, not a positive solve
        if: always()
        shell: bash
        env:
          EXPERIMENT_RESULT: ${{ steps.experiment.outcome }}
        run: |
          set -euo pipefail
          test "$EXPERIMENT_RESULT" = success
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('logs/pg-j-metric/verdict.json','utf8'));
          if(r.sourceCommit!==process.env.GITHUB_SHA||r.summary.cases!==4
            ||r.summary.exactLive!==2||r.summary.exactDead!==2
            ||r.summary.liveFalseExclusion!==0||r.summary.witnesses!==2
            ||r.summary.abstentions!==0)
            throw Error('PG-J source/semantic qualification failed');
          console.log(JSON.stringify(r.summary));
          NODE
