# One-shot exact source-native six-cell phase-retention counterfactual.
name: PG-I phase19 width544 and phase29 bucket rescue
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pg-i-phase-retention-rescue-20261019.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pg-i-phase-retention-rescue-20261019
  cancel-in-progress: false
jobs:
  source-native:
    name: Two frozen development parents x control pulse sustained, strict 250k
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Bundled source-only precommitted fixture
        run: node scripts/run-bundled.mjs scripts/stress/pg-i-phase-specific-retention-rescue-250k.mjs -- --self-test
      - name: Actual six source-native strict 250k calls
        id: experiment
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/pg-i-retention-rescue
          timeout -k 20s --preserve-status 20m \
            node scripts/run-bundled.mjs scripts/stress/pg-i-phase-specific-retention-rescue-250k.mjs -- \
            --out=logs/pg-i-retention-rescue/result.json
      - name: Retain complete actual source result including failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-i-phase-retention-rescue-20261019
          path: logs/pg-i-retention-rescue/result.json
          retention-days: 90
          if-no-files-found: warn
      - name: Enforce exact original controls and referee without requiring new solves
        if: always()
        env:
          EXPERIMENT_RESULT: ${{ steps.experiment.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPERIMENT_RESULT" = success
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('logs/pg-i-retention-rescue/result.json','utf8'));
          if(r.sourceExecutionSha!==process.env.GITHUB_SHA
             ||r.summary.sourceSelectedParents!==2||r.summary.armCells!==6
             ||r.summary.exactControlParities!==2||r.summary.maxWork>250000
             ||r.summary.sourceRefereeOrPruneAlarms!==0
             ||r.summary.sourceWorkCapViolations!==0)
             throw Error('Source phase intervention invariant violated');
          console.log('PG-I PHASE RESULT '+JSON.stringify(r.summary));
          NODE
