name: Cross-resource observability audit

on:
  push:
    branches:
      - chatgpt/cross-resource-observability-2026-09-13
    paths:
      - 'scripts/cross-resource-observability-*'
      - 'scripts/corpus-selection-lineage.mjs'
      - '.github/workflows/cross-resource-observability-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Materialize only variant-family manifests from research branch
        shell: bash
        run: |
          set -euo pipefail
          ref='refs/remotes/origin/variant-research'
          git -c protocol.version=2 fetch --depth=1 --filter=blob:none origin \
            'refs/heads/claude/variant-levels-solver-insights-tpk4qg:refs/remotes/origin/variant-research'
          mkdir -p tmp/variant-manifests
          count=0
          while IFS= read -r file; do
            target="tmp/variant-manifests/$file"
            mkdir -p "$(dirname "$target")"
            git show "$ref:$file" > "$target"
            count=$((count + 1))
          done < <(git ls-tree -r --name-only "$ref" -- data/families | grep -- '-manifest\.json$' || true)
          echo "Materialized $count family manifest files"
          test "$count" -gt 0

      - name: Run cross-resource audit
        run: >-
          node scripts/run-bundled.mjs scripts/cross-resource-observability-audit.mjs --
          --variant-family-dataset-root="$GITHUB_WORKSPACE/tmp/variant-manifests"
          --out="$GITHUB_WORKSPACE/tmp/cross-resource-summary.json"
          --rows-out="$GITHUB_WORKSPACE/tmp/cross-resource-rows.json"
          --case-limit=40

      - name: Upload audit outputs
        uses: actions/upload-artifact@v7
        with:
          name: cross-resource-observability
          path: |
            tmp/cross-resource-summary.json
            tmp/cross-resource-rows.json
          retention-days: 7
