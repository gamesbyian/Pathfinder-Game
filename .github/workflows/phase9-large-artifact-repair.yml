name: Phase 9 current-artifact repair

on:
  push:
    branches:
      - chatgpt/phase9-final-audit-closeout-repair-2026-08-30

permissions:
  contents: write

jobs:
  patch-current-phase9-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Canonicalize maintained Phase 9 provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          substitutions = {
              "logs/stress-corpus1-baseline.json": [
                  ("reports/stress/benchmark-parallel.json", "reports/stress/solver-corpus1-latest.json"),
                  ("stress:benchmark --parallel", "stress:measure-solver --parallel"),
              ],
              "logs/stress-corpus2-baseline.json": [
                  ("reports/stress/benchmark-latest-random.json", "reports/stress/solver-corpus2-latest.json"),
                  ("stress:benchmark --parallel", "stress:measure-solver --parallel"),
              ],
              "reports/stress/solver-corpus1-latest.json": [
                  ("stress:benchmark.mjs", "scripts/stress/benchmark.mjs"),
              ],
              "reports/stress/solver-corpus2-latest.json": [
                  ("stress:benchmark.mjs", "scripts/stress/benchmark.mjs"),
              ],
          }

          changed = []
          for filename, replacements in substitutions.items():
              path = Path(filename)
              text = path.read_text()
              original = text
              for old, new in replacements:
                  count = text.count(old)
                  if count:
                      text = text.replace(old, new)
                      print(f"{filename}: {old!r} -> {new!r} ({count} occurrence(s))")
              if text != original:
                  path.write_text(text)
                  changed.append(filename)
          print(f"changed {len(changed)} maintained artifact(s)")
          PY
          if git diff --quiet -- logs/stress-corpus1-baseline.json logs/stress-corpus2-baseline.json reports/stress/solver-corpus1-latest.json reports/stress/solver-corpus2-latest.json; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add logs/stress-corpus1-baseline.json logs/stress-corpus2-baseline.json reports/stress/solver-corpus1-latest.json reports/stress/solver-corpus2-latest.json
          git commit -m "data: canonicalize Phase 9 current artifact provenance"
          git push origin HEAD:${GITHUB_REF_NAME}
