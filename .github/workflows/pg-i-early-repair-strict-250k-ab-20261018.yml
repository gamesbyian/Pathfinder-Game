# Temporary one-shot, development-only PG-I current-source 250k shared-ladder A/B.
# Selects only original frozen PG-I twelve parents, not prior winner paths or outcomes.
# Retire immediately after evidence is committed and criterion adjudicated.
name: PG-I early-repair strict-250k falsifier
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pg-i-early-repair-strict-250k-ab-20261018.yml'
  workflow_dispatch:

concurrency:
  group: pg-i-early-repair-strict-250k-20261018
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  falsifier:
    name: Frozen twelve-parent paired cold control
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact immutable solver source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Setup exact Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Cheap experiment contract self-test
        run: node scripts/stress/pg-i-early-repair-strict-250k-ab.mjs --self-test
      - name: Run twelve paired strict-work cold solves
        id: run
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/pg-i-early-repair-250k-ab
          timeout -k 30s --preserve-status 40m \
            node scripts/run-bundled.mjs scripts/stress/pg-i-early-repair-strict-250k-ab.mjs -- \
              --out=logs/pg-i-early-repair-250k-ab/verdict.json
      - name: Upload evidence even if comparison fails
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-i-early-repair-250k-ab-paired
          path: logs/pg-i-early-repair-250k-ab/verdict.json
          retention-days: 30
          if-no-files-found: warn
      - name: Enforce complete exact-work comparison
        if: always()
        shell: bash
        env:
          EXPERIMENT_RESULT: ${{ steps.run.outcome }}
        run: |
          set -euo pipefail
          test "$EXPERIMENT_RESULT" = success
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('logs/pg-i-early-repair-250k-ab/verdict.json','utf8'));
          if(r.sourceHead!==process.env.GITHUB_SHA)throw Error('executed commit mismatch');
          if(r.summary.independentParents!==12||r.summary.cells!==24||r.summary.validCells!==24
             ||r.summary.invalidParents.length)throw Error('incomplete/invalid 250k A/B');
          if(r.rows.some(p=>[p.control,p.treatment].some(a=>a.workSpent>250000||a.attemptChargeSum!==a.workSpent)))
            throw Error('work contract violated');
          console.log(JSON.stringify(r.summary));
          NODE
