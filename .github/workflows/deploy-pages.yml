name: Deploy to GitHub Pages

# Builds the site with Vite and publishes dist/ to GitHub Pages.
# Requires the repo's Pages source to be set to "GitHub Actions"
# (Settings → Pages → Build and deployment → Source).
#
# CI runs PR validation; this workflow only publishes after changes land on main.
# See docs/adr/0010-build-step-vite.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; don't cancel an in-progress production deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  summarize:
    name: Summarize Pages deployment
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Write deployment digest
        shell: bash
        env:
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          {
            echo '## GitHub Pages deployment'
            echo
            echo "| Stage | Outcome |"
            echo "| --- | --- |"
            printf '| Build + artifact upload | `%s` |\n' "$BUILD"
            printf '| Pages deployment | `%s` |\n' "$DEPLOY"
            echo
            if [[ "$DEPLOY" == success ]]; then
              echo "Published: $PAGE_URL"
              echo
              printf 'Source commit: `%s`\n' "$GITHUB_SHA"
            elif [[ "$BUILD" == failure ]]; then
              echo 'The site was not deployed because the production build or Pages artifact upload failed.'
              echo '::error::GitHub Pages build/artifact stage failed.'
            else
              echo 'The Pages deployment did not complete successfully.'
              [[ "$DEPLOY" == failure ]] && echo '::error::GitHub Pages deployment failed.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
