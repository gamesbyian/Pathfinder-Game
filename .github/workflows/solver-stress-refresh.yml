# Canonical Pathfinder solver-capability workflow.
#
# CAPABILITY INVARIANT: each solve sees only the current puzzle mechanics plus current solver/config.
# No saved hint, prior solution, baseline status, winning config/gate/seed, attempt cache, corpus
# identity/position, provenance, or other exact-level history may influence the search. This mirrors
# the level editor: a freshly created level has no history to consult. Historical artifacts remain
# valuable as OUTPUTS for research and validation, but never as inputs to Solver.solve here.
#
# EVIDENCE INVARIANT: every referee-valid discovery is retained. Hint capture is output-only and
# never enters a solve. Normal refreshes are lifecycle-complete by construction because the standard
# downstream residual-analysis path consumes stageLifecycle. Deterministic/specialized A/B runs may
# opt out when lifecycle evidence is not part of their question.
name: Solver stress-corpus refresh (level-blind capability)
run-name: "Stress refresh · ${{ inputs.deterministic == 'true' && 'deterministic' || 'normal' }} · flags=${{ inputs.enable_flags || 'control' }} · shards=${{ inputs.shard_count }}"

on:
  workflow_dispatch:
    inputs:
      corpus2_budget_ms:
        description: 'Corpus-2 per-level wall-safety deadline. Default 24h is intentionally non-binding; base node/work allocations can be exceeded by additive tiers unless strict_total_work_budget=true.'
        required: false
        default: '86400000'
      corpus2_node_budget:
        description: 'Corpus-2 cumulative node ceiling per level. Unified with corpus1_node_budget (2026-08-12); the solver should treat levels identically regardless of corpus.'
        required: false
        default: '50000000'
      strict_total_work_budget:
        description: 'If true, enforce each corpus derived work budget as a true whole-solve ceiling. Default false preserves legacy additive-pass semantics.'
        required: false
        default: 'false'
      corpus2_workers:
        description: 'Cross-level worker processes per shard. Default 4 matches current standard public ubuntu-latest runner vCPU count; level-blindness is preserved at any worker count.'
        required: false
        default: '4'
      enable_flags:
        description: 'Comma-separated ablation flags to turn ON for both corpora.'
        required: false
        default: ''
      disable_flags:
        description: 'Comma-separated ablation flags to turn OFF for both corpora.'
        required: false
        default: ''
      main_loop_late_reserve_fraction:
        description: 'Optional STRATEGY_MAIN_SEARCH_LATE_RESERVE fraction; blank for control.'
        required: false
        default: ''
      main_loop_late_reserve_config_count:
        description: 'Optional late-reserve suffix config count; frozen experiment uses 4.'
        required: false
        default: ''
      repair_late_probe_node_budget:
        description: 'Optional STRATEGY_REPAIR_LATE_PROBE node cap override; blank for control.'
        required: false
        default: ''
      corpus1_budget_ms:
        description: 'Corpus-1 per-level wall budget. Default 24h is intentionally non-binding.'
        required: false
        default: '86400000'
      corpus1_node_budget:
        description: 'Corpus-1 cumulative node ceiling per level, unified with corpus2 at 50000000.'
        required: false
        default: '50000000'
      corpus1_workers:
        description: 'Cross-level worker processes per shard. Default 4 matches current standard public ubuntu-latest runner vCPU count.'
        required: false
        default: '4'
      deterministic:
        description: 'true forces a 24h non-binding deadline and skips overwriting canonical baseline/latest files. Valid discoveries remain output-only evidence.'
        required: false
        default: 'false'
      lifecycle_telemetry:
        description: 'Adds --lifecycle-telemetry, mass-weighted failure maps, and exact-dispatch reach/work evidence. Defaults true because ordinary production refreshes feed residual-atlas analysis; normal refreshes fail before fan-out if explicitly disabled. Deterministic/specialized runs may opt out.'
        required: false
        default: 'true'
      shard_count:
        description: 'Shard count. Default 60 queues fine-grained slices behind max_parallel lanes for tail balancing. Must not exceed 102 if corpus-1 coverage is required.'
        required: false
        default: '60'
      max_parallel:
        description: 'Shards running concurrently. Default 20 with shard_count=60 preserves the established runner footprint.'
        required: false
        default: '20'

concurrency:
  group: ${{ github.event.inputs.deterministic == 'true' && format('solver-stress-refresh-ab-{0}', github.run_id) || 'solver-stress-refresh' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan shard count
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      c1_timeout_min: ${{ steps.plan.outputs.c1_timeout_min }}
      c2_timeout_min: ${{ steps.plan.outputs.c2_timeout_min }}
    steps:
      - name: Enforce canonical refresh evidence contract
        if: inputs.deterministic != 'true' && inputs.lifecycle_telemetry != 'true'
        run: |
          echo 'Ordinary production refreshes must include lifecycle telemetry because the canonical residual-atlas pipeline consumes stageLifecycle.'
          echo 'Use deterministic=true for a specialized run that intentionally omits lifecycle evidence.'
          exit 1

      - name: Compute the shard list and per-shard timeouts
        id: plan
        shell: bash
        run: |
          n="${{ inputs.shard_count }}"
          shards=$(node -e "console.log(JSON.stringify(Array.from({length:Number(process.argv[1])},(_,i)=>i+1)))" "$n")
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"
          c1=$(( 45 * 20 / n )); [ "$c1" -gt 60 ] && c1=60; [ "$c1" -lt 10 ] && c1=10
          c2=$(( 300 * 20 / n )); [ "$c2" -gt 340 ] && c2=340; [ "$c2" -lt 45 ] && c2=45
          echo "c1_timeout_min=${c1}" >> "$GITHUB_OUTPUT"
          echo "c2_timeout_min=${c2}" >> "$GITHUB_OUTPUT"

  solve-shards:
    name: Capability shard ${{ matrix.shard }}/${{ inputs.shard_count }}
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel) }}
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute shard ranges
        id: range
        shell: bash
        run: |
          n="${{ inputs.shard_count }}"
          nn=$(printf '%02d' "${{ matrix.shard }}")
          c2start=$(( ( (${{ matrix.shard }} - 1) * 1700 ) / n + 1 ))
          c2end=$(( ( ${{ matrix.shard }} * 1700 ) / n ))
          c1start=$(( ( (${{ matrix.shard }} - 1) * 102 ) / n + 1 ))
          c1end=$(( ( ${{ matrix.shard }} * 102 ) / n ))
          echo "nn=${nn}" >> "$GITHUB_OUTPUT"
          echo "c2start=${c2start}" >> "$GITHUB_OUTPUT"
          echo "c2end=${c2end}" >> "$GITHUB_OUTPUT"
          echo "c1start=${c1start}" >> "$GITHUB_OUTPUT"
          echo "c1end=${c1end}" >> "$GITHUB_OUTPUT"

      - name: Run level-blind Corpus-1 slice
        id: c1
        continue-on-error: true
        shell: bash
        env:
          DEADLINE: ${{ inputs.deterministic == 'true' && '86400000' || inputs.corpus1_budget_ms }}
        run: |
          set +e
          mkdir -p logs/solver-corpus2-batches
          if [ "${{ steps.range.outputs.c1start }}" -gt "${{ steps.range.outputs.c1end }}" ]; then
            echo "No corpus-1 levels in this shard's range; skipping."
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          extra=("--save-hints")
          [ -n "${{ inputs.enable_flags }}" ] && extra+=("--enable-flags=${{ inputs.enable_flags }}")
          [ -n "${{ inputs.disable_flags }}" ] && extra+=("--disable-flags=${{ inputs.disable_flags }}")
          [ -n "${{ inputs.main_loop_late_reserve_fraction }}" ] && extra+=("--main-search-late-reserve-fraction=${{ inputs.main_loop_late_reserve_fraction }}")
          [ -n "${{ inputs.main_loop_late_reserve_config_count }}" ] && extra+=("--main-search-late-reserve-config-count=${{ inputs.main_loop_late_reserve_config_count }}")
          [ -n "${{ inputs.repair_late_probe_node_budget }}" ] && extra+=("--repair-late-probe-node-budget=${{ inputs.repair_late_probe_node_budget }}")
          [ "${{ inputs.lifecycle_telemetry }}" = "true" ] && extra+=("--lifecycle-telemetry")
          work=$(( ${{ inputs.corpus1_node_budget }} * 134 / 100 ))
          strict=()
          [ "${{ inputs.strict_total_work_budget }}" = "true" ] && strict+=("--strict-total-work-budget")
          timeout -k 30s --preserve-status "${{ needs.plan.outputs.c1_timeout_min }}m" node scripts/run-bundled.mjs scripts/level-blind-capability-sweep.mjs -- \
            --corpus=data/stress/stress-levels.json \
            --levels="pos:${{ steps.range.outputs.c1start }}-${{ steps.range.outputs.c1end }}" \
            --budget-ms="${DEADLINE}" \
            --node-budget="${{ inputs.corpus1_node_budget }}" \
            --work-budget="${work}" \
            "${strict[@]}" \
            --workers="${{ inputs.corpus1_workers }}" \
            "${extra[@]}" \
            --out="logs/solver-corpus2-batches/corpus1-batch-${{ steps.range.outputs.nn }}.json" \
            --summary-out="logs/solver-corpus2-batches/corpus1-batch-${{ steps.range.outputs.nn }}-summary.md"
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run level-blind Corpus-2 slice
        id: c2
        continue-on-error: true
        shell: bash
        env:
          DEADLINE: ${{ inputs.deterministic == 'true' && '86400000' || inputs.corpus2_budget_ms }}
        run: |
          set +e
          extra=("--save-hints")
          [ -n "${{ inputs.enable_flags }}" ] && extra+=("--enable-flags=${{ inputs.enable_flags }}")
          [ -n "${{ inputs.disable_flags }}" ] && extra+=("--disable-flags=${{ inputs.disable_flags }}")
          [ -n "${{ inputs.main_loop_late_reserve_fraction }}" ] && extra+=("--main-search-late-reserve-fraction=${{ inputs.main_loop_late_reserve_fraction }}")
          [ -n "${{ inputs.main_loop_late_reserve_config_count }}" ] && extra+=("--main-search-late-reserve-config-count=${{ inputs.main_loop_late_reserve_config_count }}")
          [ -n "${{ inputs.repair_late_probe_node_budget }}" ] && extra+=("--repair-late-probe-node-budget=${{ inputs.repair_late_probe_node_budget }}")
          [ "${{ inputs.lifecycle_telemetry }}" = "true" ] && extra+=("--lifecycle-telemetry")
          work=$(( ${{ inputs.corpus2_node_budget }} * 134 / 100 ))
          strict=()
          [ "${{ inputs.strict_total_work_budget }}" = "true" ] && strict+=("--strict-total-work-budget")
          timeout -k 30s --preserve-status "${{ needs.plan.outputs.c2_timeout_min }}m" node scripts/run-bundled.mjs scripts/level-blind-capability-sweep.mjs -- \
            --corpus=data/stress/stress-levels-random.json \
            --levels="pos:${{ steps.range.outputs.c2start }}-${{ steps.range.outputs.c2end }}" \
            --budget-ms="${DEADLINE}" \
            --node-budget="${{ inputs.corpus2_node_budget }}" \
            --work-budget="${work}" \
            "${strict[@]}" \
            --workers="${{ inputs.corpus2_workers }}" \
            "${extra[@]}" \
            --out="logs/solver-corpus2-batches/batch-${{ steps.range.outputs.nn }}.json" \
            --summary-out="logs/solver-corpus2-batches/batch-${{ steps.range.outputs.nn }}-summary.md"
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Stage shard artifact
        if: always()
        shell: bash
        run: |
          stage="artifact-staging/stress-shard-${{ steps.range.outputs.nn }}"
          mkdir -p "$stage/logs/solver-corpus2-batches" "$stage/data/stress/hints" "$stage/data/stress/hints-random"
          for f in \
            "logs/solver-corpus2-batches/batch-${{ steps.range.outputs.nn }}.json" \
            "logs/solver-corpus2-batches/batch-${{ steps.range.outputs.nn }}-summary.md" \
            "logs/solver-corpus2-batches/corpus1-batch-${{ steps.range.outputs.nn }}.json" \
            "logs/solver-corpus2-batches/corpus1-batch-${{ steps.range.outputs.nn }}-summary.md"; do
            [ -e "$f" ] && cp "$f" "$stage/logs/solver-corpus2-batches/"
          done
          git status --porcelain -- data/stress/hints/ data/stress/hints-random/ | awk '{print $2}' | while read -r f; do
            mkdir -p "$stage/$(dirname "$f")"
            cp "$f" "$stage/$f"
          done

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stress-shard-${{ steps.range.outputs.nn }}
          path: artifact-staging/stress-shard-${{ steps.range.outputs.nn }}
          if-no-files-found: error
          retention-days: 90

      - name: Fail on unexpected sweep error
        if: >-
          always() &&
          ((steps.c1.outputs.exit_code != '0' && steps.c1.outputs.exit_code != '124' && steps.c1.outputs.exit_code != '143') ||
           (steps.c2.outputs.exit_code != '0' && steps.c2.outputs.exit_code != '124' && steps.c2.outputs.exit_code != '143'))
        run: exit 1

  combine:
    name: Combine level-blind capability results
    needs: [solve-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shard artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'stress-shard-*'
          path: artifact-staging/downloaded
          merge-multiple: true

      - name: Remove stale live shard files, lay down this run, and combine
        shell: bash
        run: |
          rm -f logs/solver-corpus2-batches/batch-*.json \
                logs/solver-corpus2-batches/batch-*-summary.md \
                logs/solver-corpus2-batches/corpus1-batch-*.json \
                logs/solver-corpus2-batches/corpus1-batch-*-summary.md
          cp -a artifact-staging/downloaded/. ./
          C1=$(ls logs/solver-corpus2-batches/corpus1-batch-*.json 2>/dev/null | paste -sd, -)
          C2=$(ls logs/solver-corpus2-batches/batch-*.json 2>/dev/null | paste -sd, -)
          [ -n "$C1" ] && npm run solver:combine-sweep-reports -- --in="${C1}" --out=reports/stress/solver-corpus1-latest.json
          [ -n "$C2" ] && npm run solver:combine-sweep-reports -- --in="${C2}" --out=reports/stress/solver-corpus2-latest.json

      - name: Verify complete coverage and level-blind provenance
        id: coverage
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p logs/solver-sweep-result-inputs
          node - <<'NODE'
          const fs = require('node:fs');
          const expected = [['reports/stress/solver-corpus1-latest.json', 'data/stress/stress-levels.json', 'corpus-1'], ['reports/stress/solver-corpus2-latest.json', 'data/stress/stress-levels-random.json', 'corpus-2']];
          let ok = true;
          for (const [file, corpus, label] of expected) {
            if (!fs.existsSync(file)) { console.error(`${file}: missing`); ok = false; continue; }
            const source = JSON.parse(fs.readFileSync(corpus));
            const levels = Array.isArray(source) ? source : source.levels;
            fs.writeFileSync(`logs/solver-sweep-result-inputs/${label}-expected.txt`, `${levels.map(row => row.id).join('\n')}\n`);
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const rows = report.levels ?? [];
            if (rows.some(r => r.solvedByPrime)) { console.error(`${file}: solvedByPrime appeared in a capability report.`); ok = false; }
          }
          if (!ok) process.exit(1);
          NODE
          node scripts/validate-solver-sweep-integrity.mjs --allow-incomplete --expected-ids=logs/solver-sweep-result-inputs/corpus-1-expected.txt --result=reports/stress/solver-corpus1-latest.json --integrity-out=logs/solver-sweep-result-inputs/corpus-1-integrity.json
          node scripts/validate-solver-sweep-integrity.mjs --allow-incomplete --expected-ids=logs/solver-sweep-result-inputs/corpus-2-expected.txt --result=reports/stress/solver-corpus2-latest.json --integrity-out=logs/solver-sweep-result-inputs/corpus-2-integrity.json
          node scripts/combine-population-integrity.mjs --input=corpus-1:logs/solver-sweep-result-inputs/corpus-1-integrity.json --input=corpus-2:logs/solver-sweep-result-inputs/corpus-2-integrity.json --out=logs/solver-sweep-result-inputs/population-integrity.json
          node -e "const fs=require('node:fs'),x=require('./logs/solver-sweep-result-inputs/population-integrity.json'); fs.appendFileSync(process.env.GITHUB_OUTPUT,'complete='+String(x.coverageComplete ?? x.complete)+'\n'); if (!(x.coverageComplete ?? x.complete)) process.exit(1)"

      - name: Verify canonical lifecycle evidence is present
        if: steps.coverage.outputs.complete == 'true' && inputs.deterministic != 'true'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const file of ['reports/stress/solver-corpus1-latest.json', 'reports/stress/solver-corpus2-latest.json']) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const rows = report.levels ?? [];
            const missing = rows.filter(row => row.stageLifecycle == null);
            if (missing.length) {
              console.error(`${file}: ${missing.length}/${rows.length} rows missing stageLifecycle; refusing to publish a lifecycle-incomplete canonical refresh.`);
              process.exit(1);
            }
          }
          NODE

      - name: Regenerate derived stress metadata and compact run record
        if: steps.coverage.outputs.complete == 'true'
        shell: bash
        run: |
          node scripts/stress/rank-levels.mjs --in=reports/stress/solver-corpus2-latest.json --status=unsolved --top=30 || true
          node scripts/stress/classify-stability.mjs --in=reports/stress/solver-corpus2-latest.json --out=reports/stress/stability-random.json || true
          npm run stress:curate-dev-benchmark -- --benchmark=reports/stress/solver-corpus2-latest.json || true
          node scripts/stress/compile-baseline.mjs --mode=corpus2 --official=reports/stress/solver-corpus2-latest.json
          node scripts/stress/compile-baseline.mjs --mode=corpus1 --official=reports/stress/solver-corpus1-latest.json
          mkdir -p "reports/stress/capability-runs/${{ github.run_id }}"
          node - <<'NODE'
          const fs = require('node:fs');
          const dir = `reports/stress/capability-runs/${process.env.RUN_ID}`;
          const project = file => {
            const r = JSON.parse(fs.readFileSync(file, 'utf8'));
            const rows = r.levels ?? [];
            return {
              commitSha: r.commitSha,
              rows: rows.map(x => ({
                id: x.id ?? String(x.level), level: x.level, ok: x.ok, status: x.status,
                nodesExpanded: x.nodesExpanded, workSpent: x.workSpent, elapsedMs: x.elapsedMs,
                deadlineTruncated: x.deadlineTruncated, winningConfig: x.winningConfig,
                winningActionKey: x.winningActionKey,
                attemptCount: x.attemptCount, failedStrategies: x.failedStrategies,
                solution: x.solution,
              })),
            };
          };
          const summarize = projected => ({
            total: projected.rows.length,
            solved: projected.rows.filter(x => x.ok).length,
            solvedIds: projected.rows.filter(x => x.ok).map(x => x.id).sort(),
            nodes: projected.rows.reduce((n,x) => n + (x.nodesExpanded || 0), 0),
            work: projected.rows.reduce((n,x) => n + (x.workSpent || 0), 0),
            commitSha: projected.commitSha,
          });
          const c1 = project('reports/stress/solver-corpus1-latest.json');
          const c2 = project('reports/stress/solver-corpus2-latest.json');
          const record = {
            runId: process.env.RUN_ID,
            solverRef: process.env.SOLVER_REF,
            levelBlind: true,
            enableFlags: process.env.ENABLE_FLAGS,
            disableFlags: process.env.DISABLE_FLAGS,
            deterministic: process.env.DETERMINISTIC,
            persistHints: true,
            corpus1: summarize(c1),
            corpus2: summarize(c2),
          };
          fs.writeFileSync(`${dir}/summary.json`, JSON.stringify(record, null, 2) + '\n');
          fs.writeFileSync(`${dir}/per-level-corpus1.json`, JSON.stringify(c1, null, 2) + '\n');
          fs.writeFileSync(`${dir}/per-level-corpus2.json`, JSON.stringify(c2, null, 2) + '\n');
          NODE
        env:
          RUN_ID: ${{ github.run_id }}
          SOLVER_REF: ${{ github.sha }}
          ENABLE_FLAGS: ${{ inputs.enable_flags }}
          DISABLE_FLAGS: ${{ inputs.disable_flags }}
          DETERMINISTIC: ${{ inputs.deterministic }}
          LIFECYCLE: ${{ inputs.lifecycle_telemetry }}
          LATE_RESERVE_FRACTION: ${{ inputs.main_loop_late_reserve_fraction }}
          LATE_RESERVE_CONFIG_COUNT: ${{ inputs.main_loop_late_reserve_config_count }}
          REPAIR_LATE_PROBE_NODE_BUDGET: ${{ inputs.repair_late_probe_node_budget }}

      - name: Append compact longitudinal solver-health record
        if: steps.coverage.outputs.complete == 'true'
        shell: bash
        run: |
          node scripts/append-solver-health-record.mjs \
            --summary="reports/stress/capability-runs/${{ github.run_id }}/summary.json" \
            --combined="reports/stress/solver-corpus1-latest.json,reports/stress/solver-corpus2-latest.json" \
            --out="reports/stress/solver-health-timeline.jsonl"

      - name: Mass-weighted lifecycle failure map
        if: steps.coverage.outputs.complete == 'true' && inputs.lifecycle_telemetry == 'true'
        shell: bash
        run: |
          node scripts/stress/lifecycle-failure-map.mjs \
            --in=reports/stress/solver-corpus1-latest.json \
            --out="reports/stress/capability-runs/${{ github.run_id }}/lifecycle-failure-map-corpus1.json" \
            --summary-out="reports/stress/capability-runs/${{ github.run_id }}/lifecycle-failure-map-corpus1-summary.md"
          node scripts/stress/lifecycle-failure-map.mjs \
            --in=reports/stress/solver-corpus2-latest.json \
            --out="reports/stress/capability-runs/${{ github.run_id }}/lifecycle-failure-map-corpus2.json" \
            --summary-out="reports/stress/capability-runs/${{ github.run_id }}/lifecycle-failure-map-corpus2-summary.md"

      - name: Apply frozen WS1 legal-signal model and seal action-boundary identity
        if: steps.coverage.outputs.complete == 'true'
        shell: bash
        run: |
          node scripts/apply-action-selection-legal-signal-model.mjs \
            --inputs=reports/stress/solver-corpus1-latest.json,reports/stress/solver-corpus2-latest.json \
            --model=reports/stress/action-selection-legal-signal-frozen-model-2026-09-21.json \
            --out="reports/stress/capability-runs/${{ github.run_id }}/action-selection-legal-signal-challenge.json"

      - name: Join durable EW1 pricing to exact-current production reach/work
        if: steps.coverage.outputs.complete == 'true' && inputs.lifecycle_telemetry == 'true'
        shell: bash
        run: |
          npm run solver:analyze-equal-work-production-reach -- \
            --equal-work=reports/stress/ew1/33156541827-pricing-snapshot.json \
            --production=reports/stress/solver-corpus1-latest.json,reports/stress/solver-corpus2-latest.json \
            --capability=reports/stress/technique-niches/2026-09-01/level-capability.json \
            --out="reports/stress/capability-runs/${{ github.run_id }}/equal-work-production-reach.json" \
            --summary-out="reports/stress/capability-runs/${{ github.run_id }}/equal-work-production-reach.md" \
            --require-current-head \
            --check

      - name: Print solved counts
        if: steps.coverage.outputs.complete == 'true'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const [name, file] of [['corpus-1','reports/stress/solver-corpus1-latest.json'], ['corpus-2','reports/stress/solver-corpus2-latest.json']]) {
            const r = JSON.parse(fs.readFileSync(file,'utf8'));
            const rows = r.levels ?? [];
            const solved = rows.filter(x => x.ok).length;
            const nodes = rows.reduce((n,x) => n + (x.nodesExpanded || 0), 0);
            const work = rows.reduce((n,x) => n + (x.workSpent || 0), 0);
            console.log(`SOLVED ${name}: ${solved}/${rows.length} nodes=${nodes} work=${work} levelBlind=true`);
          }
          NODE

      - name: Print early-repair-search badness distribution
        if: steps.coverage.outputs.complete == 'true'
        shell: bash
        run: |
          node scripts/run-bundled.mjs scripts/stress/early-repair-search-badness-report.mjs -- --in=reports/stress/solver-corpus1-latest.json
          node scripts/run-bundled.mjs scripts/stress/early-repair-search-badness-report.mjs -- --in=reports/stress/solver-corpus2-latest.json

      - name: Upload combined results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-stress-refresh-combined
          path: |
            reports/stress/
            logs/solver-corpus2-batches/
          if-no-files-found: error
          retention-days: 90

      - name: Publish standard solver sweep result
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const observedExecution = {};
          for (const [name, file] of [['corpus1', 'reports/stress/solver-corpus1-latest.json'], ['corpus2', 'reports/stress/solver-corpus2-latest.json']]) {
            if (fs.existsSync(file)) observedExecution[name] = JSON.parse(fs.readFileSync(file, 'utf8')).configurationHash ?? null;
          }
          const deterministic = process.env.DETERMINISTIC === 'true';
          const optionalNumber = value => String(value ?? '').trim() === '' ? null : Number(value);
          const configuration = {
            corpus1NodeBudget: Number(process.env.C1_NODE),
            corpus2NodeBudget: Number(process.env.C2_NODE),
            corpus1DeadlineMs: deterministic ? 86400000 : Number(process.env.C1_MS),
            corpus2DeadlineMs: deterministic ? 86400000 : Number(process.env.C2_MS),
            strictTotalWorkBudget: process.env.STRICT === 'true',
            enableFlags: process.env.ENABLE,
            disableFlags: process.env.DISABLE,
            lifecycleTelemetry: process.env.LIFECYCLE === 'true',
            mainLoopLateReserveFraction: optionalNumber(process.env.LATE_RESERVE_FRACTION),
            mainLoopLateReserveConfigCount: optionalNumber(process.env.LATE_RESERVE_CONFIG_COUNT),
            repairLateProbeNodeBudget: optionalNumber(process.env.REPAIR_LATE_PROBE_NODE_BUDGET),
            observedExecution,
          };
          fs.writeFileSync('logs/solver-sweep-result-inputs/experiment-contract-spec.json', `${JSON.stringify({
            configuration,
            workflowFamily: 'solver-stress-refresh',
            producer: 'solver-stress-refresh.yml',
            entrypoint: 'scripts/level-blind-capability-sweep.mjs',
            population: { kind: 'whole-canonical-corpora', identityBasis: 'corpus-and-stable-level-id' },
            execution: { levelBlind: true, historyAware: false, historicalInputs: [], reproducibilityExpected: deterministic, producerFamily: 'portfolio-solve-sweep', schedulerMode: 'production' },
            limits: { cumulativeNodeCeiling: null, initialWorkAllocation: null, totalWorkCeiling: null, wallSafetyDeadlineMs: null, wallDeadlineBinding: !deterministic, representation: { kind: 'heterogeneous-by-corpus', corpora: { 'corpus-1': { nodeCeiling: configuration.corpus1NodeBudget, wallSafetyDeadlineMs: configuration.corpus1DeadlineMs }, 'corpus-2': { nodeCeiling: configuration.corpus2NodeBudget, wallSafetyDeadlineMs: configuration.corpus2DeadlineMs } } } },
            sideEffects: { hints: 'harvest-permitted', canonicalBaseline: process.env.DETERMINISTIC === 'true' ? 'none' : 'refresh', telemetry: configuration.lifecycleTelemetry ? 'lifecycle+compact' : 'compact', reports: 'report-write' },
          }, null, 2)}\n`);
          NODE
          node scripts/write-solver-experiment-contract.mjs \
            --spec=logs/solver-sweep-result-inputs/experiment-contract-spec.json \
            --out=logs/solver-sweep-result-inputs/experiment-contract.json
          extras=()
          for evidence in \
            "reports/stress/capability-runs/${{ github.run_id }}/summary.json" \
            "reports/stress/capability-runs/${{ github.run_id }}/action-selection-legal-signal-challenge.json" \
            "reports/stress/capability-runs/${{ github.run_id }}/lifecycle-failure-map-corpus1.json" \
            "reports/stress/capability-runs/${{ github.run_id }}/lifecycle-failure-map-corpus2.json" \
            "reports/stress/capability-runs/${{ github.run_id }}/equal-work-production-reach.json"; do
            [[ -f "$evidence" ]] && extras+=("--include=$evidence")
          done
          node scripts/sweep-publish.mjs \
            --failure-source="reports/stress/solver-corpus1-latest.json" \
            --failure-source="reports/stress/solver-corpus2-latest.json" \
            --failure-response-out="reports/stress/capability-runs/${{ github.run_id }}/compact-failure-response.json" \
            --primary="reports/stress/solver-corpus1-latest.json" \
            --include="reports/stress/solver-corpus2-latest.json" \
            "${extras[@]}" \
            --shards-expected="${{ inputs.shard_count }}" \
            --shards-observed="$(find logs/solver-corpus2-batches -maxdepth 1 -name 'batch-*.json' | wc -l | tr -d ' ')" \
            --integrity-file="logs/solver-sweep-result-inputs/population-integrity.json" \
            --contract-file="logs/solver-sweep-result-inputs/experiment-contract.json" \
            --provenance-out="reports/stress/capability-runs/${{ github.run_id }}/gha-source-run.json" \
            --source-artifact="solver-stress-refresh-combined"
        env:
          C1_NODE: ${{ inputs.corpus1_node_budget }}
          C2_NODE: ${{ inputs.corpus2_node_budget }}
          C1_MS: ${{ inputs.corpus1_budget_ms }}
          C2_MS: ${{ inputs.corpus2_budget_ms }}
          STRICT: ${{ inputs.strict_total_work_budget }}
          ENABLE: ${{ inputs.enable_flags }}
          DISABLE: ${{ inputs.disable_flags }}
          DETERMINISTIC: ${{ inputs.deterministic }}

      - name: Upload standard solver sweep result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-sweep-result
          path: logs/solver-sweep-result/
          if-no-files-found: error
          retention-days: 90

      - name: Persist capability outputs and eagerly persist hints for normal refreshes
        if: steps.coverage.outputs.complete == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "reports/stress/capability-runs/${{ github.run_id }}/"
          git add reports/stress/solver-health-timeline.jsonl
          if [ "${{ inputs.deterministic }}" != "true" ]; then
            git add data/stress/hints/ data/stress/hints-random/ data/stress/stress-levels.json data/stress/stress-levels-random.json
            git add logs/stress-corpus1-baseline.json logs/stress-corpus2-baseline.json reports/stress/
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Solver level-blind capability refresh (${{ github.run_id }})"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep $((attempt * 5))
            git fetch origin "${{ github.ref_name }}"
            git checkout -- .
            git rebase "origin/${{ github.ref_name }}" || exit 1
          done
          exit 1

      - name: Fail incomplete capability run
        if: steps.coverage.outputs.complete != 'true'
        run: |
          echo 'Capability run incomplete; results were uploaded but no baseline/report state was persisted.'
          exit 1
