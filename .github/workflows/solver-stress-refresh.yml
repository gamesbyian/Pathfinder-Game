# Canonical Pathfinder solver-capability workflow.
#
# CAPABILITY INVARIANT: each solve sees only the current puzzle mechanics plus current solver/config.
# No saved hint, prior solution, baseline status, winning config/gate/seed, attempt cache, corpus
# identity/position, provenance, or other exact-level history may influence the search. This mirrors
# the level editor: a freshly created level has no history to consult. Historical artifacts remain
# valuable as OUTPUTS for research and validation, but never as inputs to Solver.solve here.
name: Solver stress-corpus refresh (level-blind capability)

on:
  workflow_dispatch:
    inputs:
      corpus2_budget_ms:
        description: 'Corpus-2 per-level wall budget. Default 24h is intentionally non-binding; node/work budgets are the real ceilings.'
        required: false
        default: '86400000'
      corpus2_node_budget:
        description: 'Corpus-2 cumulative node ceiling per level. Unified with corpus1_node_budget (2026-08-12) -- previously 36000000, a value with no corpus-2-specific justification beyond an old, since-drifted wall-clock ratio; the solver should treat levels identically regardless of which corpus they came from. See corpus1_node_budget''s description for the unification rationale.'
        required: false
        default: '50000000'
      corpus2_workers:
        description: 'Cross-level worker processes per shard. Level-blindness is preserved even at 1 worker.'
        required: false
        default: '2'
      enable_flags:
        description: 'Comma-separated ablation flags to turn ON for both corpora.'
        required: false
        default: ''
      disable_flags:
        description: 'Comma-separated ablation flags to turn OFF for both corpora.'
        required: false
        default: ''
      main_loop_late_reserve_fraction:
        description: 'Optional STRATEGY_MAIN_LOOP_LATE_RESERVE fraction; blank for control.'
        required: false
        default: ''
      main_loop_late_reserve_config_count:
        description: 'Optional late-reserve suffix config count; frozen experiment uses 4.'
        required: false
        default: ''
      persist_hints:
        description: 'Save newly discovered valid solutions/provenance after solving, into data/stress/hints*/. Output-only: saved hints never enter the solve. Independent of the per-run analysis summary under reports/stress/capability-runs/RUN_ID/, which is always committed regardless of this flag -- see the combine job''s "Persist capability outputs" step.'
        required: false
        default: 'true'
      corpus1_budget_ms:
        description: 'Corpus-1 per-level wall budget. Default 24h is intentionally non-binding.'
        required: false
        default: '86400000'
      corpus1_node_budget:
        description: 'Corpus-1 cumulative node ceiling per level. Unified with corpus2_node_budget at 50000000 (2026-08-12): the two previously differed (corpus-1 50000000 vs corpus-2 36000000) purely because corpus-1''s number was mechanically derived from an old wall-clock ratio (20000ms corpus-1 : 8000ms corpus-2) applied to corpus-2''s node budget AT THE TIME (20000000) -- never independently justified, and never revisited when corpus-2''s own number was later raised to 36000000, leaving the two inconsistent with even their own original ratio. The solver should be corpus-agnostic: a level''s budget must not depend on which corpus it happens to live in. See reports/2026-08-12-main-loop-late-reserve-population-ab.md for the investigation that surfaced this.'
        required: false
        default: '50000000'
      corpus1_workers:
        description: 'Cross-level worker processes per shard.'
        required: false
        default: '2'
      deterministic:
        description: 'true forces a 24h non-binding deadline and skips overwriting the canonical logs/*baseline.json and reports/stress/ "latest" files; hints persist only if persist_hints=true. The compact per-run analysis summary (reports/stress/capability-runs/RUN_ID/) is always committed either way -- it is namespaced by run id, so it can never let one A/B arm mutate what a queued arm measures. Use true + persist_hints=false for matched A/B arms.'
        required: false
        default: 'false'
      lifecycle_telemetry:
        description: 'true adds --lifecycle-telemetry to both corpus solves (per-technique eligible/reached/starved/exhausted record on every row -- see modules/solver/orchestration.ts finish()) and has the combine job emit a mass-weighted failure map (scripts/stress/lifecycle-failure-map.mjs) over the full unsolved population. Opt-in: adds negligible per-level overhead (post-processing only) but the resulting combined benchmark files carry a techniqueLifecycle field on every row, which older analysis tooling does not expect.'
        required: false
        default: 'false'
      shard_count:
        description: 'Shard count (fixed 20 before 2026-08-22). Fewer, larger shards use fewer concurrent runner slots -- e.g. 10 lets a control/treatment A/B pair (each capped at this many concurrent jobs) fit the account concurrent-job limit alongside other work, or lets a same-sized second sweep run at the same time. Corpus-2''s per-shard timeout scales inversely (fewer shards -> more levels/shard -> more time/shard), clamped to the GitHub-hosted 360min/job hard ceiling -- do not go far below 10 without also raising node/work budgets down, or a shard risks not finishing its slice inside that ceiling. Must not exceed 102 (corpus-1''s level count) or some shards get zero corpus-1 coverage.'
        required: false
        default: '20'

concurrency:
  # Matched-A/B arms (deterministic=true, persist_hints=false) touch no shared repo state beyond
  # their own run-id-namespaced reports/stress/capability-runs/<run_id>/ directory (see the persist
  # step's own comment) -- data/stress/hints*/ and the canonical baseline/report files are only
  # staged when persist_hints=true / deterministic=false respectively, so two such arms can safely
  # run at once instead of queuing behind each other. Anything that CAN mutate shared state
  # (deterministic=false or persist_hints=true) still serializes under the single shared group, as
  # before -- against every other run of this workflow, mutating or not, so it can never race a
  # concurrently-running A/B arm's persist step either.
  group: ${{ (github.event.inputs.deterministic == 'true' && github.event.inputs.persist_hints == 'false') && format('solver-stress-refresh-ab-{0}', github.run_id) || 'solver-stress-refresh' }}
  cancel-in-progress: false

jobs:
  # Tiny job so `solve-shards`' matrix can size itself to shard_count instead of a fixed [1..20]
  # array -- GitHub Actions matrices must be a static list or fromJson() of a previous job's output.
  plan:
    name: Plan shard count
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      c1_timeout_min: ${{ steps.plan.outputs.c1_timeout_min }}
      c2_timeout_min: ${{ steps.plan.outputs.c2_timeout_min }}
    steps:
      - name: Compute the shard list and per-shard timeouts
        id: plan
        shell: bash
        run: |
          n="${{ inputs.shard_count }}"
          shards=$(node -e "console.log(JSON.stringify(Array.from({length:Number(process.argv[1])},(_,i)=>i+1)))" "$n")
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"
          # Baseline 45m/300m at the default 20 shards; scale inversely with shard_count (fewer,
          # bigger shards need more time each), clamped so corpus1's + corpus2's wrapper timeouts
          # together leave margin under the GitHub-hosted 360min/job hard ceiling (solve-shards' own
          # timeout-minutes below).
          c1=$(( 45 * 20 / n )); [ "$c1" -gt 60 ] && c1=60; [ "$c1" -lt 10 ] && c1=10
          c2=$(( 300 * 20 / n )); [ "$c2" -gt 340 ] && c2=340; [ "$c2" -lt 45 ] && c2=45
          echo "c1_timeout_min=${c1}" >> "$GITHUB_OUTPUT"
          echo "c2_timeout_min=${c2}" >> "$GITHUB_OUTPUT"

  solve-shards:
    name: Capability shard ${{ matrix.shard }}/${{ inputs.shard_count }}
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v4
        with:
          # Pin the immutable dispatch SHA. Using github.ref here caused run #32 to start at
          # ddb3ef... but queued shards to resolve a later main tip c86ba8....
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute shard ranges
        id: range
        shell: bash
        run: |
          n="${{ inputs.shard_count }}"
          nn=$(printf '%02d' "${{ matrix.shard }}")
          # Standard "evenly distribute N items into shard_count groups" tiling via floor division --
          # identical to the pre-2026-08-22 hardcoded (shard-1)*85+1..shard*85 when shard_count=20
          # (1700/20=85 exactly), and to corpus-1's own always-parameterized formula below.
          c2start=$(( ( (${{ matrix.shard }} - 1) * 1700 ) / n + 1 ))
          c2end=$(( ( ${{ matrix.shard }} * 1700 ) / n ))
          c1start=$(( ( (${{ matrix.shard }} - 1) * 102 ) / n + 1 ))
          c1end=$(( ( ${{ matrix.shard }} * 102 ) / n ))
          echo "nn=${nn}" >> "$GITHUB_OUTPUT"
          echo "c2start=${c2start}" >> "$GITHUB_OUTPUT"
          echo "c2end=${c2end}" >> "$GITHUB_OUTPUT"
          echo "c1start=${c1start}" >> "$GITHUB_OUTPUT"
          echo "c1end=${c1end}" >> "$GITHUB_OUTPUT"

      - name: Run level-blind Corpus-1 slice
        id: c1
        continue-on-error: true
        shell: bash
        env:
          DEADLINE: ${{ inputs.deterministic == 'true' && '86400000' || inputs.corpus1_budget_ms }}
        run: |
          set +e
          mkdir -p logs/solver-corpus2-batches
          # shard_count > 102 (corpus-1's level count) leaves some shards with an empty corpus-1
          # range (c1start > c1end); skip rather than let parseLevelSpec's min/max range handling
          # silently re-select an adjacent shard's already-covered ids.
          if [ "${{ steps.range.outputs.c1start }}" -gt "${{ steps.range.outputs.c1end }}" ]; then
            echo "No corpus-1 levels in this shard's range (shard_count > 102); skipping."
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          extra=()
          [ -n "${{ inputs.enable_flags }}" ] && extra+=("--enable-flags=${{ inputs.enable_flags }}")
          [ -n "${{ inputs.disable_flags }}" ] && extra+=("--disable-flags=${{ inputs.disable_flags }}")
          [ -n "${{ inputs.main_loop_late_reserve_fraction }}" ] && extra+=("--main-loop-late-reserve-fraction=${{ inputs.main_loop_late_reserve_fraction }}")
          [ -n "${{ inputs.main_loop_late_reserve_config_count }}" ] && extra+=("--main-loop-late-reserve-config-count=${{ inputs.main_loop_late_reserve_config_count }}")
          [ "${{ inputs.persist_hints }}" = "true" ] && extra+=("--save-hints")
          [ "${{ inputs.lifecycle_telemetry }}" = "true" ] && extra+=("--lifecycle-telemetry")
          work=$(( ${{ inputs.corpus1_node_budget }} * 134 / 100 ))
          timeout -k 30s --preserve-status "${{ needs.plan.outputs.c1_timeout_min }}m" node scripts/run-bundled.mjs scripts/level-blind-capability-sweep.mjs -- \
            --corpus=data/stress/stress-levels.json \
            --levels="pos:${{ steps.range.outputs.c1start }}-${{ steps.range.outputs.c1end }}" \
            --budget-ms="${DEADLINE}" \
            --node-budget="${{ inputs.corpus1_node_budget }}" \
            --work-budget="${work}" \
            --workers="${{ inputs.corpus1_workers }}" \
            "${extra[@]}" \
            --out="logs/solver-corpus2-batches/corpus1-batch-${{ steps.range.outputs.nn }}.json" \
            --summary-out="logs/solver-corpus2-batches/corpus1-batch-${{ steps.range.outputs.nn }}-summary.md"
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run level-blind Corpus-2 slice
        id: c2
        continue-on-error: true
        shell: bash
        env:
          DEADLINE: ${{ inputs.deterministic == 'true' && '86400000' || inputs.corpus2_budget_ms }}
        run: |
          set +e
          extra=()
          [ -n "${{ inputs.enable_flags }}" ] && extra+=("--enable-flags=${{ inputs.enable_flags }}")
          [ -n "${{ inputs.disable_flags }}" ] && extra+=("--disable-flags=${{ inputs.disable_flags }}")
          [ -n "${{ inputs.main_loop_late_reserve_fraction }}" ] && extra+=("--main-loop-late-reserve-fraction=${{ inputs.main_loop_late_reserve_fraction }}")
          [ -n "${{ inputs.main_loop_late_reserve_config_count }}" ] && extra+=("--main-loop-late-reserve-config-count=${{ inputs.main_loop_late_reserve_config_count }}")
          [ "${{ inputs.persist_hints }}" = "true" ] && extra+=("--save-hints")
          [ "${{ inputs.lifecycle_telemetry }}" = "true" ] && extra+=("--lifecycle-telemetry")
          work=$(( ${{ inputs.corpus2_node_budget }} * 134 / 100 ))
          timeout -k 30s --preserve-status "${{ needs.plan.outputs.c2_timeout_min }}m" node scripts/run-bundled.mjs scripts/level-blind-capability-sweep.mjs -- \
            --corpus=data/stress/stress-levels-random.json \
            --levels="pos:${{ steps.range.outputs.c2start }}-${{ steps.range.outputs.c2end }}" \
            --budget-ms="${DEADLINE}" \
            --node-budget="${{ inputs.corpus2_node_budget }}" \
            --work-budget="${work}" \
            --workers="${{ inputs.corpus2_workers }}" \
            "${extra[@]}" \
            --out="logs/solver-corpus2-batches/batch-${{ steps.range.outputs.nn }}.json" \
            --summary-out="logs/solver-corpus2-batches/batch-${{ steps.range.outputs.nn }}-summary.md"
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Stage shard artifact
        if: always()
        shell: bash
        run: |
          stage="artifact-staging/stress-shard-${{ steps.range.outputs.nn }}"
          mkdir -p "$stage/logs/solver-corpus2-batches" "$stage/data/stress/hints" "$stage/data/stress/hints-random"
          for f in \
            "logs/solver-corpus2-batches/batch-${{ steps.range.outputs.nn }}.json" \
            "logs/solver-corpus2-batches/batch-${{ steps.range.outputs.nn }}-summary.md" \
            "logs/solver-corpus2-batches/corpus1-batch-${{ steps.range.outputs.nn }}.json" \
            "logs/solver-corpus2-batches/corpus1-batch-${{ steps.range.outputs.nn }}-summary.md"; do
            [ -e "$f" ] && cp "$f" "$stage/logs/solver-corpus2-batches/"
          done
          git status --porcelain -- data/stress/hints/ data/stress/hints-random/ | awk '{print $2}' | while read -r f; do
            mkdir -p "$stage/$(dirname "$f")"
            cp "$f" "$stage/$f"
          done

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-shard-${{ steps.range.outputs.nn }}
          path: artifact-staging/stress-shard-${{ steps.range.outputs.nn }}
          if-no-files-found: error
          retention-days: 90

      - name: Fail on unexpected sweep error
        if: >-
          always() &&
          ((steps.c1.outputs.exit_code != '0' && steps.c1.outputs.exit_code != '124' && steps.c1.outputs.exit_code != '143') ||
           (steps.c2.outputs.exit_code != '0' && steps.c2.outputs.exit_code != '124' && steps.c2.outputs.exit_code != '143'))
        run: exit 1

  combine:
    name: Combine level-blind capability results
    needs: [solve-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'stress-shard-*'
          path: artifact-staging/downloaded
          merge-multiple: true

      - name: Remove stale live shard files, lay down this run, and combine
        shell: bash
        run: |
          # A missing artifact must become missing coverage, never silently inherit a shard from the
          # checked-out previous refresh.
          rm -f logs/solver-corpus2-batches/batch-*.json \
                logs/solver-corpus2-batches/batch-*-summary.md \
                logs/solver-corpus2-batches/corpus1-batch-*.json \
                logs/solver-corpus2-batches/corpus1-batch-*-summary.md
          cp -a artifact-staging/downloaded/. ./
          C1=$(ls logs/solver-corpus2-batches/corpus1-batch-*.json 2>/dev/null | paste -sd, -)
          C2=$(ls logs/solver-corpus2-batches/batch-*.json 2>/dev/null | paste -sd, -)
          [ -n "$C1" ] && npm run solver:combine-corpus2-batches -- --in="${C1}" --out=reports/stress/benchmark-parallel.json
          [ -n "$C2" ] && npm run solver:combine-corpus2-batches -- --in="${C2}" --out=reports/stress/benchmark-latest-random.json

      - name: Verify complete coverage and level-blind provenance
        id: coverage
        continue-on-error: true
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const expected = [['reports/stress/benchmark-parallel.json', 102], ['reports/stress/benchmark-latest-random.json', 1700]];
          let ok = true;
          for (const [file, total] of expected) {
            if (!fs.existsSync(file)) { console.error(`${file}: missing`); ok = false; continue; }
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const rows = report.levels ?? [];
            if (rows.length !== total) { console.error(`${file}: ${rows.length}/${total} levels; incomplete.`); ok = false; }
            if (rows.some(r => r.solvedByPrime)) { console.error(`${file}: solvedByPrime appeared in a capability report.`); ok = false; }
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `complete=${ok ? 'true' : 'false'}\n`);
          if (!ok) process.exit(1);
          NODE

      - name: Regenerate derived stress metadata and compact run record
        if: steps.coverage.outputs.complete == 'true'
        shell: bash
        run: |
          node scripts/stress/rank-levels.mjs --in=reports/stress/benchmark-latest-random.json --status=unsolved --top=30 || true
          node scripts/stress/classify-stability.mjs --in=reports/stress/benchmark-latest-random.json --out=reports/stress/stability-random.json || true
          npm run stress:curate-dev-benchmark -- --benchmark=reports/stress/benchmark-latest-random.json || true
          node scripts/stress/compile-baseline.mjs --mode=corpus2 --official=reports/stress/benchmark-latest-random.json
          node scripts/stress/compile-baseline.mjs --mode=corpus1 --official=reports/stress/benchmark-parallel.json
          mkdir -p "reports/stress/capability-runs/${{ github.run_id }}"
          node - <<'NODE'
          // This directory is the ONLY durable, always-committed record of a run's per-level result --
          // the uploaded Actions artifact (raw benchmark JSON, full attempts/techniqueLifecycle detail)
          // is NOT a substitute: it lives on Azure blob storage, whose download has been observed
          // blocked (403) by at least one Claude sandbox's egress policy (see the "Print repair-probe
          // badness distribution" step's own note, and reports/2026-08-15-connectivity-axis-exhausted-
          // regression.md's follow-up). A "leaner than the raw report, richer than an aggregate count"
          // per-level projection is written here specifically so a later flip/regression analysis never
          // depends on artifact-zip access being available.
          const fs = require('node:fs');
          const dir = `reports/stress/capability-runs/${process.env.RUN_ID}`;
          const project = file => {
            const r = JSON.parse(fs.readFileSync(file, 'utf8'));
            const rows = r.levels ?? [];
            return {
              commitSha: r.commitSha,
              rows: rows.map(x => ({
                id: x.id ?? String(x.level), level: x.level, ok: x.ok, status: x.status,
                nodesExpanded: x.nodesExpanded, workSpent: x.workSpent, elapsedMs: x.elapsedMs,
                deadlineTruncated: x.deadlineTruncated, winningConfig: x.winningConfig,
                attemptCount: x.attemptCount, failedStrategies: x.failedStrategies,
                solution: x.solution,
              })),
            };
          };
          const summarize = projected => ({
            total: projected.rows.length,
            solved: projected.rows.filter(x => x.ok).length,
            solvedIds: projected.rows.filter(x => x.ok).map(x => x.id).sort(),
            nodes: projected.rows.reduce((n,x) => n + (x.nodesExpanded || 0), 0),
            work: projected.rows.reduce((n,x) => n + (x.workSpent || 0), 0),
            commitSha: projected.commitSha,
          });
          const c1 = project('reports/stress/benchmark-parallel.json');
          const c2 = project('reports/stress/benchmark-latest-random.json');
          const record = {
            runId: process.env.RUN_ID,
            solverRef: process.env.SOLVER_REF,
            levelBlind: true,
            enableFlags: process.env.ENABLE_FLAGS,
            disableFlags: process.env.DISABLE_FLAGS,
            deterministic: process.env.DETERMINISTIC,
            persistHints: process.env.PERSIST_HINTS,
            corpus1: summarize(c1),
            corpus2: summarize(c2),
          };
          fs.writeFileSync(`${dir}/summary.json`, JSON.stringify(record, null, 2) + '\n');
          fs.writeFileSync(`${dir}/per-level-corpus1.json`, JSON.stringify(c1, null, 2) + '\n');
          fs.writeFileSync(`${dir}/per-level-corpus2.json`, JSON.stringify(c2, null, 2) + '\n');
          NODE
        env:
          RUN_ID: ${{ github.run_id }}
          SOLVER_REF: ${{ github.sha }}
          ENABLE_FLAGS: ${{ inputs.enable_flags }}
          DISABLE_FLAGS: ${{ inputs.disable_flags }}
          DETERMINISTIC: ${{ inputs.deterministic }}
          PERSIST_HINTS: ${{ inputs.persist_hints }}

      - name: Mass-weighted lifecycle failure map
        if: steps.coverage.outputs.complete == 'true' && inputs.lifecycle_telemetry == 'true'
        shell: bash
        run: |
          node scripts/stress/lifecycle-failure-map.mjs \
            --in=reports/stress/benchmark-parallel.json \
            --out="reports/stress/capability-runs/${{ github.run_id }}/lifecycle-failure-map-corpus1.json" \
            --summary-out="reports/stress/capability-runs/${{ github.run_id }}/lifecycle-failure-map-corpus1-summary.md"
          node scripts/stress/lifecycle-failure-map.mjs \
            --in=reports/stress/benchmark-latest-random.json \
            --out="reports/stress/capability-runs/${{ github.run_id }}/lifecycle-failure-map-corpus2.json" \
            --summary-out="reports/stress/capability-runs/${{ github.run_id }}/lifecycle-failure-map-corpus2-summary.md"

      - name: Print solved counts
        if: steps.coverage.outputs.complete == 'true'
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          for (const [name, file] of [['corpus-1','reports/stress/benchmark-parallel.json'], ['corpus-2','reports/stress/benchmark-latest-random.json']]) {
            const r = JSON.parse(fs.readFileSync(file,'utf8'));
            const rows = r.levels ?? [];
            const solved = rows.filter(x => x.ok).length;
            const nodes = rows.reduce((n,x) => n + (x.nodesExpanded || 0), 0);
            const work = rows.reduce((n,x) => n + (x.workSpent || 0), 0);
            console.log(`SOLVED ${name}: ${solved}/${rows.length} nodes=${nodes} work=${work} levelBlind=true`);
          }
          NODE

      - name: Print repair-probe badness distribution
        if: steps.coverage.outputs.complete == 'true'
        shell: bash
        # A full-population run through THIS workflow is the usual promotion bar for a flag like
        # STRATEGY_REPAIR_PROBE_ADAPTIVE_BIASED_BUDGET (see docs/future-work.md item #4 and
        # docs/solver-opt-in-experiment-ledger.md's still-open BADNESS_GATE/MIN_SCALE recalibration
        # caveat) -- print this to the JOB CONSOLE LOG specifically, not just the uploaded artifact,
        # since this session's egress policy has been observed blocking the artifact-download zip
        # (Azure blob storage, 403). See scripts/stress/repair-probe-badness-report.mjs.
        run: |
          node scripts/run-bundled.mjs scripts/stress/repair-probe-badness-report.mjs -- --in=reports/stress/benchmark-parallel.json
          node scripts/run-bundled.mjs scripts/stress/repair-probe-badness-report.mjs -- --in=reports/stress/benchmark-latest-random.json

      - name: Upload combined results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solver-stress-refresh-combined
          path: |
            reports/stress/
            logs/solver-corpus2-batches/
          if-no-files-found: error
          retention-days: 90

      - name: Persist capability outputs and/or newly found hints
        # Always runs when coverage is complete: the per-run analysis summary (reports/stress/
        # capability-runs/<run_id>/) is unconditional, so every completed run leaves a durable,
        # git-fetchable per-level record even under persist_hints=false + deterministic=true -- see
        # persist_hints's/deterministic's own input descriptions above for why this can never let one
        # A/B arm mutate what a queued arm measures (the directory is namespaced by run id and never
        # read back into any solve). Hint-corpus writes and canonical baseline/report overwrites stay
        # conditional exactly as before.
        if: steps.coverage.outputs.complete == 'true'
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "reports/stress/capability-runs/${{ github.run_id }}/"
          git add data/stress/hints/ data/stress/hints-random/ data/stress/stress-levels.json data/stress/stress-levels-random.json
          if [ "${{ inputs.deterministic }}" != "true" ]; then
            git add logs/stress-corpus1-baseline.json logs/stress-corpus2-baseline.json reports/stress/
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Solver level-blind capability refresh (${{ github.run_id }})"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep $((attempt * 5))
            git fetch origin "${{ github.ref_name }}"
            # Discard any unstaged modifications to tracked files this run deliberately did NOT stage
            # above (e.g. reports/stress/benchmark-*.json when deterministic=true, which the sweep
            # still overwrites on disk even though we chose not to commit it). Without this, `git
            # rebase` refuses with "You have unstaged changes. Please commit or stash them." the moment
            # any other commit -- e.g. an unrelated chore(audit) auto-commit -- lands on the branch
            # first, which is exactly what happened on run 31871824532 and silently dropped its whole
            # persist step, hints included. Safe: anything left unstaged here was never meant to be
            # committed by this run in the first place.
            git checkout -- .
            git rebase "origin/${{ github.ref_name }}" || exit 1
          done
          exit 1

      - name: Fail incomplete capability run
        if: steps.coverage.outputs.complete != 'true'
        run: |
          echo 'Capability run incomplete; results were uploaded but no baseline/report state was persisted.'
          exit 1
