name: Temporary solution-profile resource audit

on:
  push:
    branches:
      - chatgpt/solution-profile-resource-audit-2026-09-13
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run empirical audit
        run: node scripts/run-bundled.mjs scripts/stress/solution-profile-resource-audit.mjs
