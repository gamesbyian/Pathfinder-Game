name: Repair envelope Hint schema v4 migration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hint-envelope-v4-migration-repair.yml'
      - 'scripts/hint-artifact-v4-migration.mjs'
      - 'modules/domain/hint-runtime.mjs'
      - 'data/stress/hints-envelope/**'

permissions:
  contents: write

concurrency:
  group: hint-envelope-v4-migration-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Apply schema-v4 migration to omitted envelope store
        run: |
          node scripts/hint-artifact-v4-migration.mjs \
            --apply \
            --dirs=data/stress/hints-envelope \
            --out=/tmp/hint-envelope-v4-migration.json

      - name: Prove immediate migration idempotency
        run: |
          node scripts/hint-artifact-v4-migration.mjs \
            --dirs=data/stress/hints-envelope \
            --out=/tmp/hint-envelope-v4-rerun.json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/hint-envelope-v4-rerun.json', 'utf8'));
          if (report.totals?.filesChanged !== 0) {
            console.error(JSON.stringify(report.totals, null, 2));
            process.exit(1);
          }
          NODE

      - name: Upload reversible migration evidence
        uses: actions/upload-artifact@v7
        with:
          name: hint-envelope-v4-migration
          path: |
            /tmp/hint-envelope-v4-migration.json
            /tmp/hint-envelope-v4-rerun.json
          if-no-files-found: error
          retention-days: 14

      - name: Commit migrated envelope artifacts when needed
        run: |
          if git diff --quiet -- data/stress/hints-envelope; then
            echo "Envelope Hint store already canonical v4; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stress/hints-envelope
          git commit -m "Migrate omitted envelope Hint store to schema v4"
          git push origin "HEAD:${{ github.head_ref }}"
