name: Repair omitted Hint schema v4 migration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/hint-envelope-v4-migration-repair.yml'
      - 'scripts/hint-artifact-v4-migration.mjs'
      - 'modules/domain/hint-runtime.mjs'
      - 'data/stress/hints-envelope/**'
      - 'data/families/hints/**'
      - 'data/families/phaseB/hints/**'

permissions:
  contents: write

concurrency:
  group: hint-envelope-v4-migration-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.2

      - name: Apply schema-v4 migration to every tracked Hint store
        run: |
          node scripts/hint-artifact-v4-migration.mjs \
            --apply \
            --out=/tmp/hint-omitted-v4-migration.json

      - name: Prove immediate migration idempotency
        run: |
          node scripts/hint-artifact-v4-migration.mjs \
            --out=/tmp/hint-omitted-v4-rerun.json
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('/tmp/hint-omitted-v4-rerun.json', 'utf8'));
          if (report.changedFiles !== 0) {
            console.error(JSON.stringify({ changedFiles: report.changedFiles, files: report.files }, null, 2));
            process.exit(1);
          }
          NODE

      - name: Referee-validate every tracked Hint store after migration
        run: node scripts/validate-all-hint-stores.mjs | tee /tmp/hint-all-store-referee.txt

      - name: Upload reversible migration evidence
        uses: actions/upload-artifact@v7
        with:
          name: hint-omitted-v4-migration
          path: |
            /tmp/hint-omitted-v4-migration.json
            /tmp/hint-omitted-v4-rerun.json
            /tmp/hint-all-store-referee.txt
          if-no-files-found: error
          retention-days: 14

      - name: Commit migrated omitted artifacts when needed
        run: |
          if git diff --quiet -- data/stress/hints-envelope data/families/hints data/families/phaseB/hints; then
            echo "All tracked Hint stores already canonical v4; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stress/hints-envelope data/families/hints data/families/phaseB/hints
          git commit -m "Migrate omitted tracked Hint stores to schema v4"
          git push origin "HEAD:${{ github.head_ref }}"
