name: CI testability topology audit

on:
  workflow_dispatch:
    inputs:
      historical_audit_run_id:
        description: Optional CI historical value audit run ID to join detector/runtime evidence
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/ci-testability-topology-audit.yml'
      - 'scripts/ci-testability-topology-audit.mjs'
      - 'scripts/ci-dependency-local-routing-audit.mjs'
      - 'scripts/validation-groups.json'
      - 'package.json'

permissions:
  contents: read
  actions: read

jobs:
  full-deep-concurrency:
    if: github.event_name == 'workflow_dispatch'
    name: full-deep-concurrency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/
          sparse-checkout-cone-mode: false
      - name: Derive runtime-data cache key
        id: runtime-data-key
        shell: bash
        run: |
          {
            git rev-parse HEAD:data/levels.json
            git rev-parse HEAD:data/level-heatmaps.json
            git rev-parse HEAD:data/themes.json
            git rev-parse HEAD:data/hints
            git rev-parse HEAD:data/stress/stress-levels.json
            git rev-parse HEAD:data/stress/stress-levels-random.json
            git rev-parse HEAD:data/stress/stress-levels-envelope.json
            git rev-parse HEAD:data/stress/hints
            git rev-parse HEAD:data/stress/hints-random
            git rev-parse HEAD:data/stress/hints-envelope
          } | sha256sum | awk '{print "key="$1}' >> "$GITHUB_OUTPUT"
      - name: Require warm runtime data
        uses: actions/cache/restore@v5
        with:
          path: |
            data/levels.json
            data/level-heatmaps.json
            data/themes.json
            data/hints
            data/stress/stress-levels.json
            data/stress/stress-levels-random.json
            data/stress/stress-levels-envelope.json
            data/stress/hints
            data/stress/hints-random
            data/stress/hints-envelope
          key: runtime-data-${{ steps.runtime-data-key.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Derive dependency-tree key
        id: dependency-tree-key
        shell: bash
        run: |
          echo "key=node-modules-${RUNNER_OS}-$(node -p 'process.arch')-node$(node --version)-npm$(npm --version)-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Require warm dependency tree
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ steps.dependency-tree-key.outputs.key }}
          fail-on-cache-miss: true
      - name: Restore Firebase CLI cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.npm/_npx
          key: firebase-cli-${{ runner.os }}-node22.23.2-firebase-tools-15.28.2-v1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run coverage, proofs, and Firestore concurrently
        shell: bash
        run: |
          set +e
          start="$(date +%s)"
          SOLVER_DEADLOCK_PROOF_SKIP=1 SOLVER_R02560_PROOF_SKIP=1 \
            npm run test:coverage > /tmp/full-deep-coverage.log 2>&1 &
          coverage_pid=$!
          npm run test:deep-proofs > /tmp/full-deep-proofs.log 2>&1 &
          proofs_pid=$!
          npx --yes firebase-tools@15.28.2 \
            emulators:exec --only firestore \
            --project demo-pathfinder-fingerprint-boundary \
            "npm run test:firestore-level-fingerprint-boundary" \
            > /tmp/full-deep-firestore.log 2>&1 &
          firestore_pid=$!

          wait "$coverage_pid"; coverage_status=$?
          wait "$proofs_pid"; proofs_status=$?
          wait "$firestore_pid"; firestore_status=$?
          end="$(date +%s)"

          echo "Full concurrent deep validation wall: $((end - start))s"
          echo '=== covered implementation population ==='
          cat /tmp/full-deep-coverage.log
          echo '=== heavyweight solver proofs ==='
          cat /tmp/full-deep-proofs.log
          echo '=== Firestore persistence boundary ==='
          cat /tmp/full-deep-firestore.log

          if [[ "$coverage_status" -ne 0 || "$proofs_status" -ne 0 || "$firestore_status" -ne 0 ]]; then
            echo "::error::coverage=$coverage_status deep-proofs=$proofs_status firestore=$firestore_status"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Build CI testability topology
        run: node scripts/ci-testability-topology-audit.mjs
      - name: Audit dependency-local routing potential
        run: node scripts/ci-dependency-local-routing-audit.mjs
      - name: Download historical CI audit artifact
        if: ${{ inputs.historical_audit_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORICAL_AUDIT_RUN_ID: ${{ inputs.historical_audit_run_id }}
        shell: bash
        run: |
          rm -rf tmp/ci-history-source
          mkdir -p tmp/ci-history-source
          gh run download "${HISTORICAL_AUDIT_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name ci-historical-audit-corpus \
            --dir tmp/ci-history-source
      - name: Join topology to historical economics
        if: ${{ inputs.historical_audit_run_id != '' }}
        run: node scripts/ci-testability-economics-join.mjs
      - name: Summarize topology
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('tmp/ci-testability-topology.json', 'utf8'));
          console.log('## CI testability topology');
          console.log();
          console.log(`- Permanent contracts: **${d.summary.totalContracts}**`);
          console.log(`- Validators: **${d.summary.validators}**`);
          console.log(`- Node/CLI harnesses: **${d.summary.nodeTests}**`);
          console.log();
          console.log('### Invocation modes');
          console.log();
          console.log('| Mode | Contracts |');
          console.log('| --- | ---: |');
          for (const [name, count] of Object.entries(d.summary.invocationModes).sort((a, b) => b[1] - a[1])) {
            console.log(`| \`${name}\` | ${count} |`);
          }
          console.log();
          console.log('### Static refactor candidates');
          console.log();
          console.log('| Candidate | Contracts |');
          console.log('| --- | ---: |');
          for (const [name, count] of Object.entries(d.summary.refactorCandidateCounts).sort((a, b) => b[1] - a[1])) {
            console.log(`| \`${name}\` | ${count} |`);
          }
          NODE
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('tmp/ci-dependency-local-routing-audit.json', 'utf8'));
          console.log();
          console.log('### Dependency-local routing shadow');
          console.log();
          console.log(`- Contracts with local entrypoints: **${d.summary.contractsWithEntrypoints}/${d.summary.contracts}**`);
          console.log(`- Static-import-sufficient candidates: **${d.summary.staticImportSufficientCandidates}**`);
          console.log(`- Contracts with unresolved local edges: **${d.summary.contractsWithUnresolvedEdges}**`);
          console.log(`- Contracts with nonliteral dynamic imports: **${d.summary.contractsWithUnknownDynamicImports}**`);
          console.log(`- Source files with registered consumers: **${d.summary.sourceFilesWithRegisteredConsumers}**`);
          console.log();
          console.log('| Surface | contracts | static-only candidates | fs deps | child-process deps | unknown dynamic |');
          console.log('| --- | ---: | ---: | ---: | ---: | ---: |');
          for (const [surface, row] of Object.entries(d.bySurface)) {
            console.log(`| \`${surface}\` | ${row.contracts} | ${row.staticImportSufficientCandidates} | ${row.withFilesystemDependency} | ${row.withChildProcessDependency} | ${row.withUnknownDynamicImports} |`);
          }
          NODE
          if [[ -f tmp/ci-testability-economics.json ]]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('tmp/ci-testability-economics.json', 'utf8'));
            console.log();
            console.log('### Historical economics join');
            console.log();
            console.log(`- Episodes with parsed detector signatures: **${d.historyCoverage.episodesWithSignatures ?? 'n/a'}**`);
            console.log(`- Historical representative-log gaps: **${d.historyCoverage.retrievalGapCount ?? 'n/a'}**`);
            console.log();
            console.log('| Group | contracts | observed s | detector appearances | zero-hit observed contracts |');
            console.log('| --- | ---: | ---: | ---: | ---: |');
            for (const [name, row] of Object.entries(d.groupSummary).sort((a, b) => b[1].observedTotalSeconds - a[1].observedTotalSeconds)) {
              console.log(`| \`${name}\` | ${row.contracts} | ${row.observedTotalSeconds.toFixed(1)} | ${row.representativeDetectorAppearances} | ${row.observedZeroHitContracts} |`);
            }
          NODE
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ci-testability-topology
          path: |
            tmp/ci-testability-topology.json
            tmp/ci-testability-economics.json
            tmp/ci-dependency-local-routing-audit.json
          retention-days: 30

  node-shards-cacheless:
    name: node-shard-cacheless-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/logs/*
            /logs/artifact-metadata.json
            /logs/solver-canary-baseline.json
            /logs/*.md
            /logs/**/*.md
            !/reports/*
            /reports/*.md
            /reports/*.json
            /reports/**/*.md
            /reports/stress/experiment-evidence/**/manifest.json
            /reports/stress/experiment-evidence/35467098808__run-35467098808__attempt-1/bundle.json
            /reports/stress/experiment-evidence/35467098808__run-35467098808__attempt-1/evidence/primary/result.json
            /reports/stress/failure-evidence/class3-dose-expectations-2026-09-19.json
            /reports/stress/lane-a-c0-exact-label-projection-2026-09-20.json
            /reports/stress/lane-a-frozen-prefix-population-2026-09-18.json
            /reports/stress/class5-separator-decomposition-census-2026-09-18-with-geometry.json
            /reports/stress/lane-e-multi-pick-bisection-2026-09-17.json
            /reports/stress/class5-multi-pick-lane-e-input-2026-09-17.json
            /reports/stress/failure-evidence/ws2-class3-shared-acquisition-population-2026-09-20.json
            /reports/stress/failure-evidence/ws2-reconnaissance-solved-control-sample-2026-09-19.json
            !/data/
          sparse-checkout-cone-mode: false
      - name: Derive runtime-data cache key
        id: shard-runtime-data-key
        shell: bash
        run: |
          {
            git rev-parse HEAD:data/levels.json
            git rev-parse HEAD:data/level-heatmaps.json
            git rev-parse HEAD:data/themes.json
            git rev-parse HEAD:data/hints
            git rev-parse HEAD:data/stress/stress-levels.json
            git rev-parse HEAD:data/stress/stress-levels-random.json
            git rev-parse HEAD:data/stress/stress-levels-envelope.json
            git rev-parse HEAD:data/stress/hints
            git rev-parse HEAD:data/stress/hints-random
            git rev-parse HEAD:data/stress/hints-envelope
          } | sha256sum | awk '{print "key="$1}' >> "$GITHUB_OUTPUT"
      - name: Require warm runtime-data cache
        uses: actions/cache/restore@v5
        with:
          path: |
            data/levels.json
            data/level-heatmaps.json
            data/themes.json
            data/hints
            data/stress/stress-levels.json
            data/stress/stress-levels-random.json
            data/stress/stress-levels-envelope.json
            data/stress/hints
            data/stress/hints-random
            data/stress/hints-envelope
          key: runtime-data-${{ steps.shard-runtime-data-key.outputs.key }}
          fail-on-cache-miss: true
      - name: Derive exact dependency-tree cache key
        id: shard-dependency-tree-key
        shell: bash
        run: |
          echo "key=node-modules-${RUNNER_OS}-x64-nodev22.23.2-npm10.9.8-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Require warm exact dependency tree
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ steps.shard-dependency-tree-key.outputs.key }}
          fail-on-cache-miss: true
      - name: Set up Node without redundant npm-cache restore
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Run measured Node shard
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          PATHFINDER_PARALLEL_JOBS: '4'
          PATHFINDER_DIRECT_PACKAGE_SCRIPTS: '1'
          PATHFINDER_PARALLEL_SUCCESS_OUTPUT: summary
        run: |
          mapfile -t selected < <(node - <<'NODE'
          const fs = require('fs');
          const shard = Number(process.env.SHARD);
          const profile = JSON.parse(fs.readFileSync('scripts/ci-node-shard-timings.rehearsal.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const prefix = 'node scripts/run-scripts-parallel.mjs ';
          const command = pkg.scripts['test:node'];
          if (!command.startsWith(prefix)) throw new Error('test:node command shape changed');
          const names = command.slice(prefix.length).trim().split(/\s+/);
          const timing = new Map(profile.contracts.map(row => [row.name, Number(row.seconds)]));
          const missing = names.filter(name => !timing.has(name));
          const stale = profile.contracts.filter(row => !names.includes(row.name)).map(row => row.name);
          if (missing.length || stale.length) {
            throw new Error('timing profile does not exactly cover current test:node registry: '
              + JSON.stringify({ missing, stale }));
          }
          const bins = [{ total: 0, names: [] }, { total: 0, names: [] }];
          for (const name of [...names].sort((a, b) => timing.get(b) - timing.get(a) || a.localeCompare(b))) {
            bins.sort((a, b) => a.total - b.total);
            bins[0].names.push(name);
            bins[0].total += timing.get(name);
          }
          const chosen = bins[shard - 1];
          console.error(JSON.stringify({ shard, predictedChildSeconds: chosen.total, contracts: chosen.names.length }));
          for (const name of chosen.names) console.log(name);
          NODE
          )
          node scripts/run-scripts-parallel.mjs "${selected[@]}"

  coverage-balanced-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/
          sparse-checkout-cone-mode: false
      - name: Derive runtime-data cache key
        id: runtime-data-key
        shell: bash
        run: |
          {
            git rev-parse HEAD:data/levels.json
            git rev-parse HEAD:data/level-heatmaps.json
            git rev-parse HEAD:data/themes.json
            git rev-parse HEAD:data/hints
            git rev-parse HEAD:data/stress/stress-levels.json
            git rev-parse HEAD:data/stress/stress-levels-random.json
            git rev-parse HEAD:data/stress/stress-levels-envelope.json
            git rev-parse HEAD:data/stress/hints
            git rev-parse HEAD:data/stress/hints-random
            git rev-parse HEAD:data/stress/hints-envelope
          } | sha256sum | awk '{print "key="$1}' >> "$GITHUB_OUTPUT"
      - name: Require warm runtime-data cache
        uses: actions/cache/restore@v5
        with:
          path: |
            data/levels.json
            data/level-heatmaps.json
            data/themes.json
            data/hints
            data/stress/stress-levels.json
            data/stress/stress-levels-random.json
            data/stress/stress-levels-envelope.json
            data/stress/hints
            data/stress/hints-random
            data/stress/hints-envelope
          key: runtime-data-${{ steps.runtime-data-key.outputs.key }}
          fail-on-cache-miss: true
      - name: Derive exact dependency-tree cache key
        id: dependency-tree-key
        shell: bash
        run: |
          echo "key=node-modules-${RUNNER_OS}-x64-nodev22.23.2-npm10.9.8-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Require warm exact dependency tree
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ steps.dependency-tree-key.outputs.key }}
          fail-on-cache-miss: true
      - name: Set up Node without redundant npm-cache restore
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Run measured coverage shard 2
        env:
          PATHFINDER_COVERAGE_SHARD: '1'
          SOLVER_DEADLOCK_PROOF_SKIP: '1'
          SOLVER_R02560_PROOF_SKIP: '1'
          SHARD: '2'
        shell: bash
        run: |
          mapfile -t selected < <(node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const profile = JSON.parse(fs.readFileSync('scripts/ci-coverage-shard-timings.rehearsal.json', 'utf8'));
          function walk(dir, out=[]) {
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.posix.join(dir, ent.name);
              if (ent.isDirectory()) walk(p, out);
              else out.push(p);
            }
            return out;
          }
          const current = new Set([
            ...walk('modules').filter(p => p.endsWith('.test.ts') && !p.endsWith('-test-support.test.ts')),
            ...walk('scripts').filter(p => p.endsWith('-unit-tests.mjs')),
            'scripts/path-state-invariant-tests.mjs',
          ]);
          const timing = new Map(profile.contracts.map(x => [x.name, Number(x.seconds)]));
          const missing = [...current].filter(x => !timing.has(x));
          const stale = [...timing.keys()].filter(x => !current.has(x));
          if (missing.length || stale.length) {
            throw new Error('coverage timing profile does not exactly cover current Vitest file registry: '
              + JSON.stringify({ missing, stale }));
          }
          const bins = [{ total: 0, files: [] }, { total: 0, files: [] }];
          for (const file of [...current].sort((a,b) => timing.get(b)-timing.get(a) || a.localeCompare(b))) {
            bins.sort((a,b) => a.total-b.total);
            bins[0].files.push(file);
            bins[0].total += timing.get(file);
          }
          bins.sort((a,b) => b.total-a.total);
          const chosen = bins[1];
          console.error(JSON.stringify({ shard: 2, predictedSeconds: chosen.total, files: chosen.files.length }));
          for (const file of chosen.files) console.log(file);
          NODE
          )
          npx vitest run "${selected[@]}" --coverage --reporter=blob --outputFile=tmp/coverage-worker.blob
      - name: Upload worker coverage blob
        uses: actions/upload-artifact@v7
        with:
          name: coverage-balanced-worker
          path: tmp/coverage-worker.blob
          if-no-files-found: error
          retention-days: 7

  coverage-balanced-coordinator:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/
          sparse-checkout-cone-mode: false
      - name: Derive runtime-data cache key
        id: runtime-data-key
        shell: bash
        run: |
          {
            git rev-parse HEAD:data/levels.json
            git rev-parse HEAD:data/level-heatmaps.json
            git rev-parse HEAD:data/themes.json
            git rev-parse HEAD:data/hints
            git rev-parse HEAD:data/stress/stress-levels.json
            git rev-parse HEAD:data/stress/stress-levels-random.json
            git rev-parse HEAD:data/stress/stress-levels-envelope.json
            git rev-parse HEAD:data/stress/hints
            git rev-parse HEAD:data/stress/hints-random
            git rev-parse HEAD:data/stress/hints-envelope
          } | sha256sum | awk '{print "key="$1}' >> "$GITHUB_OUTPUT"
      - name: Require warm runtime-data cache
        uses: actions/cache/restore@v5
        with:
          path: |
            data/levels.json
            data/level-heatmaps.json
            data/themes.json
            data/hints
            data/stress/stress-levels.json
            data/stress/stress-levels-random.json
            data/stress/stress-levels-envelope.json
            data/stress/hints
            data/stress/hints-random
            data/stress/hints-envelope
          key: runtime-data-${{ steps.runtime-data-key.outputs.key }}
          fail-on-cache-miss: true
      - name: Derive exact dependency-tree cache key
        id: dependency-tree-key
        shell: bash
        run: |
          echo "key=node-modules-${RUNNER_OS}-x64-nodev22.23.2-npm10.9.8-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Require warm exact dependency tree
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ steps.dependency-tree-key.outputs.key }}
          fail-on-cache-miss: true
      - name: Set up Node without redundant npm-cache restore
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Run measured coverage shard 1
        env:
          PATHFINDER_COVERAGE_SHARD: '1'
          SOLVER_DEADLOCK_PROOF_SKIP: '1'
          SOLVER_R02560_PROOF_SKIP: '1'
        shell: bash
        run: |
          mapfile -t selected < <(node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const profile = JSON.parse(fs.readFileSync('scripts/ci-coverage-shard-timings.rehearsal.json', 'utf8'));
          function walk(dir, out=[]) {
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.posix.join(dir, ent.name);
              if (ent.isDirectory()) walk(p, out);
              else out.push(p);
            }
            return out;
          }
          const current = new Set([
            ...walk('modules').filter(p => p.endsWith('.test.ts') && !p.endsWith('-test-support.test.ts')),
            ...walk('scripts').filter(p => p.endsWith('-unit-tests.mjs')),
            'scripts/path-state-invariant-tests.mjs',
          ]);
          const timing = new Map(profile.contracts.map(x => [x.name, Number(x.seconds)]));
          const missing = [...current].filter(x => !timing.has(x));
          const stale = [...timing.keys()].filter(x => !current.has(x));
          if (missing.length || stale.length) {
            throw new Error('coverage timing profile does not exactly cover current Vitest file registry: '
              + JSON.stringify({ missing, stale }));
          }
          const bins = [{ total: 0, files: [] }, { total: 0, files: [] }];
          for (const file of [...current].sort((a,b) => timing.get(b)-timing.get(a) || a.localeCompare(b))) {
            bins.sort((a,b) => a.total-b.total);
            bins[0].files.push(file);
            bins[0].total += timing.get(file);
          }
          bins.sort((a,b) => b.total-a.total);
          const chosen = bins[0];
          console.error(JSON.stringify({ shard: 1, predictedSeconds: chosen.total, files: chosen.files.length }));
          for (const file of chosen.files) console.log(file);
          NODE
          )
          npx vitest run "${selected[@]}" --coverage --reporter=blob --outputFile=tmp/coverage-coordinator.blob
      - name: Wait for worker blob artifact
        id: worker-artifact
        shell: bash
        run: |
          artifact_id=""
          for attempt in $(seq 1 45); do
            artifact_id="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"               --jq '.artifacts[] | select(.name=="coverage-balanced-worker") | .id' | head -n1)"
            if [[ -n "$artifact_id" ]]; then
              echo "Worker artifact available on poll $attempt: $artifact_id"
              break
            fi
            sleep 1
          done
          if [[ -z "$artifact_id" ]]; then
            echo "Worker coverage artifact did not appear within 45s." >&2
            exit 1
          fi
          echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
      - name: Download worker blob and merge production coverage
        shell: bash
        env:
          ARTIFACT_ID: ${{ steps.worker-artifact.outputs.artifact_id }}
        run: |
          rm -rf tmp/coverage-blobs tmp/coverage-worker-download.zip
          mkdir -p tmp/coverage-blobs
          cp tmp/coverage-coordinator.blob tmp/coverage-blobs/
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > tmp/coverage-worker-download.zip
          unzip -q tmp/coverage-worker-download.zip -d tmp/coverage-blobs
          npx vitest --merge-reports=tmp/coverage-blobs             --reporter=default             --reporter=json             --outputFile=tmp/coverage-balanced-merged.json             --coverage
      - name: Upload merged coverage evidence
        uses: actions/upload-artifact@v7
        with:
          name: coverage-balanced-merged
          path: |
            coverage/coverage-summary.json
            tmp/coverage-balanced-merged.json
          if-no-files-found: error
          retention-days: 7

  firestore-boundary-independent:
    name: firestore-boundary-independent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/
          sparse-checkout-cone-mode: false
      - name: Derive exact dependency-tree cache key
        id: dependency-tree-key
        shell: bash
        run: |
          echo "key=node-modules-${RUNNER_OS}-x64-nodev22.23.2-npm10.9.8-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Require warm exact dependency tree
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ steps.dependency-tree-key.outputs.key }}
          fail-on-cache-miss: true
      - name: Set up Node without redundant npm-cache restore
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Restore Firebase CLI cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.npm/_npx
          key: firebase-cli-${{ runner.os }}-node22.23.2-firebase-tools-15.28.2-v1
          fail-on-cache-miss: true
      - name: Restore Firestore emulator binary
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firestore-emulator-${{ runner.os }}-firebase-tools-15.28.2-v1.22.0-v1
          fail-on-cache-miss: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Firestore persistence boundary
        shell: bash
        run: |
          start=$(date +%s%3N)
          npx --yes firebase-tools@15.28.2 \
            emulators:exec --only firestore \
            --project demo-pathfinder-fingerprint-boundary \
            "npm run test:firestore-level-fingerprint-boundary"
          end=$(date +%s%3N)
          echo "### Independent Firestore rehearsal" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Boundary execution: $((end-start)) ms" >> "$GITHUB_STEP_SUMMARY"

  firestore-boundary-direct-jar:
    name: firestore-boundary-direct-jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/
          sparse-checkout-cone-mode: false
      - name: Derive exact dependency-tree cache key
        id: dependency-tree-key
        shell: bash
        run: |
          echo "key=node-modules-${RUNNER_OS}-x64-nodev22.23.2-npm10.9.8-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Require warm exact dependency tree
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ steps.dependency-tree-key.outputs.key }}
          fail-on-cache-miss: true
      - name: Set up Node without redundant npm-cache restore
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Restore Firestore emulator binary
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firestore-emulator-${{ runner.os }}-firebase-tools-15.28.2-v1.22.0-v1
          fail-on-cache-miss: true
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run Firestore boundary against cached emulator JAR directly
        shell: bash
        run: |
          set -euo pipefail
          jar="$HOME/.cache/firebase/emulators/cloud-firestore-emulator-v1.22.0.jar"
          [[ -f "$jar" ]] || { echo "Missing cached Firestore emulator JAR: $jar" >&2; exit 1; }

          start=$(date +%s%3N)
          java \
            -Dgoogle.cloud_firestore.debug_log_level=FINE \
            -Duser.language=en \
            -jar "$jar" \
            --host 127.0.0.1 \
            --port 8080 \
            --rules firestore.rules \
            --project_id demo-pathfinder-fingerprint-boundary \
            > /tmp/firestore-direct.log 2>&1 &
          emulator_pid=$!
          cleanup() {
            kill "$emulator_pid" 2>/dev/null || true
            wait "$emulator_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in $(seq 1 100); do
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "Firestore emulator exited during startup." >&2
              cat /tmp/firestore-direct.log >&2
              exit 1
            fi
            if (echo > /dev/tcp/127.0.0.1/8080) 2>/dev/null; then
              ready=1
              break
            fi
            sleep 0.1
          done
          if [[ "$ready" != "1" ]]; then
            echo "Firestore emulator did not become ready." >&2
            cat /tmp/firestore-direct.log >&2
            exit 1
          fi

          FIRESTORE_EMULATOR_HOST=127.0.0.1:8080 \
          GCLOUD_PROJECT=demo-pathfinder-fingerprint-boundary \
          GOOGLE_CLOUD_PROJECT=demo-pathfinder-fingerprint-boundary \
            npm run test:firestore-level-fingerprint-boundary

          end=$(date +%s%3N)
          echo "### Direct-JAR Firestore rehearsal" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Emulator startup + boundary execution: $((end-start)) ms" >> "$GITHUB_STEP_SUMMARY"
