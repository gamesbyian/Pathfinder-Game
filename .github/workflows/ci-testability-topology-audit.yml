name: CI testability topology audit

on:
  workflow_dispatch:
    inputs:
      historical_audit_run_id:
        description: Optional CI historical value audit run ID to join detector/runtime evidence
        required: false
        type: string
  pull_request:
    paths:
      - '.github/workflows/ci-testability-topology-audit.yml'
      - 'scripts/ci-testability-topology-audit.mjs'
      - 'scripts/ci-dependency-local-routing-audit.mjs'
      - 'scripts/validation-groups.json'
      - 'package.json'

permissions:
  contents: read
  actions: read

jobs:
  full-deep-concurrency:
    if: github.event_name == 'workflow_dispatch'
    name: full-deep-concurrency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/
          sparse-checkout-cone-mode: false
      - name: Derive runtime-data cache key
        id: runtime-data-key
        shell: bash
        run: |
          {
            git rev-parse HEAD:data/levels.json
            git rev-parse HEAD:data/level-heatmaps.json
            git rev-parse HEAD:data/themes.json
            git rev-parse HEAD:data/hints
            git rev-parse HEAD:data/stress/stress-levels.json
            git rev-parse HEAD:data/stress/stress-levels-random.json
            git rev-parse HEAD:data/stress/stress-levels-envelope.json
            git rev-parse HEAD:data/stress/hints
            git rev-parse HEAD:data/stress/hints-random
            git rev-parse HEAD:data/stress/hints-envelope
          } | sha256sum | awk '{print "key="$1}' >> "$GITHUB_OUTPUT"
      - name: Require warm runtime data
        uses: actions/cache/restore@v5
        with:
          path: |
            data/levels.json
            data/level-heatmaps.json
            data/themes.json
            data/hints
            data/stress/stress-levels.json
            data/stress/stress-levels-random.json
            data/stress/stress-levels-envelope.json
            data/stress/hints
            data/stress/hints-random
            data/stress/hints-envelope
          key: runtime-data-${{ steps.runtime-data-key.outputs.key }}
          fail-on-cache-miss: true
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Derive dependency-tree key
        id: dependency-tree-key
        shell: bash
        run: |
          echo "key=node-modules-${RUNNER_OS}-$(node -p 'process.arch')-node$(node --version)-npm$(npm --version)-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Require warm dependency tree
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ steps.dependency-tree-key.outputs.key }}
          fail-on-cache-miss: true
      - name: Restore Firebase CLI cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.npm/_npx
          key: firebase-cli-${{ runner.os }}-node22.23.2-firebase-tools-15.28.2-v1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Run coverage, proofs, and Firestore concurrently
        shell: bash
        run: |
          set +e
          start="$(date +%s)"
          SOLVER_DEADLOCK_PROOF_SKIP=1 SOLVER_R02560_PROOF_SKIP=1 \
            npm run test:coverage > /tmp/full-deep-coverage.log 2>&1 &
          coverage_pid=$!
          npm run test:deep-proofs > /tmp/full-deep-proofs.log 2>&1 &
          proofs_pid=$!
          npx --yes firebase-tools@15.28.2 \
            emulators:exec --only firestore \
            --project demo-pathfinder-fingerprint-boundary \
            "npm run test:firestore-level-fingerprint-boundary" \
            > /tmp/full-deep-firestore.log 2>&1 &
          firestore_pid=$!

          wait "$coverage_pid"; coverage_status=$?
          wait "$proofs_pid"; proofs_status=$?
          wait "$firestore_pid"; firestore_status=$?
          end="$(date +%s)"

          echo "Full concurrent deep validation wall: $((end - start))s"
          echo '=== covered implementation population ==='
          cat /tmp/full-deep-coverage.log
          echo '=== heavyweight solver proofs ==='
          cat /tmp/full-deep-proofs.log
          echo '=== Firestore persistence boundary ==='
          cat /tmp/full-deep-firestore.log

          if [[ "$coverage_status" -ne 0 || "$proofs_status" -ne 0 || "$firestore_status" -ne 0 ]]; then
            echo "::error::coverage=$coverage_status deep-proofs=$proofs_status firestore=$firestore_status"
            exit 1
          fi

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Build CI testability topology
        run: node scripts/ci-testability-topology-audit.mjs
      - name: Audit dependency-local routing potential
        run: node scripts/ci-dependency-local-routing-audit.mjs
      - name: Download historical CI audit artifact
        if: ${{ inputs.historical_audit_run_id != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORICAL_AUDIT_RUN_ID: ${{ inputs.historical_audit_run_id }}
        shell: bash
        run: |
          rm -rf tmp/ci-history-source
          mkdir -p tmp/ci-history-source
          gh run download "${HISTORICAL_AUDIT_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --name ci-historical-audit-corpus \
            --dir tmp/ci-history-source
      - name: Join topology to historical economics
        if: ${{ inputs.historical_audit_run_id != '' }}
        run: node scripts/ci-testability-economics-join.mjs
      - name: Summarize topology
        shell: bash
        run: |
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('tmp/ci-testability-topology.json', 'utf8'));
          console.log('## CI testability topology');
          console.log();
          console.log(`- Permanent contracts: **${d.summary.totalContracts}**`);
          console.log(`- Validators: **${d.summary.validators}**`);
          console.log(`- Node/CLI harnesses: **${d.summary.nodeTests}**`);
          console.log();
          console.log('### Invocation modes');
          console.log();
          console.log('| Mode | Contracts |');
          console.log('| --- | ---: |');
          for (const [name, count] of Object.entries(d.summary.invocationModes).sort((a, b) => b[1] - a[1])) {
            console.log(`| \`${name}\` | ${count} |`);
          }
          console.log();
          console.log('### Static refactor candidates');
          console.log();
          console.log('| Candidate | Contracts |');
          console.log('| --- | ---: |');
          for (const [name, count] of Object.entries(d.summary.refactorCandidateCounts).sort((a, b) => b[1] - a[1])) {
            console.log(`| \`${name}\` | ${count} |`);
          }
          NODE
          node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('tmp/ci-dependency-local-routing-audit.json', 'utf8'));
          console.log();
          console.log('### Dependency-local routing shadow');
          console.log();
          console.log(`- Contracts with local entrypoints: **${d.summary.contractsWithEntrypoints}/${d.summary.contracts}**`);
          console.log(`- Static-import-sufficient candidates: **${d.summary.staticImportSufficientCandidates}**`);
          console.log(`- Contracts with unresolved local edges: **${d.summary.contractsWithUnresolvedEdges}**`);
          console.log(`- Contracts with nonliteral dynamic imports: **${d.summary.contractsWithUnknownDynamicImports}**`);
          console.log(`- Source files with registered consumers: **${d.summary.sourceFilesWithRegisteredConsumers}**`);
          console.log();
          console.log('| Surface | contracts | static-only candidates | fs deps | child-process deps | unknown dynamic |');
          console.log('| --- | ---: | ---: | ---: | ---: | ---: |');
          for (const [surface, row] of Object.entries(d.bySurface)) {
            console.log(`| \`${surface}\` | ${row.contracts} | ${row.staticImportSufficientCandidates} | ${row.withFilesystemDependency} | ${row.withChildProcessDependency} | ${row.withUnknownDynamicImports} |`);
          }
          NODE
          if [[ -f tmp/ci-testability-economics.json ]]; then
            node - <<'NODE' >> "$GITHUB_STEP_SUMMARY"
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('tmp/ci-testability-economics.json', 'utf8'));
            console.log();
            console.log('### Historical economics join');
            console.log();
            console.log(`- Episodes with parsed detector signatures: **${d.historyCoverage.episodesWithSignatures ?? 'n/a'}**`);
            console.log(`- Historical representative-log gaps: **${d.historyCoverage.retrievalGapCount ?? 'n/a'}**`);
            console.log();
            console.log('| Group | contracts | observed s | detector appearances | zero-hit observed contracts |');
            console.log('| --- | ---: | ---: | ---: | ---: |');
            for (const [name, row] of Object.entries(d.groupSummary).sort((a, b) => b[1].observedTotalSeconds - a[1].observedTotalSeconds)) {
              console.log(`| \`${name}\` | ${row.contracts} | ${row.observedTotalSeconds.toFixed(1)} | ${row.representativeDetectorAppearances} | ${row.observedZeroHitContracts} |`);
            }
          NODE
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ci-testability-topology
          path: |
            tmp/ci-testability-topology.json
            tmp/ci-testability-economics.json
            tmp/ci-dependency-local-routing-audit.json
          retention-days: 30
