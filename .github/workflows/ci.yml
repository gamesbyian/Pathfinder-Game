name: CI

on:
  # PRs are the CI gate. The merge commit does not need to repeat validation that already ran
  # against the PR merge ref.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest revision of a PR can become mergeable. Cancel superseded runs instead of letting
# obsolete copies consume runners and delay the head that actually matters.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Keep the PR gate evidence-driven rather than maximally fragmented. Fast/static-build, the
# two-runner Node/CLI matrix, coverage, and deep services are separate only where measured critical-
# path savings justify another runner. Independent validation steps continue after ordinary failures
# so one run reports the useful failure set; setup/install failures still stop dependent validation.
jobs:
  # Impact routing records the semantic validation plan and remains authoritative for final-status/deep-lane decisions.
  # Fast Gate independently computes the same plan locally so selected validator/build work can start without
  # waiting on another hosted runner. Node contracts do the same inside their reusable shard workflow. Planner failure fails safe to broad validation. This job intentionally avoids npm ci:
  # ownership/routing authorities use Node built-ins and Git metadata only.
  impact-shadow:
    runs-on: ubuntu-latest
    outputs:
      planner_outcome: ${{ steps.impact.outcome }}
      full: ${{ steps.impact.outputs.full }}
      surfaces: ${{ steps.impact.outputs.surfaces }}
      validator_groups: ${{ steps.impact.outputs.validator_groups }}
      node_test_groups: ${{ steps.impact.outputs.node_test_groups }}
      needs_build: ${{ steps.impact.outputs.needs_build }}
      needs_coverage: ${{ steps.impact.outputs.needs_coverage }}
      needs_deep_proofs: ${{ steps.impact.outputs.needs_deep_proofs }}
      needs_firestore: ${{ steps.impact.outputs.needs_firestore }}
      fast_job_required: ${{ steps.impact.outputs.fast_job_required }}
      deep_job_required: ${{ steps.impact.outputs.deep_job_required }}
      deep_services_job_required: ${{ steps.impact.outputs.deep_services_job_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /package.json
            /scripts/ci-impact-classifier.mjs
            /scripts/ci-impact-rules.json
            /scripts/ci-impact-shadow-plan.mjs
            /scripts/ci-execution-plan.json
            /scripts/ci-execution-plan.mjs
            /scripts/ci-validation-plan.json
            /scripts/ci-validation-plan.mjs
            /scripts/validation-groups.json
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Compute shadow validation plan
        id: impact
        continue-on-error: true
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node scripts/ci-impact-shadow-plan.mjs --git-diff HEAD^1 HEAD --out=tmp/ci-impact-shadow.json
          else
            node scripts/ci-impact-shadow-plan.mjs --full --out=tmp/ci-impact-shadow.json
          fi
      - name: Upload shadow validation plan
        if: steps.impact.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ci-impact-shadow
          path: tmp/ci-impact-shadow.json
          retention-days: 14
      - name: Record impact planner status
        if: always()
        shell: bash
        env:
          SHADOW_OUTCOME: ${{ steps.impact.outcome }}
        run: |
          echo "Impact planner outcome: $SHADOW_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SHADOW_OUTCOME" != "success" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Planner failure fails safe: Fast Gate falls back broad and deep-verification runs conservatively." >> "$GITHUB_STEP_SUMMARY"
          fi

  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Static checks need source/docs plus four runtime level documents. Hint source files are
          # restored only if the runtime-Hint projection cache misses. This checkout
          # is also sufficient for lint, Node/CLI contracts, and the production build, so those
          # validations can share one runner and one dependency installation.
          # fetch-depth 2 exposes the PR merge ref's base parent for incremental hygiene checks.
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/logs/*
            /logs/artifact-metadata.json
            /logs/solver-canary-baseline.json
            /logs/*.md
            /logs/**/*.md
            !/reports/*
            /reports/*.md
            /reports/*.json
            /reports/**/*.md
            /reports/stress/experiment-evidence/**/manifest.json
            /reports/stress/experiment-evidence/35467098808__run-35467098808__attempt-1/bundle.json
            /reports/stress/experiment-evidence/35467098808__run-35467098808__attempt-1/evidence/primary/result.json
            /reports/stress/failure-evidence/class3-dose-expectations-2026-09-19.json
            /reports/stress/lane-a-c0-exact-label-projection-2026-09-20.json
            /reports/stress/lane-a-frozen-prefix-population-2026-09-18.json
            /reports/stress/class5-separator-decomposition-census-2026-09-18-with-geometry.json
            /reports/stress/lane-e-multi-pick-bisection-2026-09-17.json
            /reports/stress/class5-multi-pick-lane-e-input-2026-09-17.json
            /reports/stress/failure-evidence/ws2-class3-shared-acquisition-population-2026-09-20.json
            /reports/stress/failure-evidence/ws2-reconnaissance-solved-control-sample-2026-09-19.json
            !/data/
          sparse-checkout-cone-mode: false
      - name: Materialize Fast Gate level documents
        shell: bash
        run: |
          mkdir -p data/stress
          for file in \
            data/levels.json \
            data/stress/stress-levels.json \
            data/stress/stress-levels-random.json \
            data/stress/stress-levels-envelope.json
          do
            git show "HEAD:$file" > "$file"
          done

      # Restore the exact dependency tree before setup-node. Node/npm are pinned, so the key
      # can be computed without a runtime probe. On the normal hit path this avoids restoring
      # npm's download cache even though npm ci will never run.
      - name: Derive exact dependency-tree cache key
        id: dependency-tree-key
        shell: bash
        run: |
          echo "key=node-modules-${RUNNER_OS}-x64-nodev22.23.2-npm10.9.8-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Restore exact dependency tree
        id: dependency-tree-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ steps.dependency-tree-key.outputs.key }}
      - name: Set up Node on warm dependency-tree path
        if: steps.dependency-tree-cache.outputs.cache-hit == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Set up Node with npm cache on dependency-tree miss
        if: steps.dependency-tree-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Restore ESLint result cache
        uses: actions/cache@v5
        with:
          path: .cache/eslint
          # A fresh commit key lets this run save improved per-file results; the config-hash
          # prefix restores the newest cache whose rule/dependency generation is still valid.
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'package-lock.json') }}-
      - name: Install dependencies from the npm cache
        id: install-dependencies
        if: steps.dependency-tree-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Save exact dependency tree after successful install
        if: steps.dependency-tree-cache.outputs.cache-hit != 'true' && steps.install-dependencies.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: node_modules
          key: ${{ steps.dependency-tree-key.outputs.key }}
      - name: Restore TypeScript incremental state
        id: typescript-buildinfo
        uses: actions/cache/restore@v5
        with:
          path: |
            node_modules/.cache/tsconfig.tsbuildinfo
            node_modules/.cache/tsconfig.test.tsbuildinfo
          key: typescript-buildinfo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.test.json') }}-${{ github.sha }}
          restore-keys: |
            typescript-buildinfo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.test.json') }}-
      - name: Compute local validation selection
        id: validation_selection
        continue-on-error: true
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node scripts/ci-impact-shadow-plan.mjs --git-diff HEAD^1 HEAD --out=tmp/ci-fast-gate-plan.json
          else
            node scripts/ci-impact-shadow-plan.mjs --full --out=tmp/ci-fast-gate-plan.json
          fi
      - name: Check package-script reachability
        id: dead_scripts
        continue-on-error: true
        run: npm run check:dead-scripts
      - name: Check textual source invariants
        id: text_source
        continue-on-error: true
        run: npm run check:text-source-files
        env:
          PATHFINDER_PR_INCREMENTAL: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      - name: Run selected non-lint validators
        id: validators
        continue-on-error: true
        shell: bash
        env:
          VALIDATOR_GROUPS: ${{ steps.validation_selection.outputs.validator_groups }}
          ROUTER_OUTCOME: ${{ steps.validation_selection.outcome }}
          PATHFINDER_PR_INCREMENTAL: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          PATHFINDER_PARALLEL_SUCCESS_OUTPUT: summary
          PATHFINDER_DIRECT_PACKAGE_SCRIPTS: '1'
        run: |
          if [[ "$ROUTER_OUTCOME" != "success" ]]; then
            echo "Local impact routing failed; running the full validator aggregate."
            npm run check:validators
          elif [[ -z "$VALIDATOR_GROUPS" ]]; then
            echo "No non-lint validator groups selected."
          else
            groups="${VALIDATOR_GROUPS//,/ }"
            node scripts/validation-groups.mjs validators $groups
          fi
      - name: Save TypeScript incremental state
        if: steps.validators.outcome == 'success' && steps.typescript-buildinfo.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            node_modules/.cache/tsconfig.tsbuildinfo
            node_modules/.cache/tsconfig.test.tsbuildinfo
          key: typescript-buildinfo-${{ runner.os }}-${{ hashFiles('package-lock.json', 'tsconfig.json', 'tsconfig.test.json') }}-${{ github.sha }}
      - name: Run lint
        id: lint
        continue-on-error: true
        run: npm run check:lint
      - name: Derive runtime-hint projection cache identity
        if: steps.validation_selection.outcome != 'success' || steps.validation_selection.outputs.needs_build == 'true'
        id: runtime-hint-projection-key
        shell: bash
        run: node scripts/ci-runtime-hint-projection-cache.mjs key
      - name: Restore exact or recent runtime-hint projection
        if: steps.validation_selection.outcome != 'success' || steps.validation_selection.outputs.needs_build == 'true'
        id: runtime-hint-projection-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/runtime-hint-projection
          key: runtime-hint-projection-v2-${{ runner.os }}-${{ steps.runtime-hint-projection-key.outputs.authority_key }}-${{ steps.runtime-hint-projection-key.outputs.source_key }}
          restore-keys: |
            runtime-hint-projection-v2-${{ runner.os }}-${{ steps.runtime-hint-projection-key.outputs.authority_key }}-
      - name: Restore runtime Hint sources for projection miss
        if: (steps.validation_selection.outcome != 'success' || steps.validation_selection.outputs.needs_build == 'true') && steps.runtime-hint-projection-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/runtime-data

      - name: Plan runtime-hint projection overlay
        if: (steps.validation_selection.outcome != 'success' || steps.validation_selection.outputs.needs_build == 'true') && steps.runtime-hint-projection-cache.outputs.cache-hit != 'true'
        shell: bash
        run: node scripts/ci-runtime-hint-projection-cache.mjs plan
      - name: Build production bundle
        if: steps.validation_selection.outcome != 'success' || steps.validation_selection.outputs.needs_build == 'true'
        id: build
        continue-on-error: true
        env:
          PATHFINDER_RUNTIME_HINT_PROJECTION_CACHE_ROOT: .cache/runtime-hint-projection
          PATHFINDER_RUNTIME_HINT_PROJECTION_RECONCILE: ${{ steps.runtime-hint-projection-cache.outputs.cache-hit != 'true' && '1' || '0' }}
        run: npm run build
      - name: Save exact runtime-hint projection after successful build
        if: (steps.validation_selection.outcome != 'success' || steps.validation_selection.outputs.needs_build == 'true') && steps.build.outcome == 'success' && steps.runtime-hint-projection-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/runtime-hint-projection
          key: runtime-hint-projection-v2-${{ runner.os }}-${{ steps.runtime-hint-projection-key.outputs.authority_key }}-${{ steps.runtime-hint-projection-key.outputs.source_key }}
      - name: Summarize and enforce fast-gate
        if: always()
        shell: bash
        env:
          DEAD_SCRIPTS: ${{ steps.dead_scripts.outcome }}
          TEXT_SOURCE: ${{ steps.text_source.outcome }}
          VALIDATORS: ${{ steps.validators.outcome }}
          LINT: ${{ steps.lint.outcome }}
          RUN_BUILD: ${{ steps.validation_selection.outcome != 'success' || steps.validation_selection.outputs.needs_build == 'true' }}
          BUILD: ${{ steps.build.outcome }}
        run: |
          failed=0
          if [[ "$RUN_BUILD" != "true" ]]; then BUILD="skipped"; fi
          {
            echo '## CI fast gate'
            echo
            echo '| Validation group | Outcome |'
            echo '| --- | --- |'
            printf '| Package/script reachability | `%s` |\n' "$DEAD_SCRIPTS"
            printf '| Textual source invariants | `%s` |\n' "$TEXT_SOURCE"
            printf '| Repository/domain validators | `%s` |\n' "$VALIDATORS"
            printf '| Lint | `%s` |\n' "$LINT"
            printf '| Production build | `%s` |\n' "$BUILD"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for name in DEAD_SCRIPTS TEXT_SOURCE VALIDATORS LINT; do
            status="${!name}"
            printf '%-14s %s\n' "$name" "$status"
            if [[ "$status" != "success" ]]; then
              failed=1
              echo "::error::CI fast-gate group $name finished with $status."
            fi
          done
          if [[ "$RUN_BUILD" == "true" && "$BUILD" != "success" ]]; then
            failed=1
            echo "::error::CI fast-gate group BUILD finished with $BUILD."
          fi
          if [[ "$failed" == "0" ]]; then
            echo 'All fast-gate validation groups passed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'One or more fast-gate groups failed. The table above is the first inspection surface; open only the failed group steps for detail.' >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$failed"

  # Node/CLI contracts run in a reusable two-shard execution-owner workflow. Keeping its
  # bootstrap out of this file preserves the main CI workflow's size/testability boundary.
  node-contracts:
    uses: ./.github/workflows/ci-node-contract-shards.yml

  # Coverage, heavyweight implementation proofs, and Firestore share one runner/install.
  # This lane is impact-scoped for PRs. Solver/game/persistence/shared and conservative full-impact
  # changes retain their deep protections; unrelated repo/research/data-only PRs may skip it.
  # Planner failure or manual dispatch always runs the lane.
  # Coverage remains independent as the longest instrumented implementation-test obligation.
  # Committed-data integrity lives in the data-owned Node lane, so coverage needs no runtime-data tree.
  # Proofs/Firestore are packed separately below.
  deep-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Compute local coverage validation plan
        id: deep-impact
        continue-on-error: true
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node scripts/ci-impact-shadow-plan.mjs --git-diff HEAD^1 HEAD --out=tmp/deep-impact-plan.json
          else
            node scripts/ci-impact-shadow-plan.mjs --full --out=tmp/deep-impact-plan.json
          fi
      - name: Record local coverage planner decision
        if: always()
        shell: bash
        env:
          PLANNER_OUTCOME: ${{ steps.deep-impact.outcome }}
          COVERAGE_REQUIRED: ${{ steps.deep-impact.outputs.deep_job_required }}
        run: |
          echo "Local coverage planner outcome: $PLANNER_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Coverage lane required: ${COVERAGE_REQUIRED:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PLANNER_OUTCOME" != "success" ]]; then
            echo "Planner failure fails safe: coverage will run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Derive exact dependency-tree cache key
        if: steps.deep-impact.outcome != 'success' || steps.deep-impact.outputs.deep_job_required == 'true'
        id: dependency-tree-key
        shell: bash
        run: |
          echo "key=node-modules-${RUNNER_OS}-x64-nodev22.23.2-npm10.9.8-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Restore exact dependency tree
        if: steps.deep-impact.outcome != 'success' || steps.deep-impact.outputs.deep_job_required == 'true'
        id: dependency-tree-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ steps.dependency-tree-key.outputs.key }}
      - name: Restore npm cache only on dependency-tree miss
        if: (steps.deep-impact.outcome != 'success' || steps.deep-impact.outputs.deep_job_required == 'true') && (steps.dependency-tree-cache.outputs.cache-hit != 'true')
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install dependencies from the npm cache
        if: (steps.deep-impact.outcome != 'success' || steps.deep-impact.outputs.deep_job_required == 'true') && (steps.dependency-tree-cache.outputs.cache-hit != 'true')
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Run covered ordinary test population
        if: steps.deep-impact.outcome != 'success' || steps.deep-impact.outputs.needs_coverage == 'true'
        id: coverage
        continue-on-error: true
        run: npm run test:coverage
        env:
          SOLVER_DEADLOCK_PROOF_SKIP: '1'
          SOLVER_R02560_PROOF_SKIP: '1'
      - name: Summarize and enforce coverage
        if: always()
        shell: bash
        env:
          RUN_COVERAGE: ${{ steps.deep-impact.outcome != 'success' || steps.deep-impact.outputs.needs_coverage == 'true' }}
          COVERAGE: ${{ steps.coverage.outcome }}
        run: |
          if [[ "$RUN_COVERAGE" != "true" ]]; then
            echo "## CI coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Coverage not selected by the canonical local impact plan." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "## CI coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf 'Covered ordinary implementation tests: `%s`\n' "$COVERAGE" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$COVERAGE" != "success" ]]; then
            echo "::error::CI coverage finished with $COVERAGE."
            exit 1
          fi

  # Solver soundness proofs and Firestore are independent from covered Vitest and do not
  # require canonical runtime data. They share one runner and execute concurrently when both
  # are selected, preserving the established same-runner packing.
  deep-services:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Compute local deep-services validation plan
        id: services-impact
        continue-on-error: true
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node scripts/ci-impact-shadow-plan.mjs --git-diff HEAD^1 HEAD --out=tmp/deep-services-impact-plan.json
          else
            node scripts/ci-impact-shadow-plan.mjs --full --out=tmp/deep-services-impact-plan.json
          fi
      - name: Record local deep-services planner decision
        if: always()
        shell: bash
        env:
          PLANNER_OUTCOME: ${{ steps.services-impact.outcome }}
          SERVICES_REQUIRED: ${{ steps.services-impact.outputs.deep_services_job_required }}
        run: |
          echo "Local deep-services planner outcome: $PLANNER_OUTCOME" >> "$GITHUB_STEP_SUMMARY"
          echo "Deep-services lane required: ${SERVICES_REQUIRED:-unknown}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$PLANNER_OUTCOME" != "success" ]]; then
            echo "Planner failure fails safe: proofs and Firestore will run." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Derive exact dependency-tree cache key
        if: steps.services-impact.outcome != 'success' || steps.services-impact.outputs.deep_services_job_required == 'true'
        id: dependency-tree-key
        shell: bash
        run: |
          echo "key=node-modules-${RUNNER_OS}-x64-nodev22.23.2-npm10.9.8-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Restore exact dependency tree
        if: steps.services-impact.outcome != 'success' || steps.services-impact.outputs.deep_services_job_required == 'true'
        id: dependency-tree-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ steps.dependency-tree-key.outputs.key }}
      - name: Restore npm cache only on dependency-tree miss
        if: (steps.services-impact.outcome != 'success' || steps.services-impact.outputs.deep_services_job_required == 'true') && (steps.dependency-tree-cache.outputs.cache-hit != 'true')
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install dependencies from the npm cache
        if: (steps.services-impact.outcome != 'success' || steps.services-impact.outputs.deep_services_job_required == 'true') && (steps.dependency-tree-cache.outputs.cache-hit != 'true')
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Restore Firebase CLI cache
        if: steps.services-impact.outcome != 'success' || steps.services-impact.outputs.needs_firestore == 'true'
        uses: actions/cache/restore@v5
        with:
          path: ~/.npm/_npx
          key: firebase-cli-${{ runner.os }}-node22.23.2-firebase-tools-15.28.2-v1
      - name: Restore Firestore emulator binary
        if: steps.services-impact.outcome != 'success' || steps.services-impact.outputs.needs_firestore == 'true'
        id: firestore-emulator-cache
        uses: actions/cache/restore@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firestore-emulator-${{ runner.os }}-firebase-tools-15.28.2-v1.22.0-v1
      - uses: actions/setup-java@v5
        if: steps.services-impact.outcome != 'success' || steps.services-impact.outputs.needs_firestore == 'true'
        with:
          distribution: temurin
          java-version: '21'
      - name: Run selected heavyweight proofs and Firestore concurrently
        if: steps.services-impact.outcome != 'success' || steps.services-impact.outputs.needs_deep_proofs == 'true' || steps.services-impact.outputs.needs_firestore == 'true'
        id: deep_services
        continue-on-error: true
        shell: bash
        env:
          RUN_PROOFS: ${{ steps.services-impact.outcome != 'success' || steps.services-impact.outputs.needs_deep_proofs == 'true' }}
          RUN_FIRESTORE: ${{ steps.services-impact.outcome != 'success' || steps.services-impact.outputs.needs_firestore == 'true' }}
        run: |
          set +e
          proofs_status=0
          firestore_status=0
          proofs_pid=''
          firestore_pid=''

          if [[ "$RUN_PROOFS" == "true" ]]; then
            npm run test:deep-proofs > /tmp/pathfinder-deep-proofs.log 2>&1 &
            proofs_pid=$!
          else
            echo "deep_proofs=skipped" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$RUN_FIRESTORE" == "true" ]]; then
            npx --yes firebase-tools@15.28.2               emulators:exec --only firestore               --project demo-pathfinder-fingerprint-boundary               "npm run test:firestore-level-fingerprint-boundary"               > /tmp/pathfinder-firestore.log 2>&1 &
            firestore_pid=$!
          else
            echo "firestore=skipped" >> "$GITHUB_OUTPUT"
          fi

          if [[ -n "$proofs_pid" ]]; then
            wait "$proofs_pid"; proofs_status=$?
            [[ "$proofs_status" -eq 0 ]] && echo "deep_proofs=success" >> "$GITHUB_OUTPUT" || echo "deep_proofs=failure" >> "$GITHUB_OUTPUT"
            echo '=== heavyweight solver proofs ==='
            cat /tmp/pathfinder-deep-proofs.log
          fi
          if [[ -n "$firestore_pid" ]]; then
            wait "$firestore_pid"; firestore_status=$?
            [[ "$firestore_status" -eq 0 ]] && echo "firestore=success" >> "$GITHUB_OUTPUT" || echo "firestore=failure" >> "$GITHUB_OUTPUT"
            echo '=== Firestore persistence boundary ==='
            cat /tmp/pathfinder-firestore.log
          fi
          if [[ "$proofs_status" -ne 0 || "$firestore_status" -ne 0 ]]; then
            exit 1
          fi
      - name: Save Firestore emulator binary after successful cold fetch
        if: (steps.services-impact.outcome != 'success' || steps.services-impact.outputs.needs_firestore == 'true') && steps.firestore-emulator-cache.outputs.cache-hit != 'true' && steps.deep_services.outputs.firestore == 'success'
        uses: actions/cache/save@v5
        with:
          path: ~/.cache/firebase/emulators
          key: firestore-emulator-${{ runner.os }}-firebase-tools-15.28.2-v1.22.0-v1
      - name: Summarize and enforce deep-services
        if: always()
        shell: bash
        env:
          RUN_SERVICES: ${{ steps.services-impact.outcome != 'success' || steps.services-impact.outputs.deep_services_job_required == 'true' }}
          RUN_PROOFS: ${{ steps.services-impact.outcome != 'success' || steps.services-impact.outputs.needs_deep_proofs == 'true' }}
          RUN_FIRESTORE: ${{ steps.services-impact.outcome != 'success' || steps.services-impact.outputs.needs_firestore == 'true' }}
          DEEP_PROOFS: ${{ steps.deep_services.outputs.deep_proofs }}
          FIRESTORE: ${{ steps.deep_services.outputs.firestore }}
        run: |
          if [[ "$RUN_SERVICES" != "true" ]]; then
            echo "## CI deep services" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Deep services not selected by the canonical local impact plan." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          proofs_status="${DEEP_PROOFS:-skipped}"
          firestore_status="${FIRESTORE:-skipped}"
          [[ "$RUN_PROOFS" == "true" ]] || proofs_status="skipped"
          [[ "$RUN_FIRESTORE" == "true" ]] || firestore_status="skipped"

          failed=0
          {
            echo '## CI deep services'
            echo
            echo '| Validation group | Selected | Outcome |'
            echo '| --- | --- | --- |'
            printf '| Heavyweight solver proofs | `%s` | `%s` |\n' "$RUN_PROOFS" "$proofs_status"
            printf '| Firestore persistence boundary | `%s` | `%s` |\n' "$RUN_FIRESTORE" "$firestore_status"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$RUN_PROOFS" == "true" && "$proofs_status" != "success" ]]; then
            failed=1
            echo "::error::CI deep-services proofs finished with $proofs_status."
          fi
          if [[ "$RUN_FIRESTORE" == "true" && "$firestore_status" != "success" ]]; then
            failed=1
            echo "::error::CI deep-services Firestore finished with $firestore_status."
          fi
          exit "$failed"
