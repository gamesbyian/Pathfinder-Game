name: CI

on:
  # PRs are the CI gate. Merging a PR already had this workflow run on the
  # pull_request event, so do not run it a second time for the merge commit.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Fast/deep split (docs/testing.md "Fast and deep gates"): `checks`, `unit-tests-fast`,
# `node-tests-fast`, and `build` are the PR-blocking fast gate — each is independent (no `needs:`
# between them), so they run on separate runners in parallel instead of serially on one, and each
# stays well clear of the CPU oversubscription that made running them concurrently on ONE runner
# flaky (see scripts/run-scripts-parallel.mjs's header comment). The workflow as a whole covers the
# same check + full Vitest coverage/deep tests + Node-validator graph as local `npm run ci`, but
# `deep-verification` owns only the full Vitest coverage/deep-test leg. Re-running `check` and
# `test:node` serially inside that job only duplicated sibling jobs and lengthened the critical path.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check

  unit-tests-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:unit:fast

  node-tests-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:node:fast

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

  deep-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
