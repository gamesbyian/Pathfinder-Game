name: CI

on:
  # PRs are the CI gate. Merging a PR already had this workflow run on the
  # pull_request event, so do not run it a second time for the merge commit.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Fast/deep split (docs/testing.md "Fast and deep gates"): `checks`, `checks-lint`,
# `unit-tests-fast`, `node-tests-fast`, and `build` are the PR-blocking fast gate — each is independent (no `needs:`
# between them), so they run on separate runners in parallel instead of serially on one, and each
# stays well clear of the CPU oversubscription that made running them concurrently on ONE runner
# flaky (see scripts/run-scripts-parallel.mjs's header comment). The workflow as a whole covers the
# same check + full Vitest coverage/deep tests + Node-validator graph as local `npm run ci`, but
# `deep-verification` owns only the full Vitest coverage/deep-test leg. Re-running `check` and
# `test:node` serially inside that job only duplicated sibling jobs and lengthened the critical path.
jobs:
  # Local `npm run check` keeps lint before the validator fan-out because racing them on one
  # machine slows both. Actions has independent runners, so run those two CPU-heavy halves in
  # parallel while retaining the full-repository checks job name for branch protection.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check:nonlint

  checks-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check:lint

  unit-tests-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # These jobs do not consume archived solver runs/reports or standing stress corpora.
          # Sparse checkout keeps all source/tests, bundled levels/hints, docs, and runtime assets
          # while avoiding ~900 MB of unrelated current-tree payload on every runner.
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:unit:fast

  node-tests-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Node harnesses validate three committed large-tree fixtures. Keep those exact evidence
          # paths while avoiding unrelated historical logs/reports/stress artifacts.
          sparse-checkout: |
            /*
            !/logs/
            !/reports/*
            /reports/experiments/
            !/reports/experiments/*
            /reports/experiments/2026-08-13-technique-tuning/
            /reports/stress/
            !/reports/stress/*
            /reports/stress/technique-census/
            !/reports/stress/technique-census/*
            /reports/stress/technique-census/32240161854/
            !/data/stress/*
            /data/stress/stress-levels.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:node:fast
        env:
          PATHFINDER_SKIP_NPM_SCRIPTS: >-
            test:plan-ab-corpus-shards,test:technique-campaign-analysis,test:technique-census-second-order

  node-tests-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run evidence-dependent Node harnesses
        run: >-
          node scripts/run-scripts-parallel.mjs
          test:plan-ab-corpus-shards
          test:technique-campaign-analysis
          test:technique-census-second-order

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Vite copies standing stress data into the runtime bundle, but does not consume logs/reports.
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

  # Heavy implementation proofs are ordinary Vitest files locally, so the local suite can use
  # Vitest's file workers. Actions delegates those same files to separate runners and tells the
  # coverage job to skip only the delegated copies. This preserves one proof population without
  # making the coverage runner execute the long poles twice.
  deadlock-soundness-0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx vitest run modules/solver/lower-bounds-deadlock-0.test.ts

  deadlock-soundness-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx vitest run modules/solver/lower-bounds-deadlock-1.test.ts

  repair-r02560-enabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx vitest run modules/solver/repair-search-close-length-gap-enabled.test.ts

  repair-r02560-disabled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx vitest run modules/solver/repair-search-close-length-gap-disabled.test.ts

  # TEMPORARY benchmark: measure the final full local command graph on one hosted runner.
  # Remove before merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run ci

  # TEMPORARY benchmark: decompose the second-order census validator. Remove before merge.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/technique-census-second-order-node-test.mjs

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: node scripts/technique-census-second-order.mjs --check

  deep-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
        env:
          SOLVER_DEADLOCK_PROOF_SKIP: '1'
          SOLVER_R02560_PROOF_SKIP: '1'
