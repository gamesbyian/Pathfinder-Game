name: CI

on:
  # PRs are the CI gate. Merging a PR already had this workflow run on the
  # pull_request event, so do not run it a second time for the merge commit.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks, tests, and production build
        run: npm run ci && npm run build
