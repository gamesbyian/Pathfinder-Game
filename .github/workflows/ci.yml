name: CI

on:
  # PRs are the CI gate. The merge commit does not need to repeat validation that already ran
  # against the PR merge ref.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Each job owns a distinct validation layer. GitHub Actions uses separate runners where that buys
# real wall time, but does not rerun the same ordinary test population merely to produce an earlier
# green badge. Local command composition remains authoritative in package.json / docs/testing.md.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Repository checks need current source/docs plus canonical level/hint data. Historical
          # logs and derived research blobs remain visible through Git's index but need not be
          # materialized. fetch-depth 2 exposes the PR merge ref's base parent for incremental
          # content hygiene checks.
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/logs/*
            /logs/artifact-metadata.json
            !/reports/*
            /reports/*.md
            !/data/stress/*
            /data/stress/README.md
            /data/stress/stress-levels.json
            /data/stress/stress-levels-random.json
            /data/stress/hints/
            /data/stress/hints-random/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check:nonlint
        env:
          PATHFINDER_PR_INCREMENTAL: ${{ github.event_name == 'pull_request' && '1' || '0' }}

  # Lint races poorly with the validator fan-out on one small machine, but is independent on its
  # own Actions runner.
  checks-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check:lint

  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Node/CLI software-contract tests use synthetic fixtures or current runtime assets.
          # Frozen research reports and standing stress corpora are not test fixtures.
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:node

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The deployed admin Dev-Mode switcher needs only these stress runtime assets. Do not
          # materialize unrelated stress tooling/research artifacts just to build the app.
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/*
            /data/stress/stress-levels.json
            /data/stress/stress-levels-random.json
            /data/stress/hints/
            /data/stress/hints-random/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

  # These four files are deliberately heavyweight implementation proofs. Local coverage lets
  # Vitest schedule them as ordinary deep files; Actions moves them to one dedicated runner so
  # coverage does not pay for them twice. One Vitest invocation lets its worker pool schedule the
  # independent files without four duplicate checkout/setup/npm-ci jobs.
  deep-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run heavyweight implementation proofs
        run: >-
          npx vitest run
          modules/solver/lower-bounds-deadlock-0.test.ts
          modules/solver/lower-bounds-deadlock-1.test.ts
          modules/solver/repair-search-close-length-gap-enabled.test.ts
          modules/solver/repair-search-close-length-gap-disabled.test.ts

  # This is the one ordinary Vitest pass on PRs: full coverage plus ordinary deep tests. The four
  # files above are skipped here only because deep-proofs owns those exact copies.
  deep-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
        env:
          SOLVER_DEADLOCK_PROOF_SKIP: '1'
          SOLVER_R02560_PROOF_SKIP: '1'
