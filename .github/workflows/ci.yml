name: CI

on:
  # PRs are the CI gate. Merging a PR already had this workflow run on the
  # pull_request event, so do not run it a second time for the merge commit.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Fast/deep split (docs/testing.md "Fast and deep gates"): `checks`, `unit-tests-fast`,
# `node-tests-fast`, and `build` are the PR-blocking fast gate — each is independent (no `needs:`
# between them), so they run on separate runners in parallel instead of serially on one, and each
# stays well clear of the CPU oversubscription that made running them concurrently on ONE runner
# flaky (see scripts/run-scripts-parallel.mjs's header comment). `deep-verification` mirrors local
# `npm run ci` byte-for-byte (full Vitest coverage + every Node validator, including the handful of
# genuinely expensive solver-proof tests the fast jobs skip via SOLVER_DEEP_TESTS=0) and runs in
# parallel alongside them rather than after them — slower, but never on the critical path.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check

  unit-tests-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:unit:fast

  node-tests-fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:node:fast

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

  deep-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run ci

  # Temporary discovery-only job for queue item #7. Branch-gated so ordinary PRs never pay for it.
  current-head-solver-profile:
    if: github.head_ref == 'chatgpt/profile-current-head-2026-08-26'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build bundled speed probe
        shell: bash
        run: |
          BUNDLE=$(node --input-type=module -e "import { buildBundle } from './scripts/run-bundled.mjs'; console.log(buildBundle('scripts/solver-speed-probe.mjs'));" | tail -n1)
          echo "SOLVER_SPEED_BUNDLE=$BUNDLE" >> "$GITHUB_ENV"
      - name: Profile published corpus
        shell: bash
        run: |
          mkdir -p tmp/current-head-profile
          node --cpu-prof \
            --cpu-prof-dir=tmp/current-head-profile \
            --cpu-prof-name=published.cpuprofile \
            "$SOLVER_SPEED_BUNDLE" \
            --corpus=published --count=160 --budget-ms=600000 --node-budget=250000 \
            --out=tmp/current-head-profile/published.json
      - name: Profile hard Corpus-2 sample
        shell: bash
        run: |
          node --cpu-prof \
            --cpu-prof-dir=tmp/current-head-profile \
            --cpu-prof-name=corpus2-hard.cpuprofile \
            "$SOLVER_SPEED_BUNDLE" \
            --corpus=corpus2 --count=24 --start=1 --stride=67 \
            --budget-ms=600000 --node-budget=250000 \
            --out=tmp/current-head-profile/corpus2-hard.json
      - name: Summarize CPU profiles
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const inputs = [
            ['published', 'tmp/current-head-profile/published.cpuprofile'],
            ['corpus2-hard', 'tmp/current-head-profile/corpus2-hard.cpuprofile'],
          ];
          const selected = ['scoreMove','buildCurUrgencyContext','applyMove','undoMove','getNeighbors','beamSearchFromGate','_floodFillReachability','evaluatePrunedMove','getDistanceFromArray','prepLevel'];
          const out = {};
          for (const [label, file] of inputs) {
            const profile = JSON.parse(readFileSync(file, 'utf8'));
            const frames = new Map(profile.nodes.map(n => [n.id, n.callFrame]));
            const counts = new Map();
            for (const id of profile.samples ?? []) {
              const name = frames.get(id)?.functionName || '(anonymous)';
              counts.set(name, (counts.get(name) || 0) + 1);
            }
            const total = profile.samples?.length || 0;
            const rows = [...counts].map(([name,samples]) => ({name,samples,pct: total ? samples*100/total : 0})).sort((a,b) => b.samples-a.samples || a.name.localeCompare(b.name));
            out[label] = { totalSamples: total, top: rows.slice(0,30), selected: rows.filter(r => selected.includes(r.name)) };
            console.log(`\n=== ${label}: ${total.toLocaleString()} CPU samples ===`);
            for (const r of rows.slice(0,20)) console.log(`${r.pct.toFixed(2).padStart(6)}%  ${String(r.samples).padStart(7)}  ${r.name}`);
            console.log('\nSelected solver functions:');
            for (const name of selected) {
              const r = rows.find(x => x.name === name);
              console.log(`${name.padEnd(28)} ${r ? `${r.pct.toFixed(2)}% (${r.samples})` : 'no self samples'}`);
            }
          }
          writeFileSync('tmp/current-head-profile/summary.json', JSON.stringify(out, null, 2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: current-head-solver-profile
          path: tmp/current-head-profile/
          retention-days: 30
