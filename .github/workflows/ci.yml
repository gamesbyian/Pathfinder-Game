name: CI

on:
  # PRs are the CI gate. The merge commit does not need to repeat validation that already ran
  # against the PR merge ref.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Only the newest revision of a PR can become mergeable. Cancel superseded runs instead of letting
# obsolete six-job copies consume runners and delay the head that actually matters.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Each job owns a distinct validation layer. GitHub Actions uses separate runners where that buys
# real wall time, but does not rerun the same ordinary test population merely to produce an earlier
# green badge. Local command composition remains authoritative in package.json / docs/testing.md.
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Repository checks need current source/docs plus canonical level/hint data. Historical
          # logs and derived research blobs remain visible through Git's index but need not be
          # materialized. fetch-depth 2 exposes the PR merge ref's base parent for incremental
          # content hygiene checks.
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/logs/*
            /logs/artifact-metadata.json
            /logs/*.md
            /logs/**/*.md
            !/reports/*
            /reports/*.md
            /reports/**/*.md
            !/data/stress/*
            /data/stress/README.md
            /data/stress/stress-levels.json
            /data/stress/stress-levels-random.json
            /data/stress/hints/
            /data/stress/hints-random/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run check:nonlint
        env:
          PATHFINDER_PR_INCREMENTAL: ${{ github.event_name == 'pull_request' && '1' || '0' }}

  # Lint races poorly with the validator fan-out on one small machine, but is independent on its
  # own Actions runner.
  checks-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - name: Restore ESLint result cache
        uses: actions/cache@v5
        with:
          path: .cache/eslint
          # A fresh commit key lets this run save improved per-file results; the config-hash
          # prefix restores the newest cache whose rule/dependency generation is still valid.
          key: eslint-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ runner.os }}-${{ hashFiles('eslint.config.mjs', 'package-lock.json') }}-
      - run: npm ci
      - name: Generate dependency-cleanup candidate
        run: |
          npm pkg delete devDependencies.npm-run-all
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          echo 'PACKAGE_JSON_BASE64_BEGIN'
          base64 -w0 package.json
          echo
          echo 'PACKAGE_JSON_BASE64_END'
          echo 'PACKAGE_LOCK_BASE64_BEGIN'
          base64 -w0 package-lock.json
          echo
          echo 'PACKAGE_LOCK_BASE64_END'
          echo 'AUDIT_AFTER_BEGIN'
          npm audit --json || true
          echo 'AUDIT_AFTER_END'
      - run: npm run check:lint

  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Node/CLI software-contract tests use synthetic fixtures or current runtime assets.
          # Frozen research reports and standing stress corpora are not test fixtures.
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:node

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The deployed admin Dev-Mode switcher needs only these stress runtime assets. Do not
          # materialize unrelated stress tooling/research artifacts just to build the app.
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/*
            /data/stress/stress-levels.json
            /data/stress/stress-levels-random.json
            /data/stress/hints/
            /data/stress/hints-random/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build

  # These four files are deliberately heavyweight implementation proofs. Local coverage lets
  # Vitest schedule them as ordinary deep files; Actions moves them to one dedicated runner so
  # coverage does not pay for them twice. One Vitest invocation lets its worker pool schedule the
  # independent files without four duplicate checkout/setup/npm-ci jobs.
  deep-proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run heavyweight implementation proofs
        run: npm run test:deep-proofs

  # This is the one ordinary Vitest pass on PRs: full coverage plus ordinary deep tests. The four
  # files above are skipped here only because deep-proofs owns those exact copies.
  deep-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/stress/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
        env:
          SOLVER_DEADLOCK_PROOF_SKIP: '1'
          SOLVER_R02560_PROOF_SKIP: '1'
