# Executes a bounded, explicit list of prefix-feasibility questions through the EXISTING
# cpsat-full-probe.py model. Cases are independent, so the selected population is round-robin
# sharded across Actions runners instead of being processed serially in one 6-hour-prone job.
# Each individual case still runs through exactly one cpsat-full-probe.py process and preserves
# the same live/dead/timeout/referee semantics.
name: cpsat-explicit-prefix-oracle

on:
  workflow_dispatch:
    inputs:
      cases_file:
        description: 'Committed JSON input. atlas-abstain format can directly read winning-prefix-atlas artifacts; cases format expects {corpus,cases:[{id?,levelId,prefix,child?}]}'
        required: false
        default: 'reports/stress/winning-prefix-atlas-pilot-2026-08-11.json'
      case_format:
        description: 'atlas-abstain or cases'
        required: false
        default: 'atlas-abstain'
      corpus:
        description: 'Optional corpus override. Blank uses the input document levelsFile/corpus field.'
        required: false
        default: ''
      time_limit:
        description: 'Per-case CP-SAT time limit in seconds. UNKNOWN remains timeout/abstain.'
        required: false
        default: '60'
      max_cases:
        description: 'Bound the TOTAL selected population before sharding. Use a high value to process the whole committed list.'
        required: false
        default: '1000'
      shard_count:
        description: 'Number of round-robin case shards. Default 20 matches the usual Actions concurrency footprint; empty shards are harmless on small pilots.'
        required: false
        default: '20'
      max_parallel:
        description: 'Shard jobs allowed to run concurrently. Lower this to share Actions capacity without changing the selected case population.'
        required: false
        default: '20'

concurrency:
  group: cpsat-explicit-prefix-oracle
  cancel-in-progress: false

jobs:
  plan:
    name: Validate tooling and plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Check out dispatched commit exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify explicit-prefix parsing/classification helpers
        run: npm run test:research-analysis-lib

      - name: Build shard matrix
        id: plan
        shell: bash
        run: |
          n="${{ inputs.shard_count }}"
          shards=$(node -e "console.log(JSON.stringify(Array.from({length:Number(process.argv[1])},(_,i)=>i+1)))" "$n")
          echo "shards=${shards}" >> "$GITHUB_OUTPUT"

  oracle-shards:
    name: Prefix oracle shard ${{ matrix.shard }}/${{ inputs.shard_count }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel) }}
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - name: Check out dispatched commit exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          npm ci
          pip install ortools

      - name: Run this explicit-prefix shard
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/stress
          corpus_arg=()
          if [ -n "${{ inputs.corpus }}" ]; then
            corpus_arg+=("--corpus=${{ inputs.corpus }}")
          fi
          nn=$(printf '%03d' "${{ matrix.shard }}")
          node scripts/run-bundled.mjs scripts/stress/cpsat-explicit-prefix-oracle.mjs -- \
            "--cases=${{ inputs.cases_file }}" \
            "--format=${{ inputs.case_format }}" \
            "--time-limit=${{ inputs.time_limit }}" \
            "--max-cases=${{ inputs.max_cases }}" \
            "--shard-index=${{ matrix.shard }}" \
            "--shard-count=${{ inputs.shard_count }}" \
            "--out=reports/stress/cpsat-explicit-prefix-oracle-shard-${nn}.json" \
            "${corpus_arg[@]}"

      - name: Upload shard result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpsat-explicit-prefix-oracle-shard-${{ matrix.shard }}
          path: reports/stress/cpsat-explicit-prefix-oracle-shard-*.json
          retention-days: 30
          if-no-files-found: error

  combine:
    name: Combine explicit-prefix oracle results
    needs: [plan, oracle-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out dispatched commit exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download every shard result
        uses: actions/download-artifact@v4
        with:
          pattern: cpsat-explicit-prefix-oracle-shard-*
          path: artifact-staging
          merge-multiple: true

      - name: Combine and verify complete shard coverage
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/stress
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          const dir = 'artifact-staging';
          const files = readdirSync(dir).filter(name => /^cpsat-explicit-prefix-oracle-shard-\d+\.json$/u.test(name)).sort();
          const expectedShards = Number('${{ inputs.shard_count }}');
          if (files.length !== expectedShards) throw new Error(`missing shard artifacts: found ${files.length}/${expectedShards}`);
          const docs = files.map(name => JSON.parse(readFileSync(path.join(dir, name), 'utf8')));
          const first = docs[0];
          for (const doc of docs) {
            if (doc.solverRef !== first.solverRef || doc.sourceCases !== first.sourceCases || doc.sourceFormat !== first.sourceFormat || doc.requestedTimeLimitSec !== first.requestedTimeLimitSec) {
              throw new Error(`metadata mismatch in shard ${doc.shardIndex}`);
            }
          }
          const rows = docs.flatMap(doc => doc.rows ?? []);
          const seen = new Set();
          for (const row of rows) {
            if (seen.has(row.caseId)) throw new Error(`duplicate case across shards: ${row.caseId}`);
            seen.add(row.caseId);
          }
          const count = label => rows.filter(row => row.oracleLabel === label).length;
          const correctnessAlarms = rows.filter(row => row.correctnessAlarm).length;
          const inputAlarms = rows.filter(row => row.inputAlarm).length;
          const expectedCases = first.selectedCaseCount;
          if (rows.length !== expectedCases) throw new Error(`incomplete case coverage: ${rows.length}/${expectedCases}`);
          const combined = {
            schemaVersion: 1,
            generatedAt: new Date().toISOString(),
            solverRef: first.solverRef,
            technique: first.technique,
            sourceCases: first.sourceCases,
            sourceFormat: first.sourceFormat,
            coordinateConvention: first.coordinateConvention,
            requestedTimeLimitSec: first.requestedTimeLimitSec,
            shardCount: expectedShards,
            summary: { cases: rows.length, live: count('live'), dead: count('dead'), abstain: count('timeout/abstain'), correctnessAlarms, inputAlarms },
            rows,
            caution: first.caution,
          };
          const out = 'reports/stress/cpsat-explicit-prefix-oracle-${{ github.run_id }}.json';
          writeFileSync(out, `${JSON.stringify(combined, null, 2)}\n`);
          console.log(`Combined ${rows.length} cases: ${combined.summary.live} live / ${combined.summary.dead} dead / ${combined.summary.abstain} abstain`);
          if (correctnessAlarms || inputAlarms) process.exitCode = 2;
          NODE

      - name: Upload combined oracle result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpsat-explicit-prefix-oracle-${{ github.run_id }}
          path: reports/stress/cpsat-explicit-prefix-oracle-${{ github.run_id }}.json
          retention-days: 30
          if-no-files-found: error
