name: Scheduler confirm-broad-001 (one-shot)

on:
  pull_request:
    paths:
      - '.github/workflows/scheduler-confirm-broad-001-one-shot.yml'

# Independent confirmation of the exact static scheduler treatment selected on development evidence.
# The solver revision, treatment, work envelope, cohort recipe, and acceptance rule are frozen.
# Exact generated cohort rows are not uploaded; per-level outcomes remain machine-produced evidence
# until the aggregate verdict is recorded by the analyze job.

env:
  SOLVER_SHA: fc696bac37bffea9ca8b8dbc7616639224fbf4dc
  GENERATOR_SHA: 4f2b2b143ee2bc194b8e017fcc59a680b9ee8d92
  COHORT_SEED: '2026082417'
  COHORT_COUNT: '256'

jobs:
  run-shard:
    name: ${{ matrix.arm }}-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arm: [control, treatment]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Check out frozen solver revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOLVER_SHA }}

      - name: Check out pinned cohort-generator revision
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GENERATOR_SHA }}
          path: tmp/generator-src

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install solver dependencies
        run: npm ci

      - name: Materialize locked cohort from pinned generator
        shell: bash
        run: |
          (cd tmp/generator-src && npm ci)
          (cd tmp/generator-src && node scripts/run-bundled.mjs scripts/stress/generate-random.mjs \
            --count=${COHORT_COUNT} \
            --master-seed=${COHORT_SEED} \
            --id-prefix=C \
            --out=${GITHUB_WORKSPACE}/tmp/confirm-broad-001.json)
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('tmp/confirm-broad-001.json','utf8')).length)")" = "256"

      - name: Apply frozen treatment rewrite
        if: matrix.arm == 'treatment'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('modules/solver/orchestration.ts')
          s = p.read_text()
          old_decl = "    const mainConfigs = baseConfigs.filter(c => !c.repair && !c.admissibleOrder);\n"
          new_decl = old_decl + (
              "    // Frozen confirm-broad-001 treatment: suppress exactly two ordinary main-loop configs.\n"
              "    // Keep mainConfigs intact because later retry stages intentionally reuse it.\n"
              "    const ordinaryMainConfigs = mainConfigs.filter(c => !new Set([\n"
              "        'dfs:objectiveFirst', 'dfs:intersectionHarvest',\n"
              "    ]).has(attemptConfigKey(c)));\n"
          )
          assert s.count(old_decl) == 1, f'mainConfigs declaration count={s.count(old_decl)}'
          s = s.replace(old_decl, new_decl)
          old_count = '        mainConfigsCount: mainConfigs.length,\n'
          assert s.count(old_count) == 1, f'mainConfigsCount site count={s.count(old_count)}'
          s = s.replace(old_count, '        mainConfigsCount: ordinaryMainConfigs.length,\n')
          old_interleaved = 'await runInterleavedAttempts(activeGates, mainConfigs, level, prep, timeBudgetMs, mainLoopStartTime'
          assert s.count(old_interleaved) == 1, f'ordinary interleaved dispatch count={s.count(old_interleaved)}'
          s = s.replace(old_interleaved, 'await runInterleavedAttempts(activeGates, ordinaryMainConfigs, level, prep, timeBudgetMs, mainLoopStartTime')
          old_serial = 'await runGateSerialAttempts(activeGates, mainConfigs, level, prep, timeBudgetMs, mainLoopStartTime'
          assert s.count(old_serial) == 1, f'ordinary serial dispatch count={s.count(old_serial)}'
          s = s.replace(old_serial, 'await runGateSerialAttempts(activeGates, ordinaryMainConfigs, level, prep, timeBudgetMs, mainLoopStartTime')
          remaining_retry_refs = s.count('activeGates, mainConfigs, level, prep, yieldFn')
          assert remaining_retry_refs >= 4, f'expected retry-tier mainConfigs references, found {remaining_retry_refs}'
          p.write_text(s)
          PY
          git diff --check

      - name: Verify treatment compiles
        if: matrix.arm == 'treatment'
        run: npm run build

      - name: Run frozen confirmation shard
        shell: bash
        run: |
          mkdir -p tmp/confirm/${{ matrix.arm }}/shard-${{ matrix.shard }}
          positions=$(python3 - <<'PY'
          shard = int('${{ matrix.shard }}')
          print('pos:' + ','.join(str(i) for i in range(1, 257) if (i - 1) % 8 == shard))
          PY
          )
          node scripts/run-bundled.mjs scripts/level-blind-capability-sweep.mjs -- \
            --corpus=tmp/confirm-broad-001.json \
            --levels="$positions" \
            --budget-ms=86400000 \
            --node-budget=50000000 \
            --work-budget=67000000 \
            --strict-total-work-budget \
            --attempt-budget-telemetry \
            --lifecycle-telemetry \
            --workers=4 \
            --out=tmp/confirm/${{ matrix.arm }}/shard-${{ matrix.shard }}/result.json \
            --summary-out=tmp/confirm/${{ matrix.arm }}/shard-${{ matrix.shard }}/summary.md

      - name: Verify shard contract and provenance
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const arm = '${{ matrix.arm }}';
          const shard = '${{ matrix.shard }}';
          const dir = `tmp/confirm/${arm}/shard-${shard}`;
          const d = JSON.parse(fs.readFileSync(`${dir}/result.json`, 'utf8'));
          const rows = d.levels ?? [];
          if (rows.length !== 32) throw new Error(`${arm}/${shard}: expected 32 rows, got ${rows.length}`);
          const bad = rows.filter(r => r.deadlineTruncated || r.status === 'deadline-truncated' || r.status === 'attempt-error');
          if (bad.length) throw new Error(`${arm}/${shard}: indeterminate/error rows: ${bad.map(r => `${r.id}:${r.status}`).join(',')}`);
          if (arm === 'treatment') {
            const forbidden = rows.flatMap(r => (r.attempts ?? []).filter(a =>
              a.stageId === 'main-loop' && a.beamWidth == null && a.template == null &&
              (a.profile === 'objectiveFirst' || a.profile === 'intersectionHarvest')
            ).map(a => `${r.id}:${a.profile}`));
            if (forbidden.length) throw new Error(`treatment executed suppressed ordinary actions: ${forbidden.join(',')}`);
          }
          NODE
          cohort_sha=$(sha256sum tmp/confirm-broad-001.json | awk '{print $1}')
          patch_sha=$(git diff -- modules/solver/orchestration.ts | sha256sum | awk '{print $1}')
          cat > tmp/confirm/${{ matrix.arm }}/shard-${{ matrix.shard }}/metadata.json <<EOF
          {
            "arm": "${{ matrix.arm }}",
            "shard": ${{ matrix.shard }},
            "solverSha": "${SOLVER_SHA}",
            "generatorSha": "${GENERATOR_SHA}",
            "cohortId": "confirm-broad-001",
            "cohortSeed": ${COHORT_SEED},
            "cohortSha256": "${cohort_sha}",
            "strictTotalWorkBudget": 67000000,
            "nodeBudget": 50000000,
            "suppressedOrdinaryMainLoopConfigKeys": ${{ matrix.arm == 'treatment' && '["dfs:objectiveFirst","dfs:intersectionHarvest"]' || '[]' }},
            "workingTreePatchSha256": "${patch_sha}"
          }
          EOF

      - name: Upload sealed shard evidence
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-confirm-${{ matrix.arm }}-${{ matrix.shard }}
          path: tmp/confirm/${{ matrix.arm }}/shard-${{ matrix.shard }}/
          retention-days: 90

  analyze:
    name: Record frozen confirmation verdict
    needs: [run-shard]
    if: always() && needs.run-shard.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Download sealed shard evidence
        uses: actions/download-artifact@v4
        with:
          pattern: scheduler-confirm-*
          path: tmp/downloaded

      - name: Apply frozen acceptance rule before exact-row inspection
        shell: bash
        run: |
          mkdir -p tmp/confirmation-analysis
          node - <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const dirs = fs.readdirSync('tmp/downloaded').filter(x => x.startsWith('scheduler-confirm-'));
          if (dirs.length !== 16) throw new Error(`expected 16 shard artifacts, got ${dirs.length}`);
          const grouped = { control: [], treatment: [] };
          const hashes = new Set();
          for (const name of dirs) {
            const meta = JSON.parse(fs.readFileSync(path.join('tmp/downloaded', name, 'metadata.json'), 'utf8'));
            const result = JSON.parse(fs.readFileSync(path.join('tmp/downloaded', name, 'result.json'), 'utf8'));
            hashes.add(meta.cohortSha256);
            grouped[meta.arm].push(...(result.levels ?? []));
          }
          if (hashes.size !== 1) throw new Error(`cohort hashes differ across arms/shards: ${[...hashes].join(',')}`);
          for (const arm of ['control','treatment']) {
            if (grouped[arm].length !== 256) throw new Error(`${arm}: expected 256 rows, got ${grouped[arm].length}`);
            const ids = new Set(grouped[arm].map(r => r.id));
            if (ids.size !== 256) throw new Error(`${arm}: duplicate/missing ids`);
          }
          const byId = rows => new Map(rows.map(r => [r.id, r]));
          const c = byId(grouped.control), t = byId(grouped.treatment);
          if ([...c.keys()].sort().join(',') !== [...t.keys()].sort().join(',')) throw new Error('arm populations differ');
          const cSolved = new Set(grouped.control.filter(r => r.ok).map(r => r.id));
          const tSolved = new Set(grouped.treatment.filter(r => r.ok).map(r => r.id));
          const gained = [...tSolved].filter(id => !cSolved.has(id)).sort();
          const lost = [...cSolved].filter(id => !tSolved.has(id)).sort();
          const totalWork = rows => rows.reduce((sum, r) => sum + Number(r.workSpent ?? 0), 0);
          const controlWork = totalWork(grouped.control);
          const treatmentWork = totalWork(grouped.treatment);
          const workReduction = controlWork ? (controlWork - treatmentWork) / controlWork : 0;
          const passesGate = lost.length === 0 && (gained.length >= 1 || workReduction >= 0.10);
          const verdict = passesGate ? 'confirmation-pass' : 'confirmation-fail';
          const aggregate = {
            verdict,
            acceptanceRule: 'no solve loss AND (>=1 gained solve OR >=10% aggregate canonical-work reduction)',
            cohortId: 'confirm-broad-001',
            cohortSize: 256,
            cohortSha256: [...hashes][0],
            solverSha: process.env.SOLVER_SHA,
            generatorSha: process.env.GENERATOR_SHA,
            control: { solved: cSolved.size, aggregateWork: controlWork },
            treatment: { solved: tSolved.size, aggregateWork: treatmentWork },
            gainedCount: gained.length,
            lostCount: lost.length,
            aggregateWorkReductionFraction: workReduction,
            aggregateWorkReductionPercent: 100 * workReduction,
            passesGate
          };
          fs.writeFileSync('tmp/confirmation-analysis/verdict.json', JSON.stringify(aggregate, null, 2) + '\n');
          fs.writeFileSync('tmp/confirmation-analysis/summary.md', [
            '# Scheduler confirm-broad-001 verdict', '',
            `Verdict: **${verdict}**`,
            `Control: ${cSolved.size}/256 solved; ${controlWork.toLocaleString()} work.`,
            `Treatment: ${tSolved.size}/256 solved; ${treatmentWork.toLocaleString()} work.`,
            `Gained solves: ${gained.length}. Lost solves: ${lost.length}.`,
            `Aggregate work reduction: ${(100 * workReduction).toFixed(2)}%.`,
            `Frozen gate: **${passesGate ? 'PASS' : 'FAIL'}**.`, '',
            'Exact changed-row IDs are intentionally omitted from this verdict artifact until the aggregate decision is recorded.', ''
          ].join('\n'));
          // Preserve changed IDs separately for post-verdict diagnosis without printing them in the log.
          fs.writeFileSync('tmp/confirmation-analysis/post-verdict-changed-ids.json', JSON.stringify({gained, lost}, null, 2) + '\n');
          console.log(fs.readFileSync('tmp/confirmation-analysis/summary.md', 'utf8'));
          NODE

      - name: Upload confirmation verdict
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-confirm-broad-001-verdict
          path: tmp/confirmation-analysis/
          retention-days: 90
