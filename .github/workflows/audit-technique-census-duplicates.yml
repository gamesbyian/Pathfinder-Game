name: Audit technique census duplicates

on:
  pull_request:
    branches: [main]
    paths:
      - scripts/audit-technique-census-duplicates.mjs
      - .github/workflows/audit-technique-census-duplicates.yml

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Audit duplicate census rows
        run: node scripts/audit-technique-census-duplicates.mjs
