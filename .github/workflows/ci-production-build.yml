name: CI Production Build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref/SHA to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/logs/
            !/reports/
            !/data/
          sparse-checkout-cone-mode: false
      - name: Materialize build runtime JSON
        shell: bash
        run: |
          mkdir -p data/stress
          for file in \
            data/levels.json \
            data/level-heatmaps.json \
            data/themes.json \
            data/stress/stress-levels.json \
            data/stress/stress-levels-random.json
          do
            git show "HEAD:$file" > "$file"
          done
      - name: Derive exact dependency-tree cache key
        id: dependency-tree-key
        shell: bash
        run: |
          echo "key=node-modules-${RUNNER_OS}-x64-nodev22.23.2-npm10.9.8-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Restore exact dependency tree
        id: dependency-tree-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ steps.dependency-tree-key.outputs.key }}
      - name: Set up Node on warm dependency-tree path
        if: steps.dependency-tree-cache.outputs.cache-hit == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Set up Node with npm cache on dependency-tree miss
        if: steps.dependency-tree-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install dependencies from the npm cache
        if: steps.dependency-tree-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Derive runtime-hint projection cache identity
        id: runtime-hint-projection-key
        shell: bash
        run: node scripts/ci-runtime-hint-projection-cache.mjs key
      - name: Restore exact or recent runtime-hint projection
        id: runtime-hint-projection-cache
        uses: actions/cache/restore@v5
        with:
          path: .cache/runtime-hint-projection
          key: runtime-hint-projection-v2-${{ runner.os }}-${{ steps.runtime-hint-projection-key.outputs.authority_key }}-${{ steps.runtime-hint-projection-key.outputs.source_key }}
          restore-keys: |
            runtime-hint-projection-v2-${{ runner.os }}-${{ steps.runtime-hint-projection-key.outputs.authority_key }}-
      - name: Restore runtime Hint sources for projection miss
        if: steps.runtime-hint-projection-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/runtime-data
      - name: Plan runtime-hint projection overlay
        if: steps.runtime-hint-projection-cache.outputs.cache-hit != 'true'
        shell: bash
        run: node scripts/ci-runtime-hint-projection-cache.mjs plan
      - name: Build production bundle
        id: build
        env:
          PATHFINDER_RUNTIME_HINT_PROJECTION_CACHE_ROOT: .cache/runtime-hint-projection
          PATHFINDER_RUNTIME_HINT_PROJECTION_RECONCILE: ${{ steps.runtime-hint-projection-cache.outputs.cache-hit != 'true' && '1' || '0' }}
        run: npm run build
      - name: Save exact runtime-hint projection after successful build
        if: steps.build.outcome == 'success' && steps.runtime-hint-projection-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .cache/runtime-hint-projection
          key: runtime-hint-projection-v2-${{ runner.os }}-${{ steps.runtime-hint-projection-key.outputs.authority_key }}-${{ steps.runtime-hint-projection-key.outputs.source_key }}
