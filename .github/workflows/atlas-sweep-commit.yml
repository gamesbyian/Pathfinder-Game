# Backfill tool: commits the shard artifacts from an ALREADY-COMPLETED atlas-sweep.yml run into
# reports/stress/, without re-running the (expensive, CP-SAT-bound) sweep itself.
#
# WHY THIS EXISTS. atlas-sweep.yml's own combine job now commits automatically (see its file-level
# comment), but that fix landed after run_id 30982779834 (a real 20-shard/340-level sweep) had
# already completed under the artifact-only version -- its shard artifacts are sitting in GitHub's
# artifact storage, uncommitted. Re-dispatching the sweep to get a committed copy would mean paying
# for the same CP-SAT work twice. This workflow instead downloads that run's existing
# atlas-sweep-shard-* artifacts directly (GitHub's own runner network, not a sandboxed agent
# session's egress-restricted one) and commits them the same way the fixed combine job does.
#
# Also useful going forward for any future atlas-sweep run whose auto-commit step failed for an
# unrelated reason (e.g. a transient push race) -- re-running this against that run_id recovers it
# without re-sweeping.
name: atlas-sweep commit (backfill from a completed run)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'atlas-sweep.yml run ID to pull shard artifacts from and commit'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the dispatched ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Download all shard artifacts from the given run
        uses: actions/download-artifact@v4
        with:
          pattern: atlas-sweep-shard-*
          path: artifact-staging
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}

      - name: Merge new/updated atlas files into the working tree and commit
        shell: bash
        run: |
          if [ -d artifact-staging/reports/stress ]; then
            mkdir -p reports/stress
            cp -r artifact-staging/reports/stress/. reports/stress/
          fi
          if git status --porcelain -- reports/stress/ | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email 'github-actions[bot]@users.noreply.github.com'
            git add reports/stress/
            git commit -m "atlas-sweep: backfill committed atlas from run ${{ inputs.run_id }}"
            git push origin HEAD:"${{ github.ref_name }}"
          else
            echo "No new/changed atlas files -- nothing to commit."
          fi
