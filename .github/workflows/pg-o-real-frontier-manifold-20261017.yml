# Disposable PG-O read-only one-shot evidence job. Delete before PR integration.
name: PG-O real frontier manifold proxy
on:
  push:
    branches:
      - chatgpt/pg-o-real-frontier-manifold-proxy-20261017
    paths:
      - .github/workflows/pg-o-real-frontier-manifold-20261017.yml
      - scripts/stress/pg-o-real-frontier-manifold-proxy.mjs
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Pure prefix-manifold metric unit controls
        run: node scripts/run-bundled.mjs scripts/stress/pg-o-real-frontier-manifold-proxy.mjs -- --self-test
      - name: Source-joined 50 exact-labelled real-beam partial geometry readout
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-bundled.mjs scripts/stress/pg-o-real-frontier-manifold-proxy.mjs -- --out=tmp/pg-o/real-frontier-manifold-001.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('tmp/pg-o/real-frontier-manifold-001.json','utf8'));
          if(r.summary.parents!==2||r.summary.cases!==50||r.summary.live!==2||r.summary.dead!==48||r.summary.allFeatureCases!==50)throw Error('frozen cohort coverage changed');
          if(r.perLevel.find(x=>x.levelId==='R03147')?.live!==2)throw Error('same-parent LIVE contrast changed');
          console.log('PG-O COMPLETE COHORT VERIFIED');
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pg-o-real-frontier-manifold-proxy-20261017
          path: tmp/pg-o/real-frontier-manifold-001.json
          retention-days: 90
          if-no-files-found: warn
