# On-demand level-blind capability sweep over an EXPLICIT, caller-supplied id list, sharded with
# the same dynamic runtime-balanced bin-packing as solver-highbudget-unsolved-sweep.yml
# (scripts/plan-highbudget-shards.mjs, reused as-is -- it only ever needed an ids-file + corpus +
# node-budget, nothing sibling-workflow-specific).
#
# Why this exists: before it, nothing in .github/workflows/ covered "run these N specific ids,
# level-blind, at one budget, right now." solver-stress-refresh.yml is fixed to the full corpus in
# 20 static ranges; solver-repair-*-sample-ab.yml are each wired to one flag's bespoke eligible-
# population selector; solver-highbudget-unsolved-sweep.yml has the right dynamic-sharding shape but
# uses portfolio-solve-sweep.mjs (history-aware -- saved hints/prior solutions are real input there,
# see docs/solver-level-blindness.md) against two ids-file paths frozen in the repo. This workflow
# is that dynamic-sharding shape pointed at scripts/level-blind-capability-sweep.mjs instead, with
# the target id list supplied at dispatch time rather than committed beforehand -- for one-off
# research questions like "does this routing/config change actually recover these specific levels
# at production budget," not a recurring named experiment.
#
# CAPABILITY INVARIANT (same as solver-stress-refresh.yml): level-blind-capability-sweep.mjs only,
# never portfolio-solve-sweep.mjs -- no saved hint, prior solution, or historical status reaches the
# solve. Artifact-only, like the sample-A/B workflows: never commits to main, never touches
# logs/stress-corpusN-baseline.json or data/level-heatmaps.json, never saves hints (no --save-hints
# passed) -- this is diagnostic evidence for a specific question, not a baseline-shaping run.
#
# RESULT INTEGRITY INVARIANT: the combine job must observe exactly the dispatched id set, once each.
# A shard artifact existing is not enough: a timed-out shard may contain only a prefix of its planned
# slice. Late-stage experiments can additionally require nonzero work/node participation on a named
# stage before the run is allowed to count as decision-bearing evidence.
name: Solver level-blind targeted sweep
run-name: "Targeted sweep · ${{ inputs.ids_file || 'inline IDs' }} · enable=${{ inputs.enable_flags || 'none' }} · disable=${{ inputs.disable_flags || 'none' }}"

on:
  workflow_dispatch:
    inputs:
      ids:
        description: 'Explicit corpus ids to sweep, comma/whitespace/newline-separated (e.g. "R00118, R02075, R02696"). Mutually exclusive with ids_file -- set one.'
        required: false
        default: ''
      ids_file:
        description: 'Path (in-repo) to a newline-separated ids file, for a target list too large for the ids field. Mutually exclusive with ids.'
        required: false
        default: ''
      corpus:
        description: 'Corpus file the ids above live in.'
        required: false
        default: 'data/stress/stress-levels-random.json'
      node_budget:
        description: 'Per-level cumulative node ceiling, and the base the derived work_budget (node_budget * 1.34) is computed from. This is a per-level STARTING allocation, not a hard per-level cost ceiling: additive fallback/retry tiers can spend several times this much real work beyond it once the main ladder is exhausted (measured 1.5x-467x on a sample; see reports/2026-08-28-additive-tier-participation-audit.md). Pass --strict-total-work-budget for a true whole-solve work cap; this workflow does not do so by default, so it is not a solve-set-preserving substitution here without separate parity evidence. IMPORTANT: unlike work_budget, the raw node count IS checked as a hard, independent stopping condition (nodeBudgetReached in modules/solver/orchestration.ts), and its status label takes priority over work-budget-reached -- so a comparison meant to isolate a work-budget-share change (e.g. admissible_order_non_default_retry_budget_fraction) can be confounded if node_budget binds before that change could matter. Set node_budget_advisory_only=true for that case.'
        required: false
        default: '50000000'
      node_budget_advisory_only:
        description: 'If true, node_budget still sizes the derived work_budget, but is NOT passed to the actual per-level solve as a --node-budget ceiling (so nodeBudgetReached can never fire; work_budget becomes the sole binding constraint). The shard-planner''s wall-time/timeout estimate is sized off the larger derived work_budget in this mode instead of the raw node_budget, since node_budget no longer bounds a level''s real worst-case wall time here. Use this whenever the comparison under test is itself a work-budget-share change. REQUIRES strict_total_work_budget=true (enforced by an early workflow step) -- without a node-budget ceiling AND without a strict work-budget ceiling, a level''s real cost is unbounded (additive tiers measured 1.5x-467x beyond the nominal work_budget), and the planner''s timeout estimate cannot safely bound it either.'
        required: false
        default: 'false'
      strict_total_work_budget:
        description: 'If true, enforce the derived work budget as a true whole-solve ceiling. Default false preserves legacy additive-pass semantics. Mandatory (and enforced) when node_budget_advisory_only=true -- see that input''s own description.'
        required: false
        default: 'false'
      work_budget:
        description: 'Optional explicit per-level work ceiling, independent of node_budget. Blank (default) preserves existing behavior exactly: work_budget is derived as node_budget * 1.34, same as always. A supplied value replaces ONLY that derived number passed to --work-budget on the actual solve -- it does not change whether --node-budget is passed (node_budget_advisory_only still controls that) and does not change the shard planner''s own capacity/timeout sizing, which stays keyed to node_budget (real node consumption, not work, is what telemetry predicts). Use this to set a genuinely independent STRICT work ceiling (with strict_total_work_budget=true) while node_budget keeps bounding the search as a real, enforced cap -- the combination node_budget_advisory_only=true otherwise forces (removing the node cap entirely) is not always what a comparison needs. See docs/solver-correctness-hardening.md and reports/2026-09-10-repair-late-probe-six-seed-envelope-audit-001.md for why this was added.'
        required: false
        default: ''
      budget_ms:
        description: 'Per-level wall-safety deadline. Default 24h is intentionally non-binding; allocation is governed by node/work inputs, with additive tiers unless strict_total_work_budget=true.'
        required: false
        default: '86400000'
      workers:
        description: 'Cross-level worker processes per shard (GH-hosted ubuntu-latest runners have 4 vCPUs).'
        required: false
        default: '4'
      target_wall_minutes:
        description: 'Target wall-clock minutes per shard (shard count is derived from this, not fixed).'
        required: false
        default: '20'
      solo_threshold_multiplier:
        description: 'An id predicted to take >= target_wall_minutes * this multiplier gets its own dedicated shard instead of being packed with others.'
        required: false
        default: '2.5'
      min_timeout_minutes:
        description: 'Floor under every shard''s timeout-minutes, regardless of how low its telemetry-predicted wall time is. Raise this above the 30-minute default when this population''s real per-level cost under THIS resolved config is already known (from a prior run) to exceed what corpus2-runtime-telemetry.json predicts -- that telemetry reflects whatever config last refreshed it, not necessarily this dispatch''s flags/budget.'
        required: false
        default: '30'
      fixed_group_size:
        description: 'Bypass telemetry-driven capacity packing and group ids into fixed-size shards of exactly this many ids instead (leave blank for normal packing). Set this equal to `workers` when a population''s real per-level cost is already known to be badly underestimated by telemetry: the normal packer keeps packing many "supposedly cheap" ids together regardless of target_wall_minutes, producing one shard per group of `workers` ids that all solve truly concurrently (not queued sequentially) keeps each shard''s real wall time close to ONE id''s real cost no matter how wrong the telemetry is. Pairs with a generously raised min_timeout_minutes, which becomes the sole timeout basis in this mode.'
        required: false
        default: ''
      auto_recover_timeouts:
        description: 'If the first-pass population is incomplete for NO reason other than missing ids (every shard job itself succeeded, and there are no duplicate/unexpected/malformed rows), automatically plan and run a second, smaller matrix over exactly the missing ids, then re-combine both passes together. Never triggers for a genuine shard crash, configuration error, or malformed output -- those still fail the run for a human to look at.'
        required: false
        default: 'true'
      seed:
        description: "Shard-packing tie-break shuffle seed (blank = derived from this run's id)."
        required: false
        default: ''
      enable_flags:
        description: 'Comma-separated ablation flags to force ON (see modules/solver/ablation-config.ts FEATURES).'
        required: false
        default: ''
      disable_flags:
        description: 'Comma-separated ablation flags to force OFF.'
        required: false
        default: ''
      admissible_order_non_default_retry_budget_fraction:
        description: 'Optional override for admissible-order-alternate-tiebreak-retrys shared fresh work pool, as a fraction of the derived work_budget. Blank = production default (no override passed).'
        required: false
        default: ''
      repair_late_probe_multi_seed_retry_seed_count:
        description: 'Optional override truncating REPAIR_LATE_PROBE_MULTI_SEED_RETRY_SEED_SALTS to its first N entries (integer in [0, 7]; e.g. 6 = exactly salts 1-6) for the late-repair-multiseed-retry 7-vs-6 seed-count confirmation (reports/2026-09-05-repair-late-probe-six-seed-confirmation-preflight.md). Blank = production default (no override passed, full seven-salt array).'
        required: false
        default: ''
      required_participation_stage:
        description: 'Optional stageId that must do real work before this run is decision-bearing. Blank disables the participation gate.'
        required: false
        default: ''
      min_participating_levels:
        description: 'Minimum number of levels on which required_participation_stage must expand nodes or spend work. Used only when required_participation_stage is set.'
        required: false
        default: '1'
      min_participation_rate:
        description: 'Minimum FRACTION (0-1) of dispatched levels on which required_participation_stage must expand nodes or spend work. Used only when required_participation_stage is set. An absolute floor like min_participating_levels=1 is trivially satisfied on a large population; this scales with population size instead. Blank/0 disables the rate check (min_participating_levels alone still applies).'
        required: false
        default: ''
      concurrency_suffix:
        description: 'Optional suffix appended to this workflow''s concurrency group. Set distinct values on paired A/B dispatches when they should run concurrently.'
        required: false
        default: ''

concurrency:
  group: solver-level-blind-targeted-sweep${{ inputs.concurrency_suffix && format('-{0}', inputs.concurrency_suffix) || '' }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan weighted shards
    runs-on: ubuntu-latest
    # 30, not the planning bookkeeping's own few-second cost: the execution-family canary step
    # below does one real full-node_budget, single-worker solve under this dispatch's exact
    # resolved config, and this job's own timeout applies to that solve too. A 10-minute budget
    # killed a real dispatch here (2026-09-10, connectivity-volume-portal-ab-001 treatment arm,
    # position-1 canary still running at 9m28s) before the shard planner ever ran. 30 matches the
    # shard planner's own solo-shard floor (plan-highbudget-shards.mjs: max(30, ...)), so the
    # canary gets at least as much headroom as production gives its cheapest real shard.
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject the advisory-node-budget / non-strict-work-budget combination
        shell: bash
        run: |
          set -euo pipefail
          # 2026-09-09 historical regression-risk audit item #3: with node_budget_advisory_only=true,
          # --node-budget is never passed to the solve at all (nodeBudgetReached can't bind), so the
          # ONLY thing bounding a level's real worst-case cost is work_budget -- but strict_total_work_
          # budget defaults false, and work_budget is then only a STARTING allocation additive fallback/
          # retry tiers can spend 1.5x-467x beyond (measured, see reports/2026-08-28-additive-tier-
          # participation-audit.md). plan-highbudget-shards.mjs sizes each shard's job timeout from the
          # SAME nominal work_budget-derived estimate with only a flat 1.5x safety margin -- nowhere
          # near enough headroom for that measured multiplier -- so this combination recreates exactly
          # the timeout/selective-censoring mechanism found during the admissible-order confirmation
          # work: some levels get killed by the job timeout well before they would have finished or
          # genuinely exhausted, non-uniformly biasing which levels count as "unsolved" in a way that
          # looks like real solver evidence. Reject it outright rather than let it plan and run: a
          # caller needing node_budget_advisory_only for a work-budget-share comparison (its own
          # documented purpose) must also pass strict_total_work_budget=true, which makes work_budget
          # an actual whole-solve ceiling and makes the planner's timeout estimate bounding again.
          if [ "${{ inputs.node_budget_advisory_only }}" = "true" ] && [ "${{ inputs.strict_total_work_budget }}" != "true" ]; then
            echo "node_budget_advisory_only=true requires strict_total_work_budget=true." >&2
            echo "Without a node-budget ceiling AND without a strict work-budget ceiling, a level's real" >&2
            echo "worst-case cost is unbounded (additive fallback/retry tiers measured 1.5x-467x beyond" >&2
            echo "the nominal work_budget -- see reports/2026-08-28-additive-tier-participation-audit.md)," >&2
            echo "so the shard planner's timeout estimate cannot safely bound it either. This recreates" >&2
            echo "the timeout/selective-censoring issue found during the admissible-order confirmation" >&2
            echo "work: some levels get killed by the job timeout non-uniformly, biasing the result set." >&2
            echo "Pass strict_total_work_budget=true alongside node_budget_advisory_only=true." >&2
            exit 2
          fi

      - name: Resolve and validate the exact id population
        id: ids
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/solver-targeted-sweep
          if [ -n "${{ inputs.ids_file }}" ] && [ -n "${{ inputs.ids }}" ]; then
            echo "ids and ids_file are mutually exclusive." >&2
            exit 2
          elif [ -n "${{ inputs.ids_file }}" ]; then
            cp "${{ inputs.ids_file }}" logs/solver-targeted-sweep/ids.txt
          elif [ -n "${{ inputs.ids }}" ]; then
            printf '%s' "${{ inputs.ids }}" | tr ',' '\n' | tr -s ' \t' '\n' | sed '/^\s*$/d' > logs/solver-targeted-sweep/ids.txt
          else
            echo "One of ids / ids_file is required." >&2
            exit 2
          fi
          sed -i 's/\r$//' logs/solver-targeted-sweep/ids.txt
          sed -i '/^[[:space:]]*$/d' logs/solver-targeted-sweep/ids.txt
          duplicates=$(sort logs/solver-targeted-sweep/ids.txt | uniq -d)
          if [ -n "$duplicates" ]; then
            echo "Duplicate ids are not allowed:" >&2
            echo "$duplicates" >&2
            exit 2
          fi
          count=$(wc -l < logs/solver-targeted-sweep/ids.txt | tr -d ' ')
          [ "$count" -gt 0 ] || { echo "Resolved id list is empty." >&2; exit 2; }
          echo "Resolved ${count} unique id(s):"
          cat logs/solver-targeted-sweep/ids.txt

      - name: 'Execution-family canary: verify the resolved config on one representative level'
        shell: bash
        run: |
          set -euo pipefail
          # docs/solver-research-operating-model.md's "before expensive decision-bearing runs"
          # checklist requires an execution-family canary -- run the smallest representative cell
          # under the EXACT resolved cap/flags/selector mode, verifying work/node/deadline stop
          # semantics and expected output fields BEFORE scaling. Nothing previously enforced this
          # mechanically anywhere (2026-09-09 solver-development-operating-loop audit). One level
          # is enough to catch the structural failure modes this guards against: a resolved
          # ablation/flag combination that eliminates every attempt config (zero attempts
          # dispatched), a crash/exception path, a malformed output row, or a wall-clock deadline
          # that fires when it should be non-binding -- before committing to the full (potentially
          # 250-shard) matrix. See scripts/verify-canary-cell.mjs's own header comment for why this
          # deliberately does NOT check target-stage participation rate (that stays validate-
          # solver-sweep-integrity.mjs's job on the full population), which is also why the canary
          # level need not come from the dispatched population at all.
          #
          # Deliberately corpus position 1, NOT the first resolved id from this dispatch's own
          # population: that population is frequently curated specifically because it contains
          # hard/anomalous levels (targeted-sweep ids, highbudget "still unsolved" ids, stratified
          # samples, ...), so "the first id" can be one of the expensive ones -- exactly what
          # happened on 2026-09-10 (connectivity-volume-portal-ab-001 treatment arm, run
          # 34423190297: the canary alone ran past 9m28s and got killed by the plan job's own
          # timeout before the shard planner ever ran). Position 1 is one of the known-fast,
          # known-solvable levels recorded in logs/solver-canary-baseline.json (solved in ~300ms
          # under production defaults); a config that is fundamentally broken -- the actual thing
          # this canary checks for -- misbehaves on ANY level, not only hard ones, so trading
          # "representative of this dispatch's difficulty" for "cheap and reliable every time" costs
          # nothing here.
          canary_pos=1
          # Flag construction here is DELIBERATELY duplicated from "Run level-blind-capability-
          # sweep on this shard's slice" below, not factored into a shared script: the whole point
          # of a canary is that it runs under the SAME resolved config the real shards will use --
          # if you change one, change the other identically.
          extra=()
          [ -n "${{ inputs.enable_flags }}" ] && extra+=("--enable-flags=${{ inputs.enable_flags }}")
          [ -n "${{ inputs.disable_flags }}" ] && extra+=("--disable-flags=${{ inputs.disable_flags }}")
          [ -n "${{ inputs.admissible_order_non_default_retry_budget_fraction }}" ] && extra+=("--admissible-order-non-default-retry-budget-fraction=${{ inputs.admissible_order_non_default_retry_budget_fraction }}")
          [ -n "${{ inputs.repair_late_probe_multi_seed_retry_seed_count }}" ] && extra+=("--repair-late-probe-multi-seed-retry-seed-count=${{ inputs.repair_late_probe_multi_seed_retry_seed_count }}")
          work="${{ inputs.work_budget }}"
          [ -z "$work" ] && work=$(( ${{ inputs.node_budget }} * 134 / 100 ))
          strict=()
          [ "${{ inputs.strict_total_work_budget }}" = "true" ] && strict+=("--strict-total-work-budget")
          nodebudget=()
          [ "${{ inputs.node_budget_advisory_only }}" != "true" ] && nodebudget+=("--node-budget=${{ inputs.node_budget }}")
          node scripts/run-bundled.mjs scripts/level-blind-capability-sweep.mjs -- \
            --corpus="${{ inputs.corpus }}" \
            --levels="pos:${canary_pos}" \
            --budget-ms="${{ inputs.budget_ms }}" \
            "${nodebudget[@]}" \
            --work-budget="${work}" \
            "${strict[@]}" \
            --workers=1 \
            "${extra[@]}" \
            --out=logs/solver-targeted-sweep/canary.json \
            --summary-out=logs/solver-targeted-sweep/canary-summary.md
          node scripts/verify-canary-cell.mjs --result=logs/solver-targeted-sweep/canary.json --expect-no-deadline-truncation=true

      - name: Run the shard planner
        id: plan
        shell: bash
        run: |
          planning_node_budget="${{ inputs.node_budget }}"
          [ "${{ inputs.node_budget_advisory_only }}" = "true" ] && planning_node_budget=$(( ${{ inputs.node_budget }} * 134 / 100 ))
          fixedGroupSize=()
          [ -n "${{ inputs.fixed_group_size }}" ] && fixedGroupSize+=("--fixed-group-size=${{ inputs.fixed_group_size }}")
          node scripts/plan-highbudget-shards.mjs \
            --ids-file=logs/solver-targeted-sweep/ids.txt \
            --corpus2="${{ inputs.corpus }}" \
            --node-budget="${planning_node_budget}" \
            --workers="${{ inputs.workers }}" \
            --target-wall-minutes="${{ inputs.target_wall_minutes }}" \
            --solo-threshold-multiplier="${{ inputs.solo_threshold_multiplier }}" \
            --min-timeout-minutes="${{ inputs.min_timeout_minutes }}" \
            --enable-flags="${{ inputs.enable_flags }}" \
            --disable-flags="${{ inputs.disable_flags }}" \
            "${fixedGroupSize[@]}" \
            --seed="${{ inputs.seed || github.run_id }}" \
            --max-shards=250 \
            --out=logs/solver-targeted-sweep/shard-plan.json
          # {shard: [...]} ONLY -- the file also carries a top-level `planning` provenance object
          # (plan-highbudget-shards.mjs) that is not itself an array; spreading the WHOLE file into
          # `strategy.matrix` (as `jq -c .` did) makes GitHub Actions treat `planning` as a second,
          # invalid matrix axis, silently producing zero solve-shards job instances (regression from
          # the 2026-09-05 commit that added `planning` -- see plan-highbudget-shards.mjs's own
          # history; caught when this workflow's very first post-regression dispatch expanded to 0
          # shard jobs despite the plan step itself reporting a nonzero shard count).
          shards_json=$(jq -c '{shard: .shard}' logs/solver-targeted-sweep/shard-plan.json)
          echo "shards=${shards_json}" >> "$GITHUB_OUTPUT"
          echo "shard_count=$(jq '.shard | length' logs/solver-targeted-sweep/shard-plan.json)" >> "$GITHUB_OUTPUT"

      - name: Upload the exact population and shard plan
        uses: actions/upload-artifact@v7
        with:
          name: targeted-shard-plan
          path: |
            logs/solver-targeted-sweep/ids.txt
            logs/solver-targeted-sweep/shard-plan.json
          retention-days: 90

  solve-shards:
    name: Targeted shard ${{ matrix.shard.idx }}/${{ needs.plan.outputs.shard_count }}
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.shard.jobTimeoutMinutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run level-blind-capability-sweep on this shard's slice
        id: sweep
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p logs/solver-targeted-sweep
          extra=()
          [ -n "${{ inputs.enable_flags }}" ] && extra+=("--enable-flags=${{ inputs.enable_flags }}")
          [ -n "${{ inputs.disable_flags }}" ] && extra+=("--disable-flags=${{ inputs.disable_flags }}")
          [ -n "${{ inputs.admissible_order_non_default_retry_budget_fraction }}" ] && extra+=("--admissible-order-non-default-retry-budget-fraction=${{ inputs.admissible_order_non_default_retry_budget_fraction }}")
          [ -n "${{ inputs.repair_late_probe_multi_seed_retry_seed_count }}" ] && extra+=("--repair-late-probe-multi-seed-retry-seed-count=${{ inputs.repair_late_probe_multi_seed_retry_seed_count }}")
          work="${{ inputs.work_budget }}"
          [ -z "$work" ] && work=$(( ${{ inputs.node_budget }} * 134 / 100 ))
          strict=()
          [ "${{ inputs.strict_total_work_budget }}" = "true" ] && strict+=("--strict-total-work-budget")
          nodebudget=()
          [ "${{ inputs.node_budget_advisory_only }}" != "true" ] && nodebudget+=("--node-budget=${{ inputs.node_budget }}")
          levels="${{ matrix.shard.levels }}"
          levels="pos:$(echo "$levels" | sed 's/pos://g')"
          timeout -k 30s --preserve-status "${{ matrix.shard.timeoutMinutes }}m" node scripts/run-bundled.mjs scripts/level-blind-capability-sweep.mjs -- \
            --corpus="${{ inputs.corpus }}" \
            --levels="${levels}" \
            --budget-ms="${{ inputs.budget_ms }}" \
            "${nodebudget[@]}" \
            --work-budget="${work}" \
            "${strict[@]}" \
            --workers="${{ inputs.workers }}" \
            "${extra[@]}" \
            --out="logs/solver-targeted-sweep/batch-${{ matrix.shard.idx }}.json" \
            --summary-out="logs/solver-targeted-sweep/batch-${{ matrix.shard.idx }}-summary.md" \
            2>&1 | tee -a "logs/solver-targeted-sweep/batch-${{ matrix.shard.idx }}.console.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload this shard's raw results as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: targeted-shard-${{ matrix.shard.idx }}
          path: |
            logs/solver-targeted-sweep/batch-${{ matrix.shard.idx }}.json
            logs/solver-targeted-sweep/batch-${{ matrix.shard.idx }}-summary.md
            logs/solver-targeted-sweep/batch-${{ matrix.shard.idx }}.console.log
          if-no-files-found: warn
          retention-days: 90

      - name: Fail the job if the sweep failed for a reason other than its own timeout wrapper
        if: >-
          always() &&
          steps.sweep.outputs.exit_code != '0' &&
          steps.sweep.outputs.exit_code != '124' &&
          steps.sweep.outputs.exit_code != '143'
        run: |
          echo "sweep exit_code=${{ steps.sweep.outputs.exit_code }}"
          exit 1

  combine-first-pass:
    name: Combine first-pass shard results
    needs: [plan, solve-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    # NOT the terminal job any more -- outputs feed plan-recovery below. This job therefore never
    # hard-fails on an incomplete population (every validation-shaped step is continue-on-error):
    # a first pass that is missing ids ONLY (every shard job itself succeeded -- see solve-shards'
    # "Fail the job if the sweep failed for a reason other than its own timeout wrapper" step,
    # which treats an id's own timeout wrapper exit 124/143 as accepted, not a failure) is exactly
    # the case auto-recovery exists for, and combine-final below still runs the HARD, must-pass
    # validate once the recovery pass (if any) is folded in. A genuine correctness problem
    # (duplicates/unexpected/malformed rows, or no result at all) is caught by "Derive timeout-
    # recovery eligibility" below and never routed to recovery -- it surfaces at combine-final
    # exactly as it always did, for a human to look at.
    outputs:
      recoverable: ${{ steps.recovery.outputs.recoverable }}
      missing_count: ${{ steps.recovery.outputs.missing_count }}
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Download exact population and shard plan
        uses: actions/download-artifact@v8
        with:
          name: targeted-shard-plan
          path: artifact-staging/plan

      - name: Download every first-pass shard's artifact
        uses: actions/download-artifact@v8
        with:
          pattern: 'targeted-shard-[0-9]*'
          path: artifact-staging/downloaded
          merge-multiple: true

      - name: Lay the downloaded shard results onto the working tree
        shell: bash
        run: |
          mkdir -p logs/solver-targeted-sweep
          cp -a artifact-staging/downloaded/. logs/solver-targeted-sweep/ 2>/dev/null || true

      - name: Combine each shard's report into one
        continue-on-error: true
        shell: bash
        run: |
          if ! ls logs/solver-targeted-sweep/batch-*.json >/dev/null 2>&1; then
            echo "No shard result files found -- every shard likely failed before writing output." >&2
            exit 1
          fi
          FILES=$(ls logs/solver-targeted-sweep/batch-*.json | paste -sd, -)
          node scripts/combine-solver-sweep-reports.mjs --in="${FILES}" --out=logs/solver-targeted-sweep/combined.json

      - name: Validate exact population completeness and required participation (informational -- see combine-final for the hard gate)
        continue-on-error: true
        shell: bash
        run: |
          extra=()
          if [ -n "${{ inputs.required_participation_stage }}" ]; then
            extra+=("--required-stage=${{ inputs.required_participation_stage }}")
            extra+=("--min-participating-levels=${{ inputs.min_participating_levels }}")
            [ -n "${{ inputs.min_participation_rate }}" ] && extra+=("--min-participation-rate=${{ inputs.min_participation_rate }}")
          fi
          node scripts/validate-solver-sweep-integrity.mjs \
            --expected-ids=artifact-staging/plan/ids.txt \
            --result=logs/solver-targeted-sweep/combined.json \
            "${extra[@]}"

      - name: Derive timeout-recovery eligibility
        id: recovery
        if: always()
        shell: bash
        run: |
          set +e
          node scripts/derive-timeout-recovery-population.mjs \
            --expected-ids=artifact-staging/plan/ids.txt \
            --result=logs/solver-targeted-sweep/combined.json \
            --out=logs/solver-targeted-sweep/missing-ids.txt
          status=$?
          if [ "$status" -eq 0 ]; then
            missing_count=$(grep -c . logs/solver-targeted-sweep/missing-ids.txt 2>/dev/null || true)
            missing_count=${missing_count:-0}
            echo "recoverable=true" >> "$GITHUB_OUTPUT"
            echo "missing_count=${missing_count}" >> "$GITHUB_OUTPUT"
          else
            # exit 3 (duplicates/unexpected/malformed) or 4 (no/unparseable result) -- a genuine
            # correctness problem, never routed to auto-recovery. combine-final's hard validate
            # below reports the exact same failure to a human.
            echo "recoverable=false" >> "$GITHUB_OUTPUT"
            echo "missing_count=0" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Upload the missing-ids population for potential recovery
        if: steps.recovery.outputs.recoverable == 'true' && steps.recovery.outputs.missing_count != '0'
        uses: actions/upload-artifact@v7
        with:
          name: targeted-recovery-missing-ids
          path: logs/solver-targeted-sweep/missing-ids.txt
          retention-days: 90

      - name: Print a solved-count summary to the job log
        # Runs even when the population-completeness check above fails: that's exactly the
        # case (a partial/short run) where this per-level breakdown is most needed, since
        # artifact downloads are blocked in some sandboxed environments and this printed log
        # is otherwise the only way to recover which ids actually finished and how.
        if: always()
        shell: bash
        run: |
          node -e "
          let d;
          try {
            d = JSON.parse(require('fs').readFileSync('logs/solver-targeted-sweep/combined.json', 'utf8'));
          } catch (e) {
            console.log('No combined.json present (' + e.message + ') -- every shard likely failed before writing output.');
            process.exit(0);
          }
          const solved = d.levels.filter(l => l.ok).length;
          console.log('First-pass targeted sweep: ' + solved + '/' + d.levels.length + ' solved.');
          console.log('Solved: ' + d.levels.filter(l => l.ok).map(l => l.id).join(', '));
          console.log('Unsolved: ' + d.levels.filter(l => !l.ok).map(l => l.id + ' (' + l.status + ')').join(', '));
          "

  plan-recovery:
    name: Plan recovery shards for missing ids
    needs: [plan, solve-shards, combine-first-pass]
    # No always()/failure()/etc. here, so GitHub Actions' implicit success() check still applies to
    # every job in `needs` -- plan, solve-shards, AND combine-first-pass all must have concluded
    # 'success' (not 'failure'/'cancelled') before this condition is even evaluated. combine-first-
    # pass's own validation-shaped steps are all continue-on-error, so it always concludes success;
    # solve-shards concludes 'failure' the moment any shard job exits for a reason other than its own
    # timeout wrapper (see solve-shards' "Fail the job if..." step) -- so a genuine shard crash always
    # skips this job even before the explicit conditions below are checked.
    if: >-
      needs.combine-first-pass.outputs.recoverable == 'true' &&
      needs.combine-first-pass.outputs.missing_count != '0' &&
      inputs.auto_recover_timeouts != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the missing-ids population
        uses: actions/download-artifact@v8
        with:
          name: targeted-recovery-missing-ids
          path: artifact-staging/recovery

      - name: Run the shard planner over exactly the missing ids
        id: plan
        shell: bash
        run: |
          planning_node_budget="${{ inputs.node_budget }}"
          [ "${{ inputs.node_budget_advisory_only }}" = "true" ] && planning_node_budget=$(( ${{ inputs.node_budget }} * 134 / 100 ))
          recovery_min_timeout=$(( ${{ inputs.min_timeout_minutes }} * 2 ))
          [ "$recovery_min_timeout" -lt 60 ] && recovery_min_timeout=60
          # Every id here already timed out once under the first pass' own plan. Force
          # --fixed-group-size=workers rather than telemetry-driven packing (that packing is exactly
          # what may have under-estimated these ids in the first place) and double the timeout floor
          # (floored at 60m): each recovery shard packs exactly `workers` ids that solve truly
          # concurrently, so a shard's wall time stays close to ONE id's real cost regardless of how
          # wrong telemetry was -- without resorting to solo shards (rejected as a default; see
          # docs/solver-scheduling-policy.md) or broadly raising the global timeout.
          node scripts/plan-highbudget-shards.mjs \
            --ids-file=artifact-staging/recovery/missing-ids.txt \
            --corpus2="${{ inputs.corpus }}" \
            --node-budget="${planning_node_budget}" \
            --workers="${{ inputs.workers }}" \
            --target-wall-minutes="${{ inputs.target_wall_minutes }}" \
            --solo-threshold-multiplier="${{ inputs.solo_threshold_multiplier }}" \
            --min-timeout-minutes="${recovery_min_timeout}" \
            --enable-flags="${{ inputs.enable_flags }}" \
            --disable-flags="${{ inputs.disable_flags }}" \
            --fixed-group-size="${{ inputs.workers }}" \
            --seed="${{ inputs.seed || github.run_id }}-recovery" \
            --max-shards=250 \
            --out=logs/solver-targeted-sweep/recovery-shard-plan.json
          shards_json=$(jq -c '{shard: .shard}' logs/solver-targeted-sweep/recovery-shard-plan.json)
          echo "shards=${shards_json}" >> "$GITHUB_OUTPUT"
          echo "shard_count=$(jq '.shard | length' logs/solver-targeted-sweep/recovery-shard-plan.json)" >> "$GITHUB_OUTPUT"

      - name: Upload the recovery shard plan
        uses: actions/upload-artifact@v7
        with:
          name: targeted-recovery-shard-plan
          path: logs/solver-targeted-sweep/recovery-shard-plan.json
          retention-days: 90

  solve-recovery-shards:
    name: Recovery shard ${{ matrix.shard.idx }}/${{ needs.plan-recovery.outputs.shard_count }}
    needs: [plan-recovery]
    # No explicit `if:` -- when plan-recovery is skipped (the common case: most first passes need no
    # recovery), this job's own implicit needs-success gate skips it before `strategy.matrix` is ever
    # evaluated, so an empty/undefined `needs.plan-recovery.outputs.shards` never reaches fromJson().
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.shard.jobTimeoutMinutes }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.plan-recovery.outputs.shards) }}
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run level-blind-capability-sweep on this recovery shard's slice
        id: sweep
        continue-on-error: true
        shell: bash
        run: |
          set +e
          mkdir -p logs/solver-targeted-sweep
          extra=()
          [ -n "${{ inputs.enable_flags }}" ] && extra+=("--enable-flags=${{ inputs.enable_flags }}")
          [ -n "${{ inputs.disable_flags }}" ] && extra+=("--disable-flags=${{ inputs.disable_flags }}")
          [ -n "${{ inputs.admissible_order_non_default_retry_budget_fraction }}" ] && extra+=("--admissible-order-non-default-retry-budget-fraction=${{ inputs.admissible_order_non_default_retry_budget_fraction }}")
          [ -n "${{ inputs.repair_late_probe_multi_seed_retry_seed_count }}" ] && extra+=("--repair-late-probe-multi-seed-retry-seed-count=${{ inputs.repair_late_probe_multi_seed_retry_seed_count }}")
          work="${{ inputs.work_budget }}"
          [ -z "$work" ] && work=$(( ${{ inputs.node_budget }} * 134 / 100 ))
          strict=()
          [ "${{ inputs.strict_total_work_budget }}" = "true" ] && strict+=("--strict-total-work-budget")
          nodebudget=()
          [ "${{ inputs.node_budget_advisory_only }}" != "true" ] && nodebudget+=("--node-budget=${{ inputs.node_budget }}")
          levels="${{ matrix.shard.levels }}"
          levels="pos:$(echo "$levels" | sed 's/pos://g')"
          timeout -k 30s --preserve-status "${{ matrix.shard.timeoutMinutes }}m" node scripts/run-bundled.mjs scripts/level-blind-capability-sweep.mjs -- \
            --corpus="${{ inputs.corpus }}" \
            --levels="${levels}" \
            --budget-ms="${{ inputs.budget_ms }}" \
            "${nodebudget[@]}" \
            --work-budget="${work}" \
            "${strict[@]}" \
            --workers="${{ inputs.workers }}" \
            "${extra[@]}" \
            --out="logs/solver-targeted-sweep/recovery-batch-${{ matrix.shard.idx }}.json" \
            --summary-out="logs/solver-targeted-sweep/recovery-batch-${{ matrix.shard.idx }}-summary.md" \
            2>&1 | tee -a "logs/solver-targeted-sweep/recovery-batch-${{ matrix.shard.idx }}.console.log"
          status=${PIPESTATUS[0]}
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload this recovery shard's raw results as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: targeted-recovery-shard-${{ matrix.shard.idx }}
          path: |
            logs/solver-targeted-sweep/recovery-batch-${{ matrix.shard.idx }}.json
            logs/solver-targeted-sweep/recovery-batch-${{ matrix.shard.idx }}-summary.md
            logs/solver-targeted-sweep/recovery-batch-${{ matrix.shard.idx }}.console.log
          if-no-files-found: warn
          retention-days: 90

      - name: Fail the job if the sweep failed for a reason other than its own timeout wrapper
        if: >-
          always() &&
          steps.sweep.outputs.exit_code != '0' &&
          steps.sweep.outputs.exit_code != '124' &&
          steps.sweep.outputs.exit_code != '143'
        run: |
          echo "sweep exit_code=${{ steps.sweep.outputs.exit_code }}"
          exit 1

  combine-final:
    name: Combine final results
    needs: [plan, combine-first-pass, plan-recovery, solve-recovery-shards]
    # always(): must still run (and hard-validate) when plan-recovery/solve-recovery-shards were
    # skipped (no recovery needed or not eligible) -- only combine-first-pass itself being skipped
    # (which cannot happen; it is if: always() and depends only on the root `plan` job) would mean
    # there is nothing to combine at all.
    if: always() && needs.combine-first-pass.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Download exact population and shard plan
        uses: actions/download-artifact@v8
        with:
          name: targeted-shard-plan
          path: artifact-staging/plan

      - name: Download every first-pass shard's artifact
        uses: actions/download-artifact@v8
        with:
          pattern: 'targeted-shard-[0-9]*'
          path: artifact-staging/downloaded
          merge-multiple: true

      - name: Download every recovery-pass shard's artifact, if a recovery pass ran
        if: needs.plan-recovery.result == 'success'
        uses: actions/download-artifact@v8
        with:
          pattern: 'targeted-recovery-shard-[0-9]*'
          path: artifact-staging/downloaded-recovery
          merge-multiple: true
          if-no-files-found: ignore

      - name: Lay the downloaded shard results onto the working tree
        shell: bash
        run: |
          mkdir -p logs/solver-targeted-sweep
          cp -a artifact-staging/downloaded/. logs/solver-targeted-sweep/ 2>/dev/null || true
          cp -a artifact-staging/downloaded-recovery/. logs/solver-targeted-sweep/ 2>/dev/null || true

      - name: Combine every first-pass and recovery-pass shard report into one
        shell: bash
        run: |
          if ! ls logs/solver-targeted-sweep/batch-*.json >/dev/null 2>&1; then
            echo "No shard result files found -- every shard likely failed before writing output." >&2
            exit 1
          fi
          FILES=$(ls logs/solver-targeted-sweep/batch-*.json 2>/dev/null)
          # Recovery ids replace their first-pass (missing) counterparts, not duplicate them --
          # first-pass shards never produced a row for a missing id in the first place, so every id
          # across both passes' batch files appears exactly once. combine-solver-sweep-reports.mjs
          # concatenates rows as-is; the exact-population validate below is what actually enforces
          # "no duplicates" if that assumption is ever wrong.
          if ls logs/solver-targeted-sweep/recovery-batch-*.json >/dev/null 2>&1; then
            FILES="${FILES}
          $(ls logs/solver-targeted-sweep/recovery-batch-*.json)"
          fi
          FILES=$(echo "$FILES" | paste -sd, -)
          node scripts/combine-solver-sweep-reports.mjs --in="${FILES}" --out=logs/solver-targeted-sweep/combined.json

      - name: Validate exact population completeness and required participation
        shell: bash
        run: |
          extra=()
          if [ -n "${{ inputs.required_participation_stage }}" ]; then
            extra+=("--required-stage=${{ inputs.required_participation_stage }}")
            extra+=("--min-participating-levels=${{ inputs.min_participating_levels }}")
            [ -n "${{ inputs.min_participation_rate }}" ] && extra+=("--min-participation-rate=${{ inputs.min_participation_rate }}")
          fi
          node scripts/validate-solver-sweep-integrity.mjs \
            --expected-ids=artifact-staging/plan/ids.txt \
            --result=logs/solver-targeted-sweep/combined.json \
            "${extra[@]}"

      - name: Print a solved-count summary to the job log
        # Runs even when the population-completeness check above fails: that's exactly the
        # case (a partial/short run) where this per-level breakdown is most needed, since
        # artifact downloads are blocked in some sandboxed environments and this printed log
        # is otherwise the only way to recover which ids actually finished and how.
        if: always()
        shell: bash
        run: |
          node -e "
          let d;
          try {
            d = JSON.parse(require('fs').readFileSync('logs/solver-targeted-sweep/combined.json', 'utf8'));
          } catch (e) {
            console.log('No combined.json present (' + e.message + ') -- every shard likely failed before writing output.');
            process.exit(0);
          }
          const solved = d.levels.filter(l => l.ok).length;
          console.log('Targeted sweep: ' + solved + '/' + d.levels.length + ' solved.');
          console.log('Solved: ' + d.levels.filter(l => l.ok).map(l => l.id).join(', '));
          console.log('Unsolved: ' + d.levels.filter(l => !l.ok).map(l => l.id + ' (' + l.status + ')').join(', '));
          "

      - name: Print an aggregate/per-level workSpent and per-stage breakdown to the job log
        # See the note on "Print a solved-count summary" above -- same reasoning: a partial
        # run's per-level detail (this step's per-stage tables include every id's ok/status,
        # not just the ones that reached that stage) is exactly what's needed to recover
        # results when validation failed and artifact downloads aren't available.
        if: always()
        shell: bash
        run: |
          if [ ! -f logs/solver-targeted-sweep/combined.json ]; then
            echo "No combined.json present -- every shard likely failed before writing output."
            exit 0
          fi
          node scripts/summarize-targeted-sweep-work.mjs \
            --in=logs/solver-targeted-sweep/combined.json \
            --stage=admissible-order-alternate-tiebreak-retry,admissible-order-fallback,connectivity-axis-prune-disabled-retry

      - name: Upload the combined result as an artifact
        uses: actions/upload-artifact@v7
        with:
          name: targeted-sweep-combined
          path: logs/solver-targeted-sweep/combined.json
          retention-days: 90

      - name: Publish standard solver sweep result
        if: always()
        shell: bash
        run: |
          node scripts/publish-solver-sweep-result.mjs \
            --primary="logs/solver-targeted-sweep/combined.json" \
            --include="artifact-staging/plan/ids.txt" \
            --include="artifact-staging/plan/shard-plan.json" \
            --shards-expected="${{ needs.plan.outputs.shard_count }}" \
            --shards-observed="$(find logs/solver-targeted-sweep -maxdepth 1 -name 'batch-*.json' -o -name 'recovery-batch-*.json' | wc -l | tr -d ' ')" \
            --shards-basis="exact expected population validated separately" \
            --source-artifact="targeted-sweep-combined"

      - name: Upload standard solver sweep result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-sweep-result
          path: logs/solver-sweep-result/
          if-no-files-found: error
          retention-days: 90
