name: Repair late must-turn stage plan

on:
  push:
    branches:
      - chatgpt/must-turn-family-contrast-pilot-2026-09-13
    paths:
      - scripts/trigger-late-mustturn-stage-plan-repair.txt

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: python3 scripts/patch-late-mustturn-stage-plan.py
      - run: npx vitest run modules/solver/stage-plan.test.ts scripts/late-mustturn-tier-unit-tests.mjs
      - run: npm run check:types
      - name: Commit repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add modules/solver/stage-plan.ts modules/solver/orchestration.ts
          git commit -m 'Fix: complete late must-turn stage planning'
          git push origin HEAD:chatgpt/must-turn-family-contrast-pilot-2026-09-13
