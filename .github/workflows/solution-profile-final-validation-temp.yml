name: Temporary final solution-profile validation

on:
  push:
    branches:
      - chatgpt/solution-profile-resource-audit-2026-09-13

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Prepare one-shot validation metadata
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          report = Path('reports/2026-09-13-solution-profile-resource-audit-001.md')
          text = report.read_text()
          old = 'Status: hardening implemented on branch; full validation and generated-artifact refresh pending.'
          new = '''> **Status:** active
          > **Last evidence:** 2026-09-13 — semantic hardening passed targeted profile tests and lint; full repository validation is now running.
          > **Decision:** retain the solution-profile resource as a known-solution sample-profile instrument under schema v3, with unsupported axes omitted from comparison.
          > **Remaining gate:** regenerate tracked schema-v3 libraries and pass the repository validation, type/docs checks, and comparer smoke tests.'''
          assert old in text, 'expected pre-validation audit status line not found'
          report.write_text(text.replace(old, new, 1))

          name = 'solution-profile-final-validation-temp.yml'
          readme = Path('.github/workflows/README.md')
          r = readme.read_text()
          if name not in r:
              marker = '## One-shot diagnostics (delete after use)\n\n'
              assert marker in r, 'one-shot workflow section not found'
              r = r.replace(marker, marker + f'`{name}` is the branch-local one-shot validation/regeneration gate for the 2026-09-13 solution-profile audit; delete it after the run is recorded.\n\n', 1)
              readme.write_text(r)

          ledger_path = Path('docs/solver-workflow-lifecycle.json')
          ledger = json.loads(ledger_path.read_text())
          if not any(row.get('workflow') == name for row in ledger['workflows']):
              ledger['workflows'].append({
                  'workflow': name,
                  'role': 'operational',
                  'status': 'maintained',
                  'currentConsumer': 'one-shot 2026-09-13 solution-profile audit validation',
                  'retirementTrigger': 'delete immediately after the audit validation run is recorded',
              })
              ledger_path.write_text(json.dumps(ledger, indent=2) + '\n')
          PY
      - name: Apply final sample-summary semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          lib = Path('scripts/stress/solution-profile-lib.mjs')
          s = lib.read_text()
          s = s.replace("export const SOLUTION_PROFILE_ALGORITHM_VERSION = 'sample-support-v1';",
                        "export const SOLUTION_PROFILE_ALGORITHM_VERSION = 'sample-support-v2';")

          old = '''export function summarizeCorpusProfiles(levelProfiles) {
              const withHints = levelProfiles.filter(p => !p.insufficientData);
              const combined = withHints.map(p => p.combined).filter(Boolean);
              const withMustCrossOrder = combined.filter(c => c.mustCrossOrder);
              const withSaturation = combined.filter(c => c.discoverySaturation?.plateauFraction !== null);

              const sourceCoverage = {};
              for (const source of PROVENANCE_SOURCES) {
                  sourceCoverage[source] = withHints.filter(p => !p.bySource?.[source]?.insufficientData).length;
              }

              return {
                  levelsTotal: levelProfiles.length,
                  levelsWithHints: withHints.length,
                  levelsInsufficientData: levelProfiles.length - withHints.length,
                  levelsWithExhaustiveSearchEvent: combined.filter(c => c.hasExhaustiveSearchEvent).length,
                  meanHintCount: Number(mean(withHints.map(p => p.hintCount)).toFixed(2)),
                  meanPathwiseDistinctiveness: Number(mean(combined.map(c => c.pairwiseDistinctiveness.meanDistance)).toFixed(4)),
                  meanTurnRate: Number(mean(combined.map(c => c.turnDistribution.turnRateMean)).toFixed(4)),
                  meanCwFraction: Number(mean(combined.map(c => c.turnDistribution.cwFraction).filter(Number.isFinite)).toFixed(4)),
                  levelsWithMustCrossOrder: withMustCrossOrder.length,
                  levelsWithObservedSingleMustCrossOrder: withMustCrossOrder.filter(c => c.mustCrossOrder.observedSingleOrder).length,
                  meanDiscoverySaturationPlateauFraction: withSaturation.length
                      ? Number(mean(withSaturation.map(c => c.discoverySaturation.plateauFraction)).toFixed(4)) : null,
                  sourceCoverage,
              };
          }'''
          new = '''export function summarizeCorpusProfiles(levelProfiles) {
              const withHints = levelProfiles.filter(p => !p.insufficientData);
              const combined = withHints.map(p => p.combined).filter(Boolean);
              const withPairwise = combined.filter(c => (c.pairwiseDistinctiveness?.pairsCompared ?? 0) > 0);
              const chiralityValues = combined.map(c => c.turnDistribution?.cwFraction).filter(Number.isFinite);
              const withMustCrossOrder = combined.filter(c => c.mustCrossOrder);
              const withComparableMustCrossOrder = withMustCrossOrder.filter(c => (c.mustCrossOrder.pathsObserved ?? 0) >= 2);
              const withComparableSaturation = combined.filter(c =>
                  c.discoverySaturation?.chronologyComplete === true && (c.discoverySaturation?.totalHints ?? 0) >= 5);
              const withDetectedSaturation = withComparableSaturation.filter(c => c.discoverySaturation.plateauFraction !== null);

              const originCoverage = {};
              for (const origin of PROVENANCE_SOURCES) {
                  originCoverage[origin] = withHints.filter(p => !p.bySource?.[origin]?.insufficientData).length;
              }

              return {
                  levelsTotal: levelProfiles.length,
                  levelsWithHints: withHints.length,
                  levelsInsufficientData: levelProfiles.length - withHints.length,
                  levelsWithExhaustiveSearchEvent: combined.filter(c => c.hasExhaustiveSearchEvent).length,
                  meanHintCount: Number(mean(withHints.map(p => p.hintCount)).toFixed(2)),
                  levelsWithComparablePathwiseDistinctiveness: withPairwise.length,
                  meanPathwiseDistinctiveness: withPairwise.length
                      ? Number(mean(withPairwise.map(c => c.pairwiseDistinctiveness.meanDistance)).toFixed(4)) : null,
                  meanTurnRate: Number(mean(combined.map(c => c.turnDistribution.turnRateMean)).toFixed(4)),
                  meanCwFraction: chiralityValues.length ? Number(mean(chiralityValues).toFixed(4)) : null,
                  levelsWithMustCrossOrder: withMustCrossOrder.length,
                  levelsWithComparableMustCrossOrder: withComparableMustCrossOrder.length,
                  levelsWithObservedSingleMustCrossOrder: withComparableMustCrossOrder
                      .filter(c => c.mustCrossOrder.observedSingleOrder).length,
                  levelsWithComparableDiscoverySaturation: withComparableSaturation.length,
                  levelsWithDetectedDiscoverySaturationPlateau: withDetectedSaturation.length,
                  meanDiscoverySaturationPlateauFraction: withDetectedSaturation.length
                      ? Number(mean(withDetectedSaturation.map(c => c.discoverySaturation.plateauFraction)).toFixed(4)) : null,
                  originCoverage,
                  // Compatibility alias for schema-v2 consumers. New human-facing output uses origin terminology.
                  sourceCoverage: originCoverage,
              };
          }'''
          assert old in s, 'summary function shape changed unexpectedly'
          s = s.replace(old, new)
          s = s.replace('`# Solution-space fingerprint summary — ${corpusTag}`',
                        '`# Known-solution sample-profile summary — ${corpusTag}`')
          old_line = '''        `- Mean hints/level: **${summary.meanHintCount}**. Mean pairwise distinctiveness: ` +
                  `**${summary.meanPathwiseDistinctiveness}**. Mean turn rate: **${summary.meanTurnRate}** ` +
                  `(cw fraction **${summary.meanCwFraction}**).`,'''
          new_line = '''        `- Mean hints/level: **${summary.meanHintCount}**. Mean pairwise distinctiveness: ` +
                  `${summary.meanPathwiseDistinctiveness === null ? 'n/a' : `**${summary.meanPathwiseDistinctiveness}**`} ` +
                  `across **${summary.levelsWithComparablePathwiseDistinctiveness}** levels with at least one path pair. ` +
                  `Mean turn rate: **${summary.meanTurnRate}** (cw fraction ` +
                  `${summary.meanCwFraction === null ? 'n/a' : `**${summary.meanCwFraction}**`}).`,'''
          assert old_line in s, 'pairwise summary renderer shape changed unexpectedly'
          s = s.replace(old_line, new_line)
          old_mc = '''        `- Must-cross order: **${summary.levelsWithObservedSingleMustCrossOrder}** / ` +
                  `${summary.levelsWithMustCrossOrder} multi-must-cross levels show one observed entry+completion order in the stored sample.`,'''
          new_mc = '''        `- Must-cross order: **${summary.levelsWithObservedSingleMustCrossOrder}** / ` +
                  `**${summary.levelsWithComparableMustCrossOrder}** support-comparable multi-must-cross levels show one observed ` +
                  `entry+completion order; **${summary.levelsWithMustCrossOrder}** levels have the mechanic at all.`,'''
          assert old_mc in s, 'must-cross summary renderer shape changed unexpectedly'
          s = s.replace(old_mc, new_mc)
          old_sat = '''        summary.meanDiscoverySaturationPlateauFraction === null
                      ? '- Discovery-saturation plateau: n/a (no comparable fully dated level had a detected plateau).'
                      : `- Mean discovery-saturation plateau point: **${summary.meanDiscoverySaturationPlateauFraction}** ` +
                        'of a level\\'s hint corpus (heuristic — see doc; not proof of exhaustion).','''
          new_sat = '''        `- Discovery saturation: **${summary.levelsWithDetectedDiscoverySaturationPlateau}** / ` +
                  `**${summary.levelsWithComparableDiscoverySaturation}** chronology-comparable levels had a detected plateau; ` +
                  `mean detected point ${summary.meanDiscoverySaturationPlateauFraction === null ? 'n/a' : `**${summary.meanDiscoverySaturationPlateauFraction}**`} ` +
                  '(heuristic; no-plateau observations stay in the denominator and are not treated as missing).','''
          assert old_sat in s, 'saturation summary renderer shape changed unexpectedly'
          s = s.replace(old_sat, new_sat)
          s = s.replace('...PROVENANCE_SOURCES.map(s => `| ${s} | ${summary.sourceCoverage[s]} |`),',
                        '...PROVENANCE_SOURCES.map(origin => `| ${origin} | ${summary.originCoverage[origin]} |`),')
          s = s.replace('/** Builds AND WRITES the full solution-space fingerprint library for one corpus — the single',
                        '/** Builds AND WRITES the full known-solution sample-profile library for one corpus — the single')
          s = s.replace("description: 'Per-level solution-space fingerprints (combined + per-provenance-source) for a '",
                        "description: 'Per-level known-solution sample profiles (combined + per-provenance-origin) for a '")
          s = s.replace('// Compact, not pretty-printed: this is a machine-readable fingerprint library, not a',
                        '// Compact, not pretty-printed: this is a machine-readable sample-profile library, not a')
          lib.write_text(s)

          compare = Path('scripts/stress/solution-profile-compare.mjs')
          c = compare.read_text()
          c = c.replace('the id itself — e.g. --target-level=R00042;', 'the id itself — e.g. --target-level=R00042;')
          c = c.replace('npx tsx scripts/stress/solution-profile-compare.mjs --target-level=42',
                        'npx tsx scripts/stress/solution-profile-compare.mjs --target-level=pos:42')
          c = c.replace("console.error('Usage: --target-level=<n or id>",
                        "console.error('Usage: --target-level=<pos:n or full-id>")
          compare.write_text(c)

          docs = Path('docs/solver-solution-profile.md')
          d = docs.read_text().replace('profileAlgorithmVersion: sample-support-v1',
                                       'profileAlgorithmVersion: sample-support-v2')
          d = d.replace('npm run stress:solution-profile-compare -- --target-level=42',
                        'npm run stress:solution-profile-compare -- --target-level=pos:42')
          docs.write_text(d)

          audit = Path('reports/2026-09-13-solution-profile-resource-audit-001.md')
          a = audit.read_text().replace('`profileAlgorithmVersion: sample-support-v1`',
                                        '`profileAlgorithmVersion: sample-support-v2`')
          audit.write_text(a)

          tests = Path('scripts/stress/solution-profile-lib-unit-tests.mjs')
          t = tests.read_text()
          marker = '''    assert.equal(summary.levelsTotal, 2);
              assert.equal(summary.levelsWithHints, 1);
              assert.equal(summary.levelsInsufficientData, 1);'''
          replacement = marker + '''
              assert.equal(summary.levelsWithComparablePathwiseDistinctiveness, 0);
              assert.equal(summary.meanPathwiseDistinctiveness, null);
              assert.equal(summary.meanCwFraction, null);'''
          assert marker in t, 'summary unit-test anchor changed unexpectedly'
          t = t.replace(marker, replacement, 1)
          tests.write_text(t)
          PY
      - name: Targeted profile checks
        run: |
          npx vitest run scripts/stress/solution-profile-lib-unit-tests.mjs scripts/stress/provenance-source-taxonomy-unit-tests.mjs
          npx eslint scripts/stress/solution-profile-lib.mjs scripts/stress/solution-profile-lib-unit-tests.mjs scripts/stress/solution-profile-compare.mjs scripts/stress/solution-profile-resource-audit.mjs
      - name: Regenerate published profile library
        run: npm run stress:solution-profile -- --levels-json=data/levels.json --out=reports/stress/solution-profile-published.json
      - name: Regenerate Corpus-1 profile library
        run: npm run stress:solution-profile -- --levels-json=data/stress/stress-levels.json --out=reports/stress/solution-profile-corpus1.json
      - name: Fast repository CI
        run: npm run ci:fast
      - name: Type check
        run: npm run check:types
      - name: Documentation links
        run: npm run check:documentation-links
      - name: Combined-profile comparer smoke
        run: npm run stress:solution-profile-compare -- --target-level=pos:1 --top=3
      - name: Origin-bucket comparer smoke
        run: npm run stress:solution-profile-compare -- --target-level=pos:1 --bucket=pathfinder-solver --top=1
      - name: Finalize audit status and recheck docs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          report = Path('reports/2026-09-13-solution-profile-resource-audit-001.md')
          text = report.read_text()
          active = '''> **Status:** active
          > **Last evidence:** 2026-09-13 — semantic hardening passed targeted profile tests and lint; full repository validation is now running.
          > **Decision:** retain the solution-profile resource as a known-solution sample-profile instrument under schema v3, with unsupported axes omitted from comparison.
          > **Remaining gate:** regenerate tracked schema-v3 libraries and pass the repository validation, type/docs checks, and comparer smoke tests.'''
          done = '''> **Status:** concluded-positive
          > **Last evidence:** 2026-09-13 — schema-v3 profile regeneration, fast repository CI, type/docs checks, and combined/origin-bucket comparer smoke tests all passed.
          > **Decision:** retain the hardened solution-profile resource as a known-solution sample-profile instrument; sparse-profile similarity remains exploratory research evidence, not a production routing feature.
          > **Remaining gate:** none for this audit; future profile/outcome research must use held-out evidence and the provenance/evidence-purpose controls documented below.'''
          assert active in text, 'active audit status block not found'
          report.write_text(text.replace(active, done, 1))
          PY
          npm run check:documentation-links
      - name: Commit final profile hardening, regenerated artifacts and audit closeout
        shell: bash
        run: |
          git add docs/solver-solution-profile.md \
                  scripts/stress/solution-profile-lib.mjs \
                  scripts/stress/solution-profile-lib-unit-tests.mjs \
                  scripts/stress/solution-profile-compare.mjs \
                  reports/2026-09-13-solution-profile-resource-audit-001.md \
                  reports/stress/solution-profile-published.json \
                  reports/stress/solution-profile-published-summary.md \
                  reports/stress/solution-profile-corpus1.json \
                  reports/stress/solution-profile-corpus1-summary.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'research: finalize schema-v3 solution profiles'
          git push origin HEAD:chatgpt/solution-profile-resource-audit-2026-09-13
