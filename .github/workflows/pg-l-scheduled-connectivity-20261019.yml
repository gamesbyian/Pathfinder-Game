# One-shot source-native PG-L exact scheduled connectivity call falsifier.
name: PG-L scheduled connectivity chronology
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pg-l-scheduled-connectivity-20261019.yml'
      - 'scripts/stress/pg-l-scheduled-connectivity-chronology.mjs'
  workflow_dispatch:
concurrency:
  group: pg-l-scheduled-connectivity-20261019
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  observe:
    name: Full source 250k two-parent control and typed connectivity observer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Pure conservative state-key and ordinal contract fixture
        run: node scripts/stress/pg-l-scheduled-connectivity-chronology.mjs --self-test
      - name: Run exact two-source 250k production controls
        id: experiment
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/pg-l-connectivity
          timeout -k 20s --preserve-status 24m \
            node scripts/run-bundled.mjs scripts/stress/pg-l-scheduled-connectivity-chronology.mjs -- \
            --out=logs/pg-l-connectivity/verdict.json
      - name: Retain exact complete or partial machine evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-l-scheduled-connectivity-20261019
          path: logs/pg-l-connectivity/verdict.json
          retention-days: 90
          if-no-files-found: warn
      - name: Preserve source correctness regardless of economic outcome
        if: always()
        env:
          EXPERIMENT_OUTCOME: ${{ steps.experiment.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPERIMENT_OUTCOME" = success
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const j=JSON.parse(readFileSync('logs/pg-l-connectivity/verdict.json','utf8'));
          if(j.executionSha!==process.env.GITHUB_SHA
            ||j.summary.parents!==2
            ||j.summary.parityPasses!==2
            ||j.summary.contradictionAlarms!==0
            ||j.summary.sourceCensored!==false)
            throw Error('PG-L source, equality or parity control failure');
          console.log('PG-L TYPED CONNECTIVITY '+JSON.stringify(j.summary));
          NODE
