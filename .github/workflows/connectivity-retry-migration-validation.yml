name: Connectivity retry migration validation

on:
  pull_request:
    paths:
      - 'modules/solver/orchestration.ts'
      - 'modules/solver/orchestration.test.ts'
      - 'modules/solver/budget-units.ts'
      - 'scripts/check-solver-budget-boundaries.mjs'
      - '.github/workflows/connectivity-retry-migration-validation.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Targeted ownership tests
        run: SOLVER_DEEP_TESTS=0 npx vitest run modules/solver/orchestration.test.ts -t "connectivity-axis-prune-disabled-retry"
      - name: Published-corpus solver regression
        run: npm run solver:regression -- --check
