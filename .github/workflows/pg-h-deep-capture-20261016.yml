# Temporary PG-H capture-only deep-prefix opportunity readout.
name: PG-H deep prefix capture opportunity
on:
  push:
    branches:
      - chatgpt/pg-h-deep-prefix-observability-2026-10-16
    paths:
      - .github/workflows/pg-h-deep-capture-20261016.yml
permissions:
  contents: read
jobs:
  deep-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Capture deep eligible states on the original frozen eight parents
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/pg-h-deep
          node scripts/run-bundled.mjs scripts/stress/semantic-forcedness-capture.mjs -- \
            --corpus=data/stress/stress-levels-random.json \
            --levels=R00242,R02941,R03030,R02405,R01229,R02307,R02561,R02240 \
            --profile=objectiveFirst --width=500 \
            --work-budget=500000 --budget-ms=600000 \
            --min-children=2 --max-children=4 --max-states-per-gate=2 \
            --selection=deepest \
            --out=tmp/pg-h-deep/capture.json \
            --cases-out=tmp/pg-h-deep/cases.json
      - name: Freeze exact follow-up opportunities without querying oracle
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const capture=JSON.parse(readFileSync('tmp/pg-h-deep/capture.json','utf8'));
          const cases=JSON.parse(readFileSync('tmp/pg-h-deep/cases.json','utf8'));
          const states=capture.parents.flatMap(p=>p.gates.flatMap(g=>g.selected.map(s=>({
            levelId:p.levelId,stateId:s.stateId,depth:s.depth,children:s.children.length,
            work:g.workSpent,eligibleForGate:g.eligibleStateCount
          }))));
          if(capture.protocol.selectionMode!=='deepest')throw Error('selection not persisted');
          if(states.length!==16||new Set(states.map(s=>s.stateId)).size!==16)throw Error('changed frozen state count');
          if(cases.cases.length<16||cases.cases.length>320||cases.cases.length!==capture.summary.childCases)throw Error('invalid case count');
          const depths=states.map(s=>s.depth);
          const summary={schema:'pathfinder.pg-h-deep-opportunity/v1',sourceCommit:process.env.GITHUB_SHA,
            states:states.length,caseCount:cases.cases.length,
            minDepth:Math.min(...depths),maxDepth:Math.max(...depths),
            meanDepth:depths.reduce((sum,n)=>sum+n,0)/depths.length,
            depths,states,oracleRun:false};
          writeFileSync('tmp/pg-h-deep/verdict.json',JSON.stringify(summary,null,2)+'\n');
          console.log('PG-H DEEP CAPTURE VERDICT '+JSON.stringify(summary));
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: pg-h-deep-capture-opportunity-001
          path: tmp/pg-h-deep/
          if-no-files-found: error
          retention-days: 90
