name: Harvest solver hint evidence

on:
  workflow_run:
    workflows:
      - 'Solver stress-corpus refresh (level-blind capability)'
      - 'Solver history-aware production replay baseline (corpus-1 + corpus-2)'
      - 'Solver high-budget sweep (unsolved-only, both corpora)'
      - 'Solver level-blind targeted sweep'
      - 'Solver routing-regime-gated routing sample A/B'
      - 'method-probe sweep (isolated single-method corpus test)'
      - 'Technique capability census (isolated single-/paired-/flag-technique, full budget)'
      - 'cpsat-hint-harvest-sweep (broaden CP-SAT hint coverage)'
      - 'Solver broad confirmation cohort'
      - 'Solver two-phase residual confirmation'
      - 'Static portfolio confirmation A/B'
      - 'Solver combine sweep runs (cross-run reconciliation)'
      - 'Solver diagnostics and hint capture'
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Existing Actions run id to re-harvest/backfill without rerunning the solver.'
        required: true
      source_workflow:
        description: 'Optional expected source workflow name; when supplied it must match the Actions run.'
        required: false
        default: ''
      source_sha:
        description: 'Optional expected source SHA; when supplied it must match the Actions run.'
        required: false
        default: ''

# Source runs may finish together. Keep one semantic writer for canonical solver evidence so two
# provenance/retention updates can never devolve into last-writer-wins generated-file commits.
concurrency:
  group: canonical-solver-hint-persistence
  cancel-in-progress: false

jobs:
  harvest:
    # Harvest even from a partially failed/cancelled run: shard jobs write reports incrementally and
    # upload in always() steps, so useful evidence can exist before the overall workflow turns red.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Self-test durable experiment evidence retention
        run: node scripts/persist-decision-bearing-experiment-evidence.mjs --self-test

      - name: Resolve source run identity
        id: source_identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          EXPECTED_WORKFLOW: ${{ inputs.source_workflow }}
          EXPECTED_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          source_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          source_workflow="$(jq -r '.name' <<<"$source_json")"
          source_sha="$(jq -r '.head_sha' <<<"$source_json")"
          source_run_attempt="$(jq -r '.run_attempt // 1' <<<"$source_json")"
          if [[ -n "$EXPECTED_WORKFLOW" && "$EXPECTED_WORKFLOW" != "$source_workflow" ]]; then
            echo "Expected source workflow '$EXPECTED_WORKFLOW' but run $SOURCE_RUN_ID belongs to '$source_workflow'." >&2
            exit 1
          fi
          if [[ -n "$EXPECTED_SHA" && "$EXPECTED_SHA" != "$source_sha" ]]; then
            echo "Expected source SHA '$EXPECTED_SHA' but run $SOURCE_RUN_ID resolved to '$source_sha'." >&2
            exit 1
          fi
          printf 'SOURCE_WORKFLOW=%s\n' "$source_workflow" >> "$GITHUB_ENV"
          printf 'SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
          printf 'SOURCE_RUN_ATTEMPT=%s\n' "$source_run_attempt" >> "$GITHUB_ENV"

      - name: Download every artifact from the source solver run
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p artifact-staging
          # Do not use actions/download-artifact's cross-run path here. This repository has measured
          # that path dropping the final partial page after each 100 artifacts (e.g. 240 -> 200).
          # gh run download paginates the run's artifact collection and preserves one directory per
          # artifact, which is exactly the shape the semantic importers expect.
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifact-staging

      - name: Merge recoverable solver evidence onto latest main
        id: merge
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Broad/residual confirmation and reconciliation populations are experiment evidence, not
          # canonical hint sources. They still pass through the durable decision-bearing retention
          # layer, but deliberately skip all three hint importers.
          HARVEST_HINTS=1
          case "$SOURCE_WORKFLOW" in
            'Solver broad confirmation cohort'|\
            'Solver two-phase residual confirmation'|\
            'Static portfolio confirmation A/B'|\
            'Solver combine sweep runs (cross-run reconciliation)')
              HARVEST_HINTS=0
              ;;
          esac

          # Never rebase competing generated evidence line-by-line. On a race, reset to the new main
          # and replay every semantic importer from the immutable source artifacts.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            if [[ "$HARVEST_HINTS" == '1' ]]; then
              # Workflows that used --save-hints, including the CP-SAT harvesters, already carry
              # canonical hint files in shard artifacts. Merge them structurally and referee-check
              # every incoming path across published, corpus-1 and corpus-2 hint stores.
              node scripts/run-bundled.mjs scripts/merge-hint-artifacts.mjs -- \
                --staging-dir=artifact-staging \
                --source-run-id="$SOURCE_RUN_ID" \
                --source-run-attempt="$SOURCE_RUN_ATTEMPT" \
                --source-workflow="$SOURCE_WORKFLOW" \
                --ingestion-receipt-out="reports/stress/hint-ingestion-receipts/run-${SOURCE_RUN_ID}-captured-artifacts.json"

              # CP-SAT is an external specialist producer. Its workflow still transports canonical
              # hint files during the Phase-6 parity window, but its self-describing discovery
              # reports can now reconstruct the same semantic events centrally while preserving
              # external-solver identity and source-run occurrence lineage.
              if [[ "$SOURCE_WORKFLOW" == 'cpsat-hint-harvest-sweep (broaden CP-SAT hint coverage)' ]]; then
                node scripts/run-bundled.mjs scripts/harvest-cpsat-discovery-reports.mjs -- \
                  --staging-dir=artifact-staging \
                  --source-run-id="$SOURCE_RUN_ID" \
                  --source-run-attempt="$SOURCE_RUN_ATTEMPT" \
                  --source-workflow="$SOURCE_WORKFLOW" \
                  --ingestion-receipt-out="reports/stress/hint-ingestion-receipts/run-${SOURCE_RUN_ID}-cpsat-discoveries.json"
              fi

              # Artifact-only level-blind workflows still retain solved paths and winning attempts in
              # their shard reports. Reconstruct canonical provenance. Corpus hash mismatches are
              # quarantined on main, never discarded or attributed to the wrong level revision.
              node scripts/run-bundled.mjs scripts/harvest-level-blind-report-hints.mjs -- \
                --staging-dir=artifact-staging \
                --source-run-id="$SOURCE_RUN_ID" \
                --source-run-attempt="$SOURCE_RUN_ATTEMPT" \
                --source-workflow="$SOURCE_WORKFLOW" \
                --ingestion-receipt-out="reports/stress/hint-ingestion-receipts/run-${SOURCE_RUN_ID}-level-blind.json"

              # History-aware portfolio workflows use baseline/prime/cache inputs but the
              # solver itself does not consume persisted Hint paths. Their self-describing reports now
              # retain exact accepted path, level revision, discovery time, attempts and per-level
              # work budget, so reconstruct them centrally during the Phase-6 dual-path window.
              node scripts/run-bundled.mjs scripts/harvest-portfolio-solve-sweep-reports.mjs -- \
                --staging-dir=artifact-staging \
                --source-run-id="$SOURCE_RUN_ID" \
                --source-run-attempt="$SOURCE_RUN_ATTEMPT" \
                --source-workflow="$SOURCE_WORKFLOW" \
                --ingestion-receipt-out="reports/stress/hint-ingestion-receipts/run-${SOURCE_RUN_ID}-portfolio.json"

              # Solver diagnostics now preserves exact successful paths, level revisions,
              # winning attempts, request identity and discovery timestamps in its uploaded report.
              # Keep the source workflow's direct writer during Phase-6 parity, but reconstruct the
              # same observations centrally as a shadow lane.
              if [[ "$SOURCE_WORKFLOW" == 'Solver diagnostics and hint capture' ]]; then
                node scripts/run-bundled.mjs scripts/harvest-solver-diagnostics-reports.mjs -- \
                  --staging-dir=artifact-staging \
                  --source-run-id="$SOURCE_RUN_ID" \
                  --source-run-attempt="$SOURCE_RUN_ATTEMPT" \
                  --source-workflow="$SOURCE_WORKFLOW" \
                  --ingestion-receipt-out="reports/stress/hint-ingestion-receipts/run-${SOURCE_RUN_ID}-diagnostics.json"
              fi

              # Direct/isolated tools serialize their valid paths too. Keep them with
              # isolatedTechnique=true so they cannot be mistaken for normal production-ladder
              # capability evidence.
              node scripts/run-bundled.mjs scripts/harvest-isolated-report-hints.mjs -- \
                --staging-dir=artifact-staging \
                --source-run-id="$SOURCE_RUN_ID" \
                --source-run-attempt="$SOURCE_RUN_ATTEMPT" \
                --source-workflow="$SOURCE_WORKFLOW" \
                --source-sha="$SOURCE_SHA" \
                --ingestion-receipt-out="reports/stress/hint-ingestion-receipts/run-${SOURCE_RUN_ID}-isolated.json"
            fi

            # A decision-bearing v3 result has already passed the experiment contract, population
            # integrity and research-outcome gates. Preserve that exact manifest plus its published
            # primary/include evidence before Actions retention can erase the rows needed to
            # reconstruct the verdict. Non-decision-bearing benchmark artifacts are ignored.
            node scripts/persist-decision-bearing-experiment-evidence.mjs \
              --staging-dir=artifact-staging \
              --out-root=reports/stress/experiment-evidence

            if [ -z "$(git status --porcelain -- data/hints/ data/stress/hints/ data/stress/hints-random/ reports/stress/pending-solver-evidence/ reports/stress/experiment-evidence/ reports/stress/hint-harvest-selection/ reports/stress/hint-ingestion-receipts/ 2>/dev/null)" ]; then
              echo 'No new canonical hint/provenance, ingestion-receipt, selection, pending, or decision-bearing experiment evidence to persist.'
              echo 'HARVEST_RESULT=no-new-evidence' >> "$GITHUB_ENV"
              exit 0
            fi

            git add data/hints/ data/stress/hints/ data/stress/hints-random/
            if [ -d reports/stress/pending-solver-evidence ]; then
              git add reports/stress/pending-solver-evidence/
            fi
            if [ -d reports/stress/experiment-evidence ]; then
              git add reports/stress/experiment-evidence/
            fi
            if [ -d reports/stress/hint-harvest-selection ]; then
              git add reports/stress/hint-harvest-selection/
            fi
            if [ -d reports/stress/hint-ingestion-receipts ]; then
              git add reports/stress/hint-ingestion-receipts/
            fi
            git commit -m "Harvest solver evidence: ${SOURCE_WORKFLOW} (${SOURCE_RUN_ID})"
            if git push origin HEAD:main; then
              echo 'HARVEST_RESULT=persisted' >> "$GITHUB_ENV"
              echo "HARVEST_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo 'HARVEST_RESULT=persist-failed' >> "$GITHUB_ENV"
          echo 'Failed to persist solver evidence after four semantic-merge retries.' >&2
          exit 1

      - name: Summarize solver evidence harvest
        if: always()
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          SOURCE_IDENTITY: ${{ steps.source_identity.outcome }}
          DOWNLOAD: ${{ steps.download.outcome }}
          MERGE: ${{ steps.merge.outcome }}
        run: |
          {
            echo '## Solver evidence harvest'
            echo
            echo "| Stage | Outcome |"
            echo "| --- | --- |"
            printf '| Resolve source identity | `%s` |\n' "$SOURCE_IDENTITY"
            printf '| Download source artifacts | `%s` |\n' "$DOWNLOAD"
            printf '| Semantic merge / persistence | `%s` |\n' "$MERGE"
            echo
            printf 'Source run: `%s`\n' "$SOURCE_RUN_ID"
            [[ -n "${SOURCE_WORKFLOW:-}" ]] && echo "Source workflow: `$SOURCE_WORKFLOW`"
            [[ -n "${SOURCE_RUN_ATTEMPT:-}" ]] && echo "Source run attempt: `$SOURCE_RUN_ATTEMPT`"
            [[ -n "${SOURCE_SHA:-}" ]] && echo "Source SHA: `$SOURCE_SHA`"
            echo
            if [[ -d reports/stress/hint-ingestion-receipts ]]; then
              echo
              echo '### Hint ingestion accounting'
              echo
              echo '```'
              node scripts/hint-ingestion-receipt-query.mjs \
                --root=reports/stress/hint-ingestion-receipts \
                --run-id="$SOURCE_RUN_ID" || true
              echo '```'
            fi
            echo
            case "${HARVEST_RESULT:-unknown}" in
              persisted)
                echo "Result: new durable solver evidence was persisted to main."
                [[ -n "${HARVEST_COMMIT:-}" ]] && echo "Persistence commit: `$HARVEST_COMMIT`"
                ;;
              no-new-evidence)
                echo 'Result: the source run contained no new canonical/pending/decision-bearing evidence to persist.'
                ;;
              persist-failed)
                echo 'Result: semantic import succeeded far enough to attempt persistence, but all push retries failed.'
                echo '::error::Solver evidence harvest could not persist its semantic merge after four retries.'
                ;;
              *)
                echo 'Result: the harvest did not reach a classified persistence outcome. Use the stage table above to locate the failure.'
                [[ "$SOURCE_IDENTITY" == failure ]] && echo '::error::Solver evidence harvest could not verify the source run identity.'
                [[ "$DOWNLOAD" == failure ]] && echo '::error::Solver evidence harvest could not download the source run artifacts.'
                [[ "$MERGE" == failure ]] && echo '::error::Solver evidence harvest failed during semantic merge or persistence.'
                ;;
            esac
          :
          } >> "$GITHUB_STEP_SUMMARY"
