name: PG-G symmetry causal factorial (one-shot)

run-name: "PG-G symmetry causal factorial · ${{ github.sha }}"

on:
  pull_request:
    paths:
      - '.github/workflows/pg-g-symmetry-causal-factorial-one-shot.yml'
      - 'modules/solver/search-state.ts'
      - 'modules/solver/types.ts'
      - 'scripts/stress/pg-g-symmetry-causal-factorial.mjs'
      - 'reports/2026-10-16-pg-g-symmetry-causal-factorial-spec-001.json'
      - 'reports/2026-10-16-pg-g-symmetry-causal-factorial-plan-001.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg-g-symmetry-causal-factorial
  cancel-in-progress: false

jobs:
  factorial:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out research source exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out pinned historical family data
        uses: actions/checkout@v7
        with:
          ref: 32132d6ba60f1203ee013ed0d475f46061eddd49
          path: historical-family-data
          sparse-checkout: |
            data/families
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run selected-pair causal experiment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/stress/pg-g-symmetry-causal-factorial
          node scripts/run-bundled.mjs scripts/stress/pg-g-symmetry-causal-factorial.mjs -- \
            --spec=reports/2026-10-16-pg-g-symmetry-causal-factorial-spec-001.json \
            --microscope-spec=reports/2026-10-15-pg-g-symmetry-ordering-microscope-spec-001.json \
            --historical-root=historical-family-data \
            --parent-root=. \
            --out=reports/stress/pg-g-symmetry-causal-factorial/result.json

      - name: Verify result contract
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = 'reports/stress/pg-g-symmetry-causal-factorial/result.json';
          const d = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (d.kind !== 'pathfinder-pg-g-symmetry-causal-factorial-result') throw new Error('unexpected result kind');
          if (d.historicalDatasetRef !== '32132d6ba60f1203ee013ed0d475f46061eddd49') throw new Error('historical dataset drifted');
          if (d.aggregate?.cases !== 5) throw new Error('expected five frozen pairs');
          if (d.aggregate?.techniquePairRows !== 7) throw new Error('expected seven pair×technique rows');
          if (d.aggregate?.uniqueParentTechniqueControls !== 5) throw new Error('expected five unique parent×technique controls');
          if (d.aggregate?.orderCanaryPrefixes !== 393) throw new Error('parent-frame order canary did not cover all 393 mapped prefixes');
          if (d.rows?.some(row => !row.parentControl?.validDeterministicEvidence)) throw new Error('invalid parent control row');
          if (d.rows?.some(row => Object.values(row.variantArms ?? {}).some(arm => !arm.validDeterministicEvidence))) throw new Error('invalid variant arm row');
          const maxAllowed = d.workBudget * 1.01;
          const allRuns = [
            ...d.rows.map(row => row.parentControl),
            ...d.rows.flatMap(row => Object.values(row.variantArms ?? {})),
          ];
          if (allRuns.some(run => run.workSpent > maxAllowed)) throw new Error('work-cap overshoot exceeds 1% guard');
          NODE

      - name: Publish standard solver result
        if: always()
        shell: bash
        run: |
          if [ -f reports/stress/pg-g-symmetry-causal-factorial/result.json ]; then
            node scripts/publish-solver-sweep-result.mjs \
              --primary=reports/stress/pg-g-symmetry-causal-factorial/result.json \
              --include=reports/2026-10-16-pg-g-symmetry-causal-factorial-spec-001.json \
              --include=reports/2026-10-16-pg-g-symmetry-causal-factorial-plan-001.md \
              --source-artifact=pg-g-symmetry-causal-factorial
          fi

      - name: Upload raw factorial evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-g-symmetry-causal-factorial
          path: reports/stress/pg-g-symmetry-causal-factorial/result.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload standard solver sweep result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-sweep-result
          path: logs/solver-sweep-result/
          if-no-files-found: warn
          retention-days: 90

      - name: Summarize causal result
        if: always()
        shell: bash
        run: |
          if [ -f reports/stress/pg-g-symmetry-causal-factorial/result.json ]; then
            node - <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync('reports/stress/pg-g-symmetry-causal-factorial/result.json', 'utf8'));
          const a = d.aggregate;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '# PG-G symmetry causal factorial',
            '',
            '- frozen pairs: ' + a.cases,
            '- pair × technique rows: ' + a.techniquePairRows,
            '- mapped-prefix order canary: ' + a.orderCanaryPrefixes,
            '- control solve-state cliffs: ' + a.controlSolveStateCliffs,
            '- cliffs resolved by parent-frame ordering: ' + a.solveCliffsResolvedByOrder,
            '- repair cliffs resolved by fixed seed: ' + a.repairSolveCliffsResolvedBySeed,
            '- repair cliffs resolved by combined order + seed: ' + a.repairSolveCliffsResolvedByCombined,
            '',
            'Selected-pair causal evidence only. No production treatment or prevalence claim follows directly.',
          ].join('\n') + '\n');
          NODE
          fi
