name: TEMP class5 freshness reconciliation

on:
  pull_request:
    branches:
      - claude/pathfinder-solver-dev-dat71l
    paths:
      - '.github/workflows/class5-freshness-reconciliation-temp.yml'
      - 'scripts/stress/audit-class5-hint-capability-freshness.mjs'
      - 'scripts/stress/analyze-post-1029-residual-atlas.mjs'
      - 'scripts/stress/reconcile-class5-freshness-with-t1.mjs'
      - 'scripts/stress/reconcile-isolated-hint-census-context.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build corrected post-1048 residual atlas
        run: |
          node scripts/run-bundled.mjs scripts/stress/analyze-post-1029-residual-atlas.mjs -- \
            --baseline=reports/stress/capability-runs/34683011115/per-level-corpus2.json \
            --lifecycle=reports/stress/capability-runs/34683011115/lifecycle-failure-map-corpus2.json \
            --census=reports/stress/technique-census/33717910218/combined-cells.json \
            --hints-dir=data/stress/hints-random \
            --out=tmp/post-1048-residual-atlas-fixed.json
      - name: Audit class5 rows against current isolated hint provenance
        run: |
          node scripts/run-bundled.mjs scripts/stress/audit-class5-hint-capability-freshness.mjs -- \
            --atlas=tmp/post-1048-residual-atlas-fixed.json \
            --hints-dir=data/stress/hints-random \
            --out=tmp/class5-hint-capability-freshness.json
      - name: Reconcile current isolated winners with frozen base T1
        run: |
          node scripts/run-bundled.mjs scripts/stress/reconcile-class5-freshness-with-t1.mjs -- \
            --freshness=tmp/class5-hint-capability-freshness.json \
            --census=reports/stress/technique-census/33717910218/combined-cells.json \
            --corpus=data/stress/stress-levels-random.json \
            --out=tmp/class5-freshness-t1-reconciliation.json
      - name: Recover Sep-3 census context behind isolated hint rows
        run: |
          node scripts/run-bundled.mjs scripts/stress/reconcile-isolated-hint-census-context.mjs -- \
            --atlas=tmp/post-1048-residual-atlas-fixed.json \
            --census=reports/stress/technique-census/33717910218/combined-cells.json \
            --hints-dir=data/stress/hints-random \
            --solver-version=277ca21be521bb7e03c268666ad868ad963f2cb5 \
            --out=tmp/class5-isolated-hint-census-context.json
      - name: Inspect production lifecycle for exact variant-source levels
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('reports/stress/capability-runs/34683011115/lifecycle-failure-map-corpus2.json', 'utf8'));
          const ids = new Set(['R00180','R01516','R01854','R02772','R03229']);
          const found = [];
          function walk(v, parentKey='') {
            if (!v || typeof v !== 'object') return;
            if (!Array.isArray(v) && ids.has(String(v.id ?? v.levelId ?? ''))) found.push({parentKey, value:v});
            if (Array.isArray(v)) v.forEach((x,i)=>walk(x, `${parentKey}[${i}]`));
            else for (const [k,x] of Object.entries(v)) walk(x, parentKey ? `${parentKey}.${k}` : k);
          }
          walk(d);
          fs.writeFileSync('tmp/class5-variant-source-lifecycle.json', JSON.stringify(found, null, 2) + '\n');
          for (const row of found) console.log('LIFECYCLE_MATCH=' + JSON.stringify(row));
          NODE
      - name: Print compact result
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const freshness = JSON.parse(fs.readFileSync('tmp/class5-hint-capability-freshness.json', 'utf8'));
          const reconciliation = JSON.parse(fs.readFileSync('tmp/class5-freshness-t1-reconciliation.json', 'utf8'));
          const context = JSON.parse(fs.readFileSync('tmp/class5-isolated-hint-census-context.json', 'utf8'));
          console.log('FRESHNESS_SUMMARY=' + JSON.stringify(freshness.summary));
          console.log('T1_RECONCILIATION_SUMMARY=' + JSON.stringify(reconciliation.summary));
          console.log('CENSUS_CONTEXT_SUMMARY=' + JSON.stringify(context.summary));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: class5-freshness-reconciliation
          path: |
            tmp/post-1048-residual-atlas-fixed.json
            tmp/class5-hint-capability-freshness.json
            tmp/class5-freshness-t1-reconciliation.json
            tmp/class5-isolated-hint-census-context.json
            tmp/class5-variant-source-lifecycle.json
          retention-days: 7
