name: TEMP R03229 class5 microscope

on:
  pull_request:
    branches:
      - claude/pathfinder-solver-dev-dat71l
    paths:
      - '.github/workflows/class5-freshness-reconciliation-temp.yml'
      - 'scripts/stress/build-class5-microscope-cases.mjs'
      - 'scripts/stress/collect-known-solution-prefix-survival.mjs'
      - 'scripts/stress/cpsat-explicit-prefix-reference.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  microscope:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: |
          npm ci
          pip install ortools
      - name: Capture production-faithful R03229 ranked pool
        run: |
          mkdir -p tmp
          node scripts/run-bundled.mjs scripts/stress/collect-known-solution-prefix-survival.mjs -- \
            --level-ids=R03229 \
            --beam-width=2000 \
            --node-budget=3000000 \
            --include-stages \
            --retain-all-removal-details \
            --retain-ranked-pool-details \
            --out=tmp/r03229-microscope-survival.json
      - name: Freeze three microscope cases
        run: |
          node scripts/run-bundled.mjs scripts/stress/build-class5-microscope-cases.mjs -- \
            --survival=tmp/r03229-microscope-survival.json \
            --level-id=R03229 \
            --out=tmp/r03229-microscope-cases.json
      - name: Exact-label all three futures
        run: |
          node scripts/run-bundled.mjs scripts/stress/cpsat-explicit-prefix-reference.mjs -- \
            --cases=tmp/r03229-microscope-cases.json \
            --format=cases \
            --time-limit=60 \
            --max-cases=3 \
            --shard-index=1 \
            --shard-count=1 \
            --out=tmp/r03229-microscope-exact.json
      - name: Print microscope result
        if: always()
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const file of ['tmp/r03229-microscope-cases.meta.json','tmp/r03229-microscope-exact.json']) {
            if (!fs.existsSync(file)) continue;
            console.log(`=== ${file} ===`);
            console.log(fs.readFileSync(file, 'utf8'));
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r03229-class5-microscope
          path: |
            tmp/r03229-microscope-survival.json
            tmp/r03229-microscope-cases.json
            tmp/r03229-microscope-cases.meta.json
            tmp/r03229-microscope-exact.json
          retention-days: 7
          if-no-files-found: warn
