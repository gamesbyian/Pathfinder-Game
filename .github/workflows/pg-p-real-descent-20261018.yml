# One-shot, read-only actual repair-descent pilot. Remove after evidence integration.
name: PG-P actual repair descent shadow pilot
on:
  push:
    branches:
      - chatgpt/pg-p-dependency-divergence-readonly-20261018
    paths:
      - .github/workflows/pg-p-real-descent-20261018.yml
      - scripts/stress/pg-p-real-repair-descent-shadow.mjs
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Check observer helper contract
        run: node scripts/run-bundled.mjs scripts/stress/pg-p-real-repair-descent-shadow.mjs -- --self-test
      - name: Observe independent bounded actual repair trajectories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tmp/pg-p
          node scripts/run-bundled.mjs scripts/stress/pg-p-real-repair-descent-shadow.mjs -- \
            --parents=12 --node-budget=20000 --elites=4 \
            --out=tmp/pg-p/real-descent.json | tee tmp/pg-p/summary.log
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('tmp/pg-p/real-descent.json','utf8'));
          if(r.summary.parents!==12||r.protocol.levelIds.length!==12||new Set(r.protocol.levelIds).size!==12)throw Error('missing independent parents');
          if(r.rows.some(p=>p.nodesExpanded>20000+32))throw Error('unexpected inflated node dose');
          console.log('PG-P SOURCE AND DOSE VERIFIED: '+JSON.stringify(r.summary));
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pg-p-real-repair-descent-shadow-20261018
          path: |
            tmp/pg-p/real-descent.json
            tmp/pg-p/summary.log
          if-no-files-found: warn
          retention-days: 90
