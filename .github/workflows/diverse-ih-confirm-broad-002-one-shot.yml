name: Diverse-IH confirm-broad-002 (one-shot)

on:
  pull_request:
    paths:
      - '.github/workflows/diverse-ih-confirm-broad-002-one-shot.yml'

env:
  SOLVER_SHA: fc696bac37bffea9ca8b8dbc7616639224fbf4dc
  GENERATOR_SHA: 4f2b2b143ee2bc194b8e017fcc59a680b9ee8d92
  COHORT_SEED: '2026082517'

jobs:
  materialize-cohort:
    name: Materialize and seal confirm-broad-002
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - name: Check out pinned cohort-generator revision
        uses: actions/checkout@v4
        with: { ref: '${{ env.GENERATOR_SHA }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Materialize reserved cohort exactly once
        run: |
          node scripts/run-bundled.mjs scripts/stress/generate-random.mjs \
            --count=256 --master-seed=${COHORT_SEED} --id-prefix=D \
            --out=${GITHUB_WORKSPACE}/tmp/confirm-broad-002.json
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const corpus=JSON.parse(fs.readFileSync('tmp/confirm-broad-002.json','utf8'));
          if(!Array.isArray(corpus.levels)||corpus.levels.length!==256) throw Error('expected 256 generated levels');
          const levelsHash=crypto.createHash('sha256').update(JSON.stringify(corpus.levels)).digest('hex');
          fs.writeFileSync('tmp/confirm-broad-002-levels.sha256',levelsHash+'\n');
          console.log(`sealed confirm-broad-002 levels sha256=${levelsHash}`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: confirm-broad-002-sealed-cohort
          path: |
            tmp/confirm-broad-002.json
            tmp/confirm-broad-002-levels.sha256
          retention-days: 90

  run-shard:
    name: ${{ matrix.arm }}-shard-${{ matrix.shard }}
    needs: materialize-cohort
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        arm: [control, treatment]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Check out frozen solver revision
        uses: actions/checkout@v4
        with: { ref: '${{ env.SOLVER_SHA }}' }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - name: Install dependencies
        run: npm ci
      - name: Download exact sealed cohort
        uses: actions/download-artifact@v4
        with:
          name: confirm-broad-002-sealed-cohort
          path: tmp
      - name: Verify sealed cohort before search
        run: |
          node - <<'NODE'
          const fs=require('node:fs'),crypto=require('node:crypto');
          const corpus=JSON.parse(fs.readFileSync('tmp/confirm-broad-002.json','utf8'));
          if(!Array.isArray(corpus.levels)||corpus.levels.length!==256) throw Error('expected 256 sealed levels');
          const got=crypto.createHash('sha256').update(JSON.stringify(corpus.levels)).digest('hex');
          const want=fs.readFileSync('tmp/confirm-broad-002-levels.sha256','utf8').trim();
          if(got!==want) throw Error(`sealed cohort hash mismatch: got ${got}, want ${want}`);
          NODE
      - name: Apply frozen selective exposure treatment
        if: matrix.arm == 'treatment'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('modules/solver/attempts.ts'); s=p.read_text()
          portal="""            beam('perimeterSweep', BEAM.STANDARD, perimeterCCW),\n        ],\n    },\n    {\n        // Must-cross-threaded levels: the diverse beams are the ones that actually solve this\n"""
          portal_new="""            beam('perimeterSweep', BEAM.STANDARD, perimeterCCW),\n            ...(f.mustCross < POLICY.HIGHINT_MC_DIVERSE\n                ? [beam('intersectionHarvest', BEAM.WIDE, null, { diverseBeam: true })]\n                : []),\n        ],\n    },\n    {\n        // Must-cross-threaded levels: the diverse beams are the ones that actually solve this\n"""
          nonportal="""            beam('perimeterSweep', BEAM.STANDARD, perimeterCW), beam('perimeterSweep', BEAM.STANDARD, perimeterCCW),\n        ],\n    },\n    {\n        why: 'near-Hamiltonian: beams collapse over the long dense walk — DFS perimeter (both directions) leads',\n"""
          nonportal_new="""            beam('perimeterSweep', BEAM.STANDARD, perimeterCW), beam('perimeterSweep', BEAM.STANDARD, perimeterCCW),\n            ...(f.mustCross < POLICY.HIGHINT_MC_DIVERSE\n                ? [beam('intersectionHarvest', BEAM.WIDE, null, { diverseBeam: true })]\n                : []),\n        ],\n    },\n    {\n        why: 'near-Hamiltonian: beams collapse over the long dense walk — DFS perimeter (both directions) leads',\n"""
          assert s.count(portal)==1, s.count(portal)
          assert s.count(nonportal)==1, s.count(nonportal)
          s=s.replace(portal,portal_new).replace(nonportal,nonportal_new)
          p.write_text(s)
          PY
          git diff --check
          npm run build
      - name: Run frozen confirmation shard
        run: |
          d=tmp/confirm/${{ matrix.arm }}/shard-${{ matrix.shard }}; mkdir -p "$d"
          positions=$(python3 - <<'PY'
          s=int('${{ matrix.shard }}')
          print('pos:'+','.join(str(i) for i in range(1,257) if (i-1)%8==s))
          PY
          )
          node scripts/run-bundled.mjs scripts/level-blind-capability-sweep.mjs -- \
            --corpus=tmp/confirm-broad-002.json --levels="$positions" \
            --budget-ms=86400000 --node-budget=50000000 --work-budget=67000000 \
            --strict-total-work-budget --attempt-budget-telemetry --lifecycle-telemetry \
            --workers=4 --out="$d/result.json" --summary-out="$d/summary.md"
      - name: Verify shard and write provenance
        run: |
          d=tmp/confirm/${{ matrix.arm }}/shard-${{ matrix.shard }}
          node - "$d" '${{ matrix.arm }}' '${{ matrix.shard }}' <<'NODE'
          const fs=require('node:fs'),cp=require('node:child_process'),crypto=require('node:crypto');
          const [d,arm,shard]=process.argv.slice(2); const r=JSON.parse(fs.readFileSync(`${d}/result.json`));
          const rows=r.levels??[]; if(rows.length!==32) throw Error(`expected 32 rows, got ${rows.length}`);
          const bad=rows.filter(x=>x.deadlineTruncated||x.status==='deadline-truncated'||x.status==='attempt-error');
          if(bad.length) throw Error(`indeterminate/error rows: ${bad.length}`);
          const patch=cp.execSync('git diff -- modules/solver/attempts.ts',{encoding:'utf8'});
          if(arm==='control' && patch.trim()) throw Error('control working tree unexpectedly modified');
          if(arm==='treatment' && !patch.includes("diverseBeam: true")) throw Error('treatment patch missing diverse beam exposure');
          const corpus=JSON.parse(fs.readFileSync('tmp/confirm-broad-002.json','utf8'));
          const levelsHash=crypto.createHash('sha256').update(JSON.stringify(corpus.levels)).digest('hex');
          const sealedHash=fs.readFileSync('tmp/confirm-broad-002-levels.sha256','utf8').trim();
          if(levelsHash!==sealedHash) throw Error('sealed cohort changed before provenance write');
          const meta={arm,shard:Number(shard),solverSha:process.env.SOLVER_SHA,generatorSha:process.env.GENERATOR_SHA,
            cohortId:'confirm-broad-002',cohortSeed:Number(process.env.COHORT_SEED),cohortLevelsSha256:levelsHash,
            strictTotalWorkBudget:67000000,nodeBudget:50000000,
            treatment:arm==='treatment'?'append beam:intersectionHarvest@beam5000(diverse) to the two very-high-intersection bundles when mustCross<2':'control',
            workingTreePatchSha256:crypto.createHash('sha256').update(patch).digest('hex')};
          fs.writeFileSync(`${d}/metadata.json`,JSON.stringify(meta,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: diverse-ih-confirm-${{ matrix.arm }}-${{ matrix.shard }}
          path: tmp/confirm/${{ matrix.arm }}/shard-${{ matrix.shard }}/
          retention-days: 90

  analyze:
    name: Record frozen confirmation verdict
    needs: run-shard
    if: always() && needs.run-shard.result == 'success'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'diverse-ih-confirm-*', path: tmp/downloaded }
      - name: Apply frozen acceptance rule before exact-row inspection
        run: |
          mkdir -p tmp/confirmation-analysis
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const dirs=fs.readdirSync('tmp/downloaded').filter(x=>/^diverse-ih-confirm-(control|treatment)-\d+$/.test(x));
          if(dirs.length!==16) throw Error(`expected 16 shard artifacts, got ${dirs.length}`);
          const g={control:[],treatment:[]}, hashes=new Set(), treatmentPatchHashes=new Set();
          for(const n of dirs){
            const p=path.join('tmp/downloaded',n);
            const m=JSON.parse(fs.readFileSync(path.join(p,'metadata.json')));
            const r=JSON.parse(fs.readFileSync(path.join(p,'result.json')));
            hashes.add(m.cohortLevelsSha256);
            if(m.arm==='treatment') treatmentPatchHashes.add(m.workingTreePatchSha256);
            g[m.arm].push(...(r.levels??[]));
          }
          if(hashes.size!==1) throw Error(`sealed levels hashes differ: ${[...hashes].join(',')}`);
          if(treatmentPatchHashes.size!==1) throw Error('treatment patch differs across shards');
          for(const a of ['control','treatment']) if(g[a].length!==256||new Set(g[a].map(x=>x.id)).size!==256) throw Error(`${a} population invalid`);
          const ids=a=>new Set(g[a].filter(x=>x.ok).map(x=>x.id)); const c=ids('control'),t=ids('treatment');
          const gained=[...t].filter(x=>!c.has(x)).sort(),lost=[...c].filter(x=>!t.has(x)).sort();
          const work=a=>g[a].reduce((s,x)=>s+Number(x.workSpent??0),0), cw=work('control'),tw=work('treatment'),wr=cw?(cw-tw)/cw:0;
          const pass=lost.length===0&&(gained.length>=1||wr>=.10);
          const v={verdict:pass?'confirmation-pass':'confirmation-fail',acceptanceRule:'no solve loss AND (>=1 gained solve OR >=10% aggregate canonical-work reduction)',cohortId:'confirm-broad-002',cohortSize:256,cohortLevelsSha256:[...hashes][0],solverSha:process.env.SOLVER_SHA,generatorSha:process.env.GENERATOR_SHA,control:{solved:c.size,aggregateWork:cw},treatment:{solved:t.size,aggregateWork:tw},gainedCount:gained.length,lostCount:lost.length,aggregateWorkReductionFraction:wr,aggregateWorkReductionPercent:100*wr,passesGate:pass};
          fs.writeFileSync('tmp/confirmation-analysis/verdict.json',JSON.stringify(v,null,2)+'\n');
          fs.writeFileSync('tmp/confirmation-analysis/post-verdict-changed-ids.json',JSON.stringify({gained,lost},null,2)+'\n');
          fs.writeFileSync('tmp/confirmation-analysis/summary.md',`# Diverse-IH confirm-broad-002 verdict\n\nVerdict: **${v.verdict}**\n\nControl: ${c.size}/256 solved; ${cw.toLocaleString()} work.\nTreatment: ${t.size}/256 solved; ${tw.toLocaleString()} work.\nGained solves: ${gained.length}. Lost solves: ${lost.length}.\nAggregate work reduction: ${(100*wr).toFixed(2)}%.\nFrozen gate: **${pass?'PASS':'FAIL'}**.\n`);
          console.log(fs.readFileSync('tmp/confirmation-analysis/summary.md','utf8'));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: diverse-ih-confirm-broad-002-verdict
          path: tmp/confirmation-analysis/
          retention-days: 90
