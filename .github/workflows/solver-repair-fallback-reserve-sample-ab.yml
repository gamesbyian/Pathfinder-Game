# Stratified-sample level-blind capability A/B for STRATEGY_REPAIR_FALLBACK_NODE_RESERVE
# (modules/solver/orchestration.ts; see REPAIR_FALLBACK_NODE_RESERVE_FRACTION's own comment and
# docs/solver-opt-in-experiment-ledger.md).
#
# Deliberately NOT a full-corpus refresh, and NOT solver-stress-refresh.yml's canonical full-1700
# capability workflow: this flag can only ever change a level's outcome if the level is repair-gated
# -- 919/1700 Corpus-2 levels as of 2026-08-13 (broader population than the must-turn-gated
# STRATEGY_REPAIR_PROBE_ADAPTIVE_BIASED_BUDGET flag's 512/1700, since this reserve has no must-turn
# requirement). A uniform random sample of the full corpus would still waste real compute
# re-confirming zero-effect on the ~46% that are structurally guaranteed byte-identical either way --
# this workflow instead draws a deterministic seeded subsample from the ELIGIBLE population
# specifically (scripts/stress/select-repair-fallback-reserve-sample.mjs), plus a small control
# sample from the ineligible remainder to empirically catch anything a code trace missed. Same seed
# -> same sample, always (reproducible, matching scripts/stress/benchmark.mjs's --sample=N --seed=
# convention).
#
# CORPUS INVARIANT: every arm also runs all of Corpus 1 and all published levels; the targeted
# sample applies only to expensive Corpus 2. scripts/plan-ab-corpus-shards.mjs owns this shared policy.
#
# CAPABILITY INVARIANT (same as solver-stress-refresh.yml): uses scripts/level-blind-capability-
# sweep.mjs, never the history-aware research sweep. Never persists hints, never touches
# logs/stress-corpus2-baseline.json / data/level-heatmaps.json (those represent FULL-corpus truth --
# overwriting them from a subset-only run would silently corrupt them, same reasoning as
# solver-highbudget-unsolved-sweep.yml). Artifact-only: this workflow never commits to main.
#
# Usage: dispatch twice with identical inputs except enable_flags -- once blank (control), once
# enable_flags=STRATEGY_REPAIR_FALLBACK_NODE_RESERVE (treatment) -- then compare each run's
# combined solved count/gains/losses (per-id, from each run's reports/stress/repair-fallback-
# reserve-sample-ab.json artifact, or the console-log summary this workflow prints directly).
name: Solver repair-fallback node-reserve sample A/B

on:
  workflow_dispatch:
    inputs:
      eligible_sample:
        description: 'How many of the eligible (repair-gated) population to sample.'
        required: false
        default: '250'
      control_sample:
        description: 'How many ineligible (structurally guaranteed unaffected) levels to sample as a control.'
        required: false
        default: '50'
      seed:
        description: 'Deterministic sample seed. MUST be identical across both arms of a matched A/B -- fixed default so omitting this on both dispatches automatically matches.'
        required: false
        default: 'repair-fallback-reserve-sample-2026-08-13'
      node_budget:
        description: 'Corpus-2 cumulative node ceiling per level. Matches solver-stress-refresh.yml''s canonical corpus2_node_budget default.'
        required: false
        default: '50000000'
      budget_ms:
        description: 'Per-level wall budget. Default 24h is intentionally non-binding; node budget is the real ceiling.'
        required: false
        default: '86400000'
      workers:
        description: 'Cross-level worker processes per shard. Default 4 matches current standard public ubuntu-latest runner vCPU count.'
        required: false
        default: '4'
      shard_count:
        description: 'Number of even shards to split the sample into. Default 60 queues fine-grained work behind 20 lanes to reduce tail latency.'
        required: false
        default: '60'
      max_parallel:
        description: 'Shards running concurrently. Keep below shard_count for queue-based tail balancing; lower further when matched arms must share the account job budget.'
        required: false
        default: '20'
      enable_flags:
        description: 'Comma-separated ablation flags to turn ON. Leave blank for the control arm; set to STRATEGY_REPAIR_FALLBACK_NODE_RESERVE for the treatment arm.'
        required: false
        default: ''
      disable_flags:
        description: 'Comma-separated ablation flags to turn OFF.'
        required: false
        default: ''
      deterministic:
        description: 'true forces a 24h non-binding deadline so this run is reproducible (bit-identical nodes/work). Matched A/B arms should both use true.'
        required: false
        default: 'true'

concurrency:
  group: solver-repair-fallback-reserve-sample-ab
  cancel-in-progress: false

jobs:
  plan:
    name: Select stratified sample and plan shards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      shards: ${{ steps.plan.outputs.shards }}
      shard_count: ${{ steps.plan.outputs.shard_count }}
      total_levels: ${{ steps.plan.outputs.total_levels }}
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Select the deterministic stratified sample
        shell: bash
        run: |
          mkdir -p logs/solver-repair-fallback-reserve-sample
          node scripts/stress/select-repair-fallback-reserve-sample.mjs \
            --corpus=data/stress/stress-levels-random.json \
            --eligible-sample="${{ inputs.eligible_sample }}" \
            --control-sample="${{ inputs.control_sample }}" \
            --seed="${{ inputs.seed }}" \
            --out=logs/solver-repair-fallback-reserve-sample/sample.txt

      - name: Split into even shards
        id: plan
        shell: bash
        run: |
          node scripts/plan-ab-corpus-shards.mjs \
            --corpus2-sample="logs/solver-repair-fallback-reserve-sample/sample.txt" \
            --corpus2-shards="${{ inputs.shard_count }}"

      - name: Upload the sample + shard plan for traceability
        uses: actions/upload-artifact@v4
        with:
          name: repair-fallback-reserve-sample-plan
          path: logs/solver-repair-fallback-reserve-sample/
          retention-days: 90

  solve-shards:
    name: Sample shard ${{ matrix.shard.idx }}/${{ needs.plan.outputs.shard_count }}
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel) }}
      matrix: ${{ fromJson(needs.plan.outputs.shards) }}
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run level-blind capability sweep on this shard
        id: sweep
        continue-on-error: true
        shell: bash
        env:
          DEADLINE: ${{ inputs.deterministic == 'true' && '86400000' || inputs.budget_ms }}
        run: |
          set +e
          mkdir -p logs/solver-repair-fallback-reserve-sample
          extra=()
          [ -n "${{ inputs.enable_flags }}" ] && extra+=("--enable-flags=${{ inputs.enable_flags }}")
          [ -n "${{ inputs.disable_flags }}" ] && extra+=("--disable-flags=${{ inputs.disable_flags }}")
          work=$(( ${{ inputs.node_budget }} * 134 / 100 ))
          timeout -k 30s --preserve-status 170m node scripts/run-bundled.mjs scripts/level-blind-capability-sweep.mjs -- \
            --corpus="${{ matrix.shard.corpus }}" \
            --levels="${{ matrix.shard.levels }}" \
            --budget-ms="${DEADLINE}" \
            --node-budget="${{ inputs.node_budget }}" \
            --work-budget="${work}" \
            --workers="${{ inputs.workers }}" \
            "${extra[@]}" \
            --out="logs/solver-repair-fallback-reserve-sample/batch-${{ matrix.shard.idx }}.json" \
            --summary-out="logs/solver-repair-fallback-reserve-sample/batch-${{ matrix.shard.idx }}-summary.md"
          status=$?
          echo "exit_code=${status}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload shard artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-fallback-reserve-sample-shard-${{ matrix.shard.idx }}
          path: |
            logs/solver-repair-fallback-reserve-sample/batch-${{ matrix.shard.idx }}.json
            logs/solver-repair-fallback-reserve-sample/batch-${{ matrix.shard.idx }}-summary.md
          if-no-files-found: error
          retention-days: 90

      - name: Fail on unexpected sweep error
        if: >-
          always() &&
          (steps.sweep.outputs.exit_code != '0' && steps.sweep.outputs.exit_code != '124' && steps.sweep.outputs.exit_code != '143')
        run: exit 1

  combine:
    name: Combine sample results
    needs: [plan, solve-shards]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the dispatched commit exactly
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download shard artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: 'repair-fallback-reserve-sample-shard-*'
          path: artifact-staging/downloaded
          merge-multiple: true

      - name: Combine into one report (subset-shaped -- NEVER the full-corpus baseline)
        shell: bash
        run: |
          mkdir -p logs/solver-repair-fallback-reserve-sample reports/stress
          cp -a artifact-staging/downloaded/. logs/solver-repair-fallback-reserve-sample/
          FILES=$(ls logs/solver-repair-fallback-reserve-sample/batch-*.json 2>/dev/null | paste -sd, -)
          [ -n "$FILES" ] && npm run solver:combine-corpus2-batches -- --allow-mixed-corpora --in="${FILES}" --out=reports/stress/repair-fallback-reserve-sample-ab.json

      - name: Verify complete coverage
        id: coverage
        shell: bash
        run: |
          node -e "
          const fs = require('node:fs');
          const expectedTotal = ${{ needs.plan.outputs.total_levels }};
          const report = JSON.parse(fs.readFileSync('reports/stress/repair-fallback-reserve-sample-ab.json', 'utf8'));
          const rows = report.levels ?? [];
          if (rows.length !== expectedTotal) { console.error(\`incomplete: \${rows.length}/\${expectedTotal}\`); process.exit(1); }
          console.log(\`complete: \${rows.length}/\${expectedTotal}\`);
          "

      - name: Print solved-count summary
        shell: bash
        run: |
          node -e "
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('reports/stress/repair-fallback-reserve-sample-ab.json', 'utf8'));
          const rows = r.levels ?? [];
          const solved = rows.filter(x => x.ok).length;
          const nodes = rows.reduce((n,x) => n + (x.nodesExpanded || 0), 0);
          const work = rows.reduce((n,x) => n + (x.workSpent || 0), 0);
          console.log('enable_flags=${{ inputs.enable_flags }} disable_flags=${{ inputs.disable_flags }}');
          console.log(\`SOLVED sample: \${solved}/\${rows.length} nodes=\${nodes} work=\${work}\`);
          console.log('Solved ids: ' + rows.filter(x => x.ok).map(x => x.id ?? String(x.level)).sort().join(','));
          "

      - name: Print repair-fallback-loop participation
        shell: bash
        run: |
          node -e "
          const fs = require('node:fs');
          const r = JSON.parse(fs.readFileSync('reports/stress/repair-fallback-reserve-sample-ab.json', 'utf8'));
          const rows = r.levels ?? [];
          const isFallbackAttempt = a => a.repair && !a.repairProbe && !a.repairMustTurnBiased && !a.repairTurnBiased;
          const withFallback = rows.filter(x => (x.attempts||[]).some(isFallbackAttempt));
          const fallbackWins = withFallback.filter(x => x.ok && (x.attempts||[]).some(a => isFallbackAttempt(a) && a.ok));
          console.log(\`Levels where the repair fallback loop got at least one attempt: \${withFallback.length}/\${rows.length}\`);
          console.log(\`Of those, solved BY the fallback loop specifically: \${fallbackWins.length}\`);
          console.log('Fallback-loop winner ids: ' + fallbackWins.map(x => x.id ?? String(x.level)).sort().join(','));
          "

      - name: Upload combined results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repair-fallback-reserve-sample-ab-combined
          path: |
            reports/stress/repair-fallback-reserve-sample-ab.json
            logs/solver-repair-fallback-reserve-sample/
          if-no-files-found: error
          retention-days: 90
