name: Scheduler evidence materialization (one-shot)

on:
  pull_request:
    paths:
      - '.github/workflows/scheduler-materialization-one-shot.yml'

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Run deterministic level-blind development sample
        run: |
          mkdir -p tmp/scheduler-materialization
          node scripts/run-bundled.mjs scripts/level-blind-capability-sweep.mjs -- \
            --corpus=data/stress/stress-levels-random.json \
            --levels=pos:1,30,59,87,116,145,174,203,231,260,289,318,347,375,404,433,462,491,519,548,577,606,635,663,692,721,750,779,807,836,865,894,922,951,980,1009,1038,1066,1095,1124,1153,1182,1210,1239,1268,1297,1326,1354,1383,1412,1441,1470,1498,1527,1556,1585,1614,1642,1671,1700 \
            --budget-ms=86400000 \
            --node-budget=50000000 \
            --work-budget=67000000 \
            --strict-total-work-budget \
            --attempt-budget-telemetry \
            --lifecycle-telemetry \
            --workers=4 \
            --out=tmp/scheduler-materialization/current-fixed-work-sample.json \
            --summary-out=tmp/scheduler-materialization/current-fixed-work-sample-summary.md
      - name: Upload raw scheduler evidence
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-current-fixed-work-sample
          path: tmp/scheduler-materialization/
          retention-days: 7
