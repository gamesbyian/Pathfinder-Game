name: Hint determinism provenance audit (one-shot)

on:
  pull_request:
    paths:
      - 'scripts/hint-determinism-audit*.mjs'
      - '.github/workflows/hint-determinism-audit-one-shot.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Unit test audit semantics
        run: node scripts/hint-determinism-audit-node-test.mjs
      - name: Audit committed hint provenance
        run: |
          node scripts/hint-determinism-audit.mjs --out=tmp/hint-determinism-audit.json > tmp/hint-determinism-audit.stdout.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('tmp/hint-determinism-audit.json', 'utf8'));
          const lines = [
            '# Hint determinism provenance audit',
            '',
            `- Files: ${r.files}`,
            `- Hints: ${r.hints}`,
            `- Provenance events: ${r.provenanceEvents}`,
            `- Deterministically comparable events: ${r.comparableEvents}`,
            `- Repeat-run comparable groups: ${r.repeatRunComparableGroups}`,
            `- Repeat-run stable groups: ${r.repeatRunStableGroups}`,
            `- Repeat-run input-divergence groups: **${r.repeatRunInputDivergenceGroups}**`,
            `- Exact event identities attached to >1 path: **${r.exactEventCrossPathGroups}**`,
            '',
            'See uploaded JSON for samples and exclusion reasons.',
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: hint-determinism-audit
          path: tmp/hint-determinism-audit.json
