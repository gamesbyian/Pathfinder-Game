# Second one-off fix for census run 32240161854: the FIRST finalize attempt (run 32331263147's
# "finalize" job) silently only retrieved 100 of the 120 `technique-census-shard-*` artifacts from
# run 32240161854 via a single `actions/download-artifact@v4` pattern+run-id call. Confirmed directly
# from that job's own log: the action's underlying "list artifacts for this run" call itself returned
# "Found 100 artifact(s)" BEFORE any pattern filtering was applied -- a real, undocumented cap on
# that action's cross-run artifact listing (most likely a single-page, unpaginated fetch, ordered
# most-recent-first). Diffing the log's "Starting download of artifact to: .../technique-census-
# shard-N" lines against the full expected 1-120 set (excluding 85, recovered separately) shows
# EXACTLY shards 1-20 are missing -- the 20 oldest-created artifacts in that run, pushed out of the
# "most recent 100" window. This silently dropped ~13,036 T1 cells from the committed combine output
# without tripping combined-cells.json's own missingShards/partialShards checks (from the combine
# script's point of view, every directory it *did* receive was complete -- it never learns a
# directory it never received should have existed).
#
# Fix: keep the original pattern-based download (it already correctly retrieves the other 100 --
# shards 21-120, plus one small already-understood duplicate/partial artifact from an unrelated
# cancelled rerun of shard 85), and ADD 20 explicit single-artifact-by-name downloads for shards
# 1-20 specifically -- a named lookup bypasses the "list artifacts" call/cap entirely, the same way
# the plan and shard-85-sub-* downloads already do successfully.
#
# Re-running combine-technique-census-shards.mjs and createHintCapture with the CORRECT complete
# input is safe/idempotent: hint capture only adds genuinely new paths (already proven dedup-safe by
# the first, incomplete run), and this overwrites the incomplete report files in place.
#
# Delete this file (and technique-census-shard85-recovery.yml) once verified.
name: Technique census finalize fix (run 32240161854, download-cap bug)

on:
  workflow_dispatch: {}

concurrency:
  group: technique-census
  cancel-in-progress: false

jobs:
  finalize:
    name: Re-combine with the full 120 shards (recovering shards 1-20, dropped by the download cap)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout current branch tip
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download the original plan (from run 32240161854)
        uses: actions/download-artifact@v4
        with:
          name: technique-census-plan
          path: plan
          repository: gamesbyian/Pathfinder-Game
          run-id: 32240161854
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download shard artifacts (pattern match -- correctly retrieves shards 21-120 + one small duplicate)
        uses: actions/download-artifact@v4
        with:
          pattern: technique-census-shard-*
          path: artifact-staging
          merge-multiple: false
          repository: gamesbyian/Pathfinder-Game
          run-id: 32240161854
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download shard 1 (by exact name, bypasses the list-artifacts cap)
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-1, path: artifact-staging/technique-census-shard-1, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 2
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-2, path: artifact-staging/technique-census-shard-2, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 3
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-3, path: artifact-staging/technique-census-shard-3, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 4
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-4, path: artifact-staging/technique-census-shard-4, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 5
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-5, path: artifact-staging/technique-census-shard-5, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 6
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-6, path: artifact-staging/technique-census-shard-6, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 7
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-7, path: artifact-staging/technique-census-shard-7, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 8
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-8, path: artifact-staging/technique-census-shard-8, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 9
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-9, path: artifact-staging/technique-census-shard-9, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 10
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-10, path: artifact-staging/technique-census-shard-10, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 11
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-11, path: artifact-staging/technique-census-shard-11, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 12
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-12, path: artifact-staging/technique-census-shard-12, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 13
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-13, path: artifact-staging/technique-census-shard-13, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 14
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-14, path: artifact-staging/technique-census-shard-14, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 15
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-15, path: artifact-staging/technique-census-shard-15, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 16
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-16, path: artifact-staging/technique-census-shard-16, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 17
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-17, path: artifact-staging/technique-census-shard-17, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 18
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-18, path: artifact-staging/technique-census-shard-18, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 19
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-19, path: artifact-staging/technique-census-shard-19, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }
      - name: Download shard 20
        uses: actions/download-artifact@v4
        with: { name: technique-census-shard-20, path: artifact-staging/technique-census-shard-20, repository: gamesbyian/Pathfinder-Game, run-id: 32240161854, github-token: ${{ secrets.GITHUB_TOKEN }} }

      - name: Download the recovered shard 85 sub-slices (from run 32331263147)
        uses: actions/download-artifact@v4
        with:
          pattern: technique-census-shard-85-sub-*
          path: artifact-staging
          merge-multiple: false
          repository: gamesbyian/Pathfinder-Game
          run-id: 32331263147
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify all 120 shard directories are present before combining
        run: |
          count=$(find artifact-staging -maxdepth 1 -type d -name 'technique-census-shard-*' | grep -cv -- '-sub-')
          subcount=$(find artifact-staging -maxdepth 1 -type d -name 'technique-census-shard-85-sub-*' | wc -l)
          echo "Non-sub shard directories: $count; shard-85 sub-slices: $subcount"
          if [ "$count" -lt 120 ] || [ "$subcount" -lt 20 ]; then
            echo "::error::Expected 120 non-sub shard dirs and 20 sub-slices, found $count and $subcount -- aborting rather than committing an incomplete combine again."
            exit 1
          fi

      - name: Combine, derive summaries, and persist novel solutions
        run: |
          node scripts/run-bundled.mjs scripts/combine-technique-census-shards.mjs -- \
            --staging-dir=artifact-staging \
            --out-dir="reports/stress/technique-census/32240161854" \
            --plan=plan/technique-census-plan.json \
            --solver-version="c96f57c853a13e96a565105995719e23cc95bd87" \
            --save-hints

      - name: Verify T1 total matches the plan's full T1 cell count (76614)
        run: |
          node -e "
            const d = require('./reports/stress/technique-census/32240161854/combined-cells.json');
            const t1 = d.results.filter(r => r.tier === 'T1').length;
            console.log('T1 cells in combined output:', t1);
            if (t1 < 76614) { console.error('::error::T1 shortfall persists:', 76614 - t1, 'cells still missing.'); process.exit(1); }
          "

      - name: Upload the combined result
        uses: actions/upload-artifact@v4
        with:
          name: technique-census-combined-fixed
          path: reports/stress/technique-census/32240161854/
          retention-days: 90

      - name: Persist the run summary and any newly discovered hints
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "reports/stress/technique-census/32240161854/"
          git add data/hints/ data/stress/hints/ data/stress/hints-random/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fix technique capability census (32240161854): recover shards 1-20 dropped by download-artifact's list cap"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:${{ github.ref_name }}; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1
