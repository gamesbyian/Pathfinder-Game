name: PG-G symmetry ordering microscope (one-shot)

run-name: "PG-G symmetry ordering microscope · ${{ github.sha }}"

on:
  pull_request:
    paths:
      - '.github/workflows/pg-g-symmetry-ordering-microscope-one-shot.yml'
      - 'scripts/stress/symmetry-ordering-seam-audit.mjs'
      - 'reports/2026-10-15-pg-g-symmetry-ordering-microscope-spec-001.json'
      - 'reports/2026-10-15-pg-g-symmetry-ordering-microscope-plan-001.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg-g-symmetry-ordering-microscope
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out diagnostic source exactly
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out pinned historical family data
        uses: actions/checkout@v7
        with:
          ref: 32132d6ba60f1203ee013ed0d475f46061eddd49
          path: historical-family-data
          sparse-checkout: |
            data/families
          sparse-checkout-cone-mode: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Replay frozen symmetry cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/stress/pg-g-symmetry-ordering-microscope
          node scripts/run-bundled.mjs scripts/stress/symmetry-ordering-seam-audit.mjs -- \
            --spec=reports/2026-10-15-pg-g-symmetry-ordering-microscope-spec-001.json \
            --historical-root=historical-family-data \
            --parent-root=. \
            --out=reports/stress/pg-g-symmetry-ordering-microscope/result.json

      - name: Verify frozen result shape
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const p = 'reports/stress/pg-g-symmetry-ordering-microscope/result.json';
          const d = JSON.parse(fs.readFileSync(p, 'utf8'));
          if (d.kind !== 'pathfinder-pg-g-symmetry-ordering-microscope-result') throw new Error('unexpected result kind');
          if (d.historicalDatasetRef !== '32132d6ba60f1203ee013ed0d475f46061eddd49') throw new Error('historical dataset ref drifted');
          if (d.aggregate?.cases !== 5 || d.cases?.length !== 5) throw new Error('expected exactly five frozen cases');
          if (d.cases.some(row => !row.pathValidation?.parent || !row.pathValidation?.variant)) throw new Error('mapped path validation failed');
          NODE

      - name: Publish standard solver result
        if: always()
        shell: bash
        run: |
          if [ -f reports/stress/pg-g-symmetry-ordering-microscope/result.json ]; then
            node scripts/publish-solver-sweep-result.mjs \
              --primary=reports/stress/pg-g-symmetry-ordering-microscope/result.json \
              --include=reports/2026-10-15-pg-g-symmetry-ordering-microscope-spec-001.json \
              --include=reports/2026-10-15-pg-g-symmetry-ordering-microscope-plan-001.md \
              --source-artifact=pg-g-symmetry-ordering-microscope
          fi

      - name: Upload raw microscope evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-g-symmetry-ordering-microscope
          path: reports/stress/pg-g-symmetry-ordering-microscope/result.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload standard solver sweep result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: solver-sweep-result
          path: logs/solver-sweep-result/
          if-no-files-found: warn
          retention-days: 90

      - name: Summarize microscope
        if: always()
        shell: bash
        run: |
          if [ -f reports/stress/pg-g-symmetry-ordering-microscope/result.json ]; then
            node - <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync('reports/stress/pg-g-symmetry-ordering-microscope/result.json', 'utf8'));
          const a = d.aggregate;
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
            '# PG-G symmetry ordering microscope',
            '',
            '- cases: ' + a.cases,
            '- checked prefixes: ' + a.checkedPrefixes,
            '- cases with legal-set mismatch: ' + a.casesWithLegalSetMismatch,
            '- cases with raw-order mismatch: ' + a.casesWithRawOrderMismatch,
            '- cases with DFS score non-equivariance: ' + a.casesWithDfsScoreNonEquivariance,
            '- cases with DFS tied-order mismatch: ' + a.casesWithDfsTieOrderMismatch,
            '- cases with admissible-slack non-equivariance: ' + a.casesWithAdmissibleSlackNonEquivariance,
            '- cases with admissible tied-order mismatch: ' + a.casesWithAdmissibleTieOrderMismatch,
            '- cases with repair seed drift: ' + a.casesWithRepairSeedDrift,
            '',
            'This is selected-on forensic mechanism evidence. Do not interpret these rates as population prevalence.',
          ].join('\n') + '\n');
          NODE
          fi
