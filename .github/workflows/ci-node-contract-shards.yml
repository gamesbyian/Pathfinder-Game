name: CI Node Contract Shards

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node-contracts:
    name: node-contracts-${{ matrix.shard }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: a
            owner_groups: research,solver,game,persistence
          - shard: b
            owner_groups: shared,data,repo
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/logs/*
            /logs/artifact-metadata.json
            /logs/solver-canary-baseline.json
            /logs/*.md
            /logs/**/*.md
            !/reports/*
            /reports/*.md
            /reports/*.json
            /reports/**/*.md
            /reports/stress/experiment-evidence/**/manifest.json
            /reports/stress/experiment-evidence/35467098808__run-35467098808__attempt-1/bundle.json
            /reports/stress/experiment-evidence/35467098808__run-35467098808__attempt-1/evidence/primary/result.json
            /reports/stress/failure-evidence/class3-dose-expectations-2026-09-19.json
            /reports/stress/lane-a-c0-exact-label-projection-2026-09-20.json
            /reports/stress/lane-a-frozen-prefix-population-2026-09-18.json
            /reports/stress/class5-separator-decomposition-census-2026-09-18-with-geometry.json
            /reports/stress/lane-e-multi-pick-bisection-2026-09-17.json
            /reports/stress/class5-multi-pick-lane-e-input-2026-09-17.json
            /reports/stress/failure-evidence/ws2-class3-shared-acquisition-population-2026-09-20.json
            /reports/stress/failure-evidence/ws2-reconnaissance-solved-control-sample-2026-09-19.json
            !/data/
          sparse-checkout-cone-mode: false
      - name: Restore component runtime data
        uses: ./.github/actions/runtime-data

      - name: Derive exact dependency-tree cache key
        id: dependency-tree-key
        shell: bash
        run: |
          echo "key=node-modules-${RUNNER_OS}-x64-nodev22.23.2-npm10.9.8-${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"
      - name: Restore exact dependency tree
        id: dependency-tree-cache
        uses: actions/cache/restore@v5
        with:
          path: node_modules
          key: ${{ steps.dependency-tree-key.outputs.key }}
      - name: Set up Node on warm dependency-tree path
        if: steps.dependency-tree-cache.outputs.cache-hit == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
      - name: Set up Node with npm cache on dependency-tree miss
        if: steps.dependency-tree-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install dependencies from the npm cache
        if: steps.dependency-tree-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Compute local Node validation selection
        id: node-selection
        continue-on-error: true
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            node scripts/ci-impact-shadow-plan.mjs --git-diff HEAD^1 HEAD --out=tmp/ci-node-${{ matrix.shard }}-plan.json
          else
            node scripts/ci-impact-shadow-plan.mjs --full --out=tmp/ci-node-${{ matrix.shard }}-plan.json
          fi
      - name: Run selected Node and CLI contract shard
        id: node_tests
        continue-on-error: true
        shell: bash
        env:
          NODE_TEST_GROUPS: ${{ steps.node-selection.outputs.node_test_groups }}
          ROUTER_OUTCOME: ${{ steps.node-selection.outcome }}
          OWNER_GROUPS: ${{ matrix.owner_groups }}
          PATHFINDER_PARALLEL_JOBS: '4'
          PATHFINDER_PARALLEL_SUCCESS_OUTPUT: summary
          PATHFINDER_DIRECT_PACKAGE_SCRIPTS: '1'
        run: |
          if [[ "$ROUTER_OUTCOME" != "success" ]]; then
            echo "Local impact routing failed; running this shard's full execution-owner partition."
            groups="repo game persistence solver research data shared"
          elif [[ -z "$NODE_TEST_GROUPS" ]]; then
            echo "No Node/CLI contract groups selected."
            exit 0
          else
            groups="${NODE_TEST_GROUPS//,/ }"
          fi
          node scripts/validation-groups.mjs nodeTests $groups --owner-groups="$OWNER_GROUPS"
      - name: Enforce Node shard
        if: always()
        shell: bash
        env:
          NODE_TESTS: ${{ steps.node_tests.outcome }}
        run: |
          echo "Node contract shard ${{ matrix.shard }}: $NODE_TESTS" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$NODE_TESTS" != "success" ]]; then
            echo "::error::CI Node shard ${{ matrix.shard }} finished with $NODE_TESTS."
            exit 1
          fi
