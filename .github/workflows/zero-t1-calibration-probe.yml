name: Zero-T1 calibration probe

on:
  pull_request:
    paths:
      - 'scripts/analyze-zero-t1-production-calibration.mjs'
      - '.github/workflows/zero-t1-calibration-probe.yml'

permissions:
  contents: read

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            /scripts/analyze-zero-t1-production-calibration.mjs
            /reports/stress/technique-niches/2026-09-01/level-capability.json
            /logs/stress-corpus2-baseline.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Run calibration
        run: |
          node scripts/analyze-zero-t1-production-calibration.mjs --out=/tmp/zero-t1-calibration.json
          cat /tmp/zero-t1-calibration.json
