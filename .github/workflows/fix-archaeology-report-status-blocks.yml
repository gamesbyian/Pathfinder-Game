name: Fix archaeology report status blocks

on:
  push:
    branches:
      - chatgpt/report-status-block-fix-2026-09-13
    paths:
      - scripts/trigger-archaeology-report-status-fix.txt

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci --prefer-offline --no-audit --fund=false
      - run: python3 scripts/fix-archaeology-report-status-blocks.py
      - name: Remove one-shot repair machinery
        run: rm .github/workflows/fix-archaeology-report-status-blocks.yml scripts/fix-archaeology-report-status-blocks.py scripts/trigger-archaeology-report-status-fix.txt
      - run: npm run check:documentation-links
      - name: Commit report headers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Docs: normalize archaeology report status blocks'
          git push origin HEAD:chatgpt/report-status-block-fix-2026-09-13
