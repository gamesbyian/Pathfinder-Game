name: Persist captured solver hints

on:
  workflow_call:
    inputs:
      artifact_pattern:
        description: 'Artifact glob containing data/stress/hints*/ files captured by solver shards.'
        required: true
        type: string
      source_run:
        description: 'Human-readable source run/workflow label for the persistence commit.'
        required: false
        type: string
        default: 'solver workflow'

# All callers, regardless of source branch/workflow, serialize through one canonical hint-store
# writer. This makes structural merge the concurrency boundary rather than git's line-based JSON
# conflict handling.
concurrency:
  group: canonical-solver-hint-persistence
  cancel-in-progress: false

jobs:
  persist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download captured hint artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact_pattern }}
          path: artifact-staging
          merge-multiple: false

      - name: Merge, validate and persist against latest main
        shell: bash
        env:
          SOURCE_RUN: ${{ inputs.source_run }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # A push can lose a race to any unrelated main commit. Never line-rebase hint JSON: fetch
          # latest main and replay the semantic merge from the immutable downloaded artifacts.
          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main
            node scripts/run-bundled.mjs scripts/merge-hint-artifacts.mjs -- \
              --staging-dir=artifact-staging

            if git diff --quiet -- data/stress/hints/ data/stress/hints-random/; then
              echo 'Captured hints/provenance are already present on main.'
              exit 0
            fi

            git add data/stress/hints/ data/stress/hints-random/
            git commit -m "Persist solver hint evidence (${SOURCE_RUN}, run ${{ github.run_id }})"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo 'Could not persist captured hint evidence after four semantic-merge retries.' >&2
          exit 1
