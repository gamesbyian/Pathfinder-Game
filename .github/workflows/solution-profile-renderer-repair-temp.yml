name: Temporary profile renderer repair
on:
  push:
    branches: [chatgpt/solution-profile-resource-audit-2026-09-13]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python scripts/stress/solution-profile-renderer-repair-temp.py
      - run: npx vitest run scripts/stress/solution-profile-lib-unit-tests.mjs scripts/stress/provenance-source-taxonomy-unit-tests.mjs
      - run: npx eslint scripts/stress/solution-profile-lib.mjs scripts/stress/solution-profile-lib-unit-tests.mjs scripts/stress/solution-profile-compare.mjs scripts/stress/solution-profile-resource-audit.mjs
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/stress/solution-profile-lib.mjs scripts/stress/solution-profile-lib-unit-tests.mjs
          git commit -m 'research: repair profile summary renderer coverage'
          git push origin HEAD:chatgpt/solution-profile-resource-audit-2026-09-13
