# One-shot read-only PG-H bounded retained-descendant-work observer, delete before PR merge.
name: PG-H deep DEAD descendant work shadow
on:
  push:
    branches:
      - chatgpt/pg-h-dead-descendant-work-shadow-20261017
    paths:
      - .github/workflows/pg-h-dead-descendant-shadow-20261017.yml
permissions:
  contents: read
  actions: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Self-check prefix accounting
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-bundled.mjs scripts/stress/pg-h-deep-descendant-work-shadow.mjs -- --self-test
      - name: Load immutable 35-case exact source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p tmp/pg-h-descendant
          gh run download 39005597866 --repo "$GITHUB_REPOSITORY" \
            --name pg-h-deep-exact-complete --dir tmp/pg-h-descendant
          test -s tmp/pg-h-descendant/cases.json
          test -s tmp/pg-h-descendant/capture.json
      - name: Rerun ordinary beam with only a read-only descendant observer
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-bundled.mjs scripts/stress/pg-h-deep-descendant-work-shadow.mjs -- \
            --corpus=data/stress/stress-levels-random.json \
            --cases=tmp/pg-h-descendant/cases.json \
            --capture=tmp/pg-h-descendant/capture.json \
            --out=tmp/pg-h-descendant/work-verdict.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          const c=createHash('sha256').update(readFileSync('data/stress/stress-levels-random.json')).digest('hex');
          if(c!=='d15ed3b626b98c3bb8898f4a49079cc8a920f9e237412966b7eeedd0a27c7ffb')throw Error('Corpus hash differs from reference');
          const r=JSON.parse(readFileSync('tmp/pg-h-descendant/work-verdict.json','utf8'));
          if(r.summary.parents!==8||r.summary.groups!==16||r.summary.cases!==35)throw Error('Case coverage altered');
          console.log('PG-H DESCENDANT COVERAGE AND CORPUS VERIFIED');
          NODE
          cat tmp/pg-h-descendant/work-verdict.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pg-h-dead-descendant-shadow-result-001
          path: tmp/pg-h-descendant/work-verdict.json
          if-no-files-found: warn
          retention-days: 90
