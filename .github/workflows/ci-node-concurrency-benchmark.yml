name: CI Node Concurrency Benchmark

on:
  workflow_dispatch:
    inputs:
      job_counts:
        description: Comma-separated PATHFINDER_PARALLEL_JOBS values; use unbounded for historical default
        required: true
        default: '4'
        type: string
      execution_modes:
        description: Comma-separated child package-script modes (npm or direct)
        required: true
        default: 'npm,direct'
        type: string
      repeats:
        description: Repeats per worker-pool size on the same runner
        required: true
        default: '4'
        type: string

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install dependencies from the npm cache
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Benchmark Node harness fan-out
        env:
          JOB_COUNTS: ${{ inputs.job_counts || '4' }}
          EXECUTION_MODES: ${{ inputs.execution_modes || 'npm,direct' }}
          REPEATS: ${{ inputs.repeats || '4' }}
        run: >-
          npm run ci:benchmark-node-concurrency --
          --jobs="$JOB_COUNTS"
          --modes="$EXECUTION_MODES"
          --repeats="$REPEATS"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ci-node-concurrency-benchmark
          path: tmp/ci-node-concurrency-benchmark/
          retention-days: 30
