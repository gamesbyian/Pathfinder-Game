name: Harvest decision-bearing experiment evidence

on:
  workflow_run:
    workflows:
      - 'Solver broad confirmation cohort'
      - 'Solver two-phase residual confirmation'
      - 'Static portfolio confirmation A/B'
      - 'Solver combine sweep runs (cross-run reconciliation)'
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Existing Actions run id to retain without rerunning the solver.'
        required: true

# Share the canonical solver-evidence writer lock with the hint harvester. Both may commit under
# reports/stress and both must replay against latest main rather than line-rebase generated evidence.
concurrency:
  group: canonical-solver-hint-persistence
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Self-test durable experiment evidence retention
        run: node scripts/persist-decision-bearing-experiment-evidence.mjs --self-test

      - name: Download every artifact from the source experiment run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p artifact-staging
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir artifact-staging

      - name: Persist accepted decision-bearing evidence onto latest main
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.source_run_id }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name || 'manual backfill' }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3 4; do
            git fetch origin main
            git reset --hard origin/main

            node scripts/persist-decision-bearing-experiment-evidence.mjs \
              --staging-dir=artifact-staging \
              --out-root=reports/stress/experiment-evidence

            if git diff --quiet -- reports/stress/experiment-evidence/ 2>/dev/null; then
              echo 'No new decision-bearing v3 experiment evidence to persist.'
              exit 0
            fi

            git add reports/stress/experiment-evidence/
            git commit -m "Retain decision-bearing experiment evidence: ${SOURCE_WORKFLOW} (${SOURCE_RUN_ID})"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 5))
          done

          echo 'Failed to persist decision-bearing experiment evidence after four semantic-merge retries.' >&2
          exit 1
