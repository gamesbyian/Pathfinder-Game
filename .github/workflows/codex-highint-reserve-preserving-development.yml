name: Codex reserve-preserving high-int development

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx vitest run modules/solver/attempts.test.ts
      - run: npm run check:types
      - run: npm run check:types:tests

  plan:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      sample_sha: ${{ steps.meta.outputs.sample_sha }}
      sample_count: ${{ steps.meta.outputs.sample_count }}
      eligible_count: ${{ steps.meta.outputs.eligible_count }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Rebuild spent parent sample
        run: |
          node scripts/run-bundled.mjs scripts/stress/select-attempt-exposure-sample.mjs -- \
            --corpus=data/stress/stress-levels-random.json \
            --enable-flag=STRATEGY_HIGHINT_STANDARD_INTERSECTION_HARVEST_BEAM_EXPOSURE \
            --technique=beam:intersectionHarvest@beam2000 \
            --exclude-ids=R01124,R02500,R02718,R02440 \
            --count=120 --seed=20260828 \
            --out=tmp/append-last-parent-sample.json
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('tmp/append-last-parent-sample.json','utf8'));
          const expected='dc3a013471f58065fa12425b59b3b6f99fd05780facd9eb9eaa46ec97cb4fbc6';
          if(d.sampleSha256!==expected) throw new Error('parent sample seal mismatch: '+d.sampleSha256);
          NODE
      - name: Materialize disjoint descendant sample
        id: meta
        shell: bash
        run: |
          node scripts/run-bundled.mjs scripts/stress/select-attempt-exposure-sample.mjs -- \
            --corpus=data/stress/stress-levels-random.json \
            --enable-flag=STRATEGY_HIGHINT_STANDARD_INTERSECTION_HARVEST_RESERVE_PRESERVING_EXPOSURE \
            --technique=beam:intersectionHarvest@beam2000 \
            --exclude-ids=R01124,R02500,R02718,R02440 \
            --exclude-sample=tmp/append-last-parent-sample.json \
            --count=120 --seed=20260829 \
            --out=tmp/reserve-preserving-sample.json
          node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('tmp/reserve-preserving-sample.json','utf8'));
          if(d.sampleCount!==120) throw new Error('expected 120 disjoint descendant rows, got '+d.sampleCount);
          const parent=JSON.parse(fs.readFileSync('tmp/append-last-parent-sample.json','utf8'));
          const spent=new Set(parent.sample.map(x=>x.id));
          if(d.sample.some(x=>spent.has(x.id))) throw new Error('descendant sample overlaps spent parent sample');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'sample_sha='+d.sampleSha256+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'sample_count='+d.sampleCount+'\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'eligible_count='+d.eligibleCount+'\n');
          console.log('descendant eligible-after-exclusions='+d.eligibleCount+' sample='+d.sampleCount+' sha='+d.sampleSha256);
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: reserve-preserving-sample
          path: |
            tmp/append-last-parent-sample.json
            tmp/reserve-preserving-sample.json
          if-no-files-found: error
          retention-days: 30

  ab:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        arm: [control, treatment]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: reserve-preserving-sample
          path: tmp
      - name: Resolve shard positions
        id: shard
        shell: bash
        run: |
          positions=$(node - <<'NODE'
          const fs=require('node:fs');
          const d=JSON.parse(fs.readFileSync('tmp/reserve-preserving-sample.json','utf8'));
          const shard=Number(process.env.SHARD), shards=8;
          const a=Math.floor(shard*d.sample.length/shards);
          const b=Math.floor((shard+1)*d.sample.length/shards);
          process.stdout.write(d.sample.slice(a,b).map(x=>x.pos).join(','));
          NODE
          )
          echo "positions=$positions" >> "$GITHUB_OUTPUT"
        env:
          SHARD: ${{ matrix.shard }}
      - name: Run strict-work descendant arm
        shell: bash
        run: |
          extra=()
          if [ "${{ matrix.arm }}" = "treatment" ]; then
            extra+=("--enable-flags=STRATEGY_HIGHINT_STANDARD_INTERSECTION_HARVEST_RESERVE_PRESERVING_EXPOSURE")
          fi
          timeout -k 30s --preserve-status 110m node scripts/run-bundled.mjs scripts/level-blind-capability-sweep.mjs -- \
            --corpus=data/stress/stress-levels-random.json \
            --levels="pos:${{ steps.shard.outputs.positions }}" \
            --budget-ms=86400000 \
            --node-budget=50000000 \
            --work-budget=67000000 \
            --strict-total-work-budget \
            --attempt-budget-telemetry \
            --workers=4 \
            "${extra[@]}" \
            --out="tmp/reserve-preserving-${{ matrix.arm }}-${{ matrix.shard }}.json" \
            --summary-out="tmp/reserve-preserving-${{ matrix.arm }}-${{ matrix.shard }}-summary.md"
      - uses: actions/upload-artifact@v7
        with:
          name: reserve-preserving-${{ matrix.arm }}-${{ matrix.shard }}
          path: tmp/reserve-preserving-${{ matrix.arm }}-${{ matrix.shard }}*
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: [plan, ab]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: reserve-preserving-*
          path: tmp/download
          merge-multiple: true
      - name: Compare descendant
        run: |
          node - <<'NODE'
          const fs=require('node:fs'), path=require('node:path');
          const files=fs.readdirSync('tmp/download').filter(f=>/^reserve-preserving-(control|treatment)-\d+\.json$/.test(f));
          const rows={control:[],treatment:[]};
          for(const f of files){
            const arm=f.includes('-control-')?'control':'treatment';
            rows[arm].push(...JSON.parse(fs.readFileSync(path.join('tmp/download',f),'utf8')).levels);
          }
          for(const arm of ['control','treatment']) rows[arm].sort((a,b)=>a.id.localeCompare(b.id));
          if(rows.control.length!==120||rows.treatment.length!==120) throw new Error('incomplete paired rows');
          const c=new Map(rows.control.map(r=>[r.id,r])), t=new Map(rows.treatment.map(r=>[r.id,r]));
          const ids=[...c.keys()].sort();
          if(ids.some(id=>!t.has(id))) throw new Error('arm ID mismatch');
          const action='main-loop|beam:intersectionHarvest@beam2000';
          const gained=ids.filter(id=>!c.get(id).ok&&t.get(id).ok);
          const lost=ids.filter(id=>c.get(id).ok&&!t.get(id).ok);
          const reached=ids.filter(id=>(t.get(id).attempts??[]).some(a=>a.actionKey===action));
          const sum=(arr,k)=>arr.reduce((s,r)=>s+Number(r[k]??0),0);
          const result={
            evidenceRole:'disjoint development validation',
            sampleSha256:'${{ needs.plan.outputs.sample_sha }}',
            sampleCount:ids.length,
            controlSolved:ids.filter(id=>c.get(id).ok).length,
            treatmentSolved:ids.filter(id=>t.get(id).ok).length,
            gained,lost,
            treatmentParticipation:reached.length,
            controlWork:sum(rows.control,'workSpent'),
            treatmentWork:sum(rows.treatment,'workSpent'),
            deadlineControl:rows.control.filter(r=>r.deadlineTruncated).length,
            deadlineTreatment:rows.treatment.filter(r=>r.deadlineTruncated).length,
            errorsControl:rows.control.filter(r=>r.status==='error'||r.hadAttemptError).length,
            errorsTreatment:rows.treatment.filter(r=>r.status==='error'||r.hadAttemptError).length,
          };
          fs.writeFileSync('tmp/reserve-preserving-development-result.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: reserve-preserving-development-result
          path: tmp/reserve-preserving-development-result.json
          if-no-files-found: error
          retention-days: 30
