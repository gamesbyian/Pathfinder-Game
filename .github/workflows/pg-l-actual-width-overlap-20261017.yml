# Disposable observer run; remove workflow before integration and preserve evidence.
name: PG-L observed production-width overlap canary
on:
  push:
    branches:
      - chatgpt/pg-l-actual-width-overlap-20261017
    paths:
      - .github/workflows/pg-l-actual-width-overlap-20261017.yml
      - scripts/stress/pg-l-actual-width-overlap-shadow.mjs
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Run provenance-neutral pure collector self-test
        run: node scripts/run-bundled.mjs scripts/stress/pg-l-actual-width-overlap-shadow.mjs -- --self-test
      - name: Exactly replay three confirmed dispatch configurations with paired observer controls
        shell: bash
        run: |
          set -euo pipefail
          node scripts/run-bundled.mjs scripts/stress/pg-l-actual-width-overlap-shadow.mjs -- --out=tmp/pg-l-actual-width-overlap/verdict.json
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const r=JSON.parse(readFileSync('tmp/pg-l-actual-width-overlap/verdict.json','utf8'));
          if(r.summary.parents!==3||r.summary.exactActionComparisonPairs!==3||r.summary.observerParityAlarms!==0)throw Error('PG-L source/control coverage');
          if(r.selection.width!==5000||r.selection.selected.length!==3)throw Error('PG-L actual width cohort mismatch');
          console.log('PG-L SOURCE-MATCHED ACTUAL-WIDTH VERDICT '+JSON.stringify(r.summary));
          NODE
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pg-l-actual-width-overlap-20261017
          path: tmp/pg-l-actual-width-overlap/verdict.json
          if-no-files-found: warn
          retention-days: 90
