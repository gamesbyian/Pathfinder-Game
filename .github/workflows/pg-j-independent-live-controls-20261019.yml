# One-time source-accepted LIVE path shadow-inclusion correctness audit.
name: PG-J independent LIVE controls
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pg-j-independent-live-controls-20261019.yml'
  workflow_dispatch:

concurrency:
  group: pg-j-independent-live-controls-20261019
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  exact-live:
    name: Source accepted full-path abstract projection
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact execution source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Fast pure-shape self-test
        run: node scripts/stress/pg-j-independent-live-witness-projection.mjs --self-test
      - name: Verify real complete referee-valid LIVE suffixes
        id: research
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/pg-j-live
          timeout -k 15s --preserve-status 9m \
            node scripts/run-bundled.mjs scripts/stress/pg-j-independent-live-witness-projection.mjs -- \
            --out=logs/pg-j-live/live-verdict.json
      - name: Preserve result even if soundness falsifies
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-j-independent-live-controls
          path: logs/pg-j-live/live-verdict.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce source authentic and complete LIVE controls
        if: always()
        env:
          RESEARCH_OUTCOME: ${{ steps.research.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RESEARCH_OUTCOME" = success
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const j=JSON.parse(readFileSync('logs/pg-j-live/live-verdict.json','utf8'));
          if(j.sourceCommit!==process.env.GITHUB_SHA||!j.summary.noSourceOrRefereeAlarms
            ||j.summary.independentParents!==2||j.summary.sourceAcceptedPaths!==3
            ||j.summary.missingAbstractTransitions!==0||!j.summary.soundnessGatePassed)
            throw Error('PG-J independent accepted-LIVE soundness qualification failed');
          console.log(JSON.stringify(j.summary));
          NODE
