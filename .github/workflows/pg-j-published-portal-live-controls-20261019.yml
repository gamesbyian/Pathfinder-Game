# Temporary first-stored-hint published portal LIVE source witness audit.
name: PG-J published portal LIVE controls
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pg-j-published-portal-live-controls-20261019.yml'
  workflow_dispatch:

concurrency:
  group: pg-j-published-portal-live-controls-20261019
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  source-live:
    name: Four published first-hint full source witnesses
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact execution source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Pure helper self-test
        run: node scripts/stress/pg-j-published-portal-live-projection.mjs --self-test
      - name: Validate and project four first published hints
        id: source
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/pg-j-published
          timeout -k 15s --preserve-status 9m \
            node scripts/run-bundled.mjs scripts/stress/pg-j-published-portal-live-projection.mjs -- \
            --out=logs/pg-j-published/verdict.json
      - name: Preserve raw evidence if incomplete
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-j-published-portal-live-controls
          path: logs/pg-j-published/verdict.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce exact source, no wrong accepted LIVE rejection
        if: always()
        env:
          SOURCE_RESULT: ${{ steps.source.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$SOURCE_RESULT" = success
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const v=JSON.parse(readFileSync('logs/pg-j-published/verdict.json','utf8'));
          if(v.sourceCommit!==process.env.GITHUB_SHA
            ||v.summary.sourceAcceptedPaths!==4
            ||v.summary.independentParents!==4
            ||!v.summary.noSourceOrRefereeAlarms
            ||!v.summary.soundnessGatePassed
            ||v.summary.missingAbstractTransitions!==0)
             throw Error('PG-J published referee-LIVE correctness-control qualification failed');
          console.log(JSON.stringify(v.summary));
          NODE
