# One-shot PG-I actual after-taper winning prefix survival readout.
name: PG-I post-taper actual first-loss diagnosis
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/pg-i-first-loss-20261019.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pg-i-post-taper-first-loss-20261019
  cancel-in-progress: false
jobs:
  evidence:
    name: Two original winner-positive strict250k native tracer arms
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - run: npm ci
      - name: Bundled source-only diagnostic fixture
        run: node scripts/run-bundled.mjs scripts/stress/pg-i-post-taper-first-loss.mjs -- --self-test
      - name: Run exact original 2 selected taper replays with read-only observer
        id: run
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/pg-i-first-loss
          timeout -k 20s --preserve-status 20m \
            node scripts/run-bundled.mjs scripts/stress/pg-i-post-taper-first-loss.mjs -- \
            --out=logs/pg-i-first-loss/result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pg-i-post-taper-first-loss-20261019
          path: logs/pg-i-first-loss/result.json
          retention-days: 90
          if-no-files-found: warn
      - name: Require source parity and no sound hard-prune alarm, not a new solve
        if: always()
        env:
          DONE: ${{ steps.run.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$DONE" = success
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const v=JSON.parse(readFileSync('logs/pg-i-first-loss/result.json','utf8'));
          if(v.executionSha!==process.env.GITHUB_SHA
            ||v.summary.cells!==2||v.summary.exactSourceParity!==2
            ||v.summary.correctnessAlarms!==0)
            throw Error('PG-I source identity or soundness alarm');
          console.log('PG-I FIRST LOSS '+JSON.stringify(v.summary));
          NODE
