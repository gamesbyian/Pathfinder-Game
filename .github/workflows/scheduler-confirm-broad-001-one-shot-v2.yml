name: Scheduler confirm-broad-001 v2 (one-shot)

on:
  pull_request:
    paths:
      - '.github/workflows/scheduler-confirm-broad-001-one-shot-v2.yml'

env:
  SOLVER_SHA: fc696bac37bffea9ca8b8dbc7616639224fbf4dc
  GENERATOR_SHA: 4f2b2b143ee2bc194b8e017fcc59a680b9ee8d92
  COHORT_SEED: '2026082417'

jobs:
  run-shard:
    name: ${{ matrix.arm }}-shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        arm: [control, treatment]
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Check out frozen solver revision
        uses: actions/checkout@v4
        with: { ref: '${{ env.SOLVER_SHA }}' }
      - name: Check out pinned cohort-generator revision
        uses: actions/checkout@v4
        with:
          ref: '${{ env.GENERATOR_SHA }}'
          path: tmp/generator-src
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - name: Install dependencies
        run: |
          npm ci
          (cd tmp/generator-src && npm ci)
      - name: Materialize locked cohort from pinned generator
        run: |
          (cd tmp/generator-src && node scripts/run-bundled.mjs scripts/stress/generate-random.mjs \
            --count=256 --master-seed=${COHORT_SEED} --id-prefix=C \
            --out=${GITHUB_WORKSPACE}/tmp/confirm-broad-001.json)
          # The generated corpus is a wrapper object with a top-level levels array.
          test "$(node -e "console.log(JSON.parse(require('fs').readFileSync('tmp/confirm-broad-001.json','utf8')).levels.length)")" = '256'
      - name: Apply frozen treatment rewrite
        if: matrix.arm == 'treatment'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('modules/solver/orchestration.ts'); s=p.read_text()
          old="    const mainConfigs = baseConfigs.filter(c => !c.repair && !c.admissibleOrder);\n"
          add=old+("    const ordinaryMainConfigs = mainConfigs.filter(c => !new Set([\n"
                   "        'dfs:objectiveFirst', 'dfs:intersectionHarvest',\n"
                   "    ]).has(attemptConfigKey(c)));\n")
          assert s.count(old)==1
          s=s.replace(old,add)
          assert s.count('        mainConfigsCount: mainConfigs.length,\n')==1
          s=s.replace('        mainConfigsCount: mainConfigs.length,\n','        mainConfigsCount: ordinaryMainConfigs.length,\n')
          a='await runInterleavedAttempts(activeGates, mainConfigs, level, prep, timeBudgetMs, mainLoopStartTime'
          b='await runGateSerialAttempts(activeGates, mainConfigs, level, prep, timeBudgetMs, mainLoopStartTime'
          assert s.count(a)==1 and s.count(b)==1
          s=s.replace(a,a.replace('mainConfigs','ordinaryMainConfigs'))
          s=s.replace(b,b.replace('mainConfigs','ordinaryMainConfigs'))
          assert s.count('activeGates, mainConfigs, level, prep, yieldFn')>=4
          p.write_text(s)
          PY
          git diff --check
          npm run build
      - name: Run frozen confirmation shard
        run: |
          d=tmp/confirm/${{ matrix.arm }}/shard-${{ matrix.shard }}; mkdir -p "$d"
          positions=$(python3 - <<'PY'
          s=int('${{ matrix.shard }}')
          print('pos:'+','.join(str(i) for i in range(1,257) if (i-1)%8==s))
          PY
          )
          node scripts/run-bundled.mjs scripts/level-blind-capability-sweep.mjs -- \
            --corpus=tmp/confirm-broad-001.json --levels="$positions" \
            --budget-ms=86400000 --node-budget=50000000 --work-budget=67000000 \
            --strict-total-work-budget --attempt-budget-telemetry --lifecycle-telemetry \
            --workers=4 --out="$d/result.json" --summary-out="$d/summary.md"
      - name: Verify shard and write provenance
        run: |
          d=tmp/confirm/${{ matrix.arm }}/shard-${{ matrix.shard }}
          node - "$d" '${{ matrix.arm }}' '${{ matrix.shard }}' <<'NODE'
          const fs=require('node:fs'), cp=require('node:child_process');
          const [d,arm,shard]=process.argv.slice(2); const r=JSON.parse(fs.readFileSync(`${d}/result.json`));
          const rows=r.levels??[]; if(rows.length!==32) throw Error(`expected 32 rows, got ${rows.length}`);
          const bad=rows.filter(x=>x.deadlineTruncated||x.status==='deadline-truncated'||x.status==='attempt-error');
          if(bad.length) throw Error(`indeterminate/error rows: ${bad.length}`);
          if(arm==='treatment'){
            const forbidden=rows.flatMap(x=>(x.attempts??[]).filter(a=>a.stageId==='main-loop'&&a.beamWidth==null&&a.template==null&&(a.profile==='objectiveFirst'||a.profile==='intersectionHarvest')));
            if(forbidden.length) throw Error(`suppressed ordinary action executed: ${forbidden.length}`);
          }
          const sh=p=>cp.execFileSync('sha256sum',[p],{encoding:'utf8'}).split(/\s+/)[0];
          const patch=cp.execSync('git diff -- modules/solver/orchestration.ts',{encoding:'utf8'});
          const crypto=require('node:crypto');
          const meta={arm,shard:Number(shard),solverSha:process.env.SOLVER_SHA,generatorSha:process.env.GENERATOR_SHA,
            cohortId:'confirm-broad-001',cohortSeed:Number(process.env.COHORT_SEED),cohortSha256:sh('tmp/confirm-broad-001.json'),
            strictTotalWorkBudget:67000000,nodeBudget:50000000,
            suppressedOrdinaryMainLoopConfigKeys:arm==='treatment'?['dfs:objectiveFirst','dfs:intersectionHarvest']:[],
            workingTreePatchSha256:crypto.createHash('sha256').update(patch).digest('hex')};
          fs.writeFileSync(`${d}/metadata.json`,JSON.stringify(meta,null,2)+'\n');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-confirm-v2-${{ matrix.arm }}-${{ matrix.shard }}
          path: tmp/confirm/${{ matrix.arm }}/shard-${{ matrix.shard }}/
          retention-days: 90

  analyze:
    name: Record frozen confirmation verdict
    needs: run-shard
    if: always() && needs.run-shard.result == 'success'
    runs-on: ubuntu-latest
    permissions: { contents: read }
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: 'scheduler-confirm-v2-*', path: tmp/downloaded }
      - name: Apply frozen acceptance rule before exact-row inspection
        run: |
          mkdir -p tmp/confirmation-analysis
          node - <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const dirs=fs.readdirSync('tmp/downloaded').filter(x=>x.startsWith('scheduler-confirm-v2-'));
          if(dirs.length!==16) throw Error(`expected 16 shard artifacts, got ${dirs.length}`);
          const g={control:[],treatment:[]}, hashes=new Set();
          for(const n of dirs){const p=path.join('tmp/downloaded',n); const m=JSON.parse(fs.readFileSync(path.join(p,'metadata.json'))); const r=JSON.parse(fs.readFileSync(path.join(p,'result.json'))); hashes.add(m.cohortSha256); g[m.arm].push(...(r.levels??[]));}
          if(hashes.size!==1) throw Error('cohort hashes differ');
          for(const a of ['control','treatment']){if(g[a].length!==256||new Set(g[a].map(x=>x.id)).size!==256) throw Error(`${a} population invalid`);}
          const ids=a=>new Set(g[a].filter(x=>x.ok).map(x=>x.id)); const c=ids('control'),t=ids('treatment');
          const gained=[...t].filter(x=>!c.has(x)).sort(),lost=[...c].filter(x=>!t.has(x)).sort();
          const work=a=>g[a].reduce((s,x)=>s+Number(x.workSpent??0),0), cw=work('control'),tw=work('treatment'),wr=cw?(cw-tw)/cw:0;
          const pass=lost.length===0&&(gained.length>=1||wr>=.10);
          const v={verdict:pass?'confirmation-pass':'confirmation-fail',acceptanceRule:'no solve loss AND (>=1 gained solve OR >=10% aggregate canonical-work reduction)',cohortId:'confirm-broad-001',cohortSize:256,cohortSha256:[...hashes][0],solverSha:process.env.SOLVER_SHA,generatorSha:process.env.GENERATOR_SHA,control:{solved:c.size,aggregateWork:cw},treatment:{solved:t.size,aggregateWork:tw},gainedCount:gained.length,lostCount:lost.length,aggregateWorkReductionFraction:wr,aggregateWorkReductionPercent:100*wr,passesGate:pass};
          fs.writeFileSync('tmp/confirmation-analysis/verdict.json',JSON.stringify(v,null,2)+'\n');
          fs.writeFileSync('tmp/confirmation-analysis/post-verdict-changed-ids.json',JSON.stringify({gained,lost},null,2)+'\n');
          fs.writeFileSync('tmp/confirmation-analysis/summary.md',`# Scheduler confirm-broad-001 verdict\n\nVerdict: **${v.verdict}**\n\nControl: ${c.size}/256 solved; ${cw.toLocaleString()} work.\nTreatment: ${t.size}/256 solved; ${tw.toLocaleString()} work.\nGained solves: ${gained.length}. Lost solves: ${lost.length}.\nAggregate work reduction: ${(100*wr).toFixed(2)}%.\nFrozen gate: **${pass?'PASS':'FAIL'}**.\n`);
          console.log(fs.readFileSync('tmp/confirmation-analysis/summary.md','utf8'));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: scheduler-confirm-broad-001-verdict-v2
          path: tmp/confirmation-analysis/
          retention-days: 90
