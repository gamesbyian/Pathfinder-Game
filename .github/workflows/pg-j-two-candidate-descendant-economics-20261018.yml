# One-shot source-native PG-J two-metric-candidate descendant expansion evidence.
name: PG-J two-candidate descendant economics
on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/pg-j-two-candidate-descendant-economics-20261018.yml'
  workflow_dispatch:

concurrency:
  group: pg-j-two-candidate-descendant-economics-20261018
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  observe:
    name: Source-exact two candidate beam lineage observations
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Checkout frozen execution source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - name: Node 22.23.2
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate observer path-matching contract
        run: node scripts/stress/pg-j-two-candidate-descendant-work.mjs --self-test
      - name: Replay original source and meter descendants
        id: experiment
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs/pg-j-two-descendants
          timeout -k 20s --preserve-status 24m \
            node scripts/run-bundled.mjs scripts/stress/pg-j-two-candidate-descendant-work.mjs -- \
            --out=logs/pg-j-two-descendants/verdict.json
      - name: Preserve exact-source success or partial output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pg-j-two-candidate-descendant-economics
          path: logs/pg-j-two-descendants/verdict.json
          retention-days: 30
          if-no-files-found: warn
      - name: Enforce identity, not descendant-economics positivity
        if: always()
        env:
          RESULT_OUTCOME: ${{ steps.experiment.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          test "$RESULT_OUTCOME" = success
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const d=JSON.parse(readFileSync('logs/pg-j-two-descendants/verdict.json','utf8'));
          if(d.sourceExecutionCommit!==process.env.GITHUB_SHA
            ||d.summary.originalCandidates!==2
            ||d.summary.distinctSourceParents!==2
            ||d.rows.some(x=>!x.sourceIdentityMatched)
            ||d.summary.sourceReproductionAlarms!==0)
             throw Error('PG-J source identity or native lineage accounting invalid');
          console.log(JSON.stringify(d.summary));
          NODE
