name: Codex missing-exposure audit

on:
  push:
    branches:
      - codex/missing-exposure-and-budget-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Rebuild current missing-exposure map
        run: |
          node scripts/run-bundled.mjs scripts/stress/current-missing-exposure-audit.mjs -- \
            --baseline=reports/stress/capability-runs/32835403128/per-level-corpus2.json \
            --census=reports/stress/technique-census/32240161854/combined-cells.json \
            --exclude-solved=R02151,R00817,R02010 \
            --out=tmp/current-missing-exposure-audit.json

      - name: Upload audit
        uses: actions/upload-artifact@v7
        with:
          name: current-missing-exposure-audit
          path: tmp/current-missing-exposure-audit.json
          if-no-files-found: error
          retention-days: 30
