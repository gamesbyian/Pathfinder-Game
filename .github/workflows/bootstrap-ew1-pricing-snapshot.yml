name: Bootstrap durable EW1 pricing snapshot

on:
  pull_request:
    paths:
      - '.github/workflows/bootstrap-ew1-pricing-snapshot.yml'

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Reconstruct corrected EW1 matrix from sealed run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          out='reports/stress/ew1/33156541827-pricing-snapshot.json'
          if [ -f "$out" ]; then
            echo "Snapshot already exists; nothing to bootstrap."
            exit 0
          fi
          rm -rf /tmp/ew1-artifacts /tmp/ew1-combined
          mkdir -p /tmp/ew1-artifacts /tmp/ew1-combined "$(dirname "$out")"
          gh run download 33156541827             --repo "${{ github.repository }}"             --pattern 'technique-census-shard-*'             --dir /tmp/ew1-artifacts
          node scripts/combine-technique-census-shards.mjs             --staging-dir=/tmp/ew1-artifacts             --out-dir=/tmp/ew1-combined
          node - <<'NODE'
          const fs = require('node:fs');
          const src = JSON.parse(fs.readFileSync('/tmp/ew1-combined/combined-cells.json', 'utf8'));
          const fields = [
            'cellId','tier','corpus','levelId','levelPos','techniqueKeys','workBudget','workSpent',
            'deadlineTruncated','ok','status','refereeValid','winningConfigKey','nodesExpanded'
          ];
          const rows = (src.results ?? [])
            .filter(row => row.tier === 'EW1' && (row.techniqueKeys?.length ?? 0) === 1)
            .sort((a,b) => a.cellId.localeCompare(b.cellId))
            .map(row => Object.fromEntries(fields.filter(k => k in row).map(k => [k, row[k]])));
          const summary = {
            cells: rows.length,
            levels: new Set(rows.map(r => r.corpus + '/' + r.levelId)).size,
            techniques: new Set(rows.map(r => r.techniqueKeys[0])).size,
            solved: rows.filter(r => r.ok).length,
            deadlineTruncated: rows.filter(r => r.deadlineTruncated).length,
            errors: rows.filter(r => r.status === 'error').length,
            workBudgets: [...new Set(rows.map(r => r.workBudget))].sort((a,b) => a-b),
            maxWorkSpent: Math.max(...rows.map(r => Number(r.workSpent ?? 0))),
          };
          const expected = {
            cells: 2015, levels: 60, techniques: 34, solved: 45,
            deadlineTruncated: 0, errors: 0, workBudgets: [10000000], maxWorkSpent: 10008897,
          };
          if (JSON.stringify(summary) !== JSON.stringify(expected)) {
            throw new Error('EW1 reconstruction integrity mismatch: ' + JSON.stringify({summary, expected}));
          }
          const out = {
            schemaVersion: 1,
            sourceRunId: 33156541827,
            sourceHeadSha: 'd1d02501a9fb833a732e918fc978a36da405396d',
            evidenceRole: 'bounded equal-work isolated-action pricing development evidence',
            sourceIntegrity: summary,
            results: rows,
          };
          fs.writeFileSync('reports/stress/ew1/33156541827-pricing-snapshot.json', JSON.stringify(out, null, 2) + '\n');
          NODE

      - name: Commit snapshot onto PR branch
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- reports/stress/ew1/33156541827-pricing-snapshot.json)" ]; then
            echo "No snapshot change."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add reports/stress/ew1/33156541827-pricing-snapshot.json
          git commit -m 'Preserve corrected EW1 pricing snapshot'
          git push origin HEAD:"${{ github.head_ref }}"
