name: Codex reserve-preserving high-int replay

on:
  push:
    branches:
      - codex/missing-exposure-and-budget-audit
    paths:
      - '.github/workflows/codex-highint-reserve-preserving-replay.yml'

permissions:
  contents: read

# validation-revision: 2

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx vitest run modules/solver/attempts.test.ts
      - run: npm run check:types

  replay:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        arm: [control, treatment]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Resolve tuning-pair positions
        id: positions
        shell: bash
        run: |
          positions=$(node - <<'NODE'
          const fs = require('node:fs');
          const doc = JSON.parse(fs.readFileSync('data/stress/stress-levels-random.json','utf8'));
          const rows = Array.isArray(doc) ? doc : doc.levels;
          const ids = new Set(['R02440','R02965']);
          const found = rows.flatMap((r,i) => ids.has(r.id) ? [i+1] : []);
          if (found.length !== 2) throw new Error('expected both tuning rows');
          process.stdout.write(found.join(','));
          NODE
          )
          echo "positions=$positions" >> "$GITHUB_OUTPUT"
      - name: Run strict-work replay arm
        shell: bash
        run: |
          extra=()
          if [ "${{ matrix.arm }}" = "treatment" ]; then
            extra+=("--enable-flags=STRATEGY_HIGHINT_STANDARD_INTERSECTION_HARVEST_RESERVE_PRESERVING_EXPOSURE")
          fi
          node scripts/run-bundled.mjs scripts/level-blind-capability-sweep.mjs -- \
            --corpus=data/stress/stress-levels-random.json \
            --levels="pos:${{ steps.positions.outputs.positions }}" \
            --budget-ms=86400000 \
            --node-budget=50000000 \
            --work-budget=67000000 \
            --strict-total-work-budget \
            --attempt-budget-telemetry \
            --workers=2 \
            "${extra[@]}" \
            --out="tmp/reserve-preserving-${{ matrix.arm }}.json" \
            --summary-out="tmp/reserve-preserving-${{ matrix.arm }}-summary.md"
      - uses: actions/upload-artifact@v7
        with:
          name: reserve-preserving-${{ matrix.arm }}
          path: tmp/reserve-preserving-${{ matrix.arm }}*
          if-no-files-found: error
          retention-days: 30

  compare:
    needs: replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: reserve-preserving-*
          path: tmp
          merge-multiple: true
      - name: Compare tuning pair
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const c = JSON.parse(fs.readFileSync('tmp/reserve-preserving-control.json','utf8'));
          const t = JSON.parse(fs.readFileSync('tmp/reserve-preserving-treatment.json','utf8'));
          const cm = new Map(c.levels.map(r => [r.id,r]));
          const tm = new Map(t.levels.map(r => [r.id,r]));
          const action = 'main-loop|beam:intersectionHarvest@beam2000';
          const rows = [...cm.keys()].sort().map(id => {
            const cr=cm.get(id), tr=tm.get(id);
            const hit=(tr.attempts ?? []).find(a => a.actionKey === action);
            return {
              id,
              control:{ok:cr.ok,status:cr.status,workSpent:cr.workSpent,winningActionKey:cr.winningActionKey},
              treatment:{ok:tr.ok,status:tr.status,workSpent:tr.workSpent,winningActionKey:tr.winningActionKey},
              newAction:hit ? {outcome:hit.outcome,workSpent:hit.workSpent,nodesExpanded:hit.nodesExpanded,mainLoopLateReserve:hit.mainLoopLateReserve ?? false} : null,
            };
          });
          const gained=rows.filter(r=>!r.control.ok&&r.treatment.ok).map(r=>r.id);
          const lost=rows.filter(r=>r.control.ok&&!r.treatment.ok).map(r=>r.id);
          const result={evidenceRole:'selected tuning replay',gained,lost,rows};
          fs.writeFileSync('tmp/reserve-preserving-result.json',JSON.stringify(result,null,2));
          console.log(JSON.stringify(result,null,2));
          NODE
      - uses: actions/upload-artifact@v7
        with:
          name: reserve-preserving-result
          path: tmp/reserve-preserving-result.json
          if-no-files-found: error
          retention-days: 30
